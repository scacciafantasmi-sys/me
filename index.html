<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Villa Franca 1980 — un paese di Sicilia</title>
<meta name="description" content="Prototipo pre-alpha di roguelike testuale ambientato in un paese immaginario di Sicilia nel 1980. Interamente client-side, nessuna AI esterna, nessuna chiave API.">
<style>
  :root {
    --bg: #14120e;
    --panel: #1d1a14;
    --panel-2: #262019;
    --border: #3a3226;
    --text: #ece3d0;
    --text-dim: #a89a80;
    --accent: #c98a3b;
    --accent-2: #7c9473;
    --accent-soft: rgba(201,138,59,0.16);
    --good: #7c9473;
    --good-soft: rgba(124,148,115,0.16);
    --warning: #c98a3b;
    --warning-soft: rgba(201,138,59,0.16);
    --critical: #a14a3a;
    --critical-soft: rgba(161,74,58,0.18);
    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { padding: 0; min-height: 100vh; }
  ::selection { background: var(--accent-soft); }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0.02em; margin: 0 0 0.4em; }
  p { line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input, select { font-family: inherit; }
  a { color: var(--accent); }

  #app { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .muted { color: var(--text-dim); font-size: 0.85em; }
  .small { font-size: 0.82em; }
  .hint { color: var(--text-dim); font-size: 0.9em; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.6em 1.1em; font-size: 0.95em; box-shadow: var(--shadow);
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #14120e; border-color: var(--accent); font-weight: bold; }
  .btn.ghost { background: transparent; }
  .btn.tiny { padding: 0.15em 0.6em; font-size: 0.9em; }
  .link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: 0.9em; }

  /* ---------------- boot / esito schermate a colonna singola ---------------- */
  .boot { max-width: 640px; margin: 3rem auto; text-align: center; }
  .boot h1 { font-size: 2.6rem; letter-spacing: 0.08em; color: var(--accent); }
  .boot .sub { color: var(--text-dim); font-style: italic; margin-top: -0.5em; }
  .boot .tagline { color: var(--text-dim); }
  .boot-actions { display: flex; flex-direction: column; gap: 0.6em; align-items: stretch; max-width: 380px; margin: 1.5em auto 0; }
  .boot.death h1, .boot.wipe h1 { color: var(--critical); }
  .boot.wipe h1 { color: var(--accent-2); }
  .anno-corrente { margin-top: 2em; color: var(--text-dim); font-size: 0.85em; }
  .fatale { color: var(--critical); font-weight: bold; }
  .salafama-list { text-align: left; max-height: 60vh; overflow-y: auto; margin-top: 1em; }

  /* ---------------- creazione personaggio ---------------- */
  .creation { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; box-shadow: var(--shadow); }
  .wizard-progress { display: flex; flex-wrap: wrap; gap: 0.5em; margin-bottom: 1.2em; font-size: 0.78em; }
  .wp-step { padding: 0.3em 0.6em; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
  .wp-step.active { border-color: var(--accent); color: var(--accent); }
  .wp-step.done { color: var(--good); border-color: var(--good); }
  .wizard-body { min-height: 320px; }
  .wizard-nav { display: flex; justify-content: space-between; margin-top: 1.5em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9em; }
  .grid2 label { display: flex; flex-direction: column; gap: 0.3em; font-size: 0.85em; color: var(--text-dim); }
  .grid2 .span2 { grid-column: 1 / -1; }
  input, select, textarea {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 0.5em 0.6em; font-size: 0.95em;
  }
  textarea { width: 100%; resize: vertical; }

  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  .skill-cat h3 { font-size: 0.95em; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
  .skill-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 0.4em; padding: 0.15em 0; font-size: 0.88em; }
  .skill-val { font-family: var(--font-mono); color: var(--accent); letter-spacing: 1px; min-width: 5.5em; text-align: center; }

  .segreti-list { display: flex; flex-direction: column; gap: 0.5em; max-height: 420px; overflow-y: auto; padding-right: 0.4em; }
  .segreto-row { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 0.6em; border: 1px solid var(--border); border-radius: 6px; padding: 0.5em 0.7em; cursor: pointer; }
  .segreto-row.selected { border-color: var(--accent); background: var(--accent-soft); }
  .segreto-row input { grid-row: 1 / span 2; margin-top: 0.3em; }
  .segreto-nome { font-weight: bold; }
  .segreto-desc { grid-column: 2; color: var(--text-dim); font-size: 0.85em; }

  .riepilogo p { margin: 0.4em 0; }
  .backstory-preview { white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.7em; font-size: 0.9em; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35em; margin-top: 0.6em; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 0.2em 0.6em; font-size: 0.78em; color: var(--text-dim); }

  /* ---------------- hub ---------------- */
  .hub-top {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.6em;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8em 1.1em; margin-bottom: 1em;
  }
  .hub-id strong { display: block; }
  .hub-money { font-family: var(--font-mono); color: var(--accent); font-size: 1.1em; }
  .hub-body { display: grid; grid-template-columns: 230px 1fr 300px; gap: 1em; align-items: start; }
  @media (max-width: 980px) { .hub-body { grid-template-columns: 1fr; } }

  .hub-side { display: flex; flex-direction: column; gap: 0.7em; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.6em 0.8em; }
  .panel summary { cursor: pointer; font-weight: bold; color: var(--accent); }
  .mini-skills { margin-top: 0.5em; display: flex; flex-direction: column; gap: 0.15em; }
  .mini-skill { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--text-dim); }
  .mini-skill.good span:last-child { color: var(--good); }
  .mini-skill.bad span:last-child { color: var(--critical); }
  .quick-actions { display: flex; flex-direction: column; gap: 0.4em; }

  .hub-main { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1em 1.2em; min-height: 420px; }
  .breadcrumb { font-size: 0.8em; color: var(--text-dim); margin-bottom: 0.6em; }
  .categorie-grid, .luoghi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.7em; margin-top: 0.8em; }
  .cat-card, .luogo-card, .azione-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 0.8em; text-align: left;
    display: flex; flex-direction: column; gap: 0.25em; color: var(--text);
  }
  .cat-card:hover, .luogo-card:hover:not(:disabled), .azione-card:hover:not(:disabled) { border-color: var(--accent); }
  .luogo-card.chiuso { opacity: 0.5; }
  .azioni-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.7em; margin-top: 0.8em; }
  .luogo-desc { color: var(--text-dim); }

  .hub-feed { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8em; max-height: 80vh; overflow-y: auto; }
  .feed-tabs { display: flex; gap: 0.3em; margin-bottom: 0.6em; }
  .tab { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4em; font-size: 0.78em; color: var(--text-dim); }
  .tab.active { color: var(--accent); border-color: var(--accent); }
  .feed-item { border-bottom: 1px solid var(--border); padding: 0.6em 0; font-size: 0.85em; }
  .feed-item:last-child { border-bottom: none; }
  .feed-item strong { display: block; margin: 0.2em 0; }
  .feed-date { color: var(--text-dim); font-size: 0.78em; }
  .feed-item.storia { border-left: 3px solid var(--accent); padding-left: 0.6em; }
  .feed-item.lore { border-left: 3px solid var(--accent-2); padding-left: 0.6em; }

  /* ---------------- modale esito ---------------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 1em; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.4em; max-width: 460px; box-shadow: var(--shadow); }
  .modal.esito-critico_successo { border-color: var(--good); }
  .modal.esito-critico_fallimento { border-color: var(--critical); }
  .modal .btn { margin-top: 0.8em; }

  @media (max-width: 640px) {
    .grid2, .skills-grid { grid-template-columns: 1fr; }
    .boot h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<div id="app"><div class="boot"><h1>VILLA FRANCA</h1><p class="tagline">Caricamento…</p></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
