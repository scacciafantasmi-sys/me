<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vetrata — un roguelike sull'isola</title>
<!-- Pagina autonoma a file singolo. Nessuna dipendenza dagli altri giochi del repository. -->
<meta name="description" content="Vetrata: un roguelike a turni e a caselle ambientato sull'Isola di Vetrata, nel Sud Italia in crisi. Ogni partita un'isola diversa, scelte, mestieri, politica, mare, horror analogico, permadeath ed eredità. Moneta: il caprino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;600&family=VT323&family=Inter:wght@400;600;800&display=swap">
<style>
:root{
  --navy:#1d3557; --navy2:#152842; --ink:#0d1726; --orange:#e2703a; --teal:#3fb7b0; --sea:#2a8fa6;
  --cream:#f3ead7; --yellow:#f2c14e; --red:#d1453b; --green:#5fb36b; --dim:#9aa6b8; --line:#2c4466;
  --panel:rgba(16,28,46,.96); --panel2:#1a2c47;
  --script:'Pacifico',cursive; --head:'Oswald','Arial Narrow',sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05080e;color:var(--cream);font-family:var(--body);font-size:14px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#game{position:fixed;inset:0;display:grid;grid-template-columns:1fr 360px;grid-template-rows:1fr 150px}
#boardWrap{position:relative;grid-row:1/3;overflow:hidden;background:#0b2a3c}
#board{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#side{grid-column:2;grid-row:1;overflow:auto;background:linear-gradient(180deg,#14243b,#0f1b2d);border-left:1px solid var(--line);padding:10px 12px}
#log{grid-column:2;grid-row:2;overflow:auto;background:#0b1422;border-left:1px solid var(--line);border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px;line-height:1.45}
#log div{margin-bottom:3px;animation:tin .3s}
#log .t{color:var(--dim);font-family:var(--head);margin-right:5px}
#log .bad{color:#ff9d92}#log .good{color:#9ee6a3}#log .weird{color:#c4b3ff;font-family:var(--mono);font-size:16px}#log .warn{color:var(--yellow)}
@media(max-width:900px){#game{grid-template-columns:1fr;grid-template-rows:55vh 1fr 110px}#boardWrap{grid-row:1}#side{grid-column:1;grid-row:2;border-left:none}#log{grid-column:1;grid-row:3;border-left:none}}
/* sidebar */
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(243,234,215,.12);border-radius:8px;padding:4px 9px;font-family:var(--head);letter-spacing:.04em;font-size:13px}
#clock{font-size:20px;color:var(--yellow)}
.big{font-size:18px}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0}
.need{display:flex;align-items:center;gap:5px;font-size:11px;font-family:var(--head);letter-spacing:.04em}
.need i{font-style:normal;width:16px;text-align:center}
.bar{flex:1;height:7px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.bar b{display:block;height:100%;background:var(--green);transition:width .4s}
.sec{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.sec h3{margin:0 0 6px;font-family:var(--head);font-weight:600;letter-spacing:.06em;font-size:14px;color:var(--yellow);text-transform:uppercase}
.zoneT{font-family:var(--script);font-size:22px;color:var(--cream);line-height:1.1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.act{background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:6px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .12s}
.act span{font-size:18px}
.act:hover:not(:disabled){border-color:var(--yellow);transform:translateY(-1px)}
.act:disabled{opacity:.35}
.plist{display:flex;flex-direction:column;gap:4px}
.pl{display:flex;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:6px 9px;font-size:12.5px}
.pl:hover{border-color:var(--yellow);background:rgba(242,193,78,.07)}
.pl .ic{font-size:18px;width:22px;text-align:center}
.pl small{color:var(--dim);display:block;font-size:11px}
.ppl{display:flex;flex-wrap:wrap;gap:4px}
.pp{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:2px 9px 2px 3px;font-size:12px;color:var(--cream)}
.pp:hover{border-color:var(--yellow)}
.pp i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.3)}
#stars{color:#f2c14e;letter-spacing:2px}
/* overlay board */
#boardHud{position:absolute;left:12px;top:10px;pointer-events:none;display:flex;flex-direction:column;gap:6px}
#boardHud .chip{background:rgba(13,23,38,.8);pointer-events:auto}
#zoomCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
#zoomCtl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(13,23,38,.85);color:var(--cream);font-size:18px}
#tip{position:absolute;pointer-events:none;background:rgba(13,23,38,.92);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;max-width:260px}
#centerMsg{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-family:var(--head);font-size:34px;letter-spacing:.08em;text-shadow:0 3px 10px #000;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
#centerMsg small{display:block;font-family:var(--body);font-size:15px;letter-spacing:0;opacity:.85}
#toasts{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:360px;pointer-events:none}
.toast{background:rgba(13,23,38,.94);border-left:4px solid var(--teal);border-radius:6px;padding:7px 11px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.bad{border-color:var(--red)} .toast.money{border-color:var(--green)} .toast.warn{border-color:var(--yellow)} .toast.weird{border-color:#8a5cff;font-family:var(--mono);font-size:17px}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
/* pannelli */
#panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,8,16,.6);backdrop-filter:blur(2px)}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(820px,95vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
.pbox.wide{width:min(1100px,96vw)}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,var(--navy),#22436b);border-bottom:3px solid var(--orange)}
.phead h2{margin:0;font-family:var(--head);font-weight:600;letter-spacing:.05em;font-size:20px;flex:1}
.phead .sub{font-size:12px;color:var(--dim)}
.pbody{padding:14px 16px;overflow:auto}
.pfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;transition:all .12s}
.btn:hover:not(:disabled){border-color:var(--yellow);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.bad{background:#7a2620;border-color:#a2392f}
.btn.sm{padding:4px 9px;font-size:12px}
.x{background:none;border:none;color:var(--cream);font-size:22px;line-height:1}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card h4{margin:0 0 4px;font-family:var(--head);font-weight:600;letter-spacing:.04em;font-size:15px}
.muted{color:var(--dim)} .small{font-size:12px} .tiny{font-size:11px}
.good{color:#8fe39a}.badc{color:#ff8a7e}.warnc{color:var(--yellow)}.weirdc{color:#b9a3ff}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.08);margin:1px 2px;border:1px solid rgba(255,255,255,.1)}
.tag.p{border-color:#5fb36b;color:#a4e5ac}.tag.n{border-color:#d1453b;color:#ffa79e}.tag.h{border-color:#8a5cff;color:#c7b5ff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.desc{line-height:1.6;color:#dfe5ee}
.quote{border-left:3px solid var(--orange);padding:4px 10px;margin:8px 0;font-style:italic;color:#e9e1cf}
input[type=text],input[type=number],textarea,select{background:#0e1a2c;color:var(--cream);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px}
input[type=range]{accent-color:var(--orange)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:8px 11px;font-size:13px;transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--yellow);background:rgba(242,193,78,.08);transform:translateX(3px)}
.opt:disabled{opacity:.4}
.opt small{color:var(--dim);display:block}
.portrait{width:64px;height:64px;border-radius:10px;border:2px solid var(--line);background:#0e1a2c;flex:none}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.slot{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;cursor:pointer;position:relative;min-height:78px}
.slot:hover{border-color:var(--yellow)}
.slot .ic{font-size:24px}.slot .nm{font-size:11px;line-height:1.2}.slot .q{position:absolute;right:5px;top:3px;font-size:11px;color:var(--yellow)}
.slot.sel{border-color:var(--orange);background:rgba(226,112,58,.12)}
.slot img{width:100%;border-radius:4px}
/* telefono */
#phone{position:fixed;right:380px;bottom:20px;width:300px;height:580px;z-index:15;background:#0b0f16;border-radius:34px;border:3px solid #39424f;box-shadow:0 20px 60px rgba(0,0,0,.7);padding:12px 10px;display:flex;flex-direction:column;animation:pop .2s}
@media(max-width:900px){#phone{right:10px}}
#phone .scr{flex:1;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#1d3557,#0e2236 60%,#2a1d2f);display:flex;flex-direction:column}
#phone .pbar{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:12px;font-family:var(--head)}
#phone .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px}
#phone .app{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;background:none;border:none;color:#fff}
#phone .app i{font-style:normal;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#phone .apph{padding:6px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--head);font-size:16px}
#phone .appb{flex:1;overflow:auto;padding:10px 12px;font-size:12.5px}
#phone .home{height:5px;width:110px;background:#666;border-radius:3px;margin:8px auto 0;cursor:pointer}
.msg{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 9px;margin-bottom:6px}
.msg b{color:var(--yellow)}
/* schermate */
#screen{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#22436b 0%,#0d1726 70%)}
.scr-in{max-width:1080px;margin:0 auto;padding:30px 20px 60px}
.logo{display:block;margin:10px auto 0;width:min(560px,90vw);filter:drop-shadow(0 10px 30px rgba(0,0,0,.55));border-radius:18px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-.4deg)}}
.title{font-family:var(--script);font-size:56px;text-align:center;color:var(--yellow);margin:0;text-shadow:3px 4px 0 var(--navy2),0 0 30px rgba(242,193,78,.25)}
.subt{text-align:center;font-family:var(--head);letter-spacing:.3em;color:var(--dim);margin-top:4px}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:26px}
.menu .btn{min-width:300px;font-size:16px;padding:11px 18px;font-family:var(--head);letter-spacing:.08em}
.connect{font-family:var(--mono);font-size:20px;color:#9fd3c7;max-width:640px;margin:30px auto;white-space:pre-wrap;line-height:1.25}
.fate{font-family:var(--script);font-size:24px;color:var(--yellow)}
.typed{font-size:17px;line-height:1.8;max-width:740px;margin:40px auto;white-space:pre-wrap}
.news{background:#f1e9d6;color:#1d1a16;font-family:Georgia,'Times New Roman',serif;border-radius:4px;padding:16px 20px}
.news .mast{font-family:'Pacifico',cursive;font-size:30px;text-align:center;border-bottom:3px double #1d1a16;padding-bottom:4px}
.news .dt{text-align:center;font-size:12px;border-bottom:1px solid #1d1a16;padding:3px;margin-bottom:10px;font-family:var(--head);letter-spacing:.1em}
.news h3{font-size:24px;margin:6px 0;line-height:1.1}.news h5{font-size:15px;margin:10px 0 3px}.news p{margin:0 0 8px;font-size:14px;line-height:1.45}
.news .cols{columns:2;column-gap:20px;column-rule:1px solid #bbb}
.mgc{background:#07101c;border:1px solid var(--line);border-radius:10px;display:block;margin:0 auto;max-width:100%}
.crt{background:#000;border-radius:28px;padding:18px;box-shadow:inset 0 0 40px rgba(0,0,0,.9),0 0 0 10px #2b2622,0 0 0 14px #15110e}
.kbd{display:inline-block;background:var(--cream);color:var(--ink);border-radius:4px;padding:0 6px;font-family:var(--head);font-weight:600;font-size:12px;margin:1px}
.flash{animation:flash .6s}
@keyframes flash{0%{background:rgba(255,255,255,.4)}100%{background:transparent}}
#fade{position:fixed;inset:0;background:#000;z-index:40;pointer-events:none;opacity:0;transition:opacity .6s}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
.evimg{width:100%;height:150px;border-radius:10px;display:block;margin-bottom:10px}

/* --- v5 UI: social, chat, tier, VetrOS --- */
.tier{font-size:11px;border:1px solid;border-radius:6px;padding:0 5px;font-weight:700}
.hearts{color:#e2607a;letter-spacing:1px}.hearts i{color:#4a3540;font-style:normal}
.pltag{background:#2a2550;color:#cbb8ff;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px}.pltag.sm{font-size:10px;padding:0 4px}
.vg-compose{display:flex;gap:6px;margin-bottom:8px}.vg-compose input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;color:#fff;padding:7px 12px;font-size:13px}
.vg-feed{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto}
.vg-post{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 11px}
.vg-head{display:flex;align-items:center;gap:7px;font-size:13px}.vg-av{width:26px;height:26px;border-radius:50%;display:inline-block;flex:none}
.vg-on{color:#5ce38a;font-size:9px}.vg-head .sp{margin-left:auto}
.vg-body{margin:6px 0;font-size:13.5px;line-height:1.4}.vg-img{width:100%;border-radius:8px;margin:4px 0}
.vg-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vg-like,.vg-reply{background:none;border:none;color:#9aa5b1;cursor:pointer;font-size:12.5px;padding:2px}.vg-like.on{color:#e2607a}
.vg-reps{flex-basis:100%;margin-top:4px;font-size:12px;color:#c7d0d9;border-left:2px solid rgba(255,255,255,.15);padding-left:8px}
.ch-log{display:flex;flex-direction:column;gap:5px;max-height:48vh;overflow:auto;padding:4px;margin-bottom:8px}
.ch-msg{align-self:flex-start;max-width:78%;background:rgba(255,255,255,.1);border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:13px;position:relative}
.ch-msg.me{align-self:flex-end;background:#2d6b6b;border-radius:12px 12px 3px 12px}
.ch-t{display:block;font-size:9px;opacity:.5;text-align:right;margin-top:2px}
.vetros{font-family:var(--mono)}.vetros-bar{background:#0a1a2a;border:1px solid #37506b;border-radius:6px;padding:5px 9px;font-size:11px;color:#6fa8d8;margin-bottom:8px}
</style>
</head>
<body>
<div id="game" class="hidden">
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="boardHud"><div id="zoneChip" class="chip"></div></div>
    <div id="zoomCtl"><button id="zin" title="Zoom +">+</button><button id="zout" title="Zoom −">−</button><button id="zme" title="Centra">◎</button></div>
    <div id="toasts"></div>
    <div id="centerMsg"></div>
    <div id="tip"></div>
  </div>
  <div id="side"></div>

</div>
<div id="phone" class="hidden"></div>
<div id="panel" class="hidden"></div>
<div id="screen"></div>
<div id="fade"></div>
<script>
'use strict';
/* =====================================================================
   VETRATA — Isola di Vetrata
   Open world RP roguelike a file singolo. Nucleo: utilità, RNG, rumore,
   nomi, audio procedurale.
   ===================================================================== */
const TS = 16;            // pixel per tile
const MW = 420, MH = 320; // dimensioni mappa in tile
const CH = 32;            // tile per chunk
const SAVE_KEY = 'villafranca_rp_v1';
const META_KEY = 'villafranca_rp_meta_v1';
const CUR = 'ℭ';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const smooth = t => t * t * (3 - 2 * t);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v, sym = true) => (sym ? CUR + ' ' : '') + Math.round(v).toLocaleString('it-IT');
const pct = v => Math.round(v * 100) + '%';
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const chance = p => Math.random() < p;
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
function shuffle(a, r = Math.random) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(list, r = Math.random) { // [{w,...}]
  let s = 0; for (const o of list) s += o.w; let x = r() * s;
  for (const o of list) { x -= o.w; if (x <= 0) return o; } return list[list.length - 1];
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ---------- Perlin 2D ---------- */
function makeNoise(seed) {
  const r = mulberry32(seed), p = new Uint8Array(512), base = [];
  for (let i = 0; i < 256; i++) base.push(i);
  shuffle(base, r); for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  function n(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
    const u = f(x), v = f(y), a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(lerp(g(p[a], x, y), g(p[b], x - 1, y), u), lerp(g(p[a + 1], x, y - 1), g(p[b + 1], x - 1, y - 1), u), v) * 0.7;
  }
  n.fbm = (x, y, oct = 4) => { let s = 0, a = 1, fr = 1, m = 0; for (let i = 0; i < oct; i++) { s += n(x * fr, y * fr) * a; m += a; a *= 0.5; fr *= 2; } return s / m; };
  return n;
}

const AU = {
  ctx: null, master: null, on: true, vol: 0.7, tts: true,
  nodes: {}, radioOn: false, radioStation: 0, radioTimer: 0, musicGain: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      // canali ambientali persistenti
      this.nodes.sea = this.loopNoise('lowpass', 500, 0);
      this.nodes.wind = this.loopNoise('bandpass', 380, 0);
      this.nodes.rain = this.loopNoise('highpass', 2400, 0);
      this.nodes.static = this.loopNoise('bandpass', 2600, 0, 0.6);
      this.nodes.feedback = this.osc('sine', 1830, 0);
      // motore
      const eo = this.ctx.createOscillator(); eo.type = 'sawtooth'; eo.frequency.value = 40;
      const ef = this.ctx.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 500;
      const eg = this.ctx.createGain(); eg.gain.value = 0; eo.connect(ef); ef.connect(eg); eg.connect(this.master); eo.start();
      this.nodes.engine = { o: eo, g: eg, f: ef };
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0; this.musicGain.connect(this.master);
    } catch (e) { this.ctx = null; }
  },
  loopNoise(type, freq, gain, q = 0.8) {
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(this.master); s.start();
    return { s, f, g };
  },
  osc(type, freq, gain) { const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = freq; const g = this.ctx.createGain(); g.gain.value = gain; o.connect(g); g.connect(this.master); o.start(); return { o, g }; },
  set(node, v, t = 0.3) { if (!this.ctx || !this.nodes[node]) return; this.nodes[node].g.gain.setTargetAtTime(this.on ? v : 0, this.ctx.currentTime, t); },
  beep(freq = 660, dur = 0.08, type = 'square', vol = 0.12, pan = 0, when = 0) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = g;
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); last = p; }
    o.connect(g); last.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  burst(dur = 0.12, freq = 900, vol = 0.25, pan = 0, when = 0, type = 'bandpass') {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + when, s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 1.2;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = g; if (this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); last = p; }
    s.connect(f); f.connect(g); last.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  sfx(n) {
    switch (n) {
      case 'click': this.beep(900, 0.04, 'square', 0.05); break;
      case 'ok': this.beep(660, 0.07, 'triangle', 0.1); this.beep(990, 0.1, 'triangle', 0.1, 0, 0.07); break;
      case 'bad': this.beep(220, 0.2, 'sawtooth', 0.08); break;
      case 'coin': this.beep(1320, 0.05, 'square', 0.06); this.beep(1760, 0.09, 'square', 0.06, 0, 0.05); break;
      case 'punch': this.burst(0.09, 300, 0.5); break;
      case 'shot': this.burst(0.25, 1200, 0.9, 0, 0, 'lowpass'); this.beep(90, 0.15, 'sawtooth', 0.2); break;
      case 'door': this.burst(0.15, 500, 0.25); break;
      case 'horn': this.beep(415, 0.35, 'sawtooth', 0.08); this.beep(523, 0.35, 'sawtooth', 0.06); break;
      case 'siren': for (let i = 0; i < 4; i++) { this.beep(700, 0.25, 'triangle', 0.06, 0, i * 0.5); this.beep(950, 0.25, 'triangle', 0.06, 0, i * 0.5 + 0.25); } break;
      case 'ring': for (let i = 0; i < 2; i++) { for (let k = 0; k < 10; k++) this.beep(k % 2 ? 1300 : 1600, 0.04, 'square', 0.07, 0, i * 0.9 + k * 0.04); } break;
      case 'phone': this.beep(1046, 0.08, 'sine', 0.09); this.beep(1318, 0.12, 'sine', 0.09, 0, 0.1); break;
      case 'shutter': this.burst(0.05, 3000, 0.4); this.burst(0.08, 1500, 0.3, 0, 0, 'bandpass'); break;
      case 'step': this.burst(0.05, 180 + Math.random() * 60, 0.12, 0, 0, 'lowpass'); break;
      case 'splash': this.burst(0.4, 700, 0.35, 0, 0, 'lowpass'); break;
      case 'crash': this.burst(0.5, 400, 0.9, 0, 0, 'lowpass'); this.burst(0.3, 2500, 0.3); break;
      case 'alarm': for (let i = 0; i < 6; i++) this.beep(i % 2 ? 1100 : 880, 0.18, 'square', 0.07, 0, i * 0.2); break;
      case 'whoosh': this.burst(0.6, 600, 0.2, 0, 0, 'bandpass'); break;
      case 'heart': this.beep(55, 0.12, 'sine', 0.35); this.beep(50, 0.12, 'sine', 0.3, 0, 0.18); break;
    }
  },
  footstepAt(pan, vol) { this.burst(0.09, 140, vol, pan, 0, 'lowpass'); this.burst(0.05, 900, vol * 0.3, pan, 0.02); },
  engine(on, rpm = 0.2, kind = 'car') {
    if (!this.ctx) return; const e = this.nodes.engine, t = this.ctx.currentTime;
    const base = kind === 'moto' ? 70 : kind === 'boat' ? 32 : kind === 'bici' ? 0 : 42;
    e.o.frequency.setTargetAtTime(base + rpm * (kind === 'moto' ? 160 : 110), t, 0.08);
    e.f.frequency.setTargetAtTime(300 + rpm * 900, t, 0.1);
    e.g.gain.setTargetAtTime(this.on && on && kind !== 'bici' ? 0.05 + rpm * 0.05 : 0, t, 0.15);
  },
  speak(text, o = {}) {
    if (!this.tts || !this.on || !window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'it-IT';
      const vs = speechSynthesis.getVoices().filter(v => /^it/i.test(v.lang));
      if (vs.length) u.voice = o.female ? (vs.find(v => /female|alice|elsa|federica|paola|isabella/i.test(v.name)) || vs[0]) : (vs.find(v => /male|luca|cosimo|diego/i.test(v.name)) || vs[vs.length - 1]);
      u.pitch = o.pitch ?? 1; u.rate = o.rate ?? 1; u.volume = clamp((o.volume ?? 0.9) * this.vol, 0, 1);
      if (o.cancel !== false) speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) { }
  },
  /* Radio: musica procedurale. Stazione 0 = Radio Vetrata (tarantella / canzone), 1 = Radio Partenope (lenta), 2 = Onde corte */
  music(dt) {
    if (!this.ctx || !this.radioOn || !this.on) { if (this.musicGain) this.musicGain.gain.setTargetAtTime(0, this.ctx ? this.ctx.currentTime : 0, 0.2); return; }
    this.musicGain.gain.setTargetAtTime(0.5, this.ctx.currentTime, 0.2);
    this.radioTimer -= dt; if (this.radioTimer > 0) return;
    const st = this.radioStation;
    if (st === 2) { this.radioTimer = 1; return; }
    const scale = st === 0 ? [0, 2, 3, 5, 7, 8, 11, 12] : [0, 3, 5, 7, 10, 12];
    const root = st === 0 ? 220 : 196, beat = st === 0 ? 0.16 : 0.42, t0 = this.ctx.currentTime + 0.05;
    this.bar = (this.bar || 0) + 1;
    const chords = [0, 5, 7, 0, 3, 7, 5, 0];
    const ch = chords[this.bar % 8];
    for (let i = 0; i < 6; i++) {
      const deg = (i === 0 ? 0 : Math.floor(Math.random() * scale.length));
      const semis = scale[deg] + ch;
      const f = root * Math.pow(2, semis / 12) * (Math.random() < 0.3 ? 2 : 1);
      if (st === 0) { // mandolino: nota ribattuta
        for (let k = 0; k < 2; k++) this.pluck(f, t0 + i * beat + k * beat / 2, beat * 0.9, 0.05);
      } else this.pluck(f, t0 + i * beat, beat * 2, 0.06, 'sine');
    }
    // basso
    this.pluck(root / 2 * Math.pow(2, ch / 12), t0, beat * 3, 0.09, 'triangle');
    this.pluck(root / 2 * Math.pow(2, (ch + 7) / 12), t0 + beat * 3, beat * 3, 0.07, 'triangle');
    this.radioTimer = beat * 6;
  },
  pluck(f, t, dur, vol, type = 'triangle') {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + dur + 0.05);
  }
};

const WX_TRANS = { sereno: { sereno: 5, nuvoloso: 2, scirocco: 1, maestrale: 1, nebbia: 0.5 }, nuvoloso: { sereno: 2, nuvoloso: 2, pioggia: 2, scirocco: 0.7, maestrale: 0.7, nebbia: 0.5 }, scirocco: { scirocco: 3, nuvoloso: 1.5, temporale: 1, sereno: 1, nebbia: 0.6 }, maestrale: { maestrale: 2, sereno: 3, nuvoloso: 1 }, pioggia: { pioggia: 2, nuvoloso: 2, temporale: 1, sereno: 0.6, nebbia: 0.6 }, temporale: { temporale: 1, pioggia: 2, nuvoloso: 1.5, maestrale: 1 }, nebbia: { nebbia: 1, sereno: 2, nuvoloso: 2 } };
function rollWeather(from) { const m = curMonth(); return wpick(Object.entries(WX_TRANS[from]).map(([k, w]) => ({ k, w: w * ((m >= 5 && m <= 8) && (k === 'pioggia' || k === 'temporale') ? 0.35 : 1) * ((m >= 10 || m <= 2) && k === 'pioggia' ? 1.6 : 1) }))).k; }
function initWeather() { G.weather = { cur: 'sereno', next: [], wetGround: 0, anom: rr(-1.5, 1.5), changeAt: G.min + rr(180, 420) }; for (let k = 0; k < 8; k++) G.weather.next.push(rollWeather(k ? G.weather.next[k - 1] : 'sereno')); }
function weatherTick() {
  const w = G.weather, wx = WEATHER[w.cur];
  if (G.min >= w.changeAt) { w.cur = w.next.shift(); w.next.push(rollWeather(w.next[w.next.length - 1] || w.cur)); w.changeAt = G.min + rr(160, 480); w.anom = clamp(w.anom + rr(-1, 1), -3, 3); const nw = WEATHER[w.cur]; log(`${nw.ico} Il tempo cambia: ${nw.n.toLowerCase()}.`, nw.storm ? 'warn' : ''); if (nw.storm) { AU.burst(1.6, 120, 0.8, 0, 0, 'lowpass'); anim.flash = 0.8; } if (w.cur === 'maestrale' || nw.storm) sendAlert('⚠️ Allerta meteo: ' + nw.n.toLowerCase() + '. Traghetti a rischio, mare agitato.'); }
  w.wetGround = clamp(w.wetGround + (wx.rain ? wx.rain * 0.01 : -0.0015), 0, 1);
  if (wx.storm && chance(0.004)) { anim.flash = 0.9; setTimeout(() => AU.burst(1.6, 120, 0.9, 0, 0, 'lowpass'), 500); if (chance(0.12)) { const s = pick(W.subst); if (s && s.ok) { s.ok = false; s.repairAt = G.min + 240; log(`⚡ Un fulmine colpisce la ${s.n}: blackout nel quartiere.`, 'warn'); addNews({ tag: 'cronaca', head: `Blackout: un fulmine mette fuori uso la ${s.n}`, body: 'I tecnici sono al lavoro. Chi ha un generatore lo ha acceso.', weight: 2 }); } } else if (chance(0.05)) { const t = pick(W.towers); if (t.ok) { t.ok = false; t.repairAt = G.min + 360; computeSignal(); log(`📵 Il temporale abbatte il ${t.n}: niente segnale in zona.`, 'warn'); } } }
  for (const s of W.subst) if (!s.ok && s.repairAt && G.min > s.repairAt) { s.ok = true; s.repairAt = null; log(`💡 Torna la corrente: ${s.n}.`); }
  for (const t of W.towers) if (!t.ok && t.repairAt && G.min > t.repairAt) { t.ok = true; t.repairAt = null; computeSignal(); log(`📶 Torna il segnale: ${t.n}.`); }
}
function forecastText() { const w = G.weather; return [w.cur, ...w.next.slice(0, 3)].map((k, i) => (i === 0 ? 'Ora' : '+' + (i * 5) + 'h') + ': ' + WEATHER[k].ico + ' ' + WEATHER[k].n).join(' · '); }
function ferryOK() { const w = G.weather.cur; return !(w === 'maestrale' || w === 'temporale') && !(G.island.blockade > G.day); }
function sendAlert(text) { if (signalHere() > 10 && hasInv('telefono')) { AU.sfx('phone'); toast('📱 ' + text, 'warn'); } }

/* ---------- Bisogni (per minuto di gioco) ---------- */
function needsTick() {
  const p = G.player; if (G.dead) return;
  const wx = WEATHER[G.weather.cur], amb = ambientTemp(), c = playerCell();
  const hot = amb > 28 ? 1.5 : 1;
  p.fame = clamp(p.fame - 0.05, 0, 100);
  p.sete = clamp(p.sete - 0.085 * hot, 0, 100);
  const night = hourOf() > 22 || hourOf() < 5;
  p.energia = clamp(p.energia - 0.04 * (hasTrait('insonne') ? 1.3 : 1) * (night && !hasTrait('notturno') ? 1.25 : 1) * (p.sick > 0 ? 1.4 : 1), 0, 100);
  p.alcol = Math.max(0, p.alcol - 0.12);
  if (p.alcol > 70) G.stats.drunkMin = (G.stats.drunkMin || 0) + 1;
  if (p.sick > 0) { p.sick--; p.fame = Math.max(0, p.fame - 0.04); }
  if (p.fame <= 0) hurt(0.06, 'la fame'); if (p.sete <= 0) hurt(0.12, 'la sete');
  const wear = (ITEMS[p.wear] && ITEMS[p.wear].wear) || ITEMS.abiti.wear;
  const inWater = c && c.water && !p.veh; const indoors = !!p.inside;
  const inCar = p.veh && ['car'].includes(VMODELS[(G.vehicles.find(v => v.id === p.veh) || {}).model || 'bici'].type);
  if (inWater) p.wet = 100;
  else if (!indoors && wx.rain > 0) { const prot = Math.max(wear.rain, hasInv('ombrello') && !p.veh ? 0.8 : 0, inCar ? 1 : 0); p.wet = clamp(p.wet + wx.rain * (1 - prot) * 2.2, 0, 100); }
  else p.wet = clamp(p.wet - (0.5 + (amb > 22 ? 0.6 : 0) + wx.wind * 0.4), 0, 100);
  let comfort = inWater ? MONTH_TEMP[curMonth()] - 3 + (wear.dive ? 14 : 0) + (hasTrait('nuotatore') ? 4 : 0) - 6 : amb + wear.warm * 4 - p.wet / 100 * 9 - (!indoors ? wx.wind * 4 : 0) + (inCar ? 4 : 0) + (indoors ? 6 : 0);
  let target = 36.6; if (comfort < 14) target = 36.6 - (14 - comfort) * 0.12; else if (comfort > 31) target = 36.6 + (comfort - 31) * 0.12 * (p.sete < 25 ? 1.8 : 1);
  p.temp += (target - p.temp) * 0.01;
  if (p.temp < 35) { hurt((35 - p.temp) * 0.15, 'l\'ipotermia'); if (chance(0.02)) log('🥶 Tremi senza controllo. Ipotermia.', 'bad'); }
  if (p.temp > 38.6) { hurt((p.temp - 38.6) * 0.1, 'un colpo di calore'); if (chance(0.02)) log('🥵 Il caldo ti fa girare la testa.', 'bad'); }
  if (inWater) { p.stamina = Math.max(0, p.stamina - 0.6 * (hasTrait('nuotatore') ? 0.6 : 1)); if (p.stamina <= 0) hurt(1.2, 'annegamento'); }
  else p.stamina = Math.min(maxStamina(), p.stamina + 0.6 * (p.energia < 15 ? 0.5 : 1));
  if (c && ['parco', 'boschi'].includes(c.zone) && curMonth() >= 4 && curMonth() <= 9 && !(p.buffs.repellente > G.min) && !indoors) { p.stress = clamp(p.stress + 0.04, 0, 100); if (chance(0.004)) log('🦟 Le zanzare ti divorano. Un repellente servirebbe.', 'warn'); }
  let ds = -0.02;
  if (p.fame < 20 || p.sete < 20) ds += 0.03; if (p.health < 40) ds += 0.05; if (G.wanted.level) ds += 0.04 * G.wanted.level;
  if (isNight() && c && ['boschi', 'parco', 'cimitero'].includes(c.zone) && !indoors) ds += 0.05;
  if (hasTrait('fumatore') && G.min - (p.lastSmoke || 0) > 360) { ds += 0.04; if (chance(0.003)) log('🚬 Ti servirebbe una sigaretta.', 'warn'); }
  if (hasTrait('bevitore') && G.min - (p.lastDrink || 0) > 600) ds += 0.03;
  if (hasTrait('claustrofobico') && p.inside && ['bunker', 'distilleria'].includes(p.inside)) ds += 0.3;
  if (p.trauma > G.day) ds += 0.02;
  ds *= hasTrait('ansioso') ? 1.4 : hasTrait('freddo') ? 0.6 : 1;
  if (ds < 0 && p.stress < 12) ds = 0;
  p.stress = clamp(p.stress + ds, 0, 100);
  if (p.fame > 40 && p.sete > 40 && p.energia > 20 && p.bleed <= 0 && p.health < 100 && p.temp > 35.5) p.health = Math.min(100, p.health + 0.025);
  if (p.bleed > 0) hurt(p.bleed * 0.15, 'un\'emorragia');
  // effetti a lungo termine dell'alcol
  if ((G.stats.drunkMin || 0) > 3000 && !G.flags.liver) { G.flags.liver = true; toast('Il medico te l\'aveva detto: il fegato comincia a lamentarsi. Salute massima ridotta.', 'bad'); }
  if (G.flags.liver && p.health > 85) p.health = 85;
  if (p.energia <= 0 && chance(0.01)) { toast('Crolli dalla stanchezza.', 'bad'); p.stress = Math.min(100, p.stress + 5); }
  try { addictionTick(); } catch (e) { }
}
const maxStamina = () => 100 + (hasTrait('atleta') ? 25 : 0) - (hasTrait('asmatico') ? 20 : 0) + skill('atletica') * 0.2;
function hurt(amt, cause) { const p = G.player; if (G.dead || p.down) return; p.health -= amt; p.lastCause = cause; if (amt > 4) { anim.shake = 0.3; AU.sfx('heart'); } if (p.health <= 0) { p.health = 0; playerDown(cause); } }

/* ---------- Polizia (leggera) ---------- */
const OFFENSES = { aggressione: { n: 'Aggressione in una rissa', heat: 30, sev: 1 }, guida: { n: 'Guida pericolosa', heat: 20, sev: 1 }, coprifuoco: { n: 'Violazione del coprifuoco', heat: 15, sev: 0.5 }, resistenza: { n: 'Resistenza a pubblico ufficiale', heat: 35, sev: 2 }, investimento: { n: 'Investimento di pedone', heat: 45, sev: 3 }, multe: { n: 'Multe non pagate', heat: 20, sev: 0.5 }, molestie: { n: 'Disturbo della quiete pubblica', heat: 10, sev: 0.3 } };

  if (chance(witnessed)) { G.wanted.heat = clamp(G.wanted.heat + O.heat, 0, 100); updateWantedLevel(); toast(`🚓 Qualcuno ha chiamato la Polizia Insulare: ${O.n.toLowerCase()}.`, 'bad'); }

}
function updateWantedLevel() { const h = G.wanted.heat; G.wanted.level = h >= 70 ? 3 : h >= 35 ? 2 : h > 1 ? 1 : 0; }
function policeCheck(c) {
  // pattuglie: più probabili in centro, di notte col coprifuoco, o se ricercato

function artFor(c) { if (c.water) return 'mare'; if (c.zone === 'marina') return 'porto'; if (['parco', 'boschi', 'cimitero'].includes(c.zone)) return 'bosco'; if (c.zone === 'monte' || c.t === T_ROCK) return 'montagna'; if (c.road === RD_COBBLE || c.road === RD_PLAZA) return c.plaza ? 'piazza' : 'vicolo'; if (c.road === RD_ASPH) return 'strada'; if (c.coast) return 'mare'; return 'bosco'; }
function eventPanel(title, art, text, choices) {
  openPanel(title, `<canvas class="evimg" id="evArt" width="760" height="150"></canvas><div class="desc">${text}</div>${optList(choices)}`, [], { noClose: true });
  sceneArt($('#evArt'), art); bindOpts(choices);

  const c = $('#bigmap'), g = c.getContext('2d'), S = 3;
  g.imageSmoothingEnabled = true; g.fillStyle = '#164e72'; g.fillRect(0, 0, 1260, 960); g.drawImage(STATIC, 0, 0, MW * S, MH * S);
  for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) if (!CELLS[cid(cx, cy)].explored) { g.fillStyle = 'rgba(8,14,26,.82)'; g.fillRect(cx * CF * S, cy * CF * S, CF * S + 0.5, CF * S + 0.5); }
  g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 1; g.font = '11px Oswald'; g.fillStyle = 'rgba(255,255,255,.6)';
  for (let x = 0; x <= MW; x += 20) { g.beginPath(); g.moveTo(x * S, 0); g.lineTo(x * S, MH * S); g.stroke(); g.fillText(String(x).padStart(3, '0'), x * S + 2, 12); }
  for (let y = 0; y <= MH; y += 20) { g.beginPath(); g.moveTo(0, y * S); g.lineTo(MW * S, y * S); g.stroke(); g.fillText(String(y).padStart(3, '0'), 2, y * S - 2); }
  g.textAlign = 'center';
  for (const z of W.zones) { if (!CELLS[cid(z.x / CF | 0, z.y / CF | 0)].explored) continue; g.font = '600 15px Oswald'; g.fillStyle = 'rgba(0,0,0,.6)'; g.fillText(z.n, z.x * S + 1, z.y * S - 13); g.fillStyle = '#f3ead7'; g.fillText(z.n, z.x * S, z.y * S - 14); }
  for (const b of W.buildings) { const P2 = PLACES[b.type]; if (P2 && b.type !== 'casa' && b.type !== 'villa' && b.cell && CELLS[cid(b.cell[0], b.cell[1])].explored) { g.font = '12px serif'; g.fillText(P2.ico, b.dx / TS * S, b.dy / TS * S + 4); } }
  if (G.home) { const b = W.buildings[G.home.b]; if (b) { g.font = '16px serif'; g.fillText('🏠', b.dx / TS * S, b.dy / TS * S + 4); } }
  for (const v of G.vehicles) if (!v.lost) { g.font = '13px serif'; g.fillText(VMODELS[v.model].type === 'boat' ? '⛵' : '🚗', (v.cx * CF + 2) * S, (v.cy * CF + 2) * S + 4); }
  for (const m of MARKERS) { g.fillStyle = m.col || '#f2c14e'; g.beginPath(); g.arc((m.cx * CF + 2) * S, (m.cy * CF + 2) * S, 6, 0, 7); g.fill(); }
  if (G.waypoint) { g.strokeStyle = '#e2703a'; g.lineWidth = 3; g.strokeRect((G.waypoint.cx * CF) * S, (G.waypoint.cy * CF) * S, CF * S, CF * S); }
  const px = (G.player.cx * CF + 2) * S, py = (G.player.cy * CF + 2) * S; g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); g.strokeStyle = '#000'; g.lineWidth = 2; g.stroke();
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1260 / S, (e.clientY - r.top) / r.height * 960 / S]; };
  c.onmousemove = e => { const [x, y] = pos(e); const cc = cellAt(x / CF | 0, y / CF | 0); $('#mapInfo').textContent = `X ${String(Math.floor(x)).padStart(3, '0')} — Y ${String(Math.floor(y)).padStart(3, '0')} · ${cc && cc.explored ? cellTitle(cc) + ' · ' + cellTerrainName(cc) : 'inesplorato'}`; };
  c.onclick = e => { const [x, y] = pos(e); G.waypoint = { cx: x / CF | 0, cy: y / CF | 0 }; toast(`📍 GPS: X ${Math.floor(x)} Y ${Math.floor(y)}`); g.strokeStyle = '#e2703a'; g.lineWidth = 3; g.strokeRect((G.waypoint.cx * CF) * S, (G.waypoint.cy * CF) * S, CF * S, CF * S); };
}

const fuelPrice = () => Math.round(1.9 * (0.5 + 0.5 * G.island.euro / 1.12) * (G.island.blockade > G.day ? 1.6 : 1) * 100) / 100;
function refuel(v) {
  const M = VMODELS[v.model]; if (!M.fuel) return toast('Questo mezzo non va a benzina.', 'warn');
  const need = M.fuel - v.fuel; if (need < 0.5) return toast('Il serbatoio è già pieno.');
  const pr = fuelPrice(), can = Math.min(need, Math.floor((G.cash + G.bank) / pr));
  if (can <= 0) return toast('Non hai soldi per la benzina.', 'bad');
  if (pay(can * pr, 'Benzina', { atCounter: true })) { advance(6); v.fuel += can; v.lowWarn = false; toast(`⛽ ${can.toFixed(1)} L per ${money(can * pr)}. Puzza di benzina sulle mani.`); }
}

    v && !v.tracker ? { t: `📍 Antifurto GPS satellitare (${money(350)})`, d: 'Vedi sempre dov\'è il tuo veicolo, ti avvisa se lo toccano.', f: () => { if (pay(350, 'GPS tracker', { atCounter: true })) { v.tracker = true; closePanel(); toast('Antifurto installato.'); } } } : null,

function removeKeys(vid) { G.inv = G.inv.filter(it => !(it.id === 'chiave' && it.d && it.d.vid === vid)); }
function buyVehicle(id, price, b) {
  if (!pay(price, 'Acquisto ' + VMODELS[id].n, { atCounter: true })) return;
  let cx = b.cell[0], cy = b.cell[1];
  if (VMODELS[id].type === 'boat') { const w = boatSpot(cx, cy); cx = w[0]; cy = w[1]; }
  const v = addVehicle(id, cx, cy, { fuel: 0.9 });
  addInv('chiave', 1, { vid: v.id, title: 'Chiave ' + VMODELS[id].n }, true);
  closePanel(); toast(`${VMODELS[id].n} è tua. Targa ${v.plate}.`, 'money'); refreshSide();
}
function boatSpot(cx, cy) { for (let r = 1; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const c = cellAt(cx + dx, cy + dy); if (c && c.water) return [c.cx, c.cy]; } return [cx, cy]; }

function minigameTiming(o) {

    for (const l of items) if (!l.gone) { g.fillStyle = l.ok ? o.good : o.bad; g.beginPath(); g.ellipse(l.x, l.y, 12, 9, 0.4, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(l.x - 3, l.y - 3, 3, 0, 7); g.fill(); }

}

function restoreWorldState() {

  (S.subst || []).forEach(([ok, ra], i) => { if (W.subst[i]) { W.subst[i].ok = ok; W.subst[i].repairAt = ra; } });

/* ---------- Borsa viva: oscilla ogni ora, non solo ogni giorno ---------- */
function stocksHourly() {
  for (const s of STOCKS) {
    const st = G.stocks[s.id]; if (!st) continue;
    if (!st.h || !st.h.length) st.h = [st.p];
    let drift = rr(-0.012, 0.012) + Math.sin((G.min / 60 + s.id.charCodeAt(0)) / 7) * 0.004;
    if (s.id === 'TRG') drift += (ferryOK() ? 0.002 : -0.006);
    if (s.id === 'VFA') drift += (G.island.euro - 1.12) * 0.004;
    if (s.id === 'CUO' && G.pol.appalti) drift += G.pol.appalti.filter(a => a.until > G.day && a.firm === 'cuomo').length * 0.004;
    if (s.id === 'LIM') drift += (G.island.tourism > 0.9 ? 0.002 : -0.001);
    if (s.id === 'ELV') drift += 0.001 + (G.stats.posts || 0) * 0.0001;
    st.p = Math.max(0.5, st.p * (1 + drift)); st.h.push(Math.round(st.p * 100) / 100); if (st.h.length > 48) st.h.shift();
  }
}

function nightDanger(c) {
  if (!isNight()) return false;
  if (G.flags.lastNightEv && G.min - G.flags.lastNightEv < 50) return false;
  const wild = ['boschi', 'parco', 'cimitero', 'scogli', 'monte', 'villaluna'].includes(c.zone);
  const unknown = !c.explored || (c.exploredNight === undefined);
  const lit = c.b.some(id => isOpen(W.buildings[id])) || c.plaza;
  if (!wild && lit) return false;
  let p = wild ? 0.14 : 0.05;
  if (!G.player.torch && !curVeh()) p += 0.06;
  if (curVeh()) p *= 0.4;
  if (hasTrait('sensitivo')) p += 0.03;
  p *= (1 + G.horror.dread * 0.5);
  if (!chance(p)) return false;
  G.flags.lastNightEv = G.min; c.exploredNight = 1;
  nightEvent(c, wild);
  return true;
}

function openChat(n) {
  const st = npcState(n); st.chat = st.chat || [];
  const msgs = st.chat.slice(-18).map(m => `<div class="ch-msg ${m.me ? 'me' : ''}">${esc(m.t)}<span class="ch-t">${m.hm}</span></div>`).join('');

  const send = () => { const t = $('#chIn').value.trim(); if (!t) return; st.chat.push({ t, me: true, hm: hhmm() }); $('#chIn').value = ''; st.op += 0.5; advance(1, { noUI: true }); renderChatLog(n); setTimeout(() => chatReply(n), 500); };
  $('#chSend').onclick = send; $('#chIn').onkeydown = e => { if (e.key === 'Enter') send(); }; $('#chIn').focus();
}
function online(n) { return isPl(n) ? plState(n).on : !((npcState(n).jailed > G.day) || !npcDesire(n) || npcDesire(n).act === 'sleep'); }
function renderChatLog(n) { const st = npcState(n); const el = $('#chLog'); if (!el) return; el.innerHTML = st.chat.slice(-18).map(m => `<div class="ch-msg ${m.me ? 'me' : ''}">${esc(m.t)}<span class="ch-t">${m.hm}</span></div>`).join(''); el.scrollTop = el.scrollHeight; }
function chatReply(n) {
  const st = npcState(n); if (!online(n)) { return; }
  let r;
  const last = (st.chat[st.chat.length - 1] || {}).t || '';
  if (/ciao|salve|ehi|ue|hey/i.test(last)) r = charLine(n, 'greet');
  else if (/\?$/.test(last)) r = chance(0.5) ? charLine(n, 'talk') : pick(['Boh, non saprei.', 'Bella domanda.', 'Dipende.', 'Sì, credo di sì.']);
  else if (/grazie/i.test(last)) r = pick(['Figurati!', 'Di niente.', 'Quando vuoi.']);
  else if (/vediamo|usciamo|beviamo|festa|caffè|caffe/i.test(last)) r = pick(['Ci sto! Dimmi dove.', 'Volentieri, passa quando vuoi.', 'Stasera? Per me va bene.']);
  else r = chance(0.4) ? charLine(n, 'talk') : (isPl(n) ? plLine(n, 'rp') : pick(['Eh già.', 'Capito.', 'Hai ragione.', ambientLine(n)]));
  st.chat.push({ t: moodPrefix(n) + r, me: false, hm: hhmm() });
  st.op += 0.5; renderChatLog(n);
}
function chatInbox() {
  // elenco delle conversazioni (rubrica + chi ti ha scritto)
  const contacts = NPCS.filter(n => { const s = npcState(n); return s.alive && (s.number || (s.chat && s.chat.length)); });
  const opts = contacts.sort((a, b) => npcState(b).op - npcState(a).op).map(n => { const s = npcState(n); return { t: (online(n) ? '🟢 ' : '⚫ ') + esc(isPl(n) ? n.pl.tag : npcName(n, false)), d: tierOf(s.op)[1] + (s.chat && s.chat.length ? ' · ' + esc((s.chat[s.chat.length - 1].t || '').slice(0, 30)) : ''), f: () => { closePanel(); openChat(n); } }; });

}

/* ---------- Slot di salvataggio manuali ---------- */
const SLOT_KEY = i => 'villafranca_rp_slot' + i;
function slotsScreen(back) {
  const slots = [1, 2, 3].map(i => { try { const d = JSON.parse(localStorage.getItem(SLOT_KEY(i))); return d ? { i, name: d._nm, day: d._day, when: d._when } : { i, empty: true }; } catch (e) { return { i, empty: true }; } });
  const rows = slots.map(sl => `<div class="card" style="margin-bottom:8px"><b>Slot ${sl.i}</b> ${sl.empty ? '<span class="muted">— vuoto</span>' : `— ${esc(sl.name)} · giorno ${sl.day} · <span class="small muted">${esc(sl.when || '')}</span>`}<div class="row" style="margin-top:6px">${G && G.player && !G.dead ? `<button class="btn sm pri" data-save="${sl.i}">💾 Salva qui</button>` : ''}${sl.empty ? '' : `<button class="btn sm" data-load="${sl.i}">📂 Carica</button> <button class="btn sm bad" data-del="${sl.i}">🗑️</button>`}</div></div>`).join('');
  openPanel('💾 Partite salvate', `<p class="desc">Salva e carica a mano in tre slot, oltre al salvataggio automatico. Caricare una partita abbandona quella in corso.</p>${rows}`, [{ t: 'Chiudi', c: 'pri', f: back || closePanel }], { wide: true });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => { saveToSlot(+b.dataset.save); slotsScreen(back); toast('💾 Partita salvata nello slot ' + b.dataset.save + '.', 'good'); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { localStorage.removeItem(SLOT_KEY(+b.dataset.del)); slotsScreen(back); });
  document.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { if (confirm('Caricare lo slot ' + b.dataset.load + '? La partita in corso non salvata andrà persa.')) loadFromSlot(+b.dataset.load); });
}
function saveToSlot(i) {
  if (!G || !G.player) return;
  G.world = snapshotWorld(); G.shoals = SHOALS; const horror = G.horror; delete G.horror;
  try { const o = Object.assign({}, G, { horror: undefined, _nm: G.player.first + ' ' + G.player.last, _day: G.day, _when: dateStr() + ' ' + hhmm() }); localStorage.setItem(SLOT_KEY(i), JSON.stringify(o)); } catch (e) { toast('Slot troppo pieno: libera spazio.', 'bad'); }
  G.horror = horror;
}
async function loadFromSlot(i) {
  let data; try { data = JSON.parse(localStorage.getItem(SLOT_KEY(i))); } catch (e) { data = null; }
  if (!data) return toast('Slot vuoto.', 'warn');
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  closePanel(); connectAndLoad();
}

/* ---------- Coltivazione: solo in una base tua, astratta ---------- */
function openColtivazione() {

  G.grow = G.grow || { plots: [] };
  const render = () => {
    const rows = G.grow.plots.map((pl, k) => {
      const age = G.day - pl.day, ready = age >= DRUGS.erba.growDays;
      const state = pl.dead ? '<span class="badc">seccata</span>' : ready ? '<span class="good">pronta da raccogliere</span>' : `in crescita (${age}/${DRUGS.erba.growDays} giorni)${pl.watered === G.day ? ' · annaffiata' : ''}`;

    }).join('');
    $('#growBody').innerHTML = `<p class="small">Piante: ${G.grow.plots.length}/6. Più ne tieni, più la Brigata e la Polizia ci fanno caso. Raccogli, essicca, lavora in dosi, poi spaccia di notte.</p>${rows || '<p class="muted">Nessuna pianta. Pianta un seme.</p>'}<div style="margin-top:8px"><button class="btn sm" id="plant" ${!hasInv('seme_erba') || G.grow.plots.length >= 6 ? 'disabled' : ''}>🌱 Pianta un seme${hasInv('seme_erba') ? '' : ' (non ne hai)'}</button> ${hasInv('erba_verde') ? `<button class="btn sm pri" id="dry">🌾 Essicca e lavora il raccolto (${countInv('erba_verde')})</button>` : ''}</div>`;
    if ($('#plant')) $('#plant').onclick = () => { removeInv('seme_erba', 1); G.grow.plots.push({ day: G.day, watered: G.day }); advance(20); render(); };
    document.querySelectorAll('[data-water]').forEach(b => b.onclick = () => { G.grow.plots[+b.dataset.water].watered = G.day; advance(10); render(); });
    document.querySelectorAll('[data-rip]').forEach(b => b.onclick = () => { G.grow.plots.splice(+b.dataset.rip, 1); render(); });

function harvestGame(yield0, back) {
  // minigioco astratto: raccogli al volo (click), poi diventa materia grezza
  minigameClick(n => { const got = Math.max(1, Math.min(yield0, Math.round(n / 3))); for (let i = 0; i < got; i++) addInv('erba_verde', 1, null, true); advance(30); offense('coltivazione', 0.1); toast(`Raccolte ${got} infiorescenze. Ora vanno lavorate.`, 'warn'); if (back) openColtivazione(); }, { title: '✂️ Raccolta', desc: 'Clicca le cime mature, lascia le foglie. 20 secondi.', good: '#6aa84f', bad: '#8a7a3a', bg: ['#2f4a2a', '#3a5a33'], goodLabel: 'cime' });
}
// lavorazione/taglio: minigioco di precisione astratto (nessun metodo reale)
function processDrug(drug) {
  const D = DRUGS[drug];
  const rawId = drug === 'erba' ? 'erba_verde' : drug === 'bianca' ? 'pasta_coca' : 'pasta_bruna';
  const have = countInv(rawId);
  if (!have) return toast('Non hai materiale grezzo da lavorare.', 'warn');
  minigameTiming({ title: '⚗️ Lavorazione: ' + D.n, desc: 'Lavoro di precisione: ferma l\'indicatore nella zona giusta a ogni passaggio. Un errore rovina la partita.', pins: 5, speed: 1.05 - skill('meccanica') / 300, zone: 0.16 + skill('meccanica') / 500,
    onWin: () => { removeInv(rawId, 1); const doses = (drug === 'erba' ? 3 : 6) + ri(0, 3) + Math.floor(skill('meccanica') / 25); const outId = drug; for (let i = 0; i < doses; i++) addInv(outId, 1, null, true); advance(90); gainSkill('meccanica', 2); offense('produzione', 0.05); toast(`Lavorazione riuscita: ${doses} dosi di ${D.n.toLowerCase()}.`, 'warn'); },
    onFail: () => { removeInv(rawId, 1); advance(60); if (chance(0.2)) { hurt(rr(2, 8), 'esalazioni nella lavorazione'); } toast('Partita rovinata. Materiale sprecato.', 'bad'); } });
}

/* ---------- Spaccio: di notte, in strada ---------- */
function canDeal() { const c = playerCell(); return isNight() || (c && c.zone && ['boschi', 'scogli', 'marina'].includes(c.zone)); }
function openSpaccio() {
  const doses = G.inv.filter(it => ITEMS[it.id] && ITEMS[it.id].dose);
  if (!doses.length) return toast('Non hai dosi da vendere. Lavora la merce prima.', 'warn');
  if (!canDeal()) return toast('Troppa gente, troppa luce. Si spaccia di notte, o in posti isolati.', 'warn');
  const c = playerCell();
  const demand = 1 + (G.island.crime || 20) / 100 + (isNight() ? 0.3 : 0);
  const opts = doses.map(it => { const I = ITEMS[it.id]; const price = Math.round(I.price * demand * (0.8 + Math.random() * 0.4)); return { t: `${I.ico} Vendi ${I.n.toLowerCase()} — ~${money(price)}`, d: `Ne hai ${countInv(it.id)} · rischio ${['','basso','medio','alto'][Math.min(3,Math.round((I.heat||10)/14))]}`, f: () => dealDose(it.id, price) }; });
  opts.push({ t: '↩︎ Lascia perdere', f: closePanel });
  openPanel('🌙 Spaccio', `<p class="desc">Un cliente si avvicina nell'ombra, lo sguardo nervoso. ${G.wanted.level ? '<span class="badc">Sei già nel mirino della Polizia.</span>' : ''} Ogni vendita attira l'attenzione: a volte il cliente è un civetta.</p>${optList(opts)}`, [{ t: 'Chiudi', c: 'pri', f: closePanel }]); bindOpts(opts);
}
function dealDose(id, price) {
  const I = ITEMS[id];
  // il cliente può essere un poliziotto in borghese
  const bustChance = clamp(0.06 + G.wanted.level * 0.05 + (I.heat || 10) / 300 + (G.pol.crackdown ? 0.08 : 0) - skill('eloquenza') / 400, 0.03, 0.5);
  advance(10);
  if (chance(bustChance)) {
    closePanel();
    eventPanel('🚨 Era un civetta!', 'vicolo', `Il «cliente» tira fuori un tesserino. «Polizia Insulare. Fermo lì.» Altri due escono dall'ombra.`, [
      { t: '🏃 Scappa', d: 'Atletica', f: () => { closePanel(); if (check('atletica', 45)) { toast('Li semini tra i vicoli, col cuore in gola.'); offense('spaccio', 0.9); } else { toast('Ti placcano a terra.', 'bad'); G.record.pending.push({ type: 'spaccio', day: G.day }); arrestPlayer('Arrestato in flagranza di spaccio'); } } },
      { t: '🤝 Consegnati', c: 'pri', f: () => { closePanel(); G.record.pending.push({ type: 'spaccio', day: G.day }); if (hasContraband()) G.record.pending.push({ type: 'detenzione', day: G.day }); arrestPlayer('Arrestato per spaccio'); } }]);
    return;
  }
  removeInv(id, 1); earn(price, 'Vendita strada', 'cash'); G.stats.deals = (G.stats.deals || 0) + 1;
  G.island.crime = Math.min(100, (G.island.crime || 20) + (I.heat || 10) / 20);
  if (chance(0.3 + (I.heat || 10) / 200)) { G.wanted.heat = clamp(G.wanted.heat + (I.heat || 10) / 3, 0, 100); updateWantedLevel(); }
  // un tossico conosciuto diventa più legato (e più rovinato)
  const addicts = npcsHere().filter(n => n.addict); if (addicts.length) { const a = addicts[0]; npcState(a).op += 2; npcState(a).addiction = Math.min(100, (npcState(a).addiction || 40) + 8); }
  openPanel('🌙 Spaccio', `<p class="desc">Passaggio di mano veloce, poi sparisce nel buio. +${money(price)}.</p>`, [{ t: 'Continua', c: 'pri', f: () => { closePanel(); openSpaccio(); } }, { t: 'Basta per stanotte', f: closePanel }]);
}

/* ---------- Uso e dipendenza del giocatore ---------- */
function useDrug(it) {
  const I = ITEMS[it.id], p = G.player;
  p.addiction = p.addiction || 0;
  for (const k in I.high) { if (k === 'stamina') p.stamina = clamp(p.stamina + I.high[k], 0, maxStamina()); else p[k] = clamp((p[k] || 0) + I.high[k], 0, 100); }
  p.addiction = Math.min(100, p.addiction + (I.addict || 0.3) * 20);
  p.highUntil = G.min + 90; G.stats.used = (G.stats.used || 0) + 1;
  useItemInst(it);
  toast(`${I.ico} Ti fai. Per un po' va tutto bene. Poi arriva il conto.`, 'warn');
  if (p.addiction > 50 && !G.flags.addictWarn) { G.flags.addictWarn = true; log('Ne senti già il bisogno appena svanisce. Sta diventando un problema.', 'bad'); }
  advance(20);
}
function addictionTick() {
  const p = G.player; if (!p.addiction) return;
  // astinenza quando non ti fai da un po'
  if (p.highUntil && G.min > p.highUntil + 240) {
    if (chance(0.02 + p.addiction / 500)) { p.stress = Math.min(100, p.stress + p.addiction / 20); if (p.addiction > 60) hurt(p.addiction / 400, 'l\'astinenza'); if (chance(0.3)) log('🥶 Sudi freddo, tremi. Il corpo chiede la dose.', 'bad'); }
  }
  p.addiction = Math.max(0, p.addiction - 0.02); // cala lentamente da sobrio
}
function rehabCost() { return Math.round(400 + G.player.addiction * 20); }
function openRehab(n) {
  const p = G.player; if (!p.addiction || p.addiction < 10) return toast('Non ne hai bisogno.');
  const cost = rehabCost();
  openPanel('🩺 Disintossicazione', `<p class="desc">Il medico ti guarda serio. «Posso aiutarti. Ci vogliono giorni, e ${money(cost)}. Ma devi volerlo tu.»</p>`, [
    { t: `✅ Disintossicati (${money(cost)}, 3 giorni)`, c: 'pri', dis: G.bank + G.cash < cost, f: () => { if (pay(cost, 'Disintossicazione', { atCounter: true })) { closePanel(); advance(3 * 1440, { quiet: true }); p.addiction = Math.max(0, p.addiction - 70); p.stress = Math.min(100, p.stress + 20); toast('Tre giorni d\'inferno. Ne esci pulito, o quasi.', 'good'); } } },
    { t: 'Non ora', f: closePanel }]);
}

/* ---------- Conseguenze dell'hacking: tracciamento e indagine ---------- */
function addTrace(amt) {
  G.trace = (G.trace || 0) + amt;
  if (G.trace > 100 && !G.record.warrants.some(w => w.type === 'hacking')) {
    G.record.warrants.push({ type: 'hacking', day: G.day });
    sendMsg('Numero privato', 'Hanno risalito i tuoi accessi. Spariscono le tracce solo se stai fermo. O se ti pentisci.', { force: true });
    toast('🚨 La Polizia Postale ha un mandato a tuo nome: accesso abusivo ai sistemi.', 'bad');
    G.wanted.heat = clamp(G.wanted.heat + 30, 0, 100); updateWantedLevel();
  } else if (G.trace > 60 && !G.flags.traceWarn) { G.flags.traceWarn = true; toast('I log dei tuoi accessi iniziano a lasciare una scia. Occhio.', 'warn'); }
}
function traceDecay() { if (G.trace > 0) G.trace = Math.max(0, G.trace - 1.5); }
function wholesaleSell() {
  const doses = G.inv.filter(it => ITEMS[it.id] && ITEMS[it.id].dose);
  if (!doses.length) return toast('Non hai dosi da vendere.', 'warn');
  const opts = doses.map(it => { const I = ITEMS[it.id], pr = Math.round(I.price * 0.55); return { t: `${I.ico} ${I.n} ×${countInv(it.id)} — ${money(pr)} cad.`, f: () => { const q = countInv(it.id); removeInv(it.id, q); earn(pr * q, 'Vendita all\'ingrosso', 'bank'); addRep(DRUGS[I.drug] ? DRUGS[I.drug].clan : 'carannante', 6); G.wanted.heat = clamp(G.wanted.heat + 4, 0, 100); updateWantedLevel(); closePanel(); toast(`Venduto in blocco: ${money(pr * q)}. Il clan è contento.`, 'money'); } }; });
  opts.push({ t: 'Chiudi', c: 'pri', f: closePanel });
  openPanel('💰 Vendita all\'ingrosso', '<p class="desc">Il clan compra in blocco: paghi meno rischio, guadagni meno. I soldi finiscono puliti sul conto.</p>' + optList(opts), [{ t: 'Chiudi', c: 'pri', f: closePanel }]); bindOpts(opts);
}

// merge tech items & stocks
try { Object.assign(ITEMS, TECH_ITEMS); } catch(e){}
try { Object.assign(ITEMS, DRUG_ITEMS); Object.assign(OFFENSES, CRIME_OFFENSES); } catch(e){}
if (!STOCKS.some(x=>x.id==='ELV')) STOCKS.push({ id: 'ELV', n: 'ElettroVetrata SpA' });

/* ---------- Ciclo di animazione ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (G && G.player && !$('#game').classList.contains('hidden')) {
    const tx = G.player.cx * CF + 2, ty = G.player.cy * CF + 2;
    anim.tok.x = lerp(anim.tok.x, tx, clamp(dt * 12, 0, 1)); anim.tok.y = lerp(anim.tok.y, ty, clamp(dt * 12, 0, 1));
    if (G.horror) G.horror.glitch = Math.max(0, G.horror.glitch - dt * 0.8);
    drawBoard(now / 1000, dt);
    if (AU.ctx) {
      const c = playerCell(), wx = WEATHER[G.weather.cur];
      AU.set('sea', c && (c.coast || c.water) ? 0.05 + wx.sea * 0.05 : 0.008, 1);
      AU.set('wind', 0.01 + wx.wind * 0.03 + (c && c.h > 0.4 ? 0.02 : 0), 1);
      AU.set('rain', wx.rain * 0.05, 1);
      if (SETTINGS.music) AU.music(dt); else if (AU.musicGain) AU.musicGain.gain.value = 0;
    }
    const ck = $('#clock'); if (ck && ck.textContent !== hhmm()) ck.textContent = hhmm();
  }
  requestAnimationFrame(frame);
}
saveSettings();
requestAnimationFrame(frame);
titleScreen();
</script>
