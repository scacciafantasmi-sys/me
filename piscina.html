<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Vestiti in Piscina — Dress Up &amp; Swim</title>
<meta name="description" content="Gioco dress-up: vesti il personaggio con moltissimi abiti da bagno e accessori, poi tuffati e nuota in piscina!">
<style>
:root{
  --skin-color:#f2c19b;
  --skin-hi:#ffe3c4;
  --skin-lo:#d9a97e;
  --hair-color:#6b4226;
  --hair-hi:#8a5a35;
  --hair-lo:#432914;
  --suit-fill:#ff6f91;
  --bg-sky-1:#bff0ff;
  --bg-sky-2:#e8fbff;
  --panel:#ffffff;
  --panel-2:#fbf6ff;
  --ink:#3a2b4d;
  --ink-soft:#6b5b83;
  --accent:#ff6f91;
  --accent-2:#33c2c9;
  --border:#e6def5;
  --radius:16px;
  --shadow:0 8px 24px rgba(90,60,140,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Trebuchet MS',sans-serif;
  background:linear-gradient(180deg,#fbeaff 0%,#eef6ff 45%,#e6fbff 100%);
  color:var(--ink);
  min-height:100vh;
  padding:14px;
}
.wrap{max-width:1180px;margin:0 auto;}
header.top{
  text-align:center;
  margin-bottom:16px;
}
header.top h1{
  font-size:clamp(22px,4vw,34px);
  margin:0 0 4px;
  background:linear-gradient(90deg,#ff6f91,#ff9f6f,#33c2c9,#7f6fff);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:hueSlide 8s linear infinite;
  font-weight:800;
  letter-spacing:.5px;
}
@keyframes hueSlide{0%{background-position:0% 50%}100%{background-position:300% 50%}}
header.top p{margin:0;color:var(--ink-soft);font-size:14px;}

.game{
  display:grid;
  grid-template-columns: minmax(280px,460px) 1fr;
  gap:18px;
  align-items:start;
}
@media (max-width:880px){
  .game{grid-template-columns:1fr;}
}

/* ---------- STAGE ---------- */
.stage-card{
  background:var(--panel);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  position:sticky;
  top:14px;
}
@media (max-width:880px){ .stage-card{position:static;} }

.stage{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio: 4 / 5;
  background:
    radial-gradient(120% 70% at 50% 0%, #fff7e0 0%, var(--bg-sky-2) 40%, var(--bg-sky-1) 100%);
  border:3px solid #fff;
  box-shadow:inset 0 0 0 2px #d9f3ff;
}
.sun{
  position:absolute; top:8%; right:10%;
  width:15%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff6c9, #ffd35c 60%, #ffb347);
  box-shadow:0 0 30px 10px rgba(255,211,92,.5);
}
.cloud{position:absolute; background:#fff; border-radius:50px; opacity:.85; filter:blur(.3px);}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud1{width:70px;height:24px;top:12%;left:8%;}
.cloud1::before{width:34px;height:34px;top:-16px;left:8px;}
.cloud1::after{width:26px;height:26px;top:-10px;left:34px;}
.cloud2{width:50px;height:18px;top:22%;left:60%;}
.cloud2::before{width:26px;height:26px;top:-12px;left:6px;}
.cloud2::after{width:20px;height:20px;top:-8px;left:26px;}

.poolTiles{
  position:absolute; left:0; right:0; bottom:0; height:46%;
  background:
    linear-gradient(#eaf7ff,#eaf7ff) top/100% 8px no-repeat,
    repeating-linear-gradient(90deg,#ffffff 0 22px,#dff1fb 22px 24px);
}
.poolWater{
  position:absolute; left:6%; right:6%; bottom:4%; top:56%;
  border-radius:26px;
  background:linear-gradient(180deg,#4fd0e6 0%,#20a6c9 55%,#1587a8 100%);
  box-shadow:inset 0 10px 26px rgba(255,255,255,.35), inset 0 -18px 30px rgba(0,60,90,.35);
  overflow:hidden;
}
.poolWater::before{
  content:"";
  position:absolute; left:-10%; right:-10%; top:-6px; height:26px;
  background:
    radial-gradient(circle at 10px 10px, transparent 9px, #cdf3ff 10px, #cdf3ff 11px, transparent 12px) repeat-x;
  background-size:40px 26px;
  opacity:.8;
  animation:waveSlide 2.4s linear infinite;
}
.poolWater::after{
  content:"";
  position:absolute; inset:0;
  background:repeating-linear-gradient(120deg, rgba(255,255,255,.08) 0 6px, transparent 6px 26px);
  animation:shimmer 3.6s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes waveSlide{from{background-position-x:0}to{background-position-x:-40px}}
@keyframes shimmer{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:.7;transform:translateX(10px)}}

.ladder{position:absolute; right:9%; top:52%; width:22px; height:16%; opacity:.9;}
.ladder i{position:absolute; background:#e8e8e8; border-radius:3px; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.ladder .rail{width:4px; height:100%; top:0;}
.ladder .rail.l{left:2px;}
.ladder .rail.r{right:2px;}
.ladder .rung{width:100%; height:3px; left:0;}

.figureLayer{
  position:absolute; left:50%; bottom:8%;
  width:46%; max-width:230px;
  transform:translate(-50%,0);
  transition:bottom .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);
  z-index:5;
}
.stage.in-water .figureLayer{
  bottom:-2%;
  animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translate(-50%,0) rotate(-3deg);}
  50%{transform:translate(-50%,-14px) rotate(3deg);}
}
.figureLayer svg{display:block; width:100%; height:auto; overflow:visible;}

.legPivot{ transform-box: fill-box; transform-origin: 50% 0%; transform:rotate(-5deg); }
.legPivot.legRight{ transform:rotate(5deg); }
.stage.in-water .legPivot.legLeft{ animation:kickL 1s ease-in-out infinite; }
.stage.in-water .legPivot.legRight{ animation:kickR 1s ease-in-out infinite; animation-delay:.5s; }
@keyframes kickL{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(14deg);}}
@keyframes kickR{0%,100%{transform:rotate(5deg);}50%{transform:rotate(-14deg);}}
.armPivot{ transform-box: fill-box; transform-origin: 50% 5%; transform:rotate(14deg); }
.armPivot.right{ transform:rotate(-14deg); }
.stage.in-water .armPivot.left{ animation:strokeL 1.3s ease-in-out infinite; }
.stage.in-water .armPivot.right{ animation:strokeR 1.3s ease-in-out infinite; }
@keyframes strokeL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-45deg)}}
@keyframes strokeR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(45deg)}}

.ripples{ position:absolute; left:50%; bottom:30%; width:70%; transform:translate(-50%,40%); z-index:4; pointer-events:none; opacity:0; }
.stage.in-water .ripples{ opacity:1; }
.ripple{
  position:absolute; left:50%; top:0; width:40px; height:14px; margin-left:-20px;
  border:2px solid rgba(255,255,255,.75); border-radius:50%;
  animation:rip 2s ease-out infinite;
}
.ripple.r2{animation-delay:.6s;}
.ripple.r3{animation-delay:1.2s;}
@keyframes rip{0%{width:20px;height:8px;margin-left:-10px;opacity:.9;}100%{width:140px;height:34px;margin-left:-70px;opacity:0;}}

.bubbles{position:absolute; left:0; right:0; bottom:6%; top:56%; overflow:hidden; z-index:3; pointer-events:none; opacity:0;}
.stage.in-water .bubbles{opacity:1;}
.bubble{position:absolute; bottom:-10%; width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,.75); box-shadow:inset -2px -2px 0 rgba(255,255,255,.4);
  animation:rise 3.4s linear infinite;}
.bubble:nth-child(1){left:20%; animation-delay:0s; width:6px;height:6px;}
.bubble:nth-child(2){left:35%; animation-delay:.7s; width:9px;height:9px;}
.bubble:nth-child(3){left:50%; animation-delay:1.4s; width:5px;height:5px;}
.bubble:nth-child(4){left:65%; animation-delay:.3s; width:8px;height:8px;}
.bubble:nth-child(5){left:78%; animation-delay:2s; width:7px;height:7px;}
.bubble:nth-child(6){left:88%; animation-delay:1s; width:6px;height:6px;}
@keyframes rise{0%{transform:translateY(0) scale(1); opacity:0;}10%{opacity:.9;}100%{transform:translateY(-260%) scale(1.3); opacity:0;}}

.splash{position:absolute; left:50%; bottom:56%; width:1px; height:1px; z-index:7; pointer-events:none;}
.splash span{position:absolute; width:6px; height:16px; background:#eafcff; border-radius:4px; opacity:0; left:0; top:0;}
.stage.splashing .splash span{animation:drop .55s ease-out forwards;}
.splash span:nth-child(1){transform:rotate(0deg) translateY(0);}
.splash span:nth-child(2){transform:rotate(40deg);}
.splash span:nth-child(3){transform:rotate(-40deg);}
.splash span:nth-child(4){transform:rotate(80deg);}
.splash span:nth-child(5){transform:rotate(-80deg);}
.splash span:nth-child(6){transform:rotate(120deg);}
.splash span:nth-child(7){transform:rotate(-120deg);}
.splash span:nth-child(8){transform:rotate(160deg);}
@keyframes drop{
  0%{opacity:1; transform:translateY(0) rotate(var(--rot,0));}
  100%{opacity:0; transform:translateY(-70px) rotate(var(--rot,0));}
}

.wetOverlay{
  position:absolute; left:0; right:0; bottom:0; height:0; overflow:hidden; z-index:6; pointer-events:none;
  transition:height .6s cubic-bezier(.4,0,.2,1);
  mix-blend-mode:multiply;
}
.stage.in-water .wetOverlay{height:38%;}
.wetOverlay .tint{position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,120,155,0) 0%, rgba(20,120,155,.4) 22%, rgba(15,100,140,.55) 100%);}

.stageControls{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center;}

/* ---------- BUTTONS ---------- */
button{font-family:inherit; cursor:pointer;}
.btn{
  border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:700;
  background:var(--panel-2); color:var(--ink); box-shadow:0 3px 0 var(--border);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--border);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff9a6f); color:#fff; box-shadow:0 3px 0 #c94f6d;}
.btn.primary.out{background:linear-gradient(135deg,var(--accent-2),#5ad1ff); box-shadow:0 3px 0 #1a8fa0;}
.btn.ghost{background:transparent; box-shadow:none; border:2px solid var(--border); padding:8px 14px;}

/* ---------- PANEL ---------- */
.panel-card{
  background:var(--panel);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
}
.tabs{
  display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;
  border-bottom:2px solid var(--border); padding-bottom:10px;
}
.tab{
  background:var(--panel-2); border:2px solid transparent; border-radius:12px;
  padding:8px 10px; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;
}
.tab .ic{font-size:18px;}
.tab.active{border-color:var(--accent); color:var(--accent); background:#fff0f4;}

.section-title{font-size:13px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin:2px 0 10px;}

.optionGrid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px;
  margin-bottom:16px;
}
.optBtn{
  background:var(--panel-2); border:2px solid var(--border); border-radius:12px;
  padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:11px; font-weight:700; color:var(--ink); text-align:center; line-height:1.15;
}
.optBtn .ic{font-size:20px;}
.optBtn.active{border-color:var(--accent); background:#fff0f4; box-shadow:0 0 0 2px #ffd6e2 inset;}

.swatchGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:8px; margin-bottom:16px;}
.swatch{
  width:100%; aspect-ratio:1; border-radius:50%; border:3px solid #fff;
  box-shadow:0 0 0 2px var(--border);
  position:relative;
}
.swatch.active{box-shadow:0 0 0 3px var(--accent);}
.swatch.active::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); font-size:14px;}

/* ---------- CHARACTER SVG FILLS ---------- */
.skinfill{fill:url(#skinGrad);}
.hairfill{fill:url(#hairGrad);}
.suitfill{fill:var(--suit-fill);}
.coverfill{fill:#fbfbff; opacity:.9;}
.headwearfill{fill:#ff6f91;}
.casualfill{fill:var(--casual-fill,#4f6fb0);}
.denimfill{fill:var(--denim-fill,#3f5b8a);}

/* ---------- WET CLOTHES EFFECT ---------- */
.stage.wet .skinfill{ filter:saturate(1.12) brightness(.99); }
.stage.wet .hairfill{ filter:brightness(.72) saturate(1.25) contrast(1.05); }
.stage.wet .suitfill,
.stage.wet .coverfill,
.stage.wet .casualfill,
.stage.wet .denimfill,
.stage.wet .headwearfill{ filter:brightness(.68) saturate(1.35) contrast(1.08); }
.wetSheen{opacity:0; transition:opacity .4s ease;}
.stage.wet .wetSheen{opacity:.4;}

.dripDrop{
  position:absolute; width:5px; height:14px; border-radius:0 0 50% 50%/0 0 60% 60%;
  background:linear-gradient(180deg, rgba(180,230,245,.15), rgba(120,200,230,.85));
  top:0; left:0; opacity:0; pointer-events:none;
}
.stage.dripping .dripDrop{ animation:dripFall 1.15s linear infinite; }
@keyframes dripFall{
  0%{opacity:0; transform:translateY(0) scaleY(.6);}
  8%{opacity:.9;}
  85%{opacity:.7;}
  100%{opacity:0; transform:translateY(70px) scaleY(1.3);}
}

.puddle{
  position:absolute; left:50%; bottom:6%; width:120px; height:22px; margin-left:-60px;
  background:radial-gradient(ellipse at center, rgba(40,150,190,.55) 0%, rgba(40,150,190,.28) 55%, transparent 75%);
  border-radius:50%; opacity:0; transition:opacity .8s ease, width .8s ease; z-index:4; pointer-events:none;
}
.stage.wet:not(.in-water) .puddle{opacity:1; width:150px;}

/* ---------- SWIM D-PAD (mobile controls) ---------- */
.swimControls{
  position:absolute; right:4%; bottom:5%; z-index:9;
  display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(3,34px);
  gap:3px; opacity:0; pointer-events:none; transition:opacity .35s ease;
}
.stage.in-water .swimControls{opacity:.92; pointer-events:auto;}
.dpadBtn{
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.55); border:2px solid rgba(255,255,255,.9); border-radius:10px;
  font-size:16px; color:#0d5c72; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:none;
  backdrop-filter:blur(2px);
}
.dpadBtn:active{background:rgba(255,255,255,.85);}
.dpadBtn.up{grid-column:2; grid-row:1;}
.dpadBtn.left{grid-column:1; grid-row:2;}
.dpadBtn.right{grid-column:3; grid-row:2;}
.dpadBtn.down{grid-column:2; grid-row:3;}

.figureMover{position:absolute; inset:0; transition:transform .5s cubic-bezier(.4,0,.2,1); pointer-events:none;}

footer{text-align:center; color:var(--ink-soft); font-size:12px; margin-top:20px; padding-bottom:10px;}
.badge{display:inline-block; background:#fff0f4; color:var(--accent); border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🏊‍♀️ Vestiti in Piscina</h1>
    <p>Scegli il tuo outfit da bagno tra moltissimi stili e colori, poi tuffati e nuota in piscina!</p>
  </header>

  <div class="game">
    <!-- STAGE -->
    <div class="stage-card">
      <div class="stage" id="stage">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="poolTiles"></div>
        <div class="poolWater"></div>
        <div class="ladder">
          <i class="rail l"></i><i class="rail r"></i>
          <i class="rung" style="top:10%"></i><i class="rung" style="top:35%"></i><i class="rung" style="top:60%"></i><i class="rung" style="top:85%"></i>
        </div>

        <div class="figureMover" id="figureMover">
          <div class="figureLayer" id="figureLayer">
            <!-- character SVG injected here -->
          </div>
        </div>
        <div class="wetOverlay"><div class="tint"></div></div>
        <div class="ripples"><div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div></div>
        <div class="bubbles">
          <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
          <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        </div>
        <div class="splash" id="splash">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="puddle"></div>
        <div class="dripLayer" style="position:absolute; left:38%; bottom:38%; width:24%;">
          <div class="dripDrop" style="left:6%; animation-delay:0s;"></div>
          <div class="dripDrop" style="left:38%; animation-delay:.4s;"></div>
          <div class="dripDrop" style="left:70%; animation-delay:.75s;"></div>
          <div class="dripDrop" style="left:22%; top:22%; animation-delay:.2s;"></div>
          <div class="dripDrop" style="left:88%; top:18%; animation-delay:.55s;"></div>
        </div>
        <div class="swimControls" id="swimControls">
          <button class="dpadBtn up" data-dir="up" aria-label="Su">▲</button>
          <button class="dpadBtn left" data-dir="left" aria-label="Sinistra">◀</button>
          <button class="dpadBtn right" data-dir="right" aria-label="Destra">▶</button>
          <button class="dpadBtn down" data-dir="down" aria-label="Giù">▼</button>
        </div>
      </div>

      <div class="stageControls">
        <button class="btn primary" id="swimBtn">🤿 Tuffati in piscina!</button>
        <button class="btn ghost" id="towelBtn" style="display:none;">🧺 Asciugamano</button>
        <button class="btn" id="randomBtn">🎲 Sorprendimi</button>
        <button class="btn ghost" id="resetBtn">↺ Reset</button>
      </div>
    </div>

    <!-- PANEL -->
    <div class="panel-card">
      <div class="tabs" id="tabs"></div>
      <div id="panelBody"></div>
    </div>
  </div>

  <footer>Gioco completamente offline, nessun dato lascia il tuo browser · il tuo outfit viene salvato automaticamente <span class="badge">100% client-side</span></footer>
</div>

<script>
(function(){
"use strict";

const bottoms = [

function shade(hex, percent){
  if(!hex || hex.indexOf("url")===0) return hex;
  const c = hex.replace('#','');
  const full = c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c;
  const num = parseInt(full,16);
  if(isNaN(num)) return hex;
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  const t = percent<0 ? 0 : 255, p = Math.abs(percent);
  r = Math.round((t-r)*p)+r; g = Math.round((t-g)*p)+g; b = Math.round((t-b)*p)+b;
  return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){ /* ignore corrupted storage */ }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ======================= RENDER ======================= */

const root = document.documentElement.style;
const figureLayer = document.getElementById("figureLayer");
figureLayer.innerHTML = charSVG();

// cache elements grouped by data-group
const groupedEls = {};
figureLayer.querySelectorAll("[data-group]").forEach(el=>{
  const g = el.dataset.group;
  (groupedEls[g] = groupedEls[g] || []).push(el);
});

function applyGroup(groupName, key){
  const els = groupedEls[groupName];
  if(!els) return;
  els.forEach(el=>{
    el.style.display = (el.dataset.key === key) ? "" : "none";
  });
}

function render(){
  root.setProperty("--skin-color", state.skin);
  root.setProperty("--skin-hi", shade(state.skin, .32));
  root.setProperty("--skin-lo", shade(state.skin, -.14));
  root.setProperty("--hair-color", state.haircolor);
  root.setProperty("--hair-hi", shade(state.haircolor, .28));
  root.setProperty("--hair-lo", shade(state.haircolor, -.36));
  root.setProperty("--suit-fill", state.suitcolor);
  root.setProperty("--casual-fill", state.casualcolor);
  root.setProperty("--denim-fill", state.denimcolor);

  applyGroup("hair", state.hair);
  applyGroup("top", state.top);
  applyGroup("bottom", state.bottom);
  applyGroup("coverup", state.coverup);
  applyGroup("casualTop", state.casualTop);
  applyGroup("casualBottom", state.casualBottom);
  applyGroup("headwear", state.headwear);
  applyGroup("eyewear", state.eyewear);
  applyGroup("jewelry", state.jewelry);
  applyGroup("floatie", state.floatie);
  applyGroup("shoes", state.shoes);

  // one-piece hides separate bottom
  const bottomGroup = document.getElementById("bottomGroup");
  bottomGroup.style.display = (state.top === "onepiece") ? "none" : "";

  // shoes hidden while swimming
  const shoesGroup = document.getElementById("shoesGroup");
  shoesGroup.style.display = stage.classList.contains("in-water") ? "none" : "";

  refreshOptionUI();
  saveState();
}

/* ======================= UI: TABS & OPTIONS ======================= */

const tabsEl = document.getElementById("tabs");
const panelBody = document.getElementById("panelBody");
let activeTab = "hair";

function iconSwatchStyle(color){
  return `background:${color.startsWith('url')?'#fff':color}; ${color.startsWith('url')? 'background-image:'+cssUrlPreview(color)+';':''}`;
}
function cssUrlPreview(v){ return v; }

function buildTabs(){
  tabsEl.innerHTML = "";
  tabsDef.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab" + (t.k===activeTab ? " active":"");
    b.innerHTML = `<span class="ic">${t.ic}</span><span>${t.label}</span>`;
    b.addEventListener("click", ()=>{ activeTab = t.k; buildTabs(); buildPanel(); });
    tabsEl.appendChild(b);
  });
}

function buildPanel(){
  const t = tabsDef.find(x=>x.k===activeTab);
  panelBody.innerHTML = "";
  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = t.label;
  panelBody.appendChild(title);

  if(t.kind === "option"){
    const grid = document.createElement("div");
    grid.className = "optionGrid";
    t.list.forEach(opt=>{
      const b = document.createElement("button");
      b.className = "optBtn" + (state[t.group]===opt.k ? " active":"");
      b.dataset.group = t.group; b.dataset.key = opt.k;
      b.innerHTML = `<span class="ic">${opt.ic}</span><span>${opt.label}</span>`;
      b.addEventListener("click", ()=>{ state[t.group] = opt.k; render(); });
      grid.appendChild(b);
    });
    panelBody.appendChild(grid);
  } else if(t.kind === "swatch"){
    const grid = document.createElement("div");
    grid.className = "swatchGrid";
    t.list.forEach(color=>{
      const b = document.createElement("button");
      b.className = "swatch" + (state[t.k]===color ? " active":"");
      b.style.background = color;
      b.dataset.swatchTab = t.k; b.dataset.value = color;
      b.addEventListener("click", ()=>{ state[t.k] = color; render(); });
      grid.appendChild(b);
    });
    panelBody.appendChild(grid);
  } else if(t.kind === "swatchObj"){
    const grid = document.createElement("div");
    grid.className = "swatchGrid";
    t.list.forEach(c=>{
      const b = document.createElement("button");
      b.className = "swatch" + (state[t.k]===c.v ? " active":"");
      b.style.background = c.v.startsWith("url") ? "#eee" : c.v;
      if(c.v.startsWith("url")){ b.style.backgroundImage = c.v; b.style.backgroundSize="cover"; }
      b.dataset.swatchTab = t.k; b.dataset.value = c.v;
      b.addEventListener("click", ()=>{ state[t.k] = c.v; render(); });
      grid.appendChild(b);
    });
    panelBody.appendChild(grid);
  }
}

function refreshOptionUI(){
  panelBody.querySelectorAll(".optBtn").forEach(b=>{
    b.classList.toggle("active", state[b.dataset.group] === b.dataset.key);
  });
  panelBody.querySelectorAll(".swatch").forEach(b=>{
    const tabKey = b.dataset.swatchTab;
    b.classList.toggle("active", state[tabKey] === b.dataset.value);
  });
}

/* ======================= CONTROLS ======================= */

const stage = document.getElementById("stage");
const swimBtn = document.getElementById("swimBtn");
const towelBtn = document.getElementById("towelBtn");
const splash = document.getElementById("splash");
const figureMover = document.getElementById("figureMover");

let dripTimeout = null;

function updateTowelBtn(){
  const isWet = stage.classList.contains("wet");
  const inWater = stage.classList.contains("in-water");
  towelBtn.style.display = (isWet && !inWater) ? "" : "none";
}

swimBtn.addEventListener("click", ()=>{
  const goingIn = !stage.classList.contains("in-water");
  stage.classList.toggle("in-water", goingIn);
  swimBtn.textContent = goingIn ? "🏖️ Esci dalla piscina" : "🤿 Tuffati in piscina!";
  swimBtn.classList.toggle("out", goingIn);
  stage.classList.add("splashing");
  setTimeout(()=>stage.classList.remove("splashing"), 600);

  if(goingIn){
    stage.classList.add("wet");
    stage.classList.remove("dripping");
    clearTimeout(dripTimeout);
  } else {
    resetSwimPosition();
    if(stage.classList.contains("wet")){
      stage.classList.add("dripping");
      clearTimeout(dripTimeout);
      dripTimeout = setTimeout(()=>stage.classList.remove("dripping"), 5200);
    }
  }
  updateTowelBtn();
  render();
});

towelBtn.addEventListener("click", ()=>{
  stage.classList.remove("wet","dripping");
  clearTimeout(dripTimeout);
  updateTowelBtn();
});

/* ---- swim movement (D-pad + keyboard, mobile-friendly) ---- */
let swimPos = {x:0, y:0};
const SWIM_BOUNDS = {minX:-90, maxX:60, minY:-65, maxY:40};
const SWIM_STEP = 7;

function applySwimPosition(){
  figureMover.style.transform = `translate(${swimPos.x}px, ${swimPos.y}px)`;
}
function resetSwimPosition(){
  swimPos = {x:0,y:0};
  applySwimPosition();
}
function nudge(dir){
  if(!stage.classList.contains("in-water")) return;
  if(dir==="up") swimPos.y = Math.max(SWIM_BOUNDS.minY, swimPos.y - SWIM_STEP);
  if(dir==="down") swimPos.y = Math.min(SWIM_BOUNDS.maxY, swimPos.y + SWIM_STEP);
  if(dir==="left") swimPos.x = Math.max(SWIM_BOUNDS.minX, swimPos.x - SWIM_STEP);
  if(dir==="right") swimPos.x = Math.min(SWIM_BOUNDS.maxX, swimPos.x + SWIM_STEP);
  applySwimPosition();
}

let moveTimer = null;
function startMove(dir){
  nudge(dir);
  clearInterval(moveTimer);
  moveTimer = setInterval(()=>nudge(dir), 90);
}
function stopMove(){
  clearInterval(moveTimer);
  moveTimer = null;
}

document.querySelectorAll(".dpadBtn").forEach(btn=>{
  const dir = btn.dataset.dir;
  btn.addEventListener("pointerdown", (e)=>{ e.preventDefault(); startMove(dir); });
  btn.addEventListener("pointerup", stopMove);
  btn.addEventListener("pointerleave", stopMove);
  btn.addEventListener("pointercancel", stopMove);
});

window.addEventListener("keydown", (e)=>{
  const map = {ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right"};
  if(map[e.key] && stage.classList.contains("in-water")){
    e.preventDefault();
    nudge(map[e.key]);
  }
});

document.getElementById("randomBtn").addEventListener("click", ()=>{
  state.skin = skinTones[Math.floor(Math.random()*skinTones.length)];
  state.haircolor = hairColors[Math.floor(Math.random()*hairColors.length)];
  state.suitcolor = suitColors[Math.floor(Math.random()*suitColors.length)].v;
  state.casualcolor = casualColors[Math.floor(Math.random()*casualColors.length)];
  state.denimcolor = denimColors[Math.floor(Math.random()*denimColors.length)];
  state.hair = hairstyles[Math.floor(Math.random()*hairstyles.length)].k;
  state.top = tops[Math.floor(Math.random()*tops.length)].k;
  state.bottom = bottoms[Math.floor(Math.random()*bottoms.length)].k;
  state.coverup = coverups[Math.floor(Math.random()*coverups.length)].k;
  state.casualTop = casualTops[Math.floor(Math.random()*casualTops.length)].k;
  state.casualBottom = casualBottoms[Math.floor(Math.random()*casualBottoms.length)].k;
  state.headwear = headwears[Math.floor(Math.random()*headwears.length)].k;
  state.eyewear = eyewears[Math.floor(Math.random()*eyewears.length)].k;
  state.jewelry = jewelries[Math.floor(Math.random()*jewelries.length)].k;
  state.shoes = shoes[Math.floor(Math.random()*shoes.length)].k;
  state.floatie = floaties[Math.floor(Math.random()*floaties.length)].k;
  buildPanel();
  render();
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  state = {
    skin: skinTones[2], haircolor: hairColors[1], suitcolor: "#ff6f91",
    casualcolor: "#ffffff", denimcolor: "#3f5b8a",
    hair:"long", top:"triangle", bottom:"low", coverup:"none",
    casualTop:"none", casualBottom:"none",
    headwear:"none", eyewear:"none", jewelry:"none", shoes:"flip", floatie:"none",
  };
  stage.classList.remove("wet","dripping");
  clearTimeout(dripTimeout);
  resetSwimPosition();
  updateTowelBtn();
  buildPanel();
  render();
});

/* ======================= INIT ======================= */
loadState();
buildTabs();
buildPanel();
render();
updateTowelBtn();

})();
