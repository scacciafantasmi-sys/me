<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Prezzo del Potere</title>
<style>
:root{
  --bg:#0a0a0d; --bg2:#111116; --panel:#15151b; --panel2:#1c1c24;
  --red:#b1181f; --red2:#e0272f; --blue:#1e3a6e; --blue2:#2d55a0;
  --text:#d8d6d0; --muted:#8a8790; --gold:#c9a54a; --dark:#050506;
  --ok:#3a7d44; --warn:#b1181f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100%;}
body{
  background:
    radial-gradient(ellipse at top, rgba(177,24,31,0.08), transparent 60%),
    linear-gradient(180deg, var(--dark) 0%, var(--bg) 100%);
  background-attachment:fixed;
}
#app{max-width:760px;margin:0 auto;padding:16px;padding-bottom:60px;}
.title-screen{text-align:center;padding:60px 10px 20px;}
.title-screen h1{
  font-size:2.6em;letter-spacing:2px;margin:0 0 6px;color:var(--red2);
  text-shadow:0 0 18px rgba(177,24,31,0.5), 0 0 2px #000;
  font-family:'Trebuchet MS',sans-serif;font-weight:900;
}
.title-screen .sub{color:var(--muted);font-style:italic;margin-bottom:30px;font-size:1.05em;}
.web-divider{text-align:center;color:var(--muted);opacity:0.5;margin:18px 0;font-size:0.85em;letter-spacing:4px;}
.btn{
  display:inline-block;background:var(--panel2);color:var(--text);border:1px solid #333;
  padding:12px 18px;margin:6px 0;border-radius:3px;cursor:pointer;font-family:inherit;
  font-size:1em;text-align:left;width:100%;transition:all .15s;line-height:1.35;
}
.btn:hover{background:var(--red);border-color:var(--red2);color:#fff;transform:translateX(2px);}
.btn:disabled,.btn.locked{opacity:0.35;cursor:not-allowed;background:#0e0e12;}
.btn:disabled:hover,.btn.locked:hover{transform:none;background:#0e0e12;border-color:#333;}
.btn .tag{display:block;font-size:0.72em;color:var(--gold);margin-top:4px;font-style:italic;}
.btn-primary{background:var(--red);border-color:var(--red2);}
.btn-primary:hover{background:var(--red2);}
.menu-btn{max-width:340px;margin:8px auto;text-align:center;}
.statbar-wrap{position:sticky;top:env(safe-area-inset-top, 0px);background:rgba(10,10,13,0.96);backdrop-filter:blur(4px);
  padding:8px 4px 10px;border-bottom:1px solid #2a2a33;z-index:10;margin-bottom:16px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-family:'Trebuchet MS',sans-serif;font-size:0.72em;}
.stat-row{display:flex;align-items:center;gap:6px;}
.stat-label{width:64px;color:var(--muted);flex-shrink:0;}
.stat-track{flex:1;height:6px;background:#000;border-radius:3px;overflow:hidden;border:1px solid #222;}
.stat-fill{height:100%;transition:width .3s;}
.stat-vita .stat-fill{background:linear-gradient(90deg,#7a0e13,var(--red2));}
.stat-resistenza .stat-fill{background:linear-gradient(90deg,#1a5c8a,#3d9cd6);}
.stat-umore .stat-fill{background:linear-gradient(90deg,#5a7a2a,#9ec24a);}
.stat-rabbia .stat-fill{background:linear-gradient(90deg,#6e1a1a,#d64d1f);}
.stat-segreto .stat-fill{background:linear-gradient(90deg,#3a2a5c,#7a5cc9);}
.stat-flash .stat-fill{background:linear-gradient(90deg,#8a6a1a,var(--gold));}
.stat-mj .stat-fill{background:linear-gradient(90deg,#8a2a5c,#d64d9e);}
.stat-rep .stat-fill{background:linear-gradient(90deg,#2a5c5c,#4dc2c2);}
.stat-val{width:26px;text-align:right;color:#aaa;font-size:0.95em;}
.chapter-tag{color:var(--gold);font-size:0.78em;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:6px;font-family:'Trebuchet MS',sans-serif;opacity:0.85;}
.story-text{font-size:1.12em;line-height:1.72;white-space:pre-line;margin-bottom:22px;color:#e2e0da;}
.story-text .fx{color:var(--red2);font-style:italic;}
.choices{margin-top:18px;}
.combat-panel{background:var(--panel);border:1px solid #2a2a33;border-radius:6px;padding:16px;margin-bottom:16px;}
.combat-vs{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'Trebuchet MS',sans-serif;}
.combat-side{flex:1;}
.combat-side h3{margin:0 0 6px;font-size:1em;color:var(--red2);}
.combat-side.enemy h3{color:#d68a3d;text-align:right;}
.combat-side.enemy{text-align:right;}
.hp-track{height:10px;background:#000;border:1px solid #333;border-radius:4px;overflow:hidden;}
.hp-fill{height:100%;background:linear-gradient(90deg,#7a0e13,var(--red2));transition:width .3s;}
.hp-fill.enemy-fill{background:linear-gradient(90deg,#8a4a10,#d68a3d);}
.combat-log{background:#000;border:1px solid #222;border-radius:4px;padding:10px;height:110px;overflow-y:auto;
  font-size:0.85em;color:#999;margin-bottom:12px;font-family:'Trebuchet MS',sans-serif;}
.combat-log div{margin-bottom:4px;}
.combat-log .hit{color:var(--red2);}
.combat-log .miss{color:#666;}
.combat-log .special{color:var(--gold);}
.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.journal{background:var(--panel);border-left:2px solid var(--gold);padding:10px 14px;margin:20px 0;
  font-size:0.85em;color:var(--muted);font-style:italic;}
.end-screen{text-align:center;padding:20px 10px;}
.end-screen h2{color:var(--gold);font-size:1.8em;margin-bottom:4px;}
.end-screen .end-sub{color:var(--muted);font-style:italic;margin-bottom:20px;}
.save-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
.save-controls button{background:var(--panel2);color:var(--muted);border:1px solid #333;padding:8px 14px;
  border-radius:3px;cursor:pointer;font-size:0.8em;font-family:'Trebuchet MS',sans-serif;}
.save-controls button:hover{color:var(--text);border-color:#555;}
.disclaimer{font-size:0.72em;color:#555;text-align:center;margin-top:40px;line-height:1.6;padding:0 10px;}
textarea.savebox{width:100%;height:80px;background:#000;color:#6a6;border:1px solid #333;font-size:0.7em;margin-top:10px;}
.small-note{font-size:0.78em;color:var(--muted);text-align:center;margin-top:10px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============ STATO ============ */
var DEFAULT_STATE = function(){ return {
  scene: "titolo",
  lastEnteredScene: null,
  stats: { vita:100, resistenza:100, umore:60, rabbia:15, segreto:90, fiduciaFlash:30, legameMJ:35, reputazione:50, soldi:15 },
  flags: {},
  journal: [],
  deathCtx: "",
  combat: null
};};
var S = DEFAULT_STATE();

function clamp(v){ return Math.max(0, Math.min(100, v)); }
function applyEffects(eff){
  if(!eff) return;
  for(var k in eff){
    if(k==="soldi"){ S.stats.soldi = Math.max(0, S.stats.soldi + eff[k]); continue; }
    if(S.stats.hasOwnProperty(k)) S.stats[k] = clamp(S.stats[k] + eff[k]);
  }
}
function setFlags(fl){ if(!fl) return; for(var k in fl) S.flags[k]=fl[k]; }
function meetsReq(req){
  if(!req) return true;
  for(var k in req){
    var r = req[k];
    if(k==="flags"){
      for(var fk in r){ if(S.flags[fk]!==r[fk]) return false; }
      continue;
    }
    var v = S.stats[k];
    if(v===undefined) continue;
    if(r.min!==undefined && v<r.min) return false;
    if(r.max!==undefined && v>r.max) return false;
  }
  return true;
}
function addJournal(txt){ S.journal.push(txt); if(S.journal.length>12) S.journal.shift(); }

/* ============ SALVATAGGIO ============ */
function save(){ try{ localStorage.setItem("prezzo_potere_save", JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem("prezzo_potere_save");
    if(raw){ var obj = JSON.parse(raw); S = Object.assign(DEFAULT_STATE(), obj); S.stats = Object.assign(DEFAULT_STATE().stats, obj.stats||{}); return true; }
  }catch(e){}
  return false;
}
function hardReset(){ S = DEFAULT_STATE(); save(); render(); }

/* ============ SCENE DATA ============ */
var SCENES = {};

/* ---------- TITOLO / MENU ---------- */
SCENES["titolo"] = { menu:true };

/* =========================================================
   ATTO 1 — LUTTO
   ========================================================= */

SCENES["intro_1"] = {
  chapter:"Atto I · Prologo",
  text:"Il cimitero di Forest Hills è vuoto da un'ora, ma Peter Parker è ancora lì, in piedi davanti a due lapidi ravvicinate. May Parker. Ben Parker. Sedici parole di condoglianze incise, e nessuna che spieghi come si fa a continuare a respirare.\n\nHa sedici anni. Ha dei poteri che non ha chiesto e non sa più a cosa servano, visto che non sono bastati a fermare un proiettile in un vicolo qualunque. Ha un borsone con tutto quello che possiede ancora infilato in fondo, perché la casa di Ingram Street non è più sua: è già passata a un'agenzia immobiliare, e lui non ha nessun altro posto dove andare.\n\nTranne uno.",
  choices:[
    {text:"«Vieni a stare da me.» Flash Thompson l'ha detto ieri, davanti a tutti, come se fosse la cosa più naturale del mondo.", next:"intro_2"}
  ]
};

SCENES["intro_2"] = {
  chapter:"Atto I · Prologo",
  text:"Flash Thompson — il ragazzo che per tre anni gli ha sbattuto la testa contro gli armadietti chiamandolo \"Parker il Fesso\" — ha una casa enorme e vuota a Forest Hills Gardens, un padre sempre in trasferta e un senso di colpa che gli è esploso in petto quando ha saputo di Ben. Ha offerto una stanza senza pensarci due volte. Peter ha detto sì perché non aveva altra scelta, e perché in fondo qualcosa, in Flash, dopo la storia dello zio, è davvero cambiato.\n\nFlash non sa niente di ragnatele o di proiettili. Non sa che l'amico che sta ospitando esce dalla finestra della sua stanza tre notti su quattro con qualcosa di rosso e blu infilato nello zaino. Non sa che ogni giorno che passa, tenerglielo nascosto costa un pezzo in più.",
  choices:[
    {text:"Entra in casa. Comincia la nuova vita, quella che nessuno dei due ha scelto davvero.", next:"casa_flash_1"}
  ]
};

SCENES["casa_flash_1"] = {
  chapter:"Atto I · Capitolo 1",
  effects:{fiduciaFlash:4, umore:2},
  text:"La stanza degli ospiti ha ancora l'odore di vernice fresca. Flash è sulla porta, le mani in tasca, che cerca di non sembrare imbarazzato.\n\n«Il bagno è in fondo al corridoio. Mio padre torna forse tra due settimane, forse tra un mese, chi lo sa. C'è cibo in frigo, prenditi quello che vuoi.» Una pausa. «Parker... mi dispiace. Per tuo zio. Sul serio.»\n\nPeter mormora un grazie che non riesce a essere più grande di così, e Flash annuisce, sollevato di non dover insistere.\n\nQuella notte resta sveglio a fissare un soffitto che non è il suo, in una casa che non è la sua, con addosso una vita che sente ancora meno sua. Sotto il letto, ripiegato dentro lo zaino, il costume aspetta. Fuori, Queens continua a respirare come se niente fosse successo — e da qualche parte là fuori c'è ancora qualcuno che ha bisogno di aiuto stanotte.",
  choices:[
    {text:"Esci dalla finestra. Il quartiere ha bisogno di Spider-Man.", next:"primo_giro_1"}
  ]
};

SCENES["primo_giro_1"] = {
  chapter:"Atto I · Capitolo 1",
  text:"Passano i giorni. Peter impara in fretta una cosa che nessun manuale gli aveva insegnato: essere Spider-Man non è la parte difficile. La parte difficile è essere Peter Parker il giorno dopo — arrivare in classe con un taglio sullo zigomo mascherato da correttore rubato a Flash, inventare scuse per la May che non c'è più a chiedergliele, contare le due banconote sgualcite che gli restano nel portafoglio e capire che non basteranno per il pranzo E per l'autobus.\n\nUna sera, tornando da scuola, sente delle urla soffocate in un vicolo dietro la Forty-Second Street.",
  choices:[
    {text:"Infilati nel vicolo. Qualcuno ha bisogno di te.", next:"combattimento_scippatori"}
  ]
};

SCENES["combattimento_scippatori"] = {
  chapter:"Atto I · Capitolo 1",
  text:"Due uomini hanno bloccato una donna contro un cassonetto, uno con un coltello a serramanico che luccica sotto un lampione rotto. Non è un supercriminale. È solo la strada, quella vera, quella che non fa notizia.",
  combat:{
    enemy:{ name:"Rapinatori di strada", vita:35, attacco:8, desc:"Due balordi armati di coltello — pericolosi soprattutto se ti fai prendere alla sprovvista." },
    onWin:"dopo_scippatori", onLose:null, isBoss:false
  }
};

SCENES["dopo_scippatori"] = {
  chapter:"Atto I · Capitolo 1",
  text:"La donna scappa senza nemmeno ringraziare — ha visto solo una maschera nel buio, e in questa città una maschera nel buio fa più paura di quanto rassicuri. Peter resta solo tra i cassonetti, il cuore che gli martella, un livido che si sta già gonfiando sotto una costola.\n\nÈ questo il lavoro. Nessun applauso. Solo il sapere, dentro, di aver fatto la cosa giusta — o di essersi fatto ancora una volta male per qualcuno che domani non si ricorderà nemmeno la sua faccia.",
  choices:[
    {text:"Torna a casa. Domani è un altro giorno di scuola, e un altro giorno da nascondere tutto a Flash.", effects:{vita:14, resistenza:14}, next:"scuola_1"}
  ]
};

SCENES["scuola_1"] = {
  chapter:"Atto I · Capitolo 2",
  effects:{legameMJ:2, vita:6, resistenza:6},
  text:"Midtown High, corridoio B. Mary Jane Watson lo intercetta all'armadietto con quella risata pronta che usa come uno scudo — ma oggi gli occhi le si fermano un secondo di troppo sul taglio che Peter ha vicino al labbro.\n\n«Tiger, sei inciampato di nuovo nel tuo stesso equipaggiamento fotografico o c'è dell'altro?» Peter tira fuori una scusa sulla fotocamera, e lei lascia cadere l'argomento — ma non gli crede fino in fondo, e gliela lascia intendere con uno sguardo che dice \"quando sarai pronto\".\n\nIn fondo al corridoio, Flash sta raccontando a un gruppetto di compagni una versione già abbellita di come ha \"praticamente salvato\" Parker dandogli un tetto. Non è cattiveria: è il suo modo di elaborare, ad alta voce, quello che è successo a Ben.\n\nDopo l'ultima campanella, il preside lo ferma: la retta per il laboratorio di scienze è scaduta, e la borsa di studio di quest'anno \"è in fase di revisione\" da quando è morto il tutore legale. Non c'è molto da decidere — gli servono soldi, e in fretta.",
  choices:[
    {text:"Vai al Daily Bugle a proporti come fotoreporter freelance.", next:"bugle_1"}
  ]
};

SCENES["bugle_1"] = {
  chapter:"Atto I · Capitolo 2",
  effects:{soldi:10, reputazione:-2},
  text:"J. Jonah Jameson — capelli a spazzola, baffi che sembrano avere vita propria, sigaro sempre spento tra i denti — passa le sue giornate a stampare in prima pagina che Spider-Man è \"una minaccia mascherata\". Il fatto che le foto migliori di quella minaccia gliele venda proprio un adolescente di nome Parker è un'ironia che solo Peter può apprezzare fino in fondo.\n\n«Non mi interessa la tua vita privata, ragazzo» abbaia Jameson senza alzare gli occhi dalle bozze. «Portami scatti di quel ragno che fa a pezzi la città e forse, forse, ti pago in tempo.» Peter incassa in silenzio — gli serve quella busta paga più di quanto gli serva l'orgoglio.",
  choices:[
    {text:"Torna in strada. C'è già qualcosa che vale una foto.", next:"villain_shocker_intro"}
  ]
};

/* --- cameo villain minore: Shocker --- */
SCENES["villain_shocker_intro"] = {
  chapter:"Atto I · Capitolo 3",
  text:"La radio della polizia, intercettata di sfuggita fuori dal Bugle, parla di un allarme alla First National sulla Quarantaduesima: qualcuno sta facendo esplodere un'intera facciata di marmo usando quelli che sembrano dei guanti pneumatici. Herman Schultz — la stampa lo chiamerà \"Shocker\" da stasera — sta caricando sacchi di banconote su un furgone mentre l'edificio dietro di lui crolla a pezzi come biscotti.",
  choices:[
    {text:"Cambiati nel vicolo più vicino. È il tuo momento.", next:"combattimento_shocker"}
  ]
};

SCENES["combattimento_shocker"] = {
  chapter:"Atto I · Capitolo 3",
  text:"I guanti di Schultz sparano onde d'urto che ti fanno vibrare le ossa anche quando le schivi di un soffio. Non è un genio del crimine — è solo un uomo con la tecnologia sbagliata nelle mani sbagliate, e la spavalderia di chi crede che nessuno possa fermarlo.",
  combat:{
    enemy:{ name:"Shocker", vita:50, attacco:13, desc:"Herman Schultz, guanti vibro-shock fatti in casa: colpisce a distanza, poco resistente da vicino." },
    onWin:"dopo_shocker", onLose:null, isBoss:false
  }
};

SCENES["dopo_shocker"] = {
  chapter:"Atto I · Capitolo 3",
  text:"Immobilizzato in un bozzolo di ragnatela contro un idrante, Shocker sputa sangue e un sorriso storto. «Goditela, moscerino. In questa città arriva gente molto peggio di me — e quella, ti giuro, non la vedi arrivare.»\n\nLa polizia arriva in tempo per prendersi il merito e il bottino recuperato. Il Daily Bugle, il giorno dopo, titola: SPIDER-MAN LEGATO A UNA RAPINA?, sotto una delle foto che Peter stesso ha scattato.",
  effects:{reputazione:-4, soldi:8, vita:8, resistenza:8},
  choices:[
    {text:"Ignora il titolo — è solo Jameson che vende copie sulla tua pelle. Torna a casa.", next:"biv1_setup"}
  ]
};

/* --- BIVIO MAGGIORE 1 --- */
SCENES["biv1_setup"] = {
  chapter:"Atto I · Capitolo 4",
  text:"Sono le tre del mattino quando Peter rientra dalla finestra della sua stanza, un braccio che sanguina più di quanto vorrebbe ammettere. La luce si accende. Flash è seduto sul bordo del suo stesso letto, non del tutto sobrio da una festa a cui Peter avrebbe dovuto accompagnarlo e a cui non si è presentato — di nuovo.\n\nGli occhi di Flash vanno dalla finestra aperta, al sangue sulla manica di Peter, al costume rosso e blu che è scivolato per metà fuori dallo zaino lasciato aperto sul pavimento. Nessuno dei due dice niente per tre secondi che durano un'eternità.\n\n«Parker...» la voce di Flash è piatta, incredula. «Quello è...»",
  choices:[
    {text:"Mentire. Costruisci in un secondo una bugia perfetta — un costume «per un servizio fotografico», il sangue «una rissa». Difendi il segreto a ogni costo.", effects:{segreto:10, fiduciaFlash:-8, umore:-4}, setFlags:{percorso1:"menzogna"}, next:"l1_M"},
    {text:"Non mentire fino in fondo. Non dici la parola \"Spider-Man\" — ma non neghi nemmeno. Lasci che Flash arrivi da solo alla verità, un pezzo alla volta.", effects:{segreto:-15, fiduciaFlash:6, umore:2}, setFlags:{percorso1:"quasiverita"}, next:"l1_Q"}
  ]
};

/* =========================================================
   STRUTTURA A BIVI REALI — nessun ramo si ricongiunge mai.
   Codice percorso: [M|Q] menzogna/quasiverità
                  + [D|C] diretto/cauto
                  + [S|B] flash sa/flash al buio
                  + [F|J|E] salva flash/mj/entrambi
                  + [V|P] vendetta/principio
   ========================================================= */

/* ---------------- LIVELLO 1 (dopo il Bivio 1) ---------------- */

SCENES["l1_M"] = {
  chapter:"Atto I · Il Ramo della Menzogna",
  text:"«Per un servizio fotografico universitario, Flash. Robaccia da studenti di cinema, mi hanno pagato quaranta dollari per farmi rincorrere da uno stuntman con un coltello di gomma.» La bugia esce così fluida che fa quasi paura a Peter stesso.\n\nFlash scrolla le spalle, troppo stanco per insistere. Da quella notte qualcosa si guasta piano tra loro: porte chiuse a chiave, domande evitate con una battuta, un fosso che si scava un centimetro alla volta.\n\nUna settimana dopo, un ladro alato con artigli d'acciaio — la stampa lo chiama già \"l'Avvoltoio\" — svaligia per la terza volta il deposito tecnologico della Oscorp Tower.",
  effects:{vita:14, resistenza:14},
  choices:[
    {text:"Vai a fermarlo. Ti servono soldi, e ti serve sapere cosa ruba.", next:"cmb_l1_M"}
  ]
};
SCENES["cmb_l1_M"] = {
  chapter:"Atto I · Cammeo — l'Avvoltoio",
  text:"Adrian Toomes plana tra i grattacieli con ali metalliche rubate a un incubo industriale, un sacco di componenti Oscorp legato alla schiena — un ex ingegnere scaricato dall'azienda senza pensione, che si riprende \"quello che gli spetta\" a modo suo.",
  combat:{ enemy:{ name:"l'Avvoltoio", vita:55, attacco:14, desc:"Adrian Toomes: veloce, aereo, difficile da agganciare — ma fragile una volta a terra." }, onWin:"f2_M", onLose:null, isBoss:false }
};

SCENES["l1_Q"] = {
  chapter:"Atto I · Il Ramo della Quasi Verità",
  text:"Peter non dice la parola. Ma non riesce a mentire guardando Flash negli occhi. «Ci sono cose che non posso dirti. Per la tua sicurezza, non perché non mi fidi.» Flash resta zitto a lungo, poi: «...Sei tu quello delle notizie, vero? Quello con la maschera.» Peter non risponde. Ma non nega nemmeno.\n\nDa quella notte qualcosa cambia — Flash inizia a coprirgli le assenze senza fare domande, a lasciargli la finestra socchiusa apposta. Una settimana dopo, al liceo circola voce di un uomo capace di prendere l'aspetto di chiunque, visto aggirarsi vicino all'ufficio del preside proprio i giorni in cui è sparito del materiale riservato sugli studenti.",
  effects:{vita:14, resistenza:14},
  choices:[
    {text:"Indaga di persona. Qualcuno sta usando la scuola come copertura.", next:"cmb_l1_Q"}
  ]
};
SCENES["cmb_l1_Q"] = {
  chapter:"Atto I · Cammeo — il Camaleonte",
  text:"Lo trovi nel seminterrato della scuola, a metà trasformazione: il volto ancora indeciso tra il proprio e quello rubato del bidello. Dmitri Smerdyakov — il Camaleonte — lavora per chi paga meglio, e stanotte qualcuno lo ha pagato per raccogliere ogni informazione possibile su chiunque, alla Midtown High, abbia perso un parente di recente.",
  combat:{ enemy:{ name:"il Camaleonte", vita:52, attacco:13, desc:"Dmitri Smerdyakov: nessuna vera forza, ma inganno e coltelli nascosti — pericoloso se lo sottovaluti." }, onWin:"f2_Q", onLose:null, isBoss:false }
};

SCENES["l2_MD"] = {
  chapter:"Atto II · Il Percorso Diretto",
  text:"Niente scuse, niente tempo da perdere: Peter supera telecamere e sensori fino al Livello R, dove trova vasche di siero verde fosforescente e una maschera da demone appesa a un manichino. L'allarme scatta comunque — una risata registrata rimbalza tra le pareti. Fugge un istante prima che il pavimento si apra su lame rotanti. Da quella notte è lui a sentirsi osservato: un'ombra sul tetto di fronte a casa di Flash, un'auto nera che rallenta troppo davanti a scuola. E sui tetti di Queens, tre giorni dopo, un uomo enorme in pelliccia di leone lo aspetta apertamente.",
  choices:[
    {text:"Sergei Kravinoff. Qualcuno lo ha pagato per cacciarti — affrontalo.", effects:{vita:12, resistenza:12}, next:"cmb_l2_MD"}
  ]
};
SCENES["l2_MC"] = {
  chapter:"Atto II · Il Percorso Cauto",
  text:"Peter chiede a Jameson un servizio fotografico sulla filantropia Oscorp e raccoglie pazientemente ogni pezzo: fatture filtrate, un articolo scientifico ritirato, un finanziamento segreto che continua nonostante il consiglio l'abbia bocciato. Lavoro lento, da giornalista, senza mai confidarsi con nessuno — nemmeno con Flash, che lo guarda tornare a casa ogni notte sempre più esausto e sempre più distante. Mentre l'indagine procede, un uomo capace di trasformare il proprio corpo in sabbia svaligia tre gioiellerie in una settimana.",
  choices:[
    {text:"Flint Marko, \"l'Uomo Sabbia\". Fermalo prima che qualcuno si faccia male.", effects:{vita:12, resistenza:12}, next:"cmb_l2_MC"}
  ]
};
SCENES["l2_QD"] = {
  chapter:"Atto II · Il Percorso Diretto",
  text:"Niente scuse, niente tempo da perdere — e stavolta Flash lo sa, e lo aspetta sveglio ogni notte con il telefono in mano pronto a chiamare qualcuno, chissà chi, se Peter non rientra. L'incursione alla Oscorp Tower finisce quasi male: un sistema di difesa automatico, una risata registrata negli altoparlanti. Da quella notte è Osborn, o quel che è diventato, a cercare lui. Flash lo vede tornare sempre più segnato e comincia a fare domande dirette che Peter non sa più come schivare. Sui tetti di Queens, tre giorni dopo, un uomo enorme in pelliccia di leone lo aspetta apertamente.",
  choices:[
    {text:"Sergei Kravinoff. Dì a Flash di stare attento, poi affrontalo.", effects:{fiduciaFlash:3, vita:12, resistenza:12}, next:"cmb_l2_QD"}
  ]
};
SCENES["l2_QC"] = {
  chapter:"Atto II · Il Percorso Cauto",
  text:"Con Flash a coprirgli le spalle in casa, Peter può muoversi con più calma: fatture filtrate, un articolo ritirato, un finanziamento segreto che continua di tasca propria. Ogni sera ne parla con Flash davanti a un piatto di pasta scotta — il lavoro da giornalista diventa qualcosa che fanno quasi insieme. Mentre l'indagine procede, un uomo capace di trasformare il proprio corpo in sabbia svaligia tre gioiellerie in una settimana.",
  choices:[
    {text:"Flint Marko, \"l'Uomo Sabbia\". Fermalo prima che qualcuno si faccia male.", effects:{vita:12, resistenza:12}, next:"cmb_l2_QC"}
  ]
};

SCENES["cmb_l2_MD"] = { chapter:"Atto II · Cammeo — Kraven il Cacciatore", text:"«Sergei Kravinoff» si presenta con un inchino teatrale. «Qualcuno mi ha pagato bene per rendere la tua vita interessante, ragno.»", combat:{ enemy:{ name:"Kraven il Cacciatore", vita:60, attacco:15, desc:"Forza bruta, sieri tribali, ama la caccia più della vittoria facile." }, onWin:"f3_MD", onLose:null, isBoss:false } };

SCENES["f3_MD"] = {
  chapter:"Atto II · Capitolo 9",
  text:"Kraven cade in ginocchio sorridendo comunque. «Dì al tuo amico Osborn... anzi no. Che si diverta a scoprire quanto sei bravo.» Due notti dopo, i notiziari parlano di un'\"esplosione di laboratorio\" alla Oscorp Tower. Sorvolando la città, vedi una sagoma su un aliante planare basso su Forest Hills e lasciar cadere una zucca che esplode in fiamme verdi sul tetto di casa di Flash — un avvertimento. Voli a casa e lo trovi scosso ma illeso sul prato bruciacchiato, e capisci che tenerlo all'oscuro è appena diventato più pericoloso di qualunque bugia.",
  choices:[
    {text:"Digli tutto, una volta per tutte: «Flash, sono io.»", effects:{segreto:-20, fiduciaFlash:15, umore:6, vita:16, resistenza:16}, setFlags:{f3:"S"}, next:"l3_MDS"},
    {text:"Inventa una copertura e proteggi il segreto, restando distante.", effects:{segreto:10, fiduciaFlash:-10, umore:-6, vita:16, resistenza:16}, setFlags:{f3:"B"}, next:"l3_MDB"}
  ]
};
SCENES["f3_MC"] = {
  chapter:"Atto II · Capitolo 9",
  text:"Alla fine intrappoli Marko in un container sigillato. «Non tutti quelli che finiscono male sono nati mostri» sussurra prima che i sigilli si chiudano. Due notti dopo, i notiziari parlano di un'\"esplosione di laboratorio\" alla Oscorp Tower. Sorvolando la città, vedi una sagoma su un aliante lasciar cadere una zucca in fiamme verdi sul tetto di casa di Flash. Lo trovi scosso ma illeso, e capisci che il segreto non può reggere ancora a lungo così.",
  choices:[
    {text:"Digli tutto, una volta per tutte: «Flash, sono io.»", effects:{segreto:-20, fiduciaFlash:15, umore:6, vita:16, resistenza:16}, setFlags:{f3:"S"}, next:"l3_MCS"},
    {text:"Inventa una copertura e proteggi il segreto, restando distante.", effects:{segreto:10, fiduciaFlash:-10, umore:-6, vita:16, resistenza:16}, setFlags:{f3:"B"}, next:"l3_MCB"}
  ]
};
SCENES["f3_QD"] = {
  chapter:"Atto II · Capitolo 9",
  text:"Kraven cade in ginocchio sorridendo comunque, e sparisce senza dire per chi lavora. Due notti dopo, un'\"esplosione di laboratorio\" alla Oscorp Tower finisce sui notiziari. Sorvolando la città vedi una sagoma su un aliante lasciar cadere una zucca in fiamme verdi proprio sul tetto di Flash — che ormai sa già del ragno, e che stanotte capisce per la prima volta cosa significhi davvero avere paura per te.",
  choices:[
    {text:"Confermagli tutto apertamente, senza più mezze misure.", effects:{segreto:-20, fiduciaFlash:15, umore:6, vita:16, resistenza:16}, setFlags:{f3:"S"}, next:"l3_QDS"},
    {text:"Minimizza, anche con lui che sa — non serve spaventarlo oltre.", effects:{segreto:10, fiduciaFlash:-10, umore:-6, vita:16, resistenza:16}, setFlags:{f3:"B"}, next:"l3_QDB"}
  ]
};
SCENES["f3_QC"] = {
  chapter:"Atto II · Capitolo 9",
  text:"Alla fine intrappoli Marko in un container sigillato — le sue parole sulla figlia ti restano addosso più del previsto. Due notti dopo, un'\"esplosione di laboratorio\" alla Oscorp Tower finisce sui notiziari. Sorvolando la città vedi una sagoma su un aliante lasciar cadere una zucca in fiamme verdi sul tetto di Flash, che ormai sa già del ragno e che stanotte, per la prima volta, capisce cosa rischia davvero a viverci insieme.",
  choices:[
    {text:"Confermagli tutto apertamente, senza più mezze misure.", effects:{segreto:-20, fiduciaFlash:15, umore:6, vita:16, resistenza:16}, setFlags:{f3:"S"}, next:"l3_QCS"},

SCENES["l3_MDS"] = {
  chapter:"Atto II · Flash Sa",
  text:"Flash assorbe la notizia con una risata nervosa — «Spider-Man dorme nella mia stanza degli ospiti» — e da allora diventa un fratello silenzioso: controlla i notiziari, copre le assenze, non fa domande. Ma un nemico che conosce i tuoi punti deboli li userà: un mercenario con corazza e coda velenosa comincia ad aggirarsi proprio intorno a Forest Hills.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Affrontalo prima che trovi quello che cerca.", effects:{vita:10, resistenza:10}, next:"cmb_l3_MDS"}]
};
SCENES["l3_MDB"] = {
  chapter:"Atto II · Flash al Buio",
  text:"«Nemici degli Osborn, certo» dice Flash, senza crederci fino in fondo. Da quel giorno chiude le finestre a doppia mandata, tiene una mazza vicino al letto \"per sicurezza\" — ha paura in casa propria e non sa nemmeno bene di cosa. Un mercenario con corazza e coda velenosa comincia ad aggirarsi proprio intorno a Forest Hills.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Vai a scoprire chi è.", effects:{vita:10, resistenza:10}, next:"cmb_l3_MDB"}]
};
SCENES["l3_MCS"] = {
  chapter:"Atto II · Flash Sa",
  text:"Flash assorbe la notizia meglio del previsto — «Ok. Ok. Spider-Man. Va bene» — e comincia a trattarti come un socio più che come un ospite, con un rispetto nuovo che non ti aspettavi. Ma un nemico che sa dove abiti userà anche questo: un mercenario armato di coda velenosa comincia ad aggirarsi proprio intorno a casa.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Affrontalo prima che trovi quello che cerca.", effects:{vita:10, resistenza:10}, next:"cmb_l3_MCS"}]
};
SCENES["l3_MCB"] = {
  chapter:"Atto II · Flash al Buio",
  text:"Flash non insiste, ma qualcosa nella fiducia tra voi si incrina in un modo nuovo: non è più solo un segreto tenuto, è un pericolo reale di cui non conosce la forma. Un mercenario armato di coda velenosa comincia ad aggirarsi proprio intorno a casa vostra.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Vai a scoprire chi è.", effects:{vita:10, resistenza:10}, next:"cmb_l3_MCB"}]
};
SCENES["l3_QDS"] = {
  chapter:"Atto II · Flash Sa",
  text:"Non c'è nemmeno bisogno di dirlo del tutto — bastano due parole e uno sguardo, e Flash ti abbraccia goffamente, la prima volta in vita sua che lo fa con te. Il legame che avete costruito indagando insieme si consolida in qualcosa di più solido. Ma un mercenario con corazza e coda velenosa comincia ad aggirarsi proprio intorno a Forest Hills.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Affrontalo prima che trovi quello che cerca.", effects:{vita:10, resistenza:10}, next:"cmb_l3_QDS"}]
};
SCENES["l3_QDB"] = {
  chapter:"Atto II · Flash al Buio",
  text:"Stavolta minimizzare fa più male del solito — Flash sa già, e vederti sminuire il pericolo davanti a lui lo ferisce più di quanto ammetta. Si allontana, non fisicamente ma in tutti gli altri modi possibili. Un mercenario con corazza e coda velenosa comincia ad aggirarsi proprio intorno a casa.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Vai a scoprire chi è.", effects:{vita:10, resistenza:10}, next:"cmb_l3_QDB"}]
};
SCENES["l3_QCS"] = {
  chapter:"Atto II · Flash Sa",
  text:"Bastano due parole e uno sguardo — Flash già lo sospettava da settimane, e conferme un fatto che indagavate insieme quasi lo solleva. Il vostro lavoro da squadra improvvisata diventa, da stanotte, anche una squadra vera. Ma un mercenario armato di coda velenosa comincia ad aggirarsi proprio intorno a casa.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Affrontalo prima che trovi quello che cerca.", effects:{vita:10, resistenza:10}, next:"cmb_l3_QCS"}]
};
SCENES["l3_QCB"] = {
  chapter:"Atto II · Flash al Buio",
  text:"Minimizzare stavolta suona quasi ridicolo — Flash sa già, ha indagato con te, e vederti far finta di niente lo allontana più di una bugia vera e propria l'avrebbe fatto. Un mercenario armato di coda velenosa comincia ad aggirarsi proprio intorno a casa.",
  choices:[{text:"Mac Gargan, \"Scorpion\". Vai a scoprire chi è.", effects:{vita:10, resistenza:10}, next:"cmb_l3_QCB"}]
};

  return "— Salvata la città, non tutto il resto —";
}

function endingText(S){

  } else {
    P.push("Le sirene arrivano otto minuti dopo. Otto minuti in cui Peter resta seduto sull'asfalto accanto a un uomo legato in ragnatela che ride piano, un suono spezzato, ripetendo «avresti dovuto... avresti dovuto...» come un disco rotto. Non l'ha fatto. E qualunque cosa sia costato stanotte, quella scelta resta sua e soltanto sua.");
  }

  /* --- P2: chi è stato salvato / perso sul ponte --- */
  if(f.f4==="F"){
    P.push("Mary Jane non tornerà mai — e ogni volta che Peter chiude gli occhi rivede quel secondo esatto in cui le ragnatele si sono spezzate. Flash, salvo, non smette di ripetergli che non è colpa sua, e ogni volta Peter finge di crederci un po' di più. Un banco vuoto in seconda fila, vicino alla finestra, resterà vuoto per il resto dell'anno scolastico.");
  } else if(f.f4==="J"){
    P.push("Flash non tornerà mai — e la casa di Forest Hills Gardens, da quella notte, è solo una casa vuota che Peter non riesce più a chiamare \"casa\". Mary Jane, salva, gli resta accanto più di quanto lui pensasse possibile, ma nessuno dei due riesce a dire ad alta voce quanto quel silenzio nuovo pesi.");
  } else if(f.entrambiEsito==="successo"){
    P.push("Flash e Mary Jane sono vivi — entrambi, contro ogni previsione, contro la fisica stessa. È il genere di miracolo che Peter non oserà mai raccontare per intero a nessuno dei due, ma che porterà con sé come prova che, quella notte almeno, \"non abbastanza\" non è stata l'ultima parola.");
  } else {
    P.push("Anche tentando l'impossibile, uno dei due è comunque scomparso nel buio sotto il ponte — e la parte peggiore, quella che Peter non confesserà mai, è aver sperato fino all'ultimo istante che il rischio doppio valesse la pena. A volte non vale. Quella notte non è valsa.");
  }

  /* --- P3: percorso1 + f3 — l'arco con Flash --- */
  var men = f.percorso1==="menzogna";
  var sa = f.f3==="S";

    P.push("Aver mentito a lungo e poi confessato tutto sotto la pressione del Folletto Verde ha lasciato una cicatrice sottile tra loro: Flash sa la verità, ma sa anche di averla scoperta solo perché costretto, non perché scelto. Restano vicini — ma con un pezzo di fiducia che nessuna delle due versioni di Peter Parker, quella con la maschera e quella senza, riesce più a restituirgli del tutto.");
  } else if(men && !sa){
    P.push("Il segreto, verso Flash, non è mai davvero caduto: Peter ha continuato a mentirgli fino alla fine, anche quando le zucche esplosive gli sono cadute sul tetto di casa. Flash non sa ancora, oggi, chi ha davvero dormito nella sua stanza degli ospiti per un anno intero — e forse, pensa Peter certe notti, è un regalo più che un furto.");
  } else if(!men && sa){
    P.push("Aver scelto la quasi-verità fin dall'inizio, e poi la verità intera quando è servita, ha reso Flash qualcosa che Peter non si aspettava di trovare dopo Ben: un fratello vero, non per sangue ma per scelta, che ha visto il peggio e non se n'è andato.");
  } else {
    P.push("Aver intuito la verità senza mai sentirsela dire fino in fondo ha lasciato Flash in una zona grigia che lo logora più di quanto Peter voglia ammettere: sa abbastanza per avere paura, non abbastanza per capire per cosa. Vivono nella stessa casa come due persone che si vogliono bene e non riescono più a dirselo del tutto.");
  }

  /* --- P4: f2 — diretto/cauto e la reputazione pubblica --- */
  if(f.f2==="D"){
    P.push("L'approccio diretto contro Osborn — l'irruzione notturna, la rabbia sempre un po' troppo vicina alla superficie — ha lasciato addosso a Spider-Man una fama ambigua: efficace, temuto, mai del tutto fidato. Jameson ha materiale per anni; Peter ha imparato, sulla propria pelle, quanto sia sottile la linea tra giustizia e vendetta anticipata.");
  } else {
    P.push("Il lavoro paziente da fotoreporter, prova dopo prova, ha lasciato in eredità qualcosa di raro per un vigilante mascherato: un fascicolo vero, verificabile, che un giorno — molto dopo — permetterà a qualcuno di capire cosa sia successo davvero alla Oscorp quell'anno. Non è gloria. È qualcosa di più utile: la verità, scritta e conservata.");
  }
  if(st.segreto<=30){
    P.push("Il segreto, ormai, è appeso a un filo sottilissimo: troppe persone sanno, troppe foto sono in giro, troppe coincidenze si sono accumulate. Peter Parker dorme sempre con un orecchio teso, sapendo che la prossima rivelazione potrebbe non dipendere più da una sua scelta.");
  }

  /* --- P5: chiusura tematica --- */
  if(f.vendetta===true){
    P.push("Zio Ben gli aveva insegnato una regola sola. Quella notte sul ponte, per la prima volta, l'ha infranta — e un ragno che dimentica perché porta la maschera, alla fine, rischia di restare solo un ragno.\n\n— FINE —");
  } else if(f.f4==="E"){
    P.push("Con grande potere, ha imparato sulla propria pelle, viene grande responsabilità — ma anche, nelle notti migliori, la possibilità di essere abbastanza. Da qualche parte sopra i tetti di Queens, un ragazzo con un ragno cucito sul petto continua a dondolarsi tra i grattacieli, e per la prima volta da mesi lo fa sapendo esattamente perché.\n\n— FINE —");
  } else {
    P.push("Con grande potere, ha imparato sulla propria pelle, non viene solo grande responsabilità — viene anche un conto che qualcuno, prima o poi, è costretto a pagare. Continua a indossare la maschera. Non perché sia guarito. Ma perché fermarsi adesso renderebbe quel vuoto ancora più inutile di quanto già sia.\n\n— FINE —");
  }

  return P.join("\n\n");
}/* GAME OVER / morte in combattimento (qualsiasi atto) */

/* ============ MOTORE ============ */
var appEl = document.getElementById("app");

function reqLabel(req){
  if(!req) return "";
  var labels={vita:"Vita",resistenza:"Resistenza",umore:"Umore",rabbia:"Rabbia",segreto:"Segreto",fiduciaFlash:"Fiducia di Flash",legameMJ:"Legame con MJ",reputazione:"Reputazione",soldi:"Soldi"};
  var parts=[];
  for(var k in req){
    if(k==="flags") continue;
    var r=req[k];
    if(r.min!==undefined) parts.push((labels[k]||k)+" ≥ "+r.min);
    if(r.max!==undefined) parts.push((labels[k]||k)+" ≤ "+r.max);
  }
  return parts.join(", ");
}

function renderStats(){
  var st=S.stats;
  function row(cls,label,val,max){
    max=max||100;
    return '<div class="stat-row stat-'+cls+'"><span class="stat-label">'+label+'</span>'+
      '<div class="stat-track"><div class="stat-fill" style="width:'+Math.max(0,Math.min(100,val/max*100))+'%"></div></div>'+
      '<span class="stat-val">'+Math.round(val)+'</span></div>';
  }
  var html='<div class="statbar-wrap"><div class="stats-grid">'+
    row("vita","Vita",st.vita)+row("resistenza","Energia",st.resistenza)+
    row("umore","Umore",st.umore)+row("rabbia","Rabbia",st.rabbia)+
    row("segreto","Segreto",st.segreto)+row("flash","Flash",st.fiduciaFlash)+
    row("mj","MJ",st.legameMJ)+row("rep","Fama",st.reputazione)+
    '</div><div style="text-align:right;font-size:0.72em;color:var(--muted);margin-top:2px;font-family:\'Trebuchet MS\',sans-serif;">$ '+st.soldi+'</div></div>';
  return html;
}

function render(){
  var scene = SCENES[S.scene];
  if(!scene){ S.scene="titolo"; scene=SCENES["titolo"]; }

  /* Applica gli effetti/flag propri della scena esattamente una volta,
     nel momento in cui vi si entra davvero (non a ogni ri-render). */
  if(S.lastEnteredScene !== S.scene){
    applyEffects(scene.effects); setFlags(scene.flags);
    S.lastEnteredScene = S.scene;
  }

  if(scene.menu){ renderTitleScreen(); return; }
  if(scene.ending){ renderEnding(scene); return; }
  if(scene.next_direct){
    S.scene = scene.next_direct; save(); render(); return;
  }
  if(scene.combat){ renderCombatEntry(scene); return; }

  var html = renderStats();
  html += '<div class="chapter-tag">'+ (scene.chapter||"") +'</div>';
  html += '<div class="story-text">'+escapeText(resolveText(scene.text)||"")+'</div>';
  html += '<div class="choices">';
  (scene.choices||[]).forEach(function(c, i){
    var ok = meetsReq(c.requires);
    html += '<button class="btn'+(ok?"":" locked")+'" '+(ok?"":"disabled")+' data-idx="'+i+'">'+
      escapeText(c.text) + (c.requires && !ok ? '<span class="tag">Richiede: '+reqLabel(c.requires)+'</span>' : '') +
      '</button>';
  });
  html += '</div>';

  if(S.journal.length){
    html += '<div class="journal">Frammenti del percorso: '+S.journal.slice(-3).join(" · ")+'</div>';
  }
  html += renderFooterControls();

  appEl.innerHTML = html;
  var btns = appEl.querySelectorAll(".choices .btn:not(.locked)");
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      var idx = parseInt(b.getAttribute("data-idx"),10);
      var choice = scene.choices[idx];
      applyEffects(choice.effects); setFlags(choice.setFlags);
      if(choice.journal) addJournal(choice.journal);
      S.scene = choice.next;
      save(); render();
    });
  });
  wireFooterControls();
  window.scrollTo(0,0);
}

function escapeText(t){
  var d=document.createElement("div"); d.innerText=t; return d.innerHTML;
}
function resolveText(t){
  return typeof t === "function" ? t(S) : t;
}

function renderFooterControls(){
  return '<div class="save-controls">'+
    '<button id="btn-export">Esporta salvataggio</button>'+
    '<button id="btn-import">Importa salvataggio</button>'+
    '<button id="btn-restart">Ricomincia da capo</button>'+
    '</div><div id="io-area"></div>';
}
function wireFooterControls(){
  var exp=document.getElementById("btn-export");
  var imp=document.getElementById("btn-import");
  var res=document.getElementById("btn-restart");
  if(exp) exp.onclick=function(){
    var area=document.getElementById("io-area");
    area.innerHTML='<textarea class="savebox" readonly>'+JSON.stringify(S)+'</textarea><div class="small-note">Copia e conserva questo testo per portare la partita altrove.</div>';
  };
  if(imp) imp.onclick=function(){
    var area=document.getElementById("io-area");
    area.innerHTML='<textarea class="savebox" placeholder="Incolla qui il salvataggio..."></textarea><button id="btn-doimport" style="margin-top:6px;">Carica</button><div id="import-err" class="small-note" style="color:var(--red2);"></div>';
    document.getElementById("btn-doimport").onclick=function(){
      var txt=area.querySelector("textarea").value;
      try{ var obj=JSON.parse(txt); S=Object.assign(DEFAULT_STATE(),obj); S.stats=Object.assign(DEFAULT_STATE().stats,obj.stats||{}); save(); render(); }
      catch(e){ document.getElementById("import-err").textContent="Salvataggio non valido — controlla di aver incollato il testo per intero."; }
    };
  };
  if(res) res.onclick=function(){
    var area=document.getElementById("io-area");
    area.innerHTML='<div class="small-note">Sei sicuro di voler ricominciare? La run attuale andrà persa.</div>'+
      '<div class="save-controls" style="margin-top:8px;"><button id="btn-restart-confirm">Sì, ricomincia</button><button id="btn-restart-cancel">Annulla</button></div>';
    document.getElementById("btn-restart-confirm").onclick=function(){ hardReset(); };
    document.getElementById("btn-restart-cancel").onclick=function(){ area.innerHTML=""; };
  };
}

  html += '<div class="web-divider">— • —</div>';
  html += '<div class="disclaimer">Progetto amatoriale non commerciale, fan-made, mai distribuito pubblicamente. Spider-Man e tutti i personaggi Marvel qui presenti sono proprietà dei rispettivi detentori dei diritti (Marvel/Disney); questo lavoro è un esperimento narrativo privato, senza alcuno scopo di lucro. Contenuti: violenza intensa, morte, tematiche di lutto — pensato per un pubblico adulto/maturo.</div>';

function renderEnding(scene){
  var html='<div class="end-screen">';
  html+='<div class="chapter-tag">'+(scene.isDeath?"Game Over":"Finale raggiunto")+'</div>';
  html+='<h2>'+scene.title+'</h2>';
  html+='<div class="end-sub">'+scene.subtitle+'</div>';
  var text = resolveText(scene.text);
  if(scene.isDeath){ text = text.replace("__DEATH_TEXT__", S.deathCtx || "Il buio arriva prima che tu possa nemmeno capire cosa sia successo."); }
  html+='<div class="story-text">'+escapeText(text)+'</div>';
  html+=renderStats();
  html+='<button class="btn btn-primary menu-btn" id="btn-newrun" style="margin:20px auto 0;">Inizia una nuova run</button>';
  html+='<div class="web-divider">— • —</div>';
  html+='<div class="disclaimer">Fine di questa run. Scelte diverse, fin dal primo bivio, portano a strade e finali completamente diversi.</div>';
  appEl.innerHTML=html;
  document.getElementById("btn-newrun").onclick=function(){ hardReset(); S.scene="intro_1"; save(); render(); };
  window.scrollTo(0,0);
}

/* ---------- COMBATTIMENTO ---------- */
var combatLogLines = [];
function renderCombatEntry(scene){
  S.combat = {
    enemy: Object.assign({}, scene.combat.enemy),
    enemyMax: scene.combat.enemy.vita,
    onWin: scene.combat.onWin,
    onLose: scene.combat.onLose,
    isBoss: scene.combat.isBoss,
    isFateCheck: scene.combat.isFateCheck||false,
    successStat: scene.combat.successStat,
    successMin: scene.combat.successMin,
    text: scene.text,
    chapter: scene.chapter,
    mercyOffered:false
  };
  combatLogLines = [];
  save();
  renderCombat();
}

function pushLog(txt, cls){ combatLogLines.push('<div class="'+(cls||"")+'">'+txt+'</div>'); if(combatLogLines.length>30) combatLogLines.shift(); }

function renderCombat(){
  var c = S.combat;
  if(!c){ render(); return; }

  if(c.isFateCheck){
    var success = S.stats[c.successStat] >= c.successMin;
    var html = renderStats();
    html += '<div class="chapter-tag">'+(c.chapter||"")+'</div>';
    html += '<div class="story-text">'+escapeText(c.text)+'</div>';
    html += '<div class="choices"><button class="btn btn-primary" id="btn-resolve-fate">Tenta l\'impossibile</button></div>';
    appEl.innerHTML = html;
    document.getElementById("btn-resolve-fate").onclick=function(){
      S.combat=null;
      S.scene = success ? c.onWin : c.onLose;
      save(); render();
    };
    return;
  }

  var html = renderStats();
  html += '<div class="chapter-tag">'+(c.chapter||"")+'</div>';
  html += '<div class="story-text">'+escapeText(c.text)+'</div>';
  html += '<div class="combat-panel">';
  html += '<div class="combat-vs">';
  html += '<div class="combat-side you"><h3>Tu</h3><div class="hp-track"><div class="hp-fill" style="width:'+Math.max(0,S.stats.vita)+'%"></div></div></div>';
  html += '<div class="combat-side enemy"><h3>'+c.enemy.name+'</h3><div class="hp-track"><div class="hp-fill enemy-fill" style="width:'+Math.max(0,c.enemy.vita/c.enemyMax*100)+'%"></div></div></div>';
  html += '</div>';
  html += '<div style="font-size:0.8em;color:var(--muted);margin-bottom:10px;font-style:italic;">'+c.enemy.desc+'</div>';
  html += '<div class="combat-log">'+combatLogLines.join("")+'</div>';

  if(c.enemy.vita<=0){
    if(c.isBoss && !c.mercyOffered){
      html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">Continua</button></div>';
    } else {
      html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">Continua</button></div>';
    }
  } else if(S.stats.vita<=0){
    html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">...</button></div>';
  } else {
    html += '<div class="combat-actions">';
    html += '<button class="btn" data-act="attacco">Attacco diretto<span class="tag">Alto danno, alto rischio</span></button>';
    html += '<button class="btn" data-act="ragnatela">Ragnatela<span class="tag">Immobilizza, danno medio</span></button>';
    html += '<button class="btn" data-act="schiva">Schivata acrobatica<span class="tag">Difesa, poco danno</span></button>';
    html += '<button class="btn" data-act="ambiente" '+(S.stats.resistenza<15?"disabled":"")+'>Usa l\'ambiente<span class="tag">Costa energia, danno alto</span></button>';
    html += '</div>';
  }
  html += '</div>';
  appEl.innerHTML = html;

  var cont = document.getElementById("btn-continue-combat");
  if(cont){
    cont.onclick = function(){
      if(S.stats.vita<=0){
        S.deathCtx = deathFlavor(c.chapter, c.enemy.name);
        S.combat=null; S.scene="finale_morte"; save(); render(); return;
      }
      if(c.enemy.vita<=0){
        S.combat=null; S.scene=c.onWin; save(); render(); return;
      }
    };
  }
  appEl.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click", function(){ doCombatAction(b.getAttribute("data-act")); });
  });
  window.scrollTo(0,0);
}

function deathFlavor(chapter, enemyName){
  return "Non ce l'ha fatta, questa volta. "+(chapter?("Durante "+chapter+", ") : "")+"contro "+enemyName+", il corpo ha ceduto prima della volontà. New York non si fermerà per lui — nessuna città lo fa mai, per nessuno. Ben lo aveva avvertito che il potere ha un prezzo. Stanotte, quel prezzo è stato tutto quello che aveva.";
}

function doCombatAction(act){
  var c = S.combat;
  if(!c || c.enemy.vita<=0 || S.stats.vita<=0) return;
  var st = S.stats;
  var roll = Math.random();
  var dmgToEnemy=0, dmgToYou=0, staminaCost=0, logMsg="", logCls="";

  if(act==="attacco"){
    staminaCost=12;
    var chance = 0.55 + (st.resistenza/400);
    if(roll<chance){ dmgToEnemy = 14 + Math.floor(Math.random()*10); logMsg="Colpisci duro. "+dmgToEnemy+" danni inflitti."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.9); logMsg="L'attacco viene parato — contrattacco in arrivo."; logCls="miss"; }
    dmgToYou += Math.floor(c.enemy.attacco*0.4);
  } else if(act==="ragnatela"){
    staminaCost=8;
    var chance2 = 0.65 + (st.resistenza/500);
    if(roll<chance2){ dmgToEnemy = 9 + Math.floor(Math.random()*6); dmgToYou = Math.floor(c.enemy.attacco*0.2); logMsg="La ragnatela lo immobilizza per un istante. "+dmgToEnemy+" danni."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.6); logMsg="Si libera prima che la ragnatela faccia presa."; logCls="miss"; }
  } else if(act==="schiva"){
    staminaCost=5;
    var chance3 = 0.7 + (st.resistenza/400);
    if(roll<chance3){ dmgToYou = Math.floor(c.enemy.attacco*0.15); dmgToEnemy = 3+Math.floor(Math.random()*4); logMsg="Schivi il colpo e rispondi con un contrattacco veloce. "+dmgToEnemy+" danni."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.5); logMsg="Ti prende comunque, ma di striscio."; logCls="miss"; }
    st.resistenza = clamp(st.resistenza + 6);
  } else if(act==="ambiente"){
    staminaCost=20;
    if(st.resistenza<15){ return; }
    var chance4 = 0.5 + (st.resistenza/350);
    if(roll<chance4){ dmgToEnemy = 22 + Math.floor(Math.random()*14); logMsg="Usi l'ambiente urbano a tuo favore — colpo devastante! "+dmgToEnemy+" danni."; logCls="special"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.7); logMsg="Il tentativo fallisce, e resti scoperto."; logCls="miss"; }
  }

  st.resistenza = clamp(st.resistenza - staminaCost);
  c.enemy.vita = Math.max(0, c.enemy.vita - dmgToEnemy);
  st.vita = clamp(st.vita - dmgToYou);

  pushLog(logMsg, logCls);
  if(dmgToYou>0) pushLog("Subisci "+dmgToYou+" danni.", "hit");
  if(st.resistenza<=10) pushLog("Sei sfinito — ogni mossa costa il doppio.", "special");

  save();
  renderCombat();
}

/* ============ AVVIO ============ */
load();
render();

})();
</script>
</body>
</html>
