<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Prezzo del Potere</title>
<style>
:root{
  --bg:#0a0a0d; --bg2:#111116; --panel:#15151b; --panel2:#1c1c24;
  --red:#b1181f; --red2:#e0272f; --blue:#1e3a6e; --blue2:#2d55a0;
  --text:#d8d6d0; --muted:#8a8790; --gold:#c9a54a; --dark:#050506;
  --ok:#3a7d44; --warn:#b1181f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100%;}
body{
  background:
    radial-gradient(ellipse at top, rgba(177,24,31,0.08), transparent 60%),
    linear-gradient(180deg, var(--dark) 0%, var(--bg) 100%);
  background-attachment:fixed;
}
#app{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
.title-screen{text-align:center;padding:60px 10px 20px;}
.title-screen h1{
  font-size:2.6em;letter-spacing:2px;margin:0 0 6px;color:var(--red2);
  text-shadow:0 0 18px rgba(177,24,31,0.5), 0 0 2px #000;
  font-family:'Trebuchet MS',sans-serif;font-weight:900;
}
.title-screen .sub{color:var(--muted);font-style:italic;margin-bottom:30px;font-size:1.05em;}
.web-divider{text-align:center;color:var(--muted);opacity:0.5;margin:18px 0;font-size:0.85em;letter-spacing:4px;}
.btn{
  display:inline-block;background:var(--panel2);color:var(--text);border:1px solid #333;
  padding:12px 18px;margin:6px 0;border-radius:3px;cursor:pointer;font-family:inherit;
  font-size:1em;text-align:left;width:100%;transition:all .15s;line-height:1.35;
}
.btn:hover{background:var(--red);border-color:var(--red2);color:#fff;transform:translateX(2px);}
.btn:disabled,.btn.locked{opacity:0.35;cursor:not-allowed;background:#0e0e12;}
.btn:disabled:hover,.btn.locked:hover{transform:none;background:#0e0e12;border-color:#333;}
.btn .tag{display:block;font-size:0.72em;color:var(--gold);margin-top:4px;font-style:italic;}
.btn-primary{background:var(--red);border-color:var(--red2);}
.btn-primary:hover{background:var(--red2);}
.menu-btn{max-width:340px;margin:8px auto;text-align:center;}
.statbar-wrap{position:sticky;top:0;background:rgba(10,10,13,0.96);backdrop-filter:blur(4px);
  padding:8px 4px 10px;border-bottom:1px solid #2a2a33;z-index:10;margin-bottom:16px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-family:'Trebuchet MS',sans-serif;font-size:0.72em;}
.stat-row{display:flex;align-items:center;gap:6px;}
.stat-label{width:64px;color:var(--muted);flex-shrink:0;}
.stat-track{flex:1;height:6px;background:#000;border-radius:3px;overflow:hidden;border:1px solid #222;}
.stat-fill{height:100%;transition:width .3s;}
.stat-vita .stat-fill{background:linear-gradient(90deg,#7a0e13,var(--red2));}
.stat-resistenza .stat-fill{background:linear-gradient(90deg,#1a5c8a,#3d9cd6);}
.stat-umore .stat-fill{background:linear-gradient(90deg,#5a7a2a,#9ec24a);}
.stat-rabbia .stat-fill{background:linear-gradient(90deg,#6e1a1a,#d64d1f);}
.stat-segreto .stat-fill{background:linear-gradient(90deg,#3a2a5c,#7a5cc9);}
.stat-flash .stat-fill{background:linear-gradient(90deg,#8a6a1a,var(--gold));}
.stat-mj .stat-fill{background:linear-gradient(90deg,#8a2a5c,#d64d9e);}
.stat-rep .stat-fill{background:linear-gradient(90deg,#2a5c5c,#4dc2c2);}
.stat-val{width:26px;text-align:right;color:#aaa;font-size:0.95em;}
.chapter-tag{color:var(--gold);font-size:0.78em;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:6px;font-family:'Trebuchet MS',sans-serif;opacity:0.85;}
.story-text{font-size:1.12em;line-height:1.72;white-space:pre-line;margin-bottom:22px;color:#e2e0da;}
.story-text .fx{color:var(--red2);font-style:italic;}
.choices{margin-top:18px;}
.combat-panel{background:var(--panel);border:1px solid #2a2a33;border-radius:6px;padding:16px;margin-bottom:16px;}
.combat-vs{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'Trebuchet MS',sans-serif;}
.combat-side{flex:1;}
.combat-side h3{margin:0 0 6px;font-size:1em;color:var(--red2);}
.combat-side.enemy h3{color:#d68a3d;text-align:right;}
.combat-side.enemy{text-align:right;}
.hp-track{height:10px;background:#000;border:1px solid #333;border-radius:4px;overflow:hidden;}
.hp-fill{height:100%;background:linear-gradient(90deg,#7a0e13,var(--red2));transition:width .3s;}
.hp-fill.enemy-fill{background:linear-gradient(90deg,#8a4a10,#d68a3d);}
.combat-log{background:#000;border:1px solid #222;border-radius:4px;padding:10px;height:110px;overflow-y:auto;
  font-size:0.85em;color:#999;margin-bottom:12px;font-family:'Trebuchet MS',sans-serif;}
.combat-log div{margin-bottom:4px;}
.combat-log .hit{color:var(--red2);}
.combat-log .miss{color:#666;}
.combat-log .special{color:var(--gold);}
.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.journal{background:var(--panel);border-left:2px solid var(--gold);padding:10px 14px;margin:20px 0;
  font-size:0.85em;color:var(--muted);font-style:italic;}
.end-screen{text-align:center;padding:20px 10px;}
.end-screen h2{color:var(--gold);font-size:1.8em;margin-bottom:4px;}
.end-screen .end-sub{color:var(--muted);font-style:italic;margin-bottom:20px;}
.save-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
.save-controls button{background:var(--panel2);color:var(--muted);border:1px solid #333;padding:8px 14px;
  border-radius:3px;cursor:pointer;font-size:0.8em;font-family:'Trebuchet MS',sans-serif;}
.save-controls button:hover{color:var(--text);border-color:#555;}
.disclaimer{font-size:0.72em;color:#555;text-align:center;margin-top:40px;line-height:1.6;padding:0 10px;}
textarea.savebox{width:100%;height:80px;background:#000;color:#6a6;border:1px solid #333;font-size:0.7em;margin-top:10px;}
.small-note{font-size:0.78em;color:var(--muted);text-align:center;margin-top:10px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============ STATO ============ */
var DEFAULT_STATE = function(){ return {
  scene: "titolo",
  lastEnteredScene: null,
  stats: { vita:100, resistenza:100, umore:60, rabbia:15, segreto:90, fiduciaFlash:30, legameMJ:35, reputazione:50, soldi:15 },
  flags: {},
  journal: [],
  deathCtx: "",
  combat: null
};};
var S = DEFAULT_STATE();

function clamp(v){ return Math.max(0, Math.min(100, v)); }
function applyEffects(eff){
  if(!eff) return;
  for(var k in eff){
    if(k==="soldi"){ S.stats.soldi = Math.max(0, S.stats.soldi + eff[k]); continue; }
    if(S.stats.hasOwnProperty(k)) S.stats[k] = clamp(S.stats[k] + eff[k]);
  }
}
function setFlags(fl){ if(!fl) return; for(var k in fl) S.flags[k]=fl[k]; }
function meetsReq(req){
  if(!req) return true;
  for(var k in req){
    var r = req[k];
    if(k==="flags"){
      for(var fk in r){ if(S.flags[fk]!==r[fk]) return false; }
      continue;
    }
    var v = S.stats[k];
    if(v===undefined) continue;
    if(r.min!==undefined && v<r.min) return false;
    if(r.max!==undefined && v>r.max) return false;
  }
  return true;
}
function addJournal(txt){ S.journal.push(txt); if(S.journal.length>12) S.journal.shift(); }

/* ============ SALVATAGGIO ============ */
function save(){ try{ localStorage.setItem("prezzo_potere_save", JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem("prezzo_potere_save");
    if(raw){ var obj = JSON.parse(raw); S = Object.assign(DEFAULT_STATE(), obj); S.stats = Object.assign(DEFAULT_STATE().stats, obj.stats||{}); return true; }
  }catch(e){}
  return false;
}
function hardReset(){ S = DEFAULT_STATE(); save(); render(); }

/* ============ SCENE DATA ============ */
var SCENES = {};

/* ---------- TITOLO / MENU ---------- */
SCENES["titolo"] = { menu:true };

/* =========================================================
   ATTO 1 — LUTTO
   ========================================================= */

SCENES["intro_1"] = {
  chapter:"Atto I · Prologo",
  text:"Il cimitero di Forest Hills è vuoto da un'ora, ma Peter Parker è ancora lì, in piedi davanti a due lapidi ravvicinate. May Parker. Ben Parker. Sedici parole di condoglianze incise, e nessuna che spieghi come si fa a continuare a respirare.\n\nHa sedici anni. Ha dei poteri che non ha chiesto e non sa più a cosa servano, visto che non sono bastati a fermare un proiettile in un vicolo qualunque. Ha un borsone con tutto quello che possiede ancora infilato in fondo, perché la casa di Ingram Street non è più sua: è già passata a un'agenzia immobiliare, e lui non ha nessun altro posto dove andare.\n\nTranne uno.",
  choices:[
    {text:"«Vieni a stare da me.» Flash Thompson l'ha detto ieri, davanti a tutti, come se fosse la cosa più naturale del mondo.", next:"intro_2"}
  ]
};

SCENES["intro_2"] = {
  chapter:"Atto I · Prologo",
  text:"Flash Thompson — il ragazzo che per tre anni gli ha sbattuto la testa contro gli armadietti chiamandolo \"Parker il Fesso\" — ha una casa enorme e vuota a Forest Hills Gardens, un padre sempre in trasferta e un senso di colpa che gli è esploso in petto quando ha saputo di Ben. Ha offerto una stanza senza pensarci due volte. Peter ha detto sì perché non aveva altra scelta, e perché in fondo qualcosa, in Flash, dopo la storia dello zio, è davvero cambiato.\n\nFlash non sa niente di ragnatele o di proiettili. Non sa che l'amico che sta ospitando esce dalla finestra della sua stanza tre notti su quattro con qualcosa di rosso e blu infilato nello zaino. Non sa che ogni giorno che passa, tenerglielo nascosto costa un pezzo in più.",
  choices:[
    {text:"Entra in casa. Comincia la nuova vita, quella che nessuno dei due ha scelto davvero.", next:"casa_flash_1"}
  ]
};

SCENES["casa_flash_1"] = {
  chapter:"Atto I · Capitolo 1",
  text:"La stanza degli ospiti ha ancora l'odore di vernice fresca. Flash è sulla porta, le mani in tasca, che cerca di non sembrare imbarazzato.\n\n«Il bagno è in fondo al corridoio. Mio padre torna forse tra due settimane, forse tra un mese, chi lo sa. C'è cibo in frigo, prenditi quello che vuoi.» Una pausa. «Parker... mi dispiace. Per tuo zio. Sul serio.»",
  choices:[
    {text:"«Grazie, Flash. Per tutto.» — accetta l'aiuto senza difese.", effects:{fiduciaFlash:8, umore:4}, next:"casa_flash_2"},
    {text:"«Non serve che tu ti scusi.» — tieni la distanza, non riesci ancora a fidarti di nessuno.", effects:{fiduciaFlash:2, segreto:2}, next:"casa_flash_2"}
  ]
};

SCENES["casa_flash_2"] = {
  chapter:"Atto I · Capitolo 1",
  text:"Quella notte Peter resta sveglio a fissare un soffitto che non è il suo, in una casa che non è la sua, con addosso una vita che sente ancora meno sua. Sotto il letto, ripiegato dentro lo zaino, il costume aspetta.\n\nFuori, Queens continua a respirare come se niente fosse successo: sirene lontane, un clacson, il ronzio arancione dei lampioni. Da qualche parte là fuori c'è ancora qualcuno che ha bisogno di aiuto stanotte, e lui è l'unico che può darglielo.",
  choices:[
    {text:"Esci dalla finestra. Il quartiere ha bisogno di Spider-Man, anche se Peter Parker sta a pezzi.", effects:{resistenza:-5}, next:"primo_giro_1"},
    {text:"Resta. Non hai dormito da tre giorni e domani c'è scuola — anche il ragno, a volte, deve fermarsi.", effects:{umore:6, resistenza:10}, next:"primo_giro_1"}
  ]
};

SCENES["primo_giro_1"] = {
  chapter:"Atto I · Capitolo 1",
  text:"Passano i giorni. Peter impara in fretta una cosa che nessun manuale gli aveva insegnato: essere Spider-Man non è la parte difficile. La parte difficile è essere Peter Parker il giorno dopo — arrivare in classe con un taglio sullo zigomo mascherato da correttore rubato a Flash, inventare scuse per la May che non c'è più a chiedergliele, contare le due banconote sgualcite che gli restano nel portafoglio e capire che non basteranno per il pranzo E per l'autobus.\n\nUna sera, tornando da scuola, sente delle urla soffocate in un vicolo dietro la Forty-Second Street.",
  choices:[
    {text:"Infilati nel vicolo. Qualcuno ha bisogno di te.", next:"combattimento_scippatori"}
  ]
};

SCENES["combattimento_scippatori"] = {
  chapter:"Atto I · Capitolo 1",
  text:"Due uomini hanno bloccato una donna contro un cassonetto, uno con un coltello a serramanico che luccica sotto un lampione rotto. Non è un supercriminale. È solo la strada, quella vera, quella che non fa notizia.",
  combat:{
    enemy:{ name:"Rapinatori di strada", vita:35, attacco:8, desc:"Due balordi armati di coltello — pericolosi soprattutto se ti fai prendere alla sprovvista." },
    onWin:"dopo_scippatori", onLose:null, isBoss:false
  }
};

SCENES["dopo_scippatori"] = {
  chapter:"Atto I · Capitolo 1",
  text:"La donna scappa senza nemmeno ringraziare — ha visto solo una maschera nel buio, e in questa città una maschera nel buio fa più paura di quanto rassicuri. Peter resta solo tra i cassonetti, il cuore che gli martella, un livido che si sta già gonfiando sotto una costola.\n\nÈ questo il lavoro. Nessun applauso. Solo il sapere, dentro, di aver fatto la cosa giusta — o di essersi fatto ancora una volta male per qualcuno che domani non si ricorderà nemmeno la sua faccia.",
  choices:[
    {text:"Torna a casa. Domani è un altro giorno di scuola, e un altro giorno da nascondere tutto a Flash.", effects:{vita:10}, next:"scuola_1"}
  ]
};

SCENES["scuola_1"] = {
  chapter:"Atto I · Capitolo 2",
  text:"Midtown High, corridoio B. Mary Jane Watson lo intercetta all'armadietto con quella risata pronta che usa come uno scudo — ma oggi gli occhi le si fermano un secondo di troppo sul taglio che Peter ha vicino al labbro.\n\n«Tiger, sei inciampato di nuovo nel tuo stesso equipaggiamento fotografico o c'è dell'altro?» Lo dice ridendo, ma aspetta davvero una risposta.",
  choices:[
    {text:"«Solo la fotocamera, promesso.» — scherza, tieni la maschera anche qui.", effects:{segreto:2, legameMJ:-1}, next:"scuola_2"},
    {text:"«È stata una brutta settimana, MJ.» — lasciale intravedere un pezzo di verità, senza dire il resto.", effects:{legameMJ:5, umore:3}, next:"scuola_2"}
  ]
};

SCENES["scuola_2"] = {
  chapter:"Atto I · Capitolo 2",
  text:"In fondo al corridoio, Flash sta raccontando a un gruppetto di compagni una versione già abbellita di come ha \"praticamente salvato\" Parker dandogli un tetto. Non è cattiveria: è il suo modo di elaborare, ad alta voce, quello che è successo a Ben. Peter lo osserva e per un attimo — solo un attimo — pensa a quanto sarebbe più facile dirgli tutto.\n\nDopo l'ultima campanella, il preside lo ferma: la retta per il laboratorio di scienze è scaduta, e la borsa di studio di quest'anno \"è in fase di revisione\" da quando è morto il tutore legale.",
  choices:[
    {text:"Accetta un lavoretto da fotoreporter freelance per il Daily Bugle — J. Jonah Jameson paga male, ma paga.", effects:{soldi:10, reputazione:-2, vita:6}, next:"bugle_1"},
    {text:"Rifiuta per ora: non hai tempo, tra scuola e ragnatele, per aggiungerci anche un capo che ti odia in partenza.", effects:{soldi:0, umore:-3, vita:6}, next:"bugle_1"}
  ]
};

SCENES["bugle_1"] = {
  chapter:"Atto I · Capitolo 2",
  text:"J. Jonah Jameson — capelli a spazzola, baffi che sembrano avere vita propria, sigaro sempre spento tra i denti — passa le sue giornate a stampare in prima pagina che Spider-Man è \"una minaccia mascherata\". Il fatto che le foto migliori di quella minaccia gliele venda proprio un adolescente di nome Parker è un'ironia che solo Peter può apprezzare fino in fondo.\n\n«Non mi interessa la tua vita privata, ragazzo» abbaia Jameson senza alzare gli occhi dalle bozze. «Portami scatti di quel ragno che fa a pezzi la città e forse, forse, ti pago in tempo.»",
  choices:[
    {text:"Incassa in silenzio. Ti serve quella busta paga più di quanto ti serva l'orgoglio.", next:"villain_shocker_intro"}
  ]
};

/* --- cameo villain minore: Shocker --- */
SCENES["villain_shocker_intro"] = {
  chapter:"Atto I · Capitolo 3",
  text:"La radio della polizia, intercettata di sfuggita fuori dal Bugle, parla di un allarme alla First National sulla Quarantaduesima: qualcuno sta facendo esplodere un'intera facciata di marmo usando quelli che sembrano dei guanti pneumatici. Herman Schultz — la stampa lo chiamerà \"Shocker\" da stasera — sta caricando sacchi di banconote su un furgone mentre l'edificio dietro di lui crolla a pezzi come biscotti.",
  choices:[
    {text:"Cambiati nel vicolo più vicino. È il tuo momento.", next:"combattimento_shocker"}
  ]
};

SCENES["combattimento_shocker"] = {
  chapter:"Atto I · Capitolo 3",
  text:"I guanti di Schultz sparano onde d'urto che ti fanno vibrare le ossa anche quando le schivi di un soffio. Non è un genio del crimine — è solo un uomo con la tecnologia sbagliata nelle mani sbagliate, e la spavalderia di chi crede che nessuno possa fermarlo.",
  combat:{
    enemy:{ name:"Shocker", vita:50, attacco:13, desc:"Herman Schultz, guanti vibro-shock fatti in casa: colpisce a distanza, poco resistente da vicino." },
    onWin:"dopo_shocker", onLose:null, isBoss:false
  }
};

SCENES["dopo_shocker"] = {
  chapter:"Atto I · Capitolo 3",
  text:"Immobilizzato in un bozzolo di ragnatela contro un idrante, Shocker sputa sangue e un sorriso storto. «Goditela, moscerino. In questa città arriva gente molto peggio di me — e quella, ti giuro, non la vedi arrivare.»\n\nLa polizia arriva in tempo per prendersi il merito e il bottino recuperato. Il Daily Bugle, il giorno dopo, titola: SPIDER-MAN LEGATO A UNA RAPINA?, sotto una delle foto che Peter stesso ha scattato.",
  effects:{reputazione:-4, soldi:8, vita:8},
  choices:[
    {text:"Ignora il titolo — è solo Jameson che vende copie sulla tua pelle. Torna a casa.", next:"biv1_setup"}
  ]
};

/* --- BIVIO MAGGIORE 1 --- */
SCENES["biv1_setup"] = {
  chapter:"Atto I · Capitolo 4",
  text:"Sono le tre del mattino quando Peter rientra dalla finestra della sua stanza, un braccio che sanguina più di quanto vorrebbe ammettere. La luce si accende. Flash è seduto sul bordo del suo stesso letto, non del tutto sobrio da una festa a cui Peter avrebbe dovuto accompagnarlo e a cui non si è presentato — di nuovo.\n\nGli occhi di Flash vanno dalla finestra aperta, al sangue sulla manica di Peter, al costume rosso e blu che è scivolato per metà fuori dallo zaino lasciato aperto sul pavimento. Nessuno dei due dice niente per tre secondi che durano un'eternità.\n\n«Parker...» la voce di Flash è piatta, incredula. «Quello è...»",
  choices:[
    {text:"Mentire. Costruisci in un secondo una bugia perfetta — un costume «per un servizio fotografico», il sangue «una rissa». Difendi il segreto a ogni costo.", effects:{segreto:10, fiduciaFlash:-8, umore:-4}, setFlags:{percorso1:"menzogna"}, next:"p1_menzogna_1"},
    {text:"Non mentire fino in fondo. Non dici la parola \"Spider-Man\" — ma non neghi nemmeno. Lasci che Flash arrivi da solo alla verità, un pezzo alla volta.", effects:{segreto:-15, fiduciaFlash:6, umore:2}, setFlags:{percorso1:"quasiverita"}, next:"p1_quasiverita_1"}
  ]
};

/* ---- RAMO A: MENZOGNA ---- */
SCENES["p1_menzogna_1"] = {
  chapter:"Atto I · Il Ramo della Menzogna",
  text:"«Per un servizio fotografico universitario, Flash. Robaccia da studenti di cinema, mi hanno pagato quaranta dollari per farmi rincorrere da uno stuntman con un coltello di gomma.» La bugia esce così fluida che fa quasi paura a Peter stesso — quanto sta diventando bravo a mentire alle persone a cui tiene.\n\nFlash lo guarda a lungo. Poi scrolla le spalle, troppo stanco o troppo ubriaco per insistere. «Va bene, Parker. Ma la prossima volta lavati quel sangue finto prima che macchi le mie lenzuola.»",
  choices:[
    {text:"Respira. Ha funzionato. Per ora.", next:"p1_menzogna_2"}
  ]
};

SCENES["p1_menzogna_2"] = {
  chapter:"Atto I · Il Ramo della Menzogna",
  text:"Vivere una doppia bugia dentro casa, oltre che fuori, ha un prezzo che Peter non aveva calcolato: ogni sguardo sospettoso di Flash, ogni domanda evitata con una battuta, scava un fosso un po' più profondo tra loro. Flash comincia a chiudere a chiave la porta della sua stanza quando esce. Non è più solo un compagno di casa distratto: è diventato uno che osserva, che conta le ore, che si accorge di ogni assenza.\n\nUna settimana dopo, mentre Peter rientra all'alba con una spalla slogata, trova un biglietto sul tavolo della cucina: \"So che mi stai nascondendo qualcosa. Non sono stupido come pensi. — F.\"",
  choices:[
    {text:"Bruciala nel lavandino. Doppia la guardia. Il segreto viene prima di tutto — anche di Flash.", effects:{segreto:8, fiduciaFlash:-6, vita:10}, next:"p1_menzogna_3"},
    {text:"Scrivi una risposta vaga ma gentile: «Non è quello che pensi. Fidati di me ancora un po'.»", effects:{fiduciaFlash:4, segreto:-2, vita:10}, next:"p1_menzogna_3"}
  ]
};

SCENES["p1_menzogna_3"] = {
  chapter:"Atto I · Il Ramo della Menzogna",
  text:"Il vicinato di Forest Hills, nel frattempo, ha un nuovo argomento di conversazione: un uomo alato con artigli d'acciaio ha svaligiato tre volte in due settimane il deposito tecnologico dell'Oscorp Tower, portandosi via prototipi che nessun giornale riesce a descrivere con precisione. La gente lo chiama \"l'Avvoltoio\".\n\nJameson, ovviamente, insinua già che Spider-Man e l'Avvoltoio lavorino insieme. Peter stringe i denti e va a scattare comunque le foto — gli servono i soldi, e gli serve sapere cosa diavolo sta rubando quell'uomo.",
  choices:[
    {text:"Segui la pista dell'Avvoltoio fino all'Oscorp Tower.", next:"villain_vulture"}
  ]
};

SCENES["villain_vulture"] = {
  chapter:"Atto I · Cammeo — l'Avvoltoio",
  text:"Adrian Toomes plana tra i grattacieli con delle ali metalliche che sembrano rubate a un incubo industriale, un sacco pieno di componenti Oscorp legato alla schiena. Ha l'aria di un uomo che ha smesso da tempo di considerarsi un criminale, e ha cominciato a considerarsi un predatore.",
  combat:{
    enemy:{ name:"l'Avvoltoio", vita:55, attacco:14, desc:"Adrian Toomes: veloce, aereo, difficile da agganciare — ma fragile una volta a terra." },
    onWin:"dopo_vulture", onLose:null, isBoss:false
  }
};

SCENES["dopo_vulture"] = {
  chapter:"Atto I · Cammeo — l'Avvoltoio",
  text:"Toomes fugge lasciandosi cadere il sacco — dentro, tra i componenti rubati, Peter trova degli schemi tecnici con un'intestazione che gli gela il sangue: OSCORP — PROGETTO GOBLIN — RIEPILOGO SIERO SPERIMENTALE. Poche righe, cancellate a metà, ma abbastanza per capire che alla Oscorp Tower si testa qualcosa che va ben oltre le ali meccaniche di un ladro.\n\nIn calce, una firma: N. Osborn.",
  choices:[
    {text:"Porta gli schemi con te. Qualunque cosa sia il \"Progetto Goblin\", è appena diventato importante.", setFlags:{sa_progetto_goblin:true}, next:"p1_menzogna_finale"}
  ]
};

SCENES["p1_menzogna_finale"] = {
  chapter:"Atto I · Finale — Il Ramo della Menzogna",
  text:"Peter torna a casa quella notte con più domande che risposte, e trova Flash sveglio in cucina ad aspettarlo, le braccia conserte, il biglietto di una settimana prima ancora sul tavolo tra loro come un confine non attraversato.\n\n«Un giorno mi dirai la verità, Parker» dice Flash, piano, senza rabbia — solo stanchezza. «Ma va bene così. Nel frattempo, resti comunque casa mia. Nessuno dorme per strada, qui.»\n\nPeter annuisce e sale in camera. Il segreto è ancora suo, intatto, ma pesa come una pietra che cresce ogni giorno. Fuori, da qualche parte in cima all'Oscorp Tower, qualcosa che porta il nome Osborn si sta preparando.",
  effects:{fiduciaFlash:3, vita:15},
  next_direct:"atto2_hub"
};

/* ---- RAMO B: QUASI-VERITÀ ---- */
SCENES["p1_quasiverita_1"] = {
  chapter:"Atto I · Il Ramo della Quasi Verità",
  text:"Peter non dice la parola. Ma non riesce nemmeno a mentire guardando Flash negli occhi — non stanotte, non a lui. «Flash... ci sono cose che non posso dirti. Per la tua sicurezza, non per non fidarmi di te. Ma quello che hai visto — non è quello che sembra essere una cosa brutta. Te lo giuro.»\n\nFlash resta in silenzio a lungo, gli occhi che vanno dal sangue sul braccio di Peter, al costume, di nuovo a Peter. Poi, piano: «...Sei tu quello delle notizie, vero? Quello con la maschera.»\n\nPeter non risponde. Ma non riesce nemmeno a negare.",
  choices:[
    {text:"Il silenzio è la tua unica risposta possibile. Lascialo lì, sospeso.", next:"p1_quasiverita_2"}
  ]
};

SCENES["p1_quasiverita_2"] = {
  chapter:"Atto I · Il Ramo della Quasi Verità",
  text:"Da quella notte, qualcosa cambia tra loro — non in peggio, sorprendentemente. Flash inizia a coprirgli le assenze senza fare domande, a lasciargli la finestra socchiusa apposta, a tenere il ghiaccio in freezer \"per gli allenamenti di football\" che in realtà sono per le costole ammaccate di Peter. Non ha mai sentito la parola Spider-Man pronunciata ad alta voce in quella casa, e forse è meglio così — ma sa, e questo basta a renderlo un alleato silenzioso.\n\nUna sera lo aspetta in cucina con un piatto di pasta scotta e una domanda diretta: «Ti fanno male, quelle cose là fuori. Lo vedo. Perché continui a farlo?»",
  choices:[
    {text:"«Perché posso fermarle, e nessun altro lo fa.» — la verità nuda, il peso di Ben in ogni parola.", effects:{fiduciaFlash:8, umore:5, vita:10}, next:"p1_quasiverita_3"},
    {text:"Cambia discorso. Anche con Flash che sa, certe cose restano troppo pesanti da dire ad alta voce.", effects:{fiduciaFlash:-2, umore:-3, vita:10}, next:"p1_quasiverita_3"}
  ]
};

SCENES["p1_quasiverita_3"] = {
  chapter:"Atto I · Il Ramo della Quasi Verità",
  text:"Con qualcuno a coprirgli le spalle in casa, Peter può permettersi di seguire piste più rischiose. Una di queste porta dritta all'Oscorp Tower, dove — secondo una soffiata che si è procurato scattando foto per il Bugle — un ladro alato di nome Adrian Toomes ha già colpito due volte.",
  choices:[
    {text:"Vai a fermarlo prima del terzo colpo.", next:"villain_vulture_b"}
  ]
};

SCENES["villain_vulture_b"] = {
  chapter:"Atto I · Cammeo — l'Avvoltoio",
  text:"Lo intercetti sul tetto della Oscorp Tower stessa, con le ali metalliche spiegate contro lo skyline e un sacco di componenti rubati legato alla schiena. Toomes non è un supercriminale nato: è un ex ingegnere che l'azienda ha scaricato senza pensione, e che ora si riprende \"quello che gli spetta\" a modo suo.",
  combat:{
    enemy:{ name:"l'Avvoltoio", vita:55, attacco:14, desc:"Adrian Toomes: veloce, aereo, difficile da agganciare — ma fragile una volta a terra." },
    onWin:"dopo_vulture_b", onLose:null, isBoss:false
  }
};

SCENES["dopo_vulture_b"] = {
  chapter:"Atto I · Cammeo — l'Avvoltoio",
  text:"Legato in un bozzolo di ragnatela sul cornicione, Toomes sputa un avvertimento invece di scuse: «Non hai idea di cosa producono davvero, lassù, ai piani che nessun dipendente può vedere. Io rubo pezzi di ricambio. Osborn... Osborn costruisce mostri.»\n\nNel sacco recuperato, tra i componenti, Peter trova degli schemi con un'intestazione inquietante: OSCORP — PROGETTO GOBLIN — RIEPILOGO SIERO SPERIMENTALE, firmati N. Osborn.",
  choices:[
    {text:"Porta gli schemi a casa. Ne parlerai con Flash — che, ora, è l'unico con cui puoi davvero parlarne.", setFlags:{sa_progetto_goblin:true}, next:"p1_quasiverita_finale"}
  ]
};

SCENES["p1_quasiverita_finale"] = {
  chapter:"Atto I · Finale — Il Ramo della Quasi Verità",
  text:"Flash guarda gli schemi tecnici sparsi sul tavolo della cucina, poi guarda Peter, poi di nuovo i fogli. «Osborn. Il padre di Harry?» Harry Osborn è il loro compagno di scuola — silenzioso, sempre un po' all'ombra del cognome che porta, l'unico che non ha mai fatto battute crudeli su Ben.\n\n«Qualunque cosa sia questo \"Progetto Goblin\"» dice Flash lentamente «forse è il caso che tu scopra cosa diavolo sta succedendo, prima che succeda a te. O a lui.»\n\nPeter annuisce. Il segreto, ora, è condiviso — più leggero da portare, ma anche più fragile: un'altra persona a cui il pericolo può arrivare, per colpa sua.",
  effects:{fiduciaFlash:4, vita:15},
  next_direct:"atto2_hub"
};

/* =========================================================
   ATTO 2 — L'OMBRA SI ALLUNGA
   ========================================================= */

SCENES["atto2_hub"] = {
  chapter:"Atto II · Capitolo 5",
  text:"Le settimane passano e il nome Osborn comincia a ricorrere troppo spesso perché sia un caso: contratti governativi sospesi, un incidente \"industriale\" ai laboratori Oscorp di cui nessun giornale scrive più dopo il primo giorno, un socio d'affari di Norman Osborn ritrovato in coma per \"cause naturali\" che nessun medico sa spiegare.\n\nPeter ha in mano gli schemi rubati del Progetto Goblin e una scelta da fare su come muoversi da qui in avanti.",
  choices:[
    {text:"Vai dritto al bersaglio: infiltrati di notte nella Oscorp Tower come Spider-Man e scopri di persona cosa sta costruendo Norman Osborn.", effects:{rabbia:8, segreto:-4, vita:12}, setFlags:{percorso2:"diretto"}, next:"p2_diretto_1"},
    {text:"Muoviti con cautela: usa la copertura da fotoreporter del Bugle per indagare alla luce del sole, raccogliere prove concrete prima di esporsi.", effects:{umore:5, reputazione:3, vita:12}, setFlags:{percorso2:"cauto"}, next:"p2_cauto_1"}
  ]
};

/* ---- RAMO A2: DIRETTO ---- */
SCENES["p2_diretto_1"] = {
  chapter:"Atto II · Il Percorso Diretto",
  text:"Niente scuse, niente tempo da perdere: Peter si arrampica sulla facciata nord della Oscorp Tower alle due del mattino, superando telecamere e sensori con la stessa facilità con cui un tempo copiava i compiti di scienze. Ai piani alti, dietro una porta blindata con la sola scritta \"LIVELLO R — ACCESSO RISTRETTO\", trova un laboratorio che sembra uscito da un incubo: vasche di siero verde fosforescente, una maschera da demone di metallo appesa a un manichino, appunti manoscritti fitti di formule e, in un angolo, una foto stropicciata — Norman Osborn con accanto un ragazzo che Peter riconosce subito.\n\nHarry.",
  choices:[
    {text:"Fotografa tutto quello che puoi prima che scatti l'allarme.", next:"p2_diretto_2"}
  ]
};

SCENES["p2_diretto_2"] = {
  chapter:"Atto II · Il Percorso Diretto",
  text:"L'allarme scatta comunque. Non luci, non sirene — qualcosa di peggio: una risata registrata che rimbalza tra le pareti metalliche del laboratorio, seguita da una voce distorta attraverso gli altoparlanti nascosti.\n\n«Un ragnetto tra le mie cose private. Che intraprendenza. Mi chiedo se sei venuto a curiosare per conto tuo... o se qualcuno ti ha mandato a spiarmi.»",
  choices:[
    {text:"Non rispondere. Scappa con quello che hai già in mano.", effects:{segreto:-6}, next:"p2_diretto_3"}
  ]
};

SCENES["p2_diretto_3"] = {
  chapter:"Atto II · Il Percorso Diretto",
  text:"Peter fugge dalla finestra più vicina un istante prima che il pavimento del laboratorio si apra su un sistema di difesa automatico — lame rotanti, gas, una rete elettrificata che manca la sua gamba per una manciata di centimetri. Il messaggio è chiaro: chiunque sia Norman Osborn, sa proteggersi.\n\nDa quella notte, l'attenzione si inverte: non è più Peter a cercare Osborn. È Osborn, o qualcosa che porta il suo nome, che ha iniziato a cercare lui — un'ombra vista due volte sul tetto di fronte a casa di Flash, un'auto nera che rallenta troppo spesso davanti a scuola.",
  choices:[
    {text:"Di' a Flash di stare più attento del solito. Qualcosa si è mosso, e non sai ancora bene cosa.", effects:{fiduciaFlash:3, vita:10}, next:"villain_kraven"}
  ]
};

/* cameo Kraven nel ramo diretto */
SCENES["villain_kraven"] = {
  chapter:"Atto II · Cammeo — Kraven il Cacciatore",
  text:"Tre giorni dopo, sui tetti di Queens, un uomo enorme avvolto in una pelliccia di leone lo aspetta apertamente, come se avesse un appuntamento. «Sergei Kravinoff» si presenta con un inchino teatrale. «Qualcuno mi ha pagato bene per rendere la tua vita interessante, ragno. Io l'ho trovata già abbastanza interessante da solo, se devo essere onesto — ma un contratto è un contratto.»",
  combat:{
    enemy:{ name:"Kraven il Cacciatore", vita:62, attacco:15, desc:"Sergei Kravinoff: forza bruta, sieri tribali, ama la caccia più della vittoria facile." },
    onWin:"dopo_kraven", onLose:null, isBoss:false
  }
};

SCENES["dopo_kraven"] = {
  chapter:"Atto II · Cammeo — Kraven il Cacciatore",
  text:"Kraven cade in ginocchio, ma sorride come se avesse comunque vinto qualcosa. «La caccia migliore della mia carriera, ragno. Dì al tuo amico Osborn...» si interrompe, si corregge da solo con un lampo di malizia negli occhi «...anzi no. Non dirgli niente. Che si diverta lui, a scoprire quanto sei bravo.»\n\nSvanisce nei tetti prima che la polizia arrivi. Osborn, dunque, sa già di lui — abbastanza da assoldare cacciatori. Il cerchio si stringe.",
  effects:{rabbia:6},
  choices:[
    {text:"Torna a casa a leccarti le ferite. La prossima mossa dev'essere più intelligente della rabbia.", effects:{vita:18}, next:"atto2_convergenza_setup"}
  ]
};

/* ---- RAMO B2: CAUTO ---- */
SCENES["p2_cauto_1"] = {
  chapter:"Atto II · Il Percorso Cauto",
  text:"Peter chiede — e ottiene, con sorpresa — un permesso da Jameson per un servizio fotografico \"dal vivo\" sulla filantropia dell'Oscorp: Norman Osborn ama farsi fotografare mentre finanzia scuole e laboratori pubblici, ed è più che felice di lasciare entrare un fotografo del Bugle a un evento di beneficenza.\n\nÈ lì, tra un rinfresco e un discorso su \"il futuro di questa città\", che Peter incontra per la prima volta Harry Osborn di persona fuori da scuola — nervoso, evasivo su suo padre, chiaramente abituato a nascondere qualcosa che nemmeno lui capisce del tutto.",
  choices:[
    {text:"Fai amicizia con Harry. Potrebbe essere la chiave per capire cosa succede davvero in quella famiglia.", effects:{legameMJ:0}, setFlags:{harry_amico:true}, next:"p2_cauto_2"},
    {text:"Resta professionale — scatti, domande innocue, niente di personale. Non vuoi legami che possano essere usati contro di te.", next:"p2_cauto_2"}
  ]
};

SCENES["p2_cauto_2"] = {
  chapter:"Atto II · Il Percorso Cauto",
  text:"Nelle settimane seguenti, Peter raccoglie pazientemente ogni pezzo: fatture di laboratorio filtrate da un impiegato scontento, un articolo di rivista scientifica ritirato \"per errori metodologici\" pochi giorni prima della pubblicazione, i verbali di un consiglio d'amministrazione che ha bocciato il finanziamento del Progetto Goblin — poco prima che Norman Osborn continuasse comunque a finanziarlo di tasca propria, in segreto.\n\nÈ un lavoro lento, da giornalista più che da eroe. E funziona: piano piano, un'immagine coerente emerge da tutti quei frammenti.",
  choices:[
    {text:"Porta quello che hai a un contatto della polizia che si fida di Spider-Man — l'agente Jean DeWolff.", effects:{reputazione:6, vita:10}, next:"p2_cauto_3"},
    {text:"Non fidarti della polizia ufficiale — Osborn ha soldi e amicizie ovunque. Tieni le prove per te.", effects:{segreto:4, reputazione:-2, vita:10}, next:"p2_cauto_3"}
  ]
};

SCENES["p2_cauto_3"] = {
  chapter:"Atto II · Il Percorso Cauto",
  text:"Mentre l'indagine cauta procede, la città non si ferma ad aspettarla: un ladro capace di trasformare il proprio corpo in sabbia ha svaligiato tre gioiellerie nel giro di una settimana, filtrando letteralmente sotto le porte blindate.",
  choices:[
    {text:"Fermalo prima che qualcuno si faccia male sul serio.", next:"villain_sandman"}
  ]
};

SCENES["villain_sandman"] = {
  chapter:"Atto II · Cammeo — l'Uomo Sabbia",
  text:"William Baker — \"Flint\" per gli amici che gli restano — si sgretola e ricompone davanti ai tuoi occhi come un incubo di sabbia bagnata. Non è cattivo per natura: è disperato, un ex detenuto che un incidente in un poligono di prova ha trasformato in qualcosa che nemmeno lui voleva diventare.",
  combat:{
    enemy:{ name:"l'Uomo Sabbia", vita:58, attacco:13, desc:"Flint Marko: corpo semi-solido, difficile da colpire in pieno, vulnerabile all'acqua e al freddo intenso." },
    onWin:"dopo_sandman", onLose:null, isBoss:false
  }
};

SCENES["dopo_sandman"] = {
  chapter:"Atto II · Cammeo — l'Uomo Sabbia",
  text:"Alla fine lo intrappoli in un container industriale sigillato — l'unico modo per fermare qualcuno che letteralmente puoi attraversare con un pugno senza che se ne accorga. Prima che i sigilli si chiudano del tutto, Marko sussurra: «Ho solo bisogno di soldi per mia figlia, ragazzo. Non tutti quelli che finiscono male sono nati mostri. Ricordatelo, quando arriverai a quello vero.»\n\nLe parole gli restano addosso più a lungo del previsto.",
  effects:{umore:-2},
  choices:[
    {text:"Torna alle tue indagini su Osborn — il tempo stringe.", effects:{vita:18}, next:"atto2_convergenza_setup"}
  ]
};

/* ---- CONVERGENZA / RIVELAZIONE ---- */
SCENES["atto2_convergenza_setup"] = {
  chapter:"Atto II · Capitolo 8",
  text:"Qualunque strada abbia preso — l'assalto diretto o l'indagine paziente — Peter arriva alla stessa notte fatale: quella in cui tutto smette di essere un sospetto e diventa certezza.\n\nUn container Oscorp sequestrato dalla polizia sulla base delle prove raccolte (o rubate) viene aperto in diretta televisiva davanti alle telecamere del canale locale. Dentro, non ci sono i documenti finanziari che il consiglio d'amministrazione si aspettava di trovare per smentire le voci. C'è un'armatura verde e viola a forma di demone, un aliante a forma di pipistrello, e un flacone di siero identico a quello fotografato nel laboratorio segreto.\n\nQuella sera stessa, le luci dell'attico all'ultimo piano della Oscorp Tower restano accese fino all'alba.",
  choices:[
    {text:"Qualcosa, in cima a quella torre, sta per rompersi.", next:"goblin_nascita"}
  ]
};

SCENES["goblin_nascita"] = {
  chapter:"Atto II · Capitolo 9",
  text:"I notiziari del mattino dopo parlano di un'esplosione al piano ricerca della Oscorp Tower — \"un tragico incidente di laboratorio\", dice il comunicato ufficiale firmato dallo stesso Norman Osborn, sopravvissuto per un soffio.\n\nMa Peter, sorvolando la città quella notte, vede qualcosa che nessun comunicato stampa può nascondere: una sagoma su un aliante metallico, avvolta in un mantello verde marcio, con un volto che non è più del tutto un volto — una maschera di rabbia scolpita nella carne stessa, che ride di una risata che si sente a isolati di distanza.\n\nIl Folletto Verde è nato. E la prima cosa che fa, planando basso sopra Forest Hills, è lasciar cadere sul tetto di una casa ben precisa una zucca che esplode in fiamme verdi — un avvertimento, non un attacco. La casa di Flash Thompson.",
  effects:{rabbia:15, umore:-8},
  choices:[
    {text:"Vola verso casa. ORA.", next:"biv2_setup"}
  ]
};

/* --- BIVIO MAGGIORE 2: FLASH SA / FLASH AL BUIO --- */
SCENES["biv2_setup"] = {
  chapter:"Atto II · Capitolo 10",
  text:"Arrivi in tempo — l'incendio sul tetto si spegne prima di raggiungere la struttura, e Flash è fuori sul prato, scalzo, che fissa i resti fumanti di una zucca finta con un ghigno da demone dipinto sopra. È scosso, ma vivo. Illeso.\n\nÈ il momento in cui Peter capisce che tenere Flash all'oscuro — o continuare a lasciarlo intuire senza dirgli mai la parola intera — è appena diventato molto più pericoloso di qualunque bugia.",
  choices:[
    {text:"Dillo, una volta per tutte, senza più giri di parole: «Flash, sono io. Sono sempre stato io.» — condividi il peso intero del segreto, per proteggerlo con la verità.", effects:{segreto:-20, fiduciaFlash:15, umore:6, vita:8}, setFlags:{flash_sa:true}, next:"p2b_flashsa_1"},
    {text:"Non dirglielo nemmeno adesso. Inventa una copertura — «gli Osborn hanno molti nemici, potrebbe essere per me quanto per loro» — e proteggi il segreto restando distante, per tenerlo fuori il più possibile da questa guerra.", effects:{segreto:10, fiduciaFlash:-10, umore:-6, vita:8}, setFlags:{flash_sa:false}, next:"p2b_flashbuio_1"}
  ]
};

/* ---- RAMO FLASH SA ---- */
SCENES["p2b_flashsa_1"] = {
  chapter:"Atto II · Flash Sa",
  text:"Flash resta in silenzio sul prato bruciacchiato più a lungo di quanto Peter si aspettasse. Poi, piano: «Lo sapevo. Cioè — non lo SAPEVO sapevo, ma... lo sapevo.» Una risata nervosa, quasi isterica per lo shock. «Cristo, Parker. Sei Spider-Man. Spider-Man dorme nella mia stanza degli ospiti.»\n\nNon è rabbia, quella sul suo viso. È qualcosa di più complicato — paura per l'amico, orgoglio assurdo, e la vertigine di ventiquattro ore che stanno riscrivendo tutto quello che pensava di sapere.",
  choices:[
    {text:"Lascialo assorbire il colpo. Restagli semplicemente vicino, per la prima volta senza nascondere niente.", effects:{fiduciaFlash:6}, next:"p2b_flashsa_2"}
  ]
};

SCENES["p2b_flashsa_2"] = {
  chapter:"Atto II · Flash Sa",
  text:"Da quella notte Flash diventa qualcosa a metà tra un fratello e un ufficiale di collegamento: controlla i notiziari locali mentre Peter dorme di giorno esausto, gli copre le assenze a scuola con alibi sempre più elaborati, gli lascia il kit di pronto soccorso sul comodino senza fare domande. Una volta, quasi si offre di \"fargli da spalla\" in un'uscita notturna, prima che Peter lo dissuada fermamente — con affetto, ma fermamente.\n\nIl problema è un altro: il Folletto Verde ora sa che qualcuno, in quella casa, conta davvero per Spider-Man. E un nemico che conosce i tuoi punti deboli è un nemico che li userà.",
  choices:[
    {text:"Affronta il problema di petto — meglio un nemico che ti insegue con la sua rabbia che uno che pianifica in silenzio.", effects:{vita:10}, next:"villain_scorpion"}
  ]
};

/* ---- RAMO FLASH AL BUIO ---- */
SCENES["p2b_flashbuio_1"] = {
  chapter:"Atto II · Flash al Buio",
  text:"«Nemici degli Osborn, certo» dice Flash lentamente, senza crederci fino in fondo, gli occhi ancora fissi sulla zucca carbonizzata. Non insiste oltre — ha imparato a non farlo, con Peter — ma qualcosa nella fiducia tra loro si incrina in modo diverso da prima: non è più solo un segreto tenuto. Ora è un pericolo reale, portato in casa sua, di cui non conosce la vera forma.\n\nDa quel giorno Flash comincia a chiudere le finestre a doppia mandata la sera, a sobbalzare a ogni rumore sul tetto, a tenere una mazza da baseball vicino al letto \"per sicurezza\". Ha paura in casa propria, e non sa nemmeno bene di cosa.",
  choices:[
    {text:"Ti senti in colpa a guardarlo così — ma resti convinto che sia la scelta più sicura per lui.", effects:{umore:-4}, next:"p2b_flashbuio_2"}
  ]
};

SCENES["p2b_flashbuio_2"] = {
  chapter:"Atto II · Flash al Buio",
  text:"La distanza tra loro cresce in fretta: Flash comincia a passare più notti da amici, \"per stare tranquillo\", lasciando Peter sempre più solo in una casa che ormai gli sembra un guscio vuoto quanto la sua vecchia camera su Ingram Street. È più al sicuro, forse. Ma la solitudine, in questo periodo, ha un costo tutto suo.\n\nIl Folletto Verde, nel frattempo, non si è fermato a un solo avvertimento: qualcuno che porta un costume da mercenario armato di coda meccanica velenosa è stato visto aggirarsi proprio intorno a Forest Hills Gardens, come se stesse cercando qualcosa — o qualcuno.",
  choices:[
    {text:"Vai a scoprire chi è, prima che trovi quello che sta cercando.", effects:{vita:10}, next:"villain_scorpion"}

/* ============ MOTORE ============ */
var appEl = document.getElementById("app");

function reqLabel(req){
  if(!req) return "";
  var labels={vita:"Vita",resistenza:"Resistenza",umore:"Umore",rabbia:"Rabbia",segreto:"Segreto",fiduciaFlash:"Fiducia di Flash",legameMJ:"Legame con MJ",reputazione:"Reputazione",soldi:"Soldi"};
  var parts=[];
  for(var k in req){
    if(k==="flags") continue;
    var r=req[k];
    if(r.min!==undefined) parts.push((labels[k]||k)+" ≥ "+r.min);
    if(r.max!==undefined) parts.push((labels[k]||k)+" ≤ "+r.max);
  }
  return parts.join(", ");
}

function renderStats(){
  var st=S.stats;
  function row(cls,label,val,max){
    max=max||100;
    return '<div class="stat-row stat-'+cls+'"><span class="stat-label">'+label+'</span>'+
      '<div class="stat-track"><div class="stat-fill" style="width:'+Math.max(0,Math.min(100,val/max*100))+'%"></div></div>'+
      '<span class="stat-val">'+Math.round(val)+'</span></div>';
  }
  var html='<div class="statbar-wrap"><div class="stats-grid">'+
    row("vita","Vita",st.vita)+row("resistenza","Energia",st.resistenza)+
    row("umore","Umore",st.umore)+row("rabbia","Rabbia",st.rabbia)+
    row("segreto","Segreto",st.segreto)+row("flash","Flash",st.fiduciaFlash)+
    row("mj","MJ",st.legameMJ)+row("rep","Fama",st.reputazione)+
    '</div><div style="text-align:right;font-size:0.72em;color:var(--muted);margin-top:2px;font-family:\'Trebuchet MS\',sans-serif;">$ '+st.soldi+'</div></div>';
  return html;
}

function render(){
  var scene = SCENES[S.scene];
  if(!scene){ S.scene="titolo"; scene=SCENES["titolo"]; }

  /* Applica gli effetti/flag propri della scena esattamente una volta,
     nel momento in cui vi si entra davvero (non a ogni ri-render). */
  if(S.lastEnteredScene !== S.scene){
    applyEffects(scene.effects); setFlags(scene.flags);
    S.lastEnteredScene = S.scene;
  }

  if(scene.menu){ renderTitleScreen(); return; }
  if(scene.router){ routeEnding(); return; }
  if(scene.ending){ renderEnding(scene); return; }
  if(scene.next_direct){
    S.scene = scene.next_direct; save(); render(); return;
  }
  if(scene.combat){ renderCombatEntry(scene); return; }

  var html = renderStats();
  html += '<div class="chapter-tag">'+ (scene.chapter||"") +'</div>';
  html += '<div class="story-text">'+escapeText(scene.text||"")+'</div>';
  html += '<div class="choices">';
  (scene.choices||[]).forEach(function(c, i){
    var ok = meetsReq(c.requires);
    html += '<button class="btn'+(ok?"":" locked")+'" '+(ok?"":"disabled")+' data-idx="'+i+'">'+
      escapeText(c.text) + (c.requires && !ok ? '<span class="tag">Richiede: '+reqLabel(c.requires)+'</span>' : '') +
      '</button>';
  });
  html += '</div>';

  if(S.journal.length){
    html += '<div class="journal">Frammenti del percorso: '+S.journal.slice(-3).join(" · ")+'</div>';
  }
  html += renderFooterControls();

  appEl.innerHTML = html;
  var btns = appEl.querySelectorAll(".choices .btn:not(.locked)");
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      var idx = parseInt(b.getAttribute("data-idx"),10);
      var choice = scene.choices[idx];
      applyEffects(choice.effects); setFlags(choice.setFlags);
      if(choice.journal) addJournal(choice.journal);
      S.scene = choice.next;
      save(); render();
    });
  });
  wireFooterControls();
  window.scrollTo(0,0);
}

function escapeText(t){
  var d=document.createElement("div"); d.innerText=t; return d.innerHTML;
}

function renderFooterControls(){
  return '<div class="save-controls">'+
    '<button id="btn-export">Esporta salvataggio</button>'+
    '<button id="btn-import">Importa salvataggio</button>'+
    '<button id="btn-restart">Ricomincia da capo</button>'+
    '</div><div id="io-area"></div>';
}
function wireFooterControls(){
  var exp=document.getElementById("btn-export");
  var imp=document.getElementById("btn-import");
  var res=document.getElementById("btn-restart");
  if(exp) exp.onclick=function(){
    var area=document.getElementById("io-area");
    area.innerHTML='<textarea class="savebox" readonly>'+JSON.stringify(S)+'</textarea><div class="small-note">Copia e conserva questo testo per portare la partita altrove.</div>';
  };
  if(imp) imp.onclick=function(){
    var area=document.getElementById("io-area");
    area.innerHTML='<textarea class="savebox" placeholder="Incolla qui il salvataggio..."></textarea><button id="btn-doimport" style="margin-top:6px;">Carica</button>';
    document.getElementById("btn-doimport").onclick=function(){
      var txt=area.querySelector("textarea").value;
      try{ var obj=JSON.parse(txt); S=Object.assign(DEFAULT_STATE(),obj); S.stats=Object.assign(DEFAULT_STATE().stats,obj.stats||{}); save(); render(); }
      catch(e){ alert("Salvataggio non valido."); }
    };
  };
  if(res) res.onclick=function(){
    if(confirm("Sei sicuro di voler ricominciare? La run attuale andrà persa.")) hardReset();
  };
}

/* ---------- TITOLO ---------- */
function renderTitleScreen(){
  var hasSave = false;
  try{ hasSave = !!localStorage.getItem("prezzo_potere_save"); }catch(e){}
  var html = '<div class="title-screen">';
  html += '<h1>IL PREZZO DEL POTERE</h1>';
  html += '<div class="sub">un roguelike narrativo di Spider-Man — crudo, reale, senza scelte facili</div>';
  html += '</div>';
  html += '<button class="btn btn-primary menu-btn" id="btn-new">Nuova partita</button>';
  if(hasSave) html += '<button class="btn menu-btn" id="btn-continue">Continua la partita salvata</button>';
  html += '<div class="web-divider">— • —</div>';
  html += '<div class="disclaimer">Progetto amatoriale non commerciale, fan-made, mai distribuito pubblicamente. Spider-Man e tutti i personaggi Marvel qui presenti sono proprietà dei rispettivi detentori dei diritti (Marvel/Disney); questo lavoro è un esperimento narrativo privato, senza alcuno scopo di lucro. Contenuti: violenza intensa, morte, tematiche di lutto — pensato per un pubblico adulto/maturo.</div>';
  appEl.innerHTML = html;
  var bn = document.getElementById("btn-new");
  var bc = document.getElementById("btn-continue");
  if(bn) bn.onclick=function(){ S=DEFAULT_STATE(); S.scene="intro_1"; save(); render(); };
  if(bc) bc.onclick=function(){ load(); if(S.scene==="titolo") S.scene="intro_1"; render(); };
}

/* ---------- ROUTER FINALI ---------- */
function routeEnding(){
  var st=S.stats, fl=S.flags;
  if(fl.vendetta===true){ S.scene="finale_ragno_nero"; save(); render(); return; }
  if(st.segreto<=35){ S.scene="finale_esposto"; save(); render(); return; }
  if(fl.salvato==="entrambi" || (st.umore>=45 && st.fiduciaFlash>=40 && st.legameMJ>=40)){ S.scene="finale_eroe"; save(); render(); return; }
  S.scene="finale_prezzo"; save(); render();
}

function renderEnding(scene){
  var html='<div class="end-screen">';
  html+='<div class="chapter-tag">'+(scene.isDeath?"Game Over":"Finale raggiunto")+'</div>';
  html+='<h2>'+scene.title+'</h2>';
  html+='<div class="end-sub">'+scene.subtitle+'</div>';
  var text = scene.text;
  if(scene.isDeath){ text = text.replace("__DEATH_TEXT__", S.deathCtx || "Il buio arriva prima che tu possa nemmeno capire cosa sia successo."); }
  html+='<div class="story-text">'+escapeText(text)+'</div>';
  html+=renderStats();
  html+='<button class="btn btn-primary menu-btn" id="btn-newrun" style="margin:20px auto 0;">Inizia una nuova run</button>';
  html+='<div class="web-divider">— • —</div>';
  html+='<div class="disclaimer">Fine di questa run. Scelte diverse, fin dal primo bivio, portano a strade e finali completamente diversi.</div>';
  appEl.innerHTML=html;
  document.getElementById("btn-newrun").onclick=function(){ hardReset(); S.scene="intro_1"; save(); render(); };
  window.scrollTo(0,0);
}

/* ---------- COMBATTIMENTO ---------- */
var combatLogLines = [];
function renderCombatEntry(scene){
  S.combat = {
    enemy: Object.assign({}, scene.combat.enemy),
    enemyMax: scene.combat.enemy.vita,
    onWin: scene.combat.onWin,
    onLose: scene.combat.onLose,
    isBoss: scene.combat.isBoss,
    isFateCheck: scene.combat.isFateCheck||false,
    successStat: scene.combat.successStat,
    successMin: scene.combat.successMin,
    text: scene.text,
    chapter: scene.chapter,
    mercyOffered:false
  };
  combatLogLines = [];
  save();
  renderCombat();
}

function pushLog(txt, cls){ combatLogLines.push('<div class="'+(cls||"")+'">'+txt+'</div>'); if(combatLogLines.length>30) combatLogLines.shift(); }

function renderCombat(){
  var c = S.combat;
  if(!c){ render(); return; }

  if(c.isFateCheck){
    var success = S.stats[c.successStat] >= c.successMin;
    var html = renderStats();
    html += '<div class="chapter-tag">'+(c.chapter||"")+'</div>';
    html += '<div class="story-text">'+escapeText(c.text)+'</div>';
    html += '<div class="choices"><button class="btn btn-primary" id="btn-resolve-fate">Tenta l\'impossibile</button></div>';
    appEl.innerHTML = html;
    document.getElementById("btn-resolve-fate").onclick=function(){
      S.combat=null;
      S.scene = success ? c.onWin : c.onLose;
      save(); render();
    };
    return;
  }

  var html = renderStats();
  html += '<div class="chapter-tag">'+(c.chapter||"")+'</div>';
  html += '<div class="story-text">'+escapeText(c.text)+'</div>';
  html += '<div class="combat-panel">';
  html += '<div class="combat-vs">';
  html += '<div class="combat-side you"><h3>Tu</h3><div class="hp-track"><div class="hp-fill" style="width:'+Math.max(0,S.stats.vita)+'%"></div></div></div>';
  html += '<div class="combat-side enemy"><h3>'+c.enemy.name+'</h3><div class="hp-track"><div class="hp-fill enemy-fill" style="width:'+Math.max(0,c.enemy.vita/c.enemyMax*100)+'%"></div></div></div>';
  html += '</div>';
  html += '<div style="font-size:0.8em;color:var(--muted);margin-bottom:10px;font-style:italic;">'+c.enemy.desc+'</div>';
  html += '<div class="combat-log">'+combatLogLines.join("")+'</div>';

  if(c.enemy.vita<=0){
    if(c.isBoss && !c.mercyOffered){
      html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">Continua</button></div>';
    } else {
      html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">Continua</button></div>';
    }
  } else if(S.stats.vita<=0){
    html += '<div class="choices"><button class="btn btn-primary" id="btn-continue-combat">...</button></div>';
  } else {
    html += '<div class="combat-actions">';
    html += '<button class="btn" data-act="attacco">Attacco diretto<span class="tag">Alto danno, alto rischio</span></button>';
    html += '<button class="btn" data-act="ragnatela">Ragnatela<span class="tag">Immobilizza, danno medio</span></button>';
    html += '<button class="btn" data-act="schiva">Schivata acrobatica<span class="tag">Difesa, poco danno</span></button>';
    html += '<button class="btn" data-act="ambiente" '+(S.stats.resistenza<15?"disabled":"")+'>Usa l\'ambiente<span class="tag">Costa energia, danno alto</span></button>';
    html += '</div>';
  }
  html += '</div>';
  appEl.innerHTML = html;

  var cont = document.getElementById("btn-continue-combat");
  if(cont){
    cont.onclick = function(){
      if(S.stats.vita<=0){
        S.deathCtx = deathFlavor(c.chapter, c.enemy.name);
        S.combat=null; S.scene="finale_morte"; save(); render(); return;
      }
      if(c.enemy.vita<=0){
        S.combat=null; S.scene=c.onWin; save(); render(); return;
      }
    };
  }
  appEl.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click", function(){ doCombatAction(b.getAttribute("data-act")); });
  });
  window.scrollTo(0,0);
}

function deathFlavor(chapter, enemyName){
  return "Non ce l'ha fatta, questa volta. "+(chapter?("Durante "+chapter+", ") : "")+"contro "+enemyName+", il corpo ha ceduto prima della volontà. New York non si fermerà per lui — nessuna città lo fa mai, per nessuno. Ben lo aveva avvertito che il potere ha un prezzo. Stanotte, quel prezzo è stato tutto quello che aveva.";
}

function doCombatAction(act){
  var c = S.combat;
  if(!c || c.enemy.vita<=0 || S.stats.vita<=0) return;
  var st = S.stats;
  var roll = Math.random();
  var dmgToEnemy=0, dmgToYou=0, staminaCost=0, logMsg="", logCls="";

  if(act==="attacco"){
    staminaCost=12;
    var chance = 0.55 + (st.resistenza/400);
    if(roll<chance){ dmgToEnemy = 14 + Math.floor(Math.random()*10); logMsg="Colpisci duro. "+dmgToEnemy+" danni inflitti."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.9); logMsg="L'attacco viene parato — contrattacco in arrivo."; logCls="miss"; }
    dmgToYou += Math.floor(c.enemy.attacco*0.4);
  } else if(act==="ragnatela"){
    staminaCost=8;
    var chance2 = 0.65 + (st.resistenza/500);
    if(roll<chance2){ dmgToEnemy = 9 + Math.floor(Math.random()*6); dmgToYou = Math.floor(c.enemy.attacco*0.2); logMsg="La ragnatela lo immobilizza per un istante. "+dmgToEnemy+" danni."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.6); logMsg="Si libera prima che la ragnatela faccia presa."; logCls="miss"; }
  } else if(act==="schiva"){
    staminaCost=5;
    var chance3 = 0.7 + (st.resistenza/400);
    if(roll<chance3){ dmgToYou = Math.floor(c.enemy.attacco*0.15); dmgToEnemy = 3+Math.floor(Math.random()*4); logMsg="Schivi il colpo e rispondi con un contrattacco veloce. "+dmgToEnemy+" danni."; logCls="hit"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.5); logMsg="Ti prende comunque, ma di striscio."; logCls="miss"; }
    st.resistenza = clamp(st.resistenza + 6);
  } else if(act==="ambiente"){
    staminaCost=20;
    if(st.resistenza<15){ return; }
    var chance4 = 0.5 + (st.resistenza/350);
    if(roll<chance4){ dmgToEnemy = 22 + Math.floor(Math.random()*14); logMsg="Usi l'ambiente urbano a tuo favore — colpo devastante! "+dmgToEnemy+" danni."; logCls="special"; }
    else { dmgToYou = Math.floor(c.enemy.attacco*0.7); logMsg="Il tentativo fallisce, e resti scoperto."; logCls="miss"; }
  }

  st.resistenza = clamp(st.resistenza - staminaCost);
  c.enemy.vita = Math.max(0, c.enemy.vita - dmgToEnemy);
  st.vita = clamp(st.vita - dmgToYou);

  pushLog(logMsg, logCls);
  if(dmgToYou>0) pushLog("Subisci "+dmgToYou+" danni.", "hit");
  if(st.resistenza<=10) pushLog("Sei sfinito — ogni mossa costa il doppio.", "special");

  save();
  renderCombat();
}

/* ============ AVVIO ============ */
load();
render();

})();
</script>

</html>
