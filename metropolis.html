<script>
(function(){
"use strict";

/* =========================================================================
   METROPOLIS — IL MEDIATORE
   Avventura narrativa a scelte multiple liberamente ispirata alla trama e
   all'estetica del film "Metropolis" (1927) di Fritz Lang. Opera di finzione
   originale: nessun fotogramma, dialogo originale, musica o logo ufficiale
   di alcuno studio/restauro viene riprodotto qui. Il titolo e ogni elemento
   grafico sono un trattamento originale ispirato allo stile Art Déco /
   Espressionista tedesco del film.
   ========================================================================= */

var META_KEY = "metropolis_meta_v1";

var ACHIEVEMENTS = {
  risveglio: { name: "Il Risveglio", icon: "🌇", desc: "Sei sceso per la prima volta nella Città delle Mani." },
  numero_11811: { name: "Il Numero 11811", icon: "🧥", desc: "Hai scambiato il tuo posto con quello di un operaio." },

  incubo_babilonia: { name: "L'Incubo di Babilonia", icon: "🐍", desc: "Sei sopravvissuto alla febbre e alla visione della Meretrice." },

  cinque_finali: { name: "Tutti i Volti della Città", icon: "🎭", desc: "Hai visto tutti e cinque i finali di questa storia." }
};

var CHAPTERS = [
  { n: 1, title: "I Giardini Eterni", from: "s_intro" },
  { n: 2, title: "La Città delle Mani", from: "s_lift" },
  { n: 3, title: "Il Numero 11811", from: "s_office" },
  { n: 4, title: "Il Turno", from: "s_shift" },
  { n: 5, title: "Le Catacombe", from: "s_catacombs" },
  { n: 6, title: "L'Uomo di Domani", from: "s_spy_report" },
  { n: 7, title: "La Notte del Segreto", from: "s_night_search" },
  { n: 8, title: "La Falsa Profetessa", from: "s_false_maria_intro" },
  { n: 9, title: "Il Diluvio", from: "s_riot" },
  { n: 10, title: "Il Rogo", from: "s_witch_burning" },
  { n: 11, title: "La Cattedrale", from: "s_rotwang_madness" },
  { n: 12, title: "Il Mediatore", from: "s_reconciliation" }
];

function chapterFor(sceneId){
  var idx = -1;
  for (var i=0;i<CHAPTERS.length;i++){
    if (SCENE_ORDER.indexOf(CHAPTERS[i].from) <= SCENE_ORDER.indexOf(sceneId)) idx = i;
  }
  return CHAPTERS[idx] || CHAPTERS[0];
}

/* ------------------------------ Motore -------------------------------- */

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function freshState(){
  return {
    currentScene: "s_intro",
    stats: { operai: 40, padre: 60, maria: 0, sospetto: 0, salute: 100 },
    inventory: [],
    flags: {},
    flood: 0,
    enteredScenes: [],
    history: [],
    ending: null
  };
}

function freshMeta(){
  return { achievements: [], endingsSeen: [] };
}

var state = null;
var meta = null;
var toastQueue = [];
var audioCtx = null;
var ambientNodes = null;
var audioOn = false;

function loadState(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveState(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadMeta(){
  try {
    var raw = localStorage.getItem(META_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveMeta(){
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e){}
}

function grantItem(id){
  if (state.inventory.indexOf(id) === -1) state.inventory.push(id);
}
function grantAchievement(id){
  if (meta.achievements.indexOf(id) === -1) {
    meta.achievements.push(id);
    toastQueue.push(id);
    saveMeta();
  }
}

function checkAchievements(){
  var s = state.stats, f = state.flags, inv = state.inventory;
  if (f.risveglio_seen) grantAchievement("risveglio");
  if (f.swapped) grantAchievement("numero_11811");
  if (f.declared_mediator) grantAchievement("mediatore_dichiarato");
  if (inv.indexOf("medaglione_maria") !== -1) grantAchievement("promessa_buio");
  if (inv.indexOf("schema_robot") !== -1) grantAchievement("segreto_rotwang");
  if (f.fever_survived) grantAchievement("incubo_babilonia");
  if (s.operai >= 90) grantAchievement("amico_operai");
  if (f.vera_natura_seen) grantAchievement("vera_natura");
  if (f.tutti_salvi) grantAchievement("bambini_salvi");
  if (f.molti_persi) grantAchievement("prezzo_ignoranza");
  if (f.duel_clean || f.duel_wounded) grantAchievement("duello_cattedrale");
  var allItems = Object.keys(ITEMS);
  var hasAll = allItems.every(function(id){ return inv.indexOf(id) !== -1; });
  if (hasAll) grantAchievement("collezionista");
  if (state.ending){
    if (meta.endingsSeen.indexOf(state.ending) === -1){
      meta.endingsSeen.push(state.ending);
      saveMeta();
    }
    if (state.ending === "s_end_true") grantAchievement("finale_cuore");
    if (state.ending === "s_end_best") grantAchievement("finale_alba");
    if (state.ending === "s_end_dark") grantAchievement("finale_ombra");
    if (state.ending === "s_end_sacrifice") grantAchievement("finale_sacrificio");
    if (state.ending === "s_end_bittersweet") grantAchievement("finale_agrodolce");
    var allEnd = ["s_end_true","s_end_best","s_end_dark","s_end_sacrifice","s_end_bittersweet"];
    if (allEnd.every(function(e){ return meta.endingsSeen.indexOf(e) !== -1; })) grantAchievement("cinque_finali");
  }
}

/* ------------------------------- Audio --------------------------------- */

function ensureAudio(){
  if (!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  return audioCtx;
}

function toggleAmbient(){
  var ctx = ensureAudio();
  if (!ctx) return;
  if (audioOn){
    if (ambientNodes){
      ambientNodes.forEach(function(n){ try{ n.stop(); }catch(e){} });
      ambientNodes = null;
    }
    audioOn = false;
  } else {
    if (ctx.state === "suspended") ctx.resume();
    var master = ctx.createGain();
    master.gain.value = 0.05;
    master.connect(ctx.destination);
    var nodes = [master];
    [55, 82.5, 110].forEach(function(freq, i){
      var osc = ctx.createOscillator();
      osc.type = i === 1 ? "sawtooth" : "sine";
      osc.frequency.value = freq;
      var g = ctx.createGain();
      g.gain.value = i === 0 ? 1 : 0.35;
      osc.connect(g); g.connect(master);
      osc.start();
      nodes.push(osc);
    });
    var lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(master.gain);
    lfo.start();
    nodes.push(lfo);
    ambientNodes = nodes;
    audioOn = true;
  }
  render();
}

function clickSound(){
  var ctx = ensureAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(220, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.12);
  g.gain.setValueAtTime(0.06, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.15);
}

/* ------------------------------- Scene ---------------------------------
   Ogni scena: { text: [paragrafi], intertitle: bool, onEnter(state),
   choices: [ { label, requires(state), effect(state), next: id | fn(state) } ] }
------------------------------------------------------------------------- */

var SCENES = {

  s_lift: {

    text: [
      "L'ascensore scende più di quanto pensassi potesse scendere qualcosa. Il marmo lascia il posto al metallo, i fiori al vapore. Quando le porte si aprono, il rumore ti colpisce come uno schiaffo: un battito meccanico, enorme, incessante.",
      "Vedi il cambio turno: migliaia di uomini in tuta grigia camminano a testa bassa, tutti allo stesso passo, tutti con lo stesso sguardo vuoto, incrociando un'altra folla identica che entra mentre loro escono. Nessuno parla. Nessuno alza gli occhi.",
      "Non hai mai visto niente del genere. Non sapevi nemmeno che esistesse."
    ],
    onEnter: function(s){ s.flags.risveglio_seen = true; },
    choices: [ { label: "Continua, sempre più a fondo", next: "s_moloch" } ]
  },

  s_moloch: {
    text: [
      "Sei davanti alla Macchina M, un cuore d'acciaio alto come una cattedrale, circondato da operai che ne leggono i quadranti come sacerdoti che leggono presagi.",
      "Un ago sale oltre il segno rosso. Nessuno se ne accorge in tempo. La macchina esplode in una vampata di vapore e schegge: corpi vengono scagliati contro le pareti, urla si mescolano al sibilo del metallo che si piega.",
      "Per un istante, nel fumo, non vedi più una macchina: vedi una bocca enorme, spalancata, che ha appena divorato degli uomini vivi. Poi il fumo si dirada, e resta solo l'orrore concreto di ciò che è appena accaduto."
    ],
    choices: [
      { label: "Corri tra i feriti a dare una mano", effect: function(s){ s.stats.operai = clamp(s.stats.operai + 10); s.flags.helped_wounded = true; }, next: "s_office" },
      { label: "Resta paralizzato, incapace di muoverti", next: "s_office" }
    ]
  },

  s_office: {
    chapterNum: 3,
    text: [
      "Sali fino all'ufficio di tuo padre, in cima alla Nuova Torre di Babele. Joh Fredersen riceve la notizia dell'esplosione con la stessa calma con cui riceverebbe un rapporto sulle scorte di carbone.",
      "Josaphat, il suo primo assistente, viene chiamato: il rapporto sull'incidente è arrivato con qualche minuto di ritardo. Per tuo padre, questo basta. «Sei licenziato» dice, senza alzare la voce, senza alzare gli occhi dalla scrivania.",
      "Josaphat impallidisce. Sai che, per un uomo di Metropolis senza lavoro, la caduta può essere rapida e definitiva."
    ],
    choices: [
      { label: "Prendi le difese di Josaphat davanti a tuo padre", effect: function(s){ s.stats.padre = clamp(s.stats.padre - 10); s.flags.defended_josaphat = true; }, next: "s_josaphat_home" },
      { label: "Resta in silenzio: non è affar tuo, per ora", effect: function(s){ s.stats.padre = clamp(s.stats.padre + 5); }, next: "s_josaphat_home" }
    ]
  },

  s_josaphat_home: {
    text: [
      "Trovi Josaphat mentre sta già preparando i bagagli, pronto a lasciare il suo appartamento nella città alta. Gli chiedi di restare, in segreto, come tuo unico contatto fidato: qualcuno a cui rivolgerti se le cose, in basso, si mettessero male.",
      "Ti dà un piccolo fischietto d'ottone. «Tre colpi brevi» dice. «Vorranno dire che ho visto, e che sto arrivando.»",
      "Poi, guardandoti dritto negli occhi, ti chiede cosa intendi fare adesso. Gli rispondi che vuoi vedere con i tuoi occhi la vita di chi lavora laggiù, non solo il fumo delle sue macchine."
    ],
    onEnter: function(s){ grantItem("fischietto_josaphat"); },
    choices: [ { label: "Scendi di nuovo verso i cancelli della Città delle Mani", next: "s_swap" } ]
  },

  s_swap: {
    text: [
      "Ai cancelli incontri un operaio esausto, il numero 11811 cucito sul petto. Si chiama Georgy. Sogna solo una notte a Yoshiwara, lontano da quei cancelli, e non un minuto di più.",
      "Gli offri denaro, i tuoi vestiti, la tua vita per una notte in cambio della sua tuta e del suo turno. All'inizio ride, pensa sia uno scherzo crudele. Poi vede che fai sul serio.",
      "«Il turno dura dieci ore» ti avverte, mentre si toglie la tuta. «Alla macchina degli orologi, non alle macchine con cui hai giocato tu.» Indossi la sua uniforme grigia. Per la prima volta in vita tua, nessuno ti guarda come il figlio di Joh Fredersen."
    ],
    onEnter: function(s){ s.flags.swapped = true; grantItem("tuta_11811"); grantItem("orologio_dieci_ore"); },
    choices: [ { label: "Prendi il tuo posto sulla linea", next: "s_shift" } ]
  },

  s_shift: {
    chapterNum: 4,
    text: [
      "La macchina davanti a te è un enorme quadrante con due lancette di ottone incandescente: devi spostarle, in continuazione, a comando di spie luminose che non si fermano mai. Non è lavoro: è un metronomo che ti usa come pendolo.",
      "Le braccia bruciano, la vista si annebbia, i minuti si allungano in modo osceno. A un certo punto, mentre ti pieghi in due dallo sforzo, un foglietto piegato scivola dalla tasca della tuta che indossi: una mappa disegnata a mano, con un simbolo che non riconosci."
    ],
    choices: [
      { label: "Nascondi il foglio e resisti fino alla fine del turno", effect: function(s){ grantItem("mappa_catacombe"); }, next: "s_collapse" },
      { label: "Fermati subito a leggerlo, rischiando una punizione", effect: function(s){ grantItem("mappa_catacombe"); s.stats.salute = clamp(s.stats.salute - 10); }, next: "s_collapse" }
    ]
  },

  s_collapse: {
    text: [
      "Quando finalmente la sirena libera il turno, le gambe ti cedono. Crolli contro il quadrante, e per un momento non senti più nulla — non il rumore, non il dolore, nemmeno la paura.",
      "Una mano ti solleva. È Josaphat, che ti ha seguito di nascosto fin qui, come promesso. «Ora capisci» ti dice piano «perché quella donna parla ai bambini di fratelli.»",
      "Un altro operaio, passandoti accanto, ti sussurra un'ora e un luogo: stanotte, nelle vecchie catacombe sotto la città."
    ],
    choices: [ { label: "Aspetta il calare della notte", next: "s_catacombs" } ]
  },

  s_catacombs: {
    chapterNum: 5,
    text: [
      "Segui una fila silenziosa di operai in una galleria scavata secoli fa, tra pareti di teschi e croci di legno consumate dal tempo. Centinaia di candele tremano nel buio.",
      "Al centro, in piedi su un blocco di pietra, c'è lei: Maria. Racconta agli operai la storia della Torre di Babele — costruita da una Testa che sognava di toccare le stelle, con le Mani di migliaia di uomini che quel sogno non lo condividevano affatto. La Torre cadde non per l'ira di un dio, ma per l'odio tra chi l'aveva pensata e chi l'aveva costruita con il proprio sudore.",
      "«Serve un Mediatore» conclude, con la voce che trema di speranza più che di rabbia. «Il Mediatore fra la Testa e le Mani deve essere il Cuore.» Il tuo cuore batte come se quelle parole fossero rivolte solo a te."
    ],
    choices: [
      { label: "Alzati davanti a tutti: «Il Mediatore sono io»", effect: function(s){ s.stats.maria = clamp(s.stats.maria + 20); s.flags.declared_mediator = true; }, next: "s_meeting_maria" },
      { label: "Resta in silenzio, ma avvicinati a lei quando la folla si dirada", effect: function(s){ s.stats.maria = clamp(s.stats.maria + 10); }, next: "s_meeting_maria" }
    ]
  },

  s_meeting_maria: {
    text: [
      "Quando restate soli tra le candele che si spengono, Maria ti osserva a lungo, come se stesse decidendo se crederti. «Sei davvero il figlio di Fredersen» dice, non come un'accusa, ma come una constatazione carica di conseguenze.",
      "Si toglie dal collo un piccolo medaglione con inciso una spiga di grano e te lo mette in mano. «Se qualcuno dovesse mai dubitare che sono io» dice «chiedigli di questo.»",
      "Vi promettete di rivedervi. Mentre risali verso la superficie, non sai ancora che qualcuno vi ha seguiti nell'ombra per tutta la notte."
    ],
    onEnter: function(s){ grantItem("medaglione_maria"); },
    choices: [ { label: "Torna a casa, con la mente piena di lei", next: "s_spy_report" } ]
  },

  s_spy_report: {
    chapterNum: 6,
    text: [
      "Quella notte, un uomo magro e silenzioso — uno dei tanti occhi di cui Joh Fredersen dispone in città — bussa alla porta dell'ufficio più alto di Metropolis.",
      "Riferisce tutto: le catacombe, la donna, la folla, la mappa scomparsa dalla tasca di un operaio. E riferisce, soprattutto, di aver riconosciuto Freder tra loro, vestito da operaio.",
      "Joh Fredersen non alza la voce. Si limita a prendere il cappello e a ordinare che l'automobile lo porti immediatamente a casa di un vecchio collaboratore: l'inventore Rotwang."
    ],
    choices: [ { label: "Continua", next: "s_rotwang_house" } ]
  },

  s_rotwang_house: {
    text: [
      "La casa di Rotwang è un'isola di legno antico incastonata tra i grattacieli, con una stella a cinque punte scolpita sopra la porta. All'interno, una statua ricorda Hel — la donna che Rotwang amò, che sposò invece Joh Fredersen, e che morì dando alla luce te.",
      "Nel suo laboratorio sotterraneo, tra scintille e ingranaggi, Rotwang svela a Fredersen la sua opera segreta: una figura umanoide d'acciaio e rame, ancora senza volto. «L'uomo del futuro» la chiama. «Non si stanca mai. Non si ammala mai. Non ama nessuno.»",
      "Fredersen, saputo delle catacombe e della donna che vi predica, ha un'idea fredda e precisa: dare a quella macchina il volto e il corpo di Maria, per screditarla agli occhi degli operai prima che la sua parola diventi rivolta. Rotwang accetta con un sorriso che il padrone di Metropolis non sa leggere: da anni aspetta solo un'occasione per vendicarsi di lui, e ora gliel'ha portata in casa da solo."
    ],
    choices: [ { label: "Continua", next: "s_night_search" } ]
  },

  s_night_search: {
    chapterNum: 7,
    text: [
      "Non riesci a dormire. Esci di nascosto, deciso a rivedere Maria prima del previsto, e i tuoi passi ti portano proprio vicino alla vecchia casa di Rotwang, da cui provengono luci e rumori che non dovrebbero esserci a quest'ora.",
      "Attraverso un varco nel muro senti un urlo che riconosci — Maria — inseguita da un fascio di torcia nei cunicoli che collegano la sua casa alle catacombe."
    ],
    choices: [
      { label: "Forza subito la porta principale", effect: function(s){ s.stats.salute = clamp(s.stats.salute - 15); grantItem("schema_robot"); s.stats.sospetto = clamp(s.stats.sospetto + 20); }, next: "s_fever" },
      { label: "Aggirati in silenzio e osserva da una fessura nel muro", effect: function(s){ grantItem("schema_robot"); s.stats.sospetto = clamp(s.stats.sospetto + 30); }, next: "s_fever" }
    ]
  },

  s_fever: {
    text: [
      "Quel che vedi — o credi di vedere — non ha senso: Maria legata a una poltrona di rame, un alone di luce che scivola dal suo corpo verso la figura d'acciaio accanto a lei, come un ritratto che cambia cornice. Un colpo alla testa, o forse solo l'orrore stesso, ti fa perdere i sensi.",
      "Ti risvegli nel tuo letto, bruciante di febbre. Le statue della Morte e dei Sette Peccati Capitali, nella cappella di famiglia, sembrano muoversi nella penombra. Vedi una donna vestita solo di seta danzare su un mostro a sette teste, mentre uomini in redingote si sbranano ai suoi piedi per un suo sguardo.",
      "Quando la febbre cala, non sai più distinguere cosa hai davvero visto da cosa ha inventato la tua mente in delirio. Ma un pensiero resta, freddo e chiaro: qualcosa, sotto quella casa, ha preso il volto di Maria."
    ],
    onEnter: function(s){ s.flags.fever_survived = true; },
    choices: [ { label: "Rialzati e torna in strada", next: "s_false_maria_intro" } ]
  },

  s_false_maria_intro: {
    chapterNum: 8,
    text: [
      "In città si parla già di una \"Maria\" vista a Yoshiwara, il locale di piacere della città alta, che balla per uomini che si sfidano a duello per un suo sorriso — cosa che la Maria che conosci non farebbe mai.",
      "La incontri per un istante, per strada: ha il suo viso, la sua voce, ma lo sguardo è sbagliato, freddo, come se ti stesse studiando invece di riconoscerti."
    ],
    choices: [
      { requires: function(s){ return s.inventory.indexOf("medaglione_maria") !== -1; },
        label: "Mostrale il medaglione e osserva la sua reazione", effect: function(s){ s.stats.sospetto = clamp(s.stats.sospetto + 30); s.flags.tested_medallion = true; }, next: "s_confront_early" },
      { label: "Allontanati confuso, convincendoti che sia solo lo stress", next: "s_workers_incited" }
    ]
  },

  s_confront_early: {
    text: [
      "Alla vista del medaglione, l'espressione della falsa Maria si incrina per una frazione di secondo — un guasto, un cortocircuito nella recitazione perfetta. Non hai più dubbi.",
      "Corri da Josaphat e da alcuni operai fidati: «Quella che parla nelle catacombe stanotte non è lei. Non fidatevi delle sue parole, qualunque cosa dica.» Non tutti ti credono, ma il seme del dubbio è piantato, e potrebbe fare la differenza quando sarà il momento."
    ],
    onEnter: function(s){ s.flags.warned_workers = true; },
    choices: [ { label: "Continua", next: "s_workers_incited" } ]
  },

  s_workers_incited: {
    text: [
      "Nelle catacombe, la falsa Maria non parla più di pazienza e Mediatori. Incita alla furia: «Basta aspettare un cuore che non arriverà mai. Distruggete le macchine, stanotte, con le vostre mani!»",
      "Grot, il caposquadra che ha sempre difeso gli operai senza mai tradire il proprio ruolo, cerca di fermarli: «Le macchine sono ciò che tiene in vita le vostre case, i vostri figli!» Nessuno lo ascolta più. La folla si muove come un'unica bestia verso il Cuore-Macchina."
    ],
    choices: [ { label: "Segui la folla, temendo il peggio", next: "s_riot" } ]
  },

  s_riot: {
    chapterNum: 9,
    text: [
      "Con mazze e sbarre, gli operai fanno a pezzi il Cuore-Macchina che regola l'intera Città delle Mani. Per un istante esultano, liberi per la prima volta in vita loro.",
      "Poi l'acqua comincia a salire dai condotti rotti. Grot urla la verità che nessuno voleva sentire: le loro case, dove sono rimasti i loro figli, stanno per allagarsi.",
      "Nel caos generale, la vera Maria — libera, forse fuggita nella confusione dell'attacco a Rotwang — ti afferra per un braccio. «I bambini» dice soltanto. Non serve altro."
    ],
    choices: [ { label: "Correte insieme verso le case degli operai", next: "s_flood_alarm" } ]
  },

  s_flood_alarm: {
    text: [
      "L'acqua sale più in fretta di quanto entrambi temevate. Dovete decidere in un istante come raggiungere i bambini, ancora addormentati o in preda al panico nelle case basse."
    ],
    choices: [
      { label: "La vecchia scala a chiocciola: più lunga, ma sicura", effect: function(s){ s.flood += 12; }, next: "s_flood_panic" },
      { label: "I cunicoli di servizio: più rapidi, ma rischiosi", effect: function(s){ if (s.stats.salute >= 70) { s.flood += 20; } else { s.flood += 6; s.stats.salute = clamp(s.stats.salute - 10); } }, next: "s_flood_panic" }
    ]
  },

  s_flood_panic: {
    text: [
      "Trovate i bambini svegli, terrorizzati, ammassati sui tavoli e i letti più alti mentre l'acqua nera continua a salire lungo i corridoi. Maria conosce molti di loro per nome; tu no, ma il tempo per le presentazioni non c'è."
    ],
    choices: [
      { label: "Fermati un istante a calmarli, promettendo che ce la farete", effect: function(s){ s.flood += 15; s.stats.salute = clamp(s.stats.salute - 5); }, next: "s_flood_climax" },
      { label: "Radunali in fila e correte senza fermarvi", effect: function(s){ s.flood += 8; }, next: "s_flood_climax" }
    ]
  },

  s_flood_climax: {
    text: [
      "Guidate la lunga fila di bambini verso le scale più alte della città, con l'acqua che vi lambisce le caviglie e poi i ginocchi. Ogni scelta fatta stanotte, ogni minuto risparmiato o perso, conta adesso più di ogni altra cosa."
    ],
    onEnter: function(s){
      var total = s.flood;
      if (s.flags.warned_workers) total += 15;
      if (s.inventory.indexOf("mappa_catacombe") !== -1) total += 10;
      if (s.stats.maria >= 40) total += 8;
      if (total >= 45) { s.flags.tutti_salvi = true; }
      else if (total >= 25) { s.flags.alcuni_persi = true; }
      else { s.flags.molti_persi = true; }
    },
    text2: null,
    choices: [ { label: "Continua", next: "s_flood_result" } ]
  },

  s_flood_result: {
    text: function(s){
      if (s.flags.tutti_salvi) return [
        "Uno a uno, li issate tutti sulla piattaforma più alta, all'asciutto, mentre sotto di voi la Città delle Mani sparisce sotto un lago nero e silenzioso.",
        "Li contate e ricontate, increduli: nessuno manca all'appello. Maria si volta verso di te, per la prima volta con qualcosa che somiglia alla speranza."
      ];
      if (s.flags.alcuni_persi) return [
        "Salvate quanti più potete, ma l'acqua è più veloce di voi in alcuni corridoi laterali. Quando finalmente contate i bambini in salvo, alcuni volti familiari non rispondono all'appello.",
        "Il silenzio che segue è peggiore di qualunque urlo."
      ];
      return [
        "Nonostante ogni sforzo, siete arrivati tardi in troppi luoghi. L'acqua ha reclamato ciò che la rivolta non aveva previsto di perdere.",
        "Maria stringe le mani di chi resta, incapace di dire nulla che possa davvero consolare."
      ];
    },
    choices: [ { label: "Risalite verso la città, tra gli operai in lacrime e furiosi", next: "s_return_to_city" } ]
  },

  s_return_to_city: {
    text: [
      "Gli operai sopravvissuti tornano in superficie increduli e furiosi, convinti di aver distrutto tutto per niente — o peggio, di aver ucciso i propri figli con le proprie mani.",
      "Qualcuno grida che l'ha vista, quella notte: la donna che li ha spinti a distruggere il Cuore-Macchina. È ancora lì, tra la folla, che osserva con un sorriso che nessuna madre in lutto potrebbe avere.",
      "«Strega!» urla una voce. Poi un'altra. Poi cento."
    ],
    choices: [ { label: "Segui la folla inferocita verso la piazza", next: "s_witch_burning" } ]
  },

  s_witch_burning: {
    chapterNum: 10,
    text: [
      "La folla trascina la falsa Maria fino a un rogo improvvisato in mezzo alla piazza, sordi a ogni sua parola. Le fiamme si alzano rapide.",
      "E poi, sotto la pelle che si arriccia e si scioglie come cera, qualcosa luccica: rame, acciaio, un teschio di ingranaggi che ride ancora, immobile, mentre l'illusione brucia via del tutto.",
      "La piazza ammutolisce. Non era mai stata lei. Non lo è mai stata."
    ],
    onEnter: function(s){ s.flags.vera_natura_seen = true; },
    choices: [ { label: "Continua", next: "s_rotwang_madness" } ]
  },

  s_rotwang_madness: {
    chapterNum: 11,
    text: [
      "Nel caos che segue, un urlo attira la tua attenzione verso il tetto della vecchia cattedrale: è Rotwang, che ha scambiato la vera Maria, appena ritrovata nella confusione, per la sua Hel perduta da vent'anni.",
      "La insegue tra le guglie di pietra, incurante dell'altezza, incurante di tutto tranne del fantasma che crede di rincorrere."
    ],
    choices: [ { label: "Scala la cattedrale per raggiungerli", next: "s_cathedral_choice" } ]
  },

  s_cathedral_choice: {
    text: [
      "Raggiungi il tetto della cattedrale proprio mentre Rotwang ha messo le mani su Maria, sul bordo della grondaia, con la città intera che gira vertiginosa sotto di loro.",
      "Non hai molto tempo per decidere come intervenire."
    ],
    choices: [
      { label: "Scagliati direttamente contro di lui, a mani nude", next: function(s){
          if (s.stats.salute >= 70) { s.flags.duel_wounded = true; return "s_duel_survive"; }
          s.flags.freder_died = true; return "s_end_sacrifice";
        } },
      { label: "Aggirati con calma tra le guglie e cogli l'attimo giusto", next: function(s){
          if (s.stats.salute >= 50 || s.inventory.indexOf("schema_robot") !== -1) { s.flags.duel_clean = true; return "s_duel_survive"; }
          s.flags.duel_wounded = true; return "s_duel_survive";
        } }
    ]
  },

  s_duel_survive: {
    text: function(s){
      if (s.flags.duel_clean) return [
        "Conosci gli ingranaggi di Rotwang meglio di quanto lui immagini: ogni suo movimento è quello di un uomo che ha passato la vita chino su una scrivania, non su un tetto. Lo scarti, lo lasci sbilanciare da solo.",
        "Rotwang precipita nel vuoto con un ultimo grido che non è rivolto a te, ma a Hel. Tu resti in piedi, senza un graffio, con Maria stretta al petto."
      ];
      return [
        "La lotta è breve e brutale. Un colpo ti spacca il labbro, un altro ti fa perdere l'equilibrio per un istante che sembra durare un'eternità — ma è Rotwang, alla fine, a perdere la presa sulla pietra bagnata.",
        "Precipita in silenzio. Tu resti aggrappato a un doccione di pietra, ferito ma vivo, con Maria che ti tira su per un braccio."
      ];
    },
    onEnter: function(s){ s.stats.salute = clamp(s.stats.salute - (s.flags.duel_wounded ? 25 : 5)); },
    choices: [ { label: "Scendete insieme verso la piazza", next: "s_reconciliation" } ]
  },

  s_reconciliation: {
    chapterNum: 12,
    text: [
      "Davanti al portale della cattedrale, Grot e i pochi operai rimasti in piedi affrontano Joh Fredersen, arrivato di persona a contare i danni e i corpi. Nessuno dei due sembra disposto a fare il primo passo, e le mani di alcuni operai stringono ancora gli attrezzi usati per distruggere il Cuore-Macchina.",
      "Maria ti guarda. Sai, in quel momento, che le parole delle catacombe non erano solo una storia."
    ],
    choices: [ { label: "Scendi tra loro e prendi la mano di entrambi", next: function(s){ return chooseEnding(s); } } ]
  },

  /* ---------------------------- Finali ---------------------------- */

  s_end_true: {
    ending: true,
    text: [
      "Scendi gli ultimi gradini e ti metti tra tuo padre e Grot, prendendo una mano di ciascuno. Per un istante nessuno si muove.",
      "«Il Mediatore fra la Testa e le Mani» dici, con la voce ancora rotta dalla notte appena vissuta «deve essere il Cuore.» Poi unisci le loro mani con le tue.",

  s_end_best: {

      "«Il Mediatore fra la Testa e le Mani deve essere il Cuore» dici, e stavolta nessuno dubita che tu lo sia già diventato. Metropolis, all'alba, sembra — per la prima volta — una città sola, non due."
    ],
    choices: [ { label: "Fine — Torna al menu", next: "MENU" } ]

  s_end_dark: {
    ending: true,
    text: [
      "Troppe case sono state inghiottite dall'acqua, troppi bambini non hanno risposto all'appello. Quando scendi verso Grot e tuo padre, non trovi spazio per una riconciliazione: solo lutto, accuse, e le guardie di Fredersen che arrivano per disperdere quel che resta della folla con la forza.",
      "Tuo padre ti guarda con qualcosa che assomiglia quasi a compassione, ma non cede di un millimetro. «Le macchine devono ripartire» dice. «Il resto verrà dopo.»",
      "Non verrà mai. Metropolis continuerà a girare, cuore contro mani, per un'altra generazione almeno. Tu resti a guardare la città illuminarsi di nuovo, dall'alto, chiedendoti se il Mediatore che credevi di essere sia mai davvero esistito."
    ],
    choices: [ { label: "Fine — Torna al menu", next: "MENU" } ]
  },

  s_end_bittersweet: {
    ending: true,
    text: [
      "Alcuni bambini non sono tornati dalle acque, e nessuna stretta di mano può davvero cancellarlo. Eppure, proprio per questo, quando scendi tra Grot e tuo padre trovi qualcosa che non ti aspettavi: la stanchezza condivisa di chi ha perso qualcosa di reale, dall'una e dall'altra parte della città.",
      "«Il Mediatore fra la Testa e le Mani deve essere il Cuore» dici, e stavolta la frase suona meno come una profezia e più come una richiesta di scuse reciproche. Tuo padre stringe la mano di Grot lentamente, senza convinzione ma senza ritrarla.",
      "Non è la vittoria che avevi immaginato nelle catacombe. È solo un inizio, fatto di cenere e di promesse che qualcuno dovrà mantenere."
    ],
    choices: [ { label: "Fine — Torna al menu", next: "MENU" } ]
  },

  s_end_sacrifice: {
    ending: true,
    text: [
      "Le tue dita scivolano dalla pietra bagnata un istante dopo quelle di Rotwang. Maria urla il tuo nome mentre cadi, ma il vento e la distanza si portano via ogni risposta che avresti voluto darle.",
      "Nei giorni che seguono, è la tua assenza — non le tue parole — a costringere Joh Fredersen e Grot a guardarsi davvero per la prima volta, sopra una bara invece che sopra un tavolo di trattative.",
      "Maria ripete a chiunque voglia ascoltarla ciò che tu avevi capito nelle catacombe: che serviva un Cuore tra la Testa e le Mani. Metropolis lo troverà, forse, ma senza di te per vederlo."

var SCENE_ORDER = [
  "s_intro","s_garden","s_lift","s_moloch","s_office","s_josaphat_home","s_swap",
  "s_shift","s_collapse","s_catacombs","s_meeting_maria","s_spy_report","s_rotwang_house",
  "s_night_search","s_fever","s_false_maria_intro","s_confront_early","s_workers_incited",
  "s_riot","s_flood_alarm","s_flood_panic","s_flood_climax","s_flood_result","s_return_to_city",
  "s_witch_burning","s_rotwang_madness","s_cathedral_choice","s_duel_survive","s_reconciliation",
  "s_end_true","s_end_best","s_end_dark","s_end_bittersweet","s_end_sacrifice"
];

function chooseEnding(s){
  if (s.flags.freder_died) return "s_end_sacrifice"; // già gestito prima di arrivare qui
  var score = s.stats.operai + s.stats.maria;
  if (s.flags.declared_mediator) score += 15;
  if (s.flags.warned_workers) score += 15;
  if (s.flags.tutti_salvi) score += 40;
  else if (s.flags.alcuni_persi) score += 5;
  else if (s.flags.molti_persi) score -= 35;

  if (s.flags.tutti_salvi && s.flags.warned_workers && s.flags.declared_mediator && s.stats.maria >= 60) return "s_end_best";
  if (s.flags.molti_persi || s.stats.operai < 25) return "s_end_dark";
  if (s.flags.alcuni_persi) return "s_end_bittersweet";
  if (score >= 90) return "s_end_true";
  return "s_end_bittersweet";
}

/* ------------------------------ Rendering ------------------------------ */

var activeTab = "storia";

function getScene(id){ return SCENES[id]; }

function textOf(scene, s){
  var t = typeof scene.text === "function" ? scene.text(s) : scene.text;
  return t || [];
}

function applyOnEnter(id){
  var scene = getScene(id);
  if (scene && scene.onEnter && state.enteredScenes.indexOf(id) === -1){
    scene.onEnter(state);
  }
  if (state.enteredScenes.indexOf(id) === -1){
    state.enteredScenes.push(id);
    state.history.push(id);
  }
  if (scene && scene.ending){
    state.ending = id;
  }
  checkAchievements();
  saveState();
}

function choose(choiceIdx){
  var scene = getScene(state.currentScene);
  var visible = visibleChoices(scene);
  var choice = visible[choiceIdx];
  if (!choice) return;
  clickSound();
  if (choice.effect) choice.effect(state);
  var next = typeof choice.next === "function" ? choice.next(state) : choice.next;
  if (next === "MENU"){
    try { localStorage.removeItem(SAVE_KEY); } catch(e){}
    state = null;
    render();
    return;
  }
  state.currentScene = next;
  applyOnEnter(next);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function visibleChoices(scene){
  return (scene.choices || []).filter(function(c){ return !c.requires || c.requires(state); });
}

function statBar(label, value, cls){
  return '<div class="stat-row"><div class="lbl"><span>'+label+'</span><span>'+value+'</span></div>' +
    '<div class="bar '+(cls||"")+'"><span style="width:'+value+'%"></span></div></div>';
}

function renderSidebar(){
  var s = state.stats;
  var html = '<div class="panel">';
  html += '<h3 style="font-size:0.95em;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);">Stato di Freder</h3>';
  html += statBar("Fiducia degli operai", s.operai, "trust");
  html += statBar("Rapporto col padre", s.padre, "");
  html += statBar("Legame con Maria", s.maria, "trust");
  html += statBar("Sospetto sulla verità", s.sospetto, "");
  html += statBar("Salute", s.salute, s.salute < 35 ? "danger" : "");
  html += '</div>';

  html += '<div class="panel">';
  html += '<h3 style="font-size:0.95em;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);">Inventario</h3>';
  if (state.inventory.length === 0){
    html += '<div class="inv-empty">Ancora nulla in tasca.</div>';
  } else {
    html += '<div class="inv-grid">';
    state.inventory.forEach(function(id){
      var it = ITEMS[id];
      html += '<div class="inv-item" title="'+it.name+'">'+it.icon+'</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="panel">';
  html += '<h3 style="font-size:0.95em;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);">Ambiente sonoro</h3>';
  html += '<button class="btn wide" onclick="MetropolisGame.toggleAudio()">'+(audioOn ? "🔇 Ferma il ronzio delle macchine" : "🔊 Attiva il ronzio delle macchine")+'</button>';
  html += '<p class="small muted" style="margin-top:0.6em;">Drone industriale sintetizzato via Web Audio — nessun file audio esterno, nessuna colonna sonora originale del film.</p>';
  html += '</div>';

  return html;
}

function renderStoria(){
  var scene = getScene(state.currentScene);
  if (!scene) return '<div class="panel">Errore di scena.</div>';
  var html = "";
  if (scene.intertitle){
    var ch = CHAPTERS.filter(function(c){ return c.n === scene.chapterNum; })[0];
    html += '<div class="intertitle"><div class="num">Capitolo '+(ch?ch.n:"")+'</div><h2>'+(ch?ch.title:"")+'</h2></div>';
  }
  html += '<div class="panel">';
  if (!scene.intertitle){
    var chap = chapterFor(state.currentScene);
    html += '<div class="scene-tag">Capitolo '+chap.n+' — '+chap.title+'</div>';
  }
  html += '<div class="scene-text">';
  textOf(scene, state).forEach(function(p){ html += "<p>"+p+"</p>"; });
  html += '</div>';

  if (scene.ending){
    html += '<div class="ending-badge">Finale raggiunto</div>';
  }

  var visible = visibleChoices(scene);
  html += '<div class="choices">';
  visible.forEach(function(c, i){
    html += '<button class="btn" onclick="MetropolisGame.choose('+i+')">'+c.label+'</button>';
  });
  html += '</div>';
  html += '</div>';
  return html;
}

function renderInventario(){
  var html = '<div class="panel"><h2>Inventario</h2>';
  if (state.inventory.length === 0){
    html += '<p class="muted">Non hai ancora raccolto nulla in questa storia.</p>';
  } else {
    html += '<div class="item-list">';
    state.inventory.forEach(function(id){
      var it = ITEMS[id];
      html += '<div class="item-entry"><div class="icon">'+it.icon+'</div><div><div class="name">'+it.name+'</div><div class="desc">'+it.desc+'</div></div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderDiario(){
  var html = '<div class="panel"><h2>Diario di viaggio</h2>';
  var seenChapters = [];
  state.history.forEach(function(id){
    var ch = chapterFor(id);
    if (seenChapters.indexOf(ch.n) === -1) seenChapters.push(ch.n);
  });
  CHAPTERS.forEach(function(ch){
    if (seenChapters.indexOf(ch.n) === -1) return;
    html += '<div class="diary-entry"><div class="ch-num">Capitolo '+ch.n+'</div><div>'+ch.title+'</div></div>';
  });
  html += '<p class="muted small" style="margin-top:1em;">Finali visti finora: '+meta.endingsSeen.length+' / 5</p>';
  html += '</div>';
  return html;
}

function renderAchievements(){
  var html = '<div class="panel"><h2>Achievement</h2><div class="ach-list">';
  Object.keys(ACHIEVEMENTS).forEach(function(id){
    var a = ACHIEVEMENTS[id];
    var unlocked = meta.achievements.indexOf(id) !== -1;
    html += '<div class="ach '+(unlocked?"":"locked")+'"><div class="icon">'+(unlocked ? a.icon : "🔒")+'</div>' +
      '<div><div class="name">'+a.name+'</div><div class="desc">'+(unlocked ? a.desc : "Non ancora sbloccato.")+'</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function renderImpostazioni(){
  var html = '<div class="panel"><h2>Salvataggio</h2>';
  html += '<p class="muted small">La partita si salva automaticamente nel browser dopo ogni scelta. Puoi anche esportarla o importarla come file JSON.</p>';
  html += '<div class="row">';
  html += '<button class="btn" onclick="MetropolisGame.exportSave()">⬇️ Esporta partita</button>';
  html += '<button class="btn" onclick="MetropolisGame.triggerImport()">⬆️ Importa partita</button>';
  html += '<input type="file" id="importFile" accept="application/json" style="display:none" onchange="MetropolisGame.importSave(event)">';
  html += '<button class="btn" style="border-color:var(--critical);" onclick="MetropolisGame.resetGame()">♻️ Ricomincia da capo</button>';
  html += '</div>';
  html += '<textarea class="savebox" id="saveOut" readonly placeholder="Il JSON della partita esportata comparirà qui"></textarea>';
  html += '</div>';

  html += '<div class="panel"><h2>Informazioni</h2>';
  html += '<p class="small">Metropolis (1927) di Fritz Lang è oggi di pubblico dominio negli Stati Uniti; in altri paesi la durata del copyright sulle opere cinematografiche può essere diversa (nell\'Unione Europea, ad esempio, dura fino a 70 anni dopo la morte dell\'ultimo autore superstite). Questo è un gioco di finzione originale, liberamente ispirato alla trama e all\'estetica Art Déco / Espressionista del film: non riproduce alcun fotogramma, dialogo originale, la colonna sonora di Gottfried Huppertz, né il logo ufficiale di alcuno studio o restauro. Il trattamento grafico del titolo è opera originale.</p>';
  html += '</div>';
  return html;
}

function render(){
  var app = document.getElementById("app");
  if (!state){
    app.innerHTML = renderBoot();
    return;
  }
  var chap = chapterFor(state.currentScene);
  var html = '<div class="game-wrap active">';
  html += '<header class="gamehead"><div class="title">Metropolis — Il Mediatore</div>' +
    '<div class="chapter-tag">Capitolo '+chap.n+' di 12 — '+chap.title+'</div></header>';

  html += '<nav class="tabs">';
  [["storia","Storia"],["inventario","Inventario"],["diario","Diario"],["achievement","Achievement"],["impostazioni","Impostazioni"]].forEach(function(t){
    html += '<button class="'+(activeTab===t[0]?"active":"")+'" onclick="MetropolisGame.setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  html += '</nav>';

  html += '<div class="layout"><div class="main">';
  if (activeTab === "storia") html += renderStoria();
  else if (activeTab === "inventario") html += renderInventario();
  else if (activeTab === "diario") html += renderDiario();
  else if (activeTab === "achievement") html += renderAchievements();
  else if (activeTab === "impostazioni") html += renderImpostazioni();
  html += '</div><div class="sidebar">'+renderSidebar()+'</div></div>';

  html += '<div class="footer-note">Metropolis — Il Mediatore · fan game non ufficiale ispirato al film del 1927 · nessun dato lascia mai questo browser</div>';
  html += '</div>';

  html += renderToasts();

  app.innerHTML = html;
  flushToasts();
}

function renderToasts(){
  if (toastQueue.length === 0) return "";
  var html = '<div class="toast-wrap">';
  toastQueue.forEach(function(id){
    var a = ACHIEVEMENTS[id];
    html += '<div class="toast"><div class="t-head">Achievement sbloccato</div><div>'+a.icon+' <strong>'+a.name+'</strong></div></div>';
  });
  html += '</div>';
  return html;
}
function flushToasts(){
  if (toastQueue.length === 0) return;
  setTimeout(function(){ toastQueue = []; render(); }, 3200);
}

function renderBoot(){
  var hasSave = !!loadState();
  var html = '<div class="boot">';
  html += '<div class="cog">⚙</div>';
  html += '<h1>Metropolis</h1>';
  html += '<div class="sub">Il Mediatore</div>';
  html += '<p class="tagline">Un\'avventura narrativa a scelte multiple, liberamente ispirata al film del 1927 di Fritz Lang.</p>';
  html += '<div class="boot-frame">';
  html += '<div class="boot-actions">';
  html += '<button class="btn primary wide" onclick="MetropolisGame.newGame()">Nuova Partita</button>';
  if (hasSave) html += '<button class="btn wide" onclick="MetropolisGame.continueGame()">Continua</button>';
  html += '<button class="btn wide ghost" onclick="MetropolisGame.showAchievementsFromMenu()">Achievement ('+meta.achievements.length+' / '+Object.keys(ACHIEVEMENTS).length+')</button>';
  html += '</div></div>';
  html += '<div class="disclaimer">Fan game non ufficiale. <em>Metropolis</em> (1927, Fritz Lang) è di pubblico dominio negli Stati Uniti; il regime di copyright può variare altrove. Nessun fotogramma, musica originale o logo ufficiale viene riprodotto: trama e ambientazione sono reinterpretate liberamente, il titolo è un trattamento grafico originale.</div>';
  html += '</div>';
  return html;
}

/* ------------------------------- API pubblica --------------------------- */

var showingAchFromMenu = false;

window.MetropolisGame = {
  newGame: function(){
    state = freshState();
    applyOnEnter(state.currentScene);
    activeTab = "storia";
    render();
  },
  continueGame: function(){
    state = loadState() || freshState();
    activeTab = "storia";
    render();
  },
  choose: choose,
  setTab: function(t){ activeTab = t; render(); },
  toggleAudio: toggleAmbient,
  exportSave: function(){
    var box = document.getElementById("saveOut");
    if (box) box.value = JSON.stringify(state, null, 2);
  },
  triggerImport: function(){
    var input = document.getElementById("importFile");
    if (input) input.click();
  },
  importSave: function(evt){
    var file = evt.target.files && evt.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var loaded = JSON.parse(e.target.result);
        if (loaded && loaded.stats && loaded.currentScene){
          state = loaded;
          saveState();
          render();
        }
      } catch(err){ /* file non valido, ignorato */ }
    };
    reader.readAsText(file);
  },
  resetGame: function(){
    if (window.confirm("Ricominciare da capo? La partita in corso andrà persa (gli achievement restano salvati).")){
      state = freshState();
      saveState();
      activeTab = "storia";
      render();
    }
  },
  showAchievementsFromMenu: function(){
    state = state || freshState();
    activeTab = "achievement";
    render();
  }
};

/* -------------------------------- Avvio --------------------------------- */

meta = loadMeta() || freshMeta();
state = null; // mostra il frontespizio; l'utente sceglie Nuova Partita o Continua
render();

})();
</script>
