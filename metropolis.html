<meta name="description" content="Avventura narrativa a scelte multiple liberamente ispirata al film Metropolis (1927) di Fritz Lang. Interamente client-side, nessuna AI esterna, nessuna chiave API, nessuna connessione di rete necessaria.">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #16151a;
    --panel-2: #1e1c22;
    --border: #3a362c;
    --text: #e9e5d8;
    --text-dim: #9c9686;
    --gold: #c9a227;
    --gold-soft: rgba(201,162,39,0.14);
    --good: #7c9473;
    --warning: #c98a3b;
    --critical: #a13a2e;
    --critical-soft: rgba(161,58,46,0.18);
    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 10px 28px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,39,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  ::selection { background: var(--gold-soft); }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0.03em; margin: 0 0 0.4em; }
  p { line-height: 1.65; margin: 0 0 1em; }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--gold); }

  #app { max-width: 1100px; margin: 0 auto; padding: 1.1rem 1rem 4rem; }

  .muted { color: var(--text-dim); font-size: 0.85em; }
  .small { font-size: 0.82em; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.65em 1.1em; font-size: 0.95em; box-shadow: var(--shadow);
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    text-align: left;
  }
  .btn:hover:not(:disabled) { border-color: var(--gold); background: #24222a; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.primary { background: var(--gold); color: #14120e; border-color: var(--gold); font-weight: bold; }
  .btn.primary:hover { background: #ddb640; }
  .btn.ghost { background: transparent; }
  .btn.tiny { padding: 0.2em 0.65em; font-size: 0.82em; }
  .btn.wide { display: block; width: 100%; }
  .link { background: none; border: none; color: var(--gold); text-decoration: underline; padding: 0; font-size: 0.9em; }

  /* ---------- Frontespizio / menu ---------- */
  .boot { max-width: 640px; margin: 3rem auto 2rem; text-align: center; }
  .boot .cog { font-size: 2.4rem; opacity: 0.7; display: inline-block; animation: spin 18s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .boot h1 {
    font-size: 3.1rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold);
    text-shadow: 0 0 18px rgba(201,162,39,0.35);
    margin: 0.3em 0 0.1em;
  }
  .boot .sub { color: var(--text-dim); font-style: italic; letter-spacing: 0.05em; }
  .boot .tagline { color: var(--text-dim); margin-top: 1em; }
  .boot-actions { display: flex; flex-direction: column; gap: 0.6em; align-items: stretch; max-width: 380px; margin: 1.6em auto 0; }
  .boot-frame { border: 1px solid var(--border); border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold); padding: 1.6rem 1.2rem; background: var(--panel); }
  .disclaimer { max-width: 640px; margin: 1.6rem auto 0; font-size: 0.78em; color: var(--text-dim); border: 1px dashed var(--border); padding: 0.9em 1.1em; text-align: left; }

  /* ---------- Layout di gioco ---------- */
  .game-wrap { display: none; }
  .game-wrap.active { display: block; }
  header.gamehead {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    border-bottom: 1px solid var(--border); padding-bottom: 0.7em; margin-bottom: 1em; flex-wrap: wrap;
  }
  header.gamehead .title { font-size: 1.15rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  header.gamehead .chapter-tag { color: var(--text-dim); font-size: 0.82em; }
  nav.tabs { display: flex; gap: 0.4em; flex-wrap: wrap; margin-bottom: 1em; }
  nav.tabs button { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); padding: 0.45em 0.9em; border-radius: 999px; font-size: 0.85em; }
  nav.tabs button.active { border-color: var(--gold); color: var(--gold); }

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.2rem; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.3rem 1.4rem; box-shadow: var(--shadow); }

  .intertitle { text-align: center; padding: 2.2rem 1rem; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); background: #0e0d10; }
  .intertitle .num { color: var(--text-dim); letter-spacing: 0.3em; font-size: 0.75em; text-transform: uppercase; }
  .intertitle h2 { font-size: 1.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-top: 0.3em; }

  .scene-tag { color: var(--gold); font-size: 0.72em; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.6em; }
  .scene-text p:first-of-type { }
  .scene-text p::first-letter { font-size: 1.5em; color: var(--gold); }

  .choices { display: flex; flex-direction: column; gap: 0.6em; margin-top: 1.4em; }

  .sidebar { display: flex; flex-direction: column; gap: 1rem; }
  .stat-row { margin-bottom: 0.7em; }
  .stat-row .lbl { display: flex; justify-content: space-between; font-size: 0.78em; color: var(--text-dim); margin-bottom: 0.25em; }
  .bar { height: 7px; background: #26242a; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ddb640); }
  .bar.danger > span { background: linear-gradient(90deg, var(--critical), #c9503f); }
  .bar.trust > span { background: linear-gradient(90deg, var(--good), #9cb891); }

  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 0.4em; }
  .inv-item { border: 1px solid var(--border); border-radius: 4px; background: var(--panel-2); font-size: 1.3rem; text-align: center; padding: 0.4em 0; cursor: default; }
  .inv-empty { color: var(--text-dim); font-size: 0.82em; }

  .ach-list, .item-list { display: flex; flex-direction: column; gap: 0.7em; }
  .ach, .item-entry { display: flex; gap: 0.7em; align-items: flex-start; border: 1px solid var(--border); border-radius: 5px; padding: 0.6em 0.8em; background: var(--panel-2); }
  .ach.locked { opacity: 0.4; }
  .ach .icon, .item-entry .icon { font-size: 1.4rem; }
  .ach .name, .item-entry .name { font-weight: bold; color: var(--gold); }
  .ach .desc, .item-entry .desc { font-size: 0.85em; color: var(--text-dim); }

  .toast-wrap { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 0.5em; z-index: 50; max-width: 300px; }
  .toast { background: #1c1a14; border: 1px solid var(--gold); border-radius: 5px; padding: 0.6em 0.9em; box-shadow: var(--shadow); animation: fadeIn 0.25s ease; font-size: 0.85em; }
  .toast .t-head { color: var(--gold); font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px);} to { opacity:1; transform: translateY(0);} }

  .diary-entry { border-left: 2px solid var(--gold); padding-left: 0.8em; margin-bottom: 0.9em; }
  .diary-entry .ch-num { color: var(--text-dim); font-size: 0.75em; letter-spacing: 0.1em; text-transform: uppercase; }

  .footer-note { text-align: center; color: var(--text-dim); font-size: 0.75em; margin-top: 2rem; }
  .row { display: flex; gap: 0.6em; flex-wrap: wrap; }
  textarea.savebox { width: 100%; min-height: 90px; background: #0e0d10; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0.6em; font-size: 0.75em; }
  .ending-badge { display: inline-block; margin-top: 1em; padding: 0.4em 0.9em; border: 1px solid var(--gold); border-radius: 999px; color: var(--gold); font-size: 0.8em; letter-spacing: 0.08em; text-transform: uppercase; }
  .minigame-box { text-align: center; padding: 2rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: #0e0d10; margin-top: 1.2em; }
  .minigame-box .btn.primary { animation: pulse 0.6s ease infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 rgba(201,162,39,0.5);} to { box-shadow: 0 0 16px rgba(201,162,39,0.6);} }

  .qte-target { font-size: 2.6rem; min-height: 1.3em; margin-bottom: 0.7em; }
  .qte-target.dim { opacity: 0.25; }
  .qte-buttons { display: flex; align-items: center; justify-content: center; gap: 0.8em; flex-wrap: wrap; }
  .qte-opt { font-size: 1.7rem; padding: 0.5em 0.85em; line-height: 1; }

  .poster-svg { display: block; margin: 0 auto 0.8em; width: 100%; max-width: 260px; height: auto; }
  .carousel { text-align: center; min-height: 3.6em; margin: 0 0 1.2em; }
  .carousel .cs-title { color: var(--gold); font-weight: bold; letter-spacing: 0.05em; margin-bottom: 0.2em; }
  .carousel .cs-text { color: var(--text-dim); font-size: 0.82em; }
  .carousel .cs-dots { margin-top: 0.5em; }
  .carousel .cs-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--border); margin: 0 3px; }
  .carousel .cs-dot.active { background: var(--gold); }

  @keyframes sceneFade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
  .scene-panel { animation: sceneFade 0.4s ease; }
  .intertitle { animation: sceneFade 0.5s ease; }

  .map-wrap { margin-top: 0.8em; }
  .map-svg { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 6px; background: #0a0908; }
  .map-svg text { font-family: Georgia, serif; }
</style>
</head>

function chapterFor(sceneId){
  var idx = -1;

var state = null;
var meta = null;
var toastQueue = [];
var audioCtx = null;
var ambientNodes = null;
var audioOn = false;

function loadState(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveState(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadMeta(){
  try {
    var raw = localStorage.getItem(META_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveMeta(){
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e){}
}

function grantItem(id){
  if (state.inventory.indexOf(id) === -1) state.inventory.push(id);
}
var chimeQueueIndex = 0;

function grantAchievement(id){
  if (meta.achievements.indexOf(id) === -1) {
    meta.achievements.push(id);
    toastQueue.push({ type: "achievement", id: id });
    // Se più achievement scattano nello stesso istante (capita spesso
    // arrivando a un finale), suonarli tutti insieme produce un grappolo
    // dissonante che suona "rotto". Li scaglioniamo di poco.
    var delay = chimeQueueIndex * 280;
    chimeQueueIndex++;
    setTimeout(chimeSound, delay);
    saveMeta();
  }
}

function useItem(id){
  var it = ITEMS[id];
  if (!it || !it.use) return;
  if (it.consumable){
    if (it.use.effect) it.use.effect(state);
    state.inventory = state.inventory.filter(function(x){ return x !== id; });
  } else {
    if (it.use.once && state.flags["used_" + id]) return;
    state.flags["used_" + id] = true;
    state.flags["note_" + id] = it.use.text;
    if (it.use.achievement) grantAchievement(it.use.achievement);
  }
  toastQueue.push({ type: "message", icon: it.icon, text: it.use.text });
  clickSound();
  checkAchievements();
  saveState();
  render();
}

function checkAchievements(){
  chimeQueueIndex = 0;
  var s = state.stats, f = state.flags, inv = state.inventory;
  if (f.risveglio_seen) grantAchievement("risveglio");
  if (f.swapped) grantAchievement("numero_11811");
  if (f.declared_mediator) grantAchievement("mediatore_dichiarato");
  if (inv.indexOf("medaglione_maria") !== -1) grantAchievement("promessa_buio");
  if (inv.indexOf("schema_robot") !== -1) grantAchievement("segreto_rotwang");
  if (f.fever_survived) grantAchievement("incubo_babilonia");
  if (s.operai >= 90) grantAchievement("amico_operai");
  if (f.vera_natura_seen) grantAchievement("vera_natura");
  if (f.tutti_salvi) grantAchievement("bambini_salvi");
  if (f.molti_persi) grantAchievement("prezzo_ignoranza");
  if (f.duel_clean || f.duel_wounded) grantAchievement("duello_cattedrale");
  if (f.read_garden_book) grantAchievement("presagio");
  if (f.defied_father) grantAchievement("sfidante");
  if (f.tried_to_flee) grantAchievement("fuga_impossibile");
  if (f.visited_yoshiwara) grantAchievement("ballo_ricchi");
  if (f.shift_precise) grantAchievement("ritmo_macchina");
  if (f.pre_warned_grot && f.pre_alerted) grantAchievement("rete_allarme");
  var allItems = Object.keys(ITEMS);
  var hasAll = allItems.every(function(id){ return inv.indexOf(id) !== -1; });
  if (hasAll) grantAchievement("collezionista");
  if (state.ending){
    if (meta.endingsSeen.indexOf(state.ending) === -1){
      meta.endingsSeen.push(state.ending);
      saveMeta();
    }
    if (state.ending === "s_end_true") grantAchievement("finale_cuore");
    if (state.ending === "s_end_best") grantAchievement("finale_alba");
    if (state.ending === "s_end_dark") grantAchievement("finale_ombra");
    if (state.ending === "s_end_sacrifice") grantAchievement("finale_sacrificio");
    if (state.ending === "s_end_bittersweet") grantAchievement("finale_agrodolce");
    var allEnd = ["s_end_true","s_end_best","s_end_dark","s_end_sacrifice","s_end_bittersweet"];
    if (allEnd.every(function(e){ return meta.endingsSeen.indexOf(e) !== -1; })) grantAchievement("cinque_finali");
  }
}

/* ------------------------------- Audio --------------------------------- */

var masterBus = null;

function ensureAudio(){
  if (!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    // Tutti i suoni passano da qui invece che direttamente su destination:
    // senza un limitatore condiviso, due o più suoni che partono nello
    // stesso istante (es. più achievement sbloccati insieme, o il click di
    // una scelta che coincide con lo sting di un finale) si sommano e
    // possono superare 0dB, producendo clipping/distorsione udibile —
    // il "sfx buggato" che si sente quando capitano più eventi vicini.
    masterBus = audioCtx.createDynamicsCompressor();
    masterBus.threshold.value = -20;
    masterBus.knee.value = 14;
    masterBus.ratio.value = 8;
    masterBus.attack.value = 0.002;
    masterBus.release.value = 0.18;
    masterBus.connect(audioCtx.destination);
  }
  // Molti browser creano/lasciano il contesto in stato "suspended" finché non
  // viene esplicitamente ripreso dentro un gesto dell'utente: senza questa
  // riga i suoni vengono schedulati ma non si sentono mai.
  if (audioCtx.state === "suspended"){
    audioCtx.resume().catch(function(){});
  }
  return audioCtx;
}

// Sblocca l'audio al primo tocco/click ovunque sulla pagina, così anche il
// primo suono di scelta (non solo il drone ambientale) risulta udibile.
document.addEventListener("pointerdown", function(){ ensureAudio(); }, { passive: true });

function toggleAmbient(){
  var ctx = ensureAudio();
  if (!ctx) return;
  if (audioOn){
    if (ambientNodes){
      ambientNodes.oscillators.forEach(function(n){ try{ n.stop(); }catch(e){} });
      try { ambientNodes.master.disconnect(); } catch(e){}
      ambientNodes = null;
    }
    audioOn = false;
  } else {
    var master = ctx.createGain();
    master.gain.value = 0.05;
    master.connect(masterBus);
    var oscillators = [];
    [55, 82.5, 110].forEach(function(freq, i){
      var osc = ctx.createOscillator();
      osc.type = i === 1 ? "sawtooth" : "sine";
      osc.frequency.value = freq;
      var g = ctx.createGain();
      g.gain.value = i === 0 ? 1 : 0.35;
      osc.connect(g); g.connect(master);
      osc.start();
      oscillators.push(osc);
    });
    var lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(master.gain);
    lfo.start();
    oscillators.push(lfo);
    ambientNodes = { master: master, oscillators: oscillators };
    audioOn = true;
  }
  render();
}

function clickSound(){
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = ctx.currentTime;
  // Scatto metallico (clic della leva)
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(280, t);
  osc.frequency.exponentialRampToValueAtTime(85, t + 0.13);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  osc.connect(g); g.connect(masterBus);
  osc.start(t); osc.stop(t + 0.17);
  // Colpo grave sotto (il peso della macchina)
  var thunk = ctx.createOscillator();
  var tg = ctx.createGain();
  thunk.type = "sine";
  thunk.frequency.setValueAtTime(75, t);
  thunk.frequency.exponentialRampToValueAtTime(40, t + 0.2);
  tg.gain.setValueAtTime(0.0001, t);
  tg.gain.exponentialRampToValueAtTime(0.2, t + 0.01);
  tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  thunk.connect(tg); tg.connect(masterBus);
  thunk.start(t); thunk.stop(t + 0.23);
}

function chimeSound(){
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach(function(freq, i){
    var start = t + i * 0.1;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.15, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
    osc.connect(g); g.connect(masterBus);
    osc.start(start); osc.stop(start + 0.55);
  });
}

function endingSting(mood){
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = ctx.currentTime;
  var chords = {
    good: [261.63, 329.63, 392.00, 523.25],
    bad: [207.65, 246.94, 293.66],
    mixed: [246.94, 293.66, 349.23, 415.30]
  };
  var freqs = chords[mood] || chords.mixed;
  freqs.forEach(function(freq){
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    osc.connect(g); g.connect(masterBus);
    osc.start(t); osc.stop(t + 2.5);
  });
}

function qteFeedbackSound(hit){
  var ctx = ensureAudio();
  if (!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = hit ? "triangle" : "sawtooth";
  osc.frequency.setValueAtTime(hit ? 440 : 160, t);
  osc.frequency.exponentialRampToValueAtTime(hit ? 660 : 90, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(hit ? 0.12 : 0.14, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  osc.connect(g); g.connect(masterBus);
  osc.start(t); osc.stop(t + 0.19);
}

      "«Il turno dura dieci ore» ti avverte, mentre si toglie la tuta. «Alla macchina degli orologi, non alle macchine con cui hai giocato tu.» Indossi la sua uniforme grigia. Per la prima volta in vita tua, nessuno ti guarda come il figlio di Joh Fredersen."
    ],
    onEnter: function(s){ s.flags.swapped = true; grantItem("tuta_11811"); grantItem("orologio_dieci_ore"); },
    choices: [ { label: "Prendi il tuo posto sulla linea", next: "s_shift" } ]
  },

  s_shift: {
    chapterNum: 4,
    text: [
      "La macchina davanti a te è un enorme quadrante con due lancette di ottone incandescente: quando la spia si accende di verde, devi colpire la leva nell'istante esatto, sincronizzato al ritmo della macchina. Troppo presto o troppo tardi, e sono i tuoi muscoli a pagarne il prezzo.",
      "Non è lavoro: è un metronomo che ti usa come pendolo, per dieci ore di fila. A te, cinque colpi bastano e avanzano per capirlo."
    ],
    minigame: "shift",
    onRendered: function(){ if (!shiftGame) initShiftGame(); }
  },

  s_shift_paper: {
    text: function(s){
      var intro;
      if (s.flags.shift_precise) intro = "Prendi il ritmo della macchina quasi subito: ogni colpo cade dove deve, come se il tuo corpo avesse sempre saputo farlo. Gli altri operai intorno a te se ne accorgono, e qualcuno annuisce appena.";
      else if (s.flags.shift_clumsy) intro = "Sbagli il tempo più di una volta: le braccia bruciano, i colpi arrivano storti, e un sorvegliante ti osserva a lungo senza dire nulla. Alla fine del turno, ti fanno male muscoli che non sapevi nemmeno di avere.";
      else intro = "Il ritmo della macchina è brutale ma, colpo dopo colpo, riesci a reggerlo quanto basta per non farti notare.";
      return [
        intro,
        "A un certo punto, mentre ti pieghi in due dallo sforzo, un foglietto piegato scivola dalla tasca della tuta che indossi: una mappa disegnata a mano, con un simbolo che non riconosci."
      ];
    },
    choices: [
      { label: "Nascondi il foglio e resisti fino alla fine del turno", effect: function(s){ grantItem("mappa_catacombe"); }, next: "s_collapse" },
      { label: "Fermati subito a leggerlo, rischiando una punizione", effect: function(s){ grantItem("mappa_catacombe"); s.stats.salute = clamp(s.stats.salute - 10); }, next: "s_collapse" }
    ]
  },

  s_collapse: {
    text: [
      "Quando finalmente la sirena libera il turno, le gambe ti cedono. Crolli contro il quadrante, e per un momento non senti più nulla — non il rumore, non il dolore, nemmeno la paura.",
      "Una mano ti solleva. È Josaphat, che ti ha seguito di nascosto fin qui, come promesso. «Ora capisci» ti dice piano «perché quella donna parla ai bambini di fratelli.»",
      "Un altro operaio, passandoti accanto, ti sussurra un'ora e un luogo: stanotte, nelle vecchie catacombe sotto la città."
    ],
    choices: [ { label: "Hai ancora qualche ora prima del buio: guardati intorno", next: "s_worker_district_hub" } ]
  },

  s_worker_district_hub: {
    text: [
      "Il quartiere degli operai si stende sotto la città vera e propria: file di case basse e identiche, corridoi di lamiera, un cielo che qui non si è mai visto."
    ],
    choices: [
      { requires: function(s){ return !s.flags.visited_district_kitchen; }, label: "Entra nella cucina comune, da cui viene odore di minestra", next: "s_district_kitchen" },
      { requires: function(s){ return !s.flags.visited_district_graffiti; }, label: "Osserva una scritta tracciata col gesso su un muro", next: "s_district_graffiti" },
      { requires: function(s){ return !s.flags.visited_district_rumor; }, label: "Ascolta due operai che parlano sottovoce vicino a un fornello", next: "s_district_rumor" },
      { label: "È ora: scendi verso le catacombe", next: "s_catacombs" }
    ]
  },

  s_district_kitchen: {
    text: [
      "Una famiglia condivide un'unica scodella di minestra tra cinque persone, senza lamentarsi, come se fosse la cosa più normale del mondo. Quando si accorgono che li guardi, ti offrono comunque un cucchiaio.",
      "Rifiuti, imbarazzato, ma accetti di sederti un momento con loro. Nessuno ti chiede chi sei davvero: qui, vestito così, sei solo un altro numero stanco."
    ],
    onEnter: function(s){ s.flags.visited_district_kitchen = true; s.stats.operai = clamp(s.stats.operai + 6); grantItem("cibo_operaio"); },
    choices: [ { label: "Ringrazia e continua a guardarti intorno", next: "s_worker_district_hub" } ]
  },

  s_district_graffiti: {
    text: [
      "Sul muro scrostato, qualcuno ha tracciato col gesso la parola «MOLOCH» e sotto, in una colonna fitta, decine e decine di piccoli segni verticali — un conteggio che nessuno ha mai reso ufficiale.",
      "Non serve chiedere cosa contino. Lo sai già."
    ],
    onEnter: function(s){ s.flags.visited_district_graffiti = true; s.stats.sospetto = clamp(s.stats.sospetto + 5); },
    choices: [ { label: "Allontanati in silenzio", next: "s_worker_district_hub" } ]
  },

  s_district_rumor: {
    text: [
      "«...luci accese tutta la notte, dietro casa sua» sta dicendo un operaio anziano a un altro, più giovane. «E rumori che non sono di nessuna macchina che io conosca.»",
      "«La casa di chi?» chiede il giovane. «Dell'inventore. Quello con la stella sopra la porta» risponde l'anziano, abbassando ulteriormente la voce quando si accorge che sei lì vicino."
    ],
    onEnter: function(s){ s.flags.visited_district_rumor = true; s.stats.sospetto = clamp(s.stats.sospetto + 5); },
    choices: [ { label: "Fingi di non aver sentito nulla", next: "s_worker_district_hub" } ]
  },

  s_catacombs: {
    chapterNum: 5,
    text: [
      "Segui una fila silenziosa di operai in una galleria scavata secoli fa, tra pareti di teschi e croci di legno consumate dal tempo. Centinaia di candele tremano nel buio.",
      "Al centro, in piedi su un blocco di pietra, c'è lei: Maria. Racconta agli operai la storia della Torre di Babele — costruita da una Testa che sognava di toccare le stelle, con le Mani di migliaia di uomini che quel sogno non lo condividevano affatto. La Torre cadde non per l'ira di un dio, ma per l'odio tra chi l'aveva pensata e chi l'aveva costruita con il proprio sudore.",
      "«Serve un Mediatore» conclude, con la voce che trema di speranza più che di rabbia. «Il Mediatore fra la Testa e le Mani deve essere il Cuore.» Il tuo cuore batte come se quelle parole fossero rivolte solo a te."
    ],
    choices: [
      { label: "Alzati davanti a tutti: «Il Mediatore sono io»", effect: function(s){ s.stats.maria = clamp(s.stats.maria + 20); s.flags.declared_mediator = true; }, next: "s_meeting_maria" },
      { label: "Resta in silenzio, ma avvicinati a lei quando la folla si dirada", effect: function(s){ s.stats.maria = clamp(s.stats.maria + 10); }, next: "s_meeting_maria" }
    ]
  },

  s_meeting_maria: {
    text: function(s){
      var open = s.flags.declared_mediator
        ? "Quando restate soli tra le candele che si spengono, Maria ti osserva a lungo, come se stesse ancora decidendo se le parole che hai gridato davanti a tutti fossero coraggio o solo entusiasmo passeggero. «Sei davvero il figlio di Fredersen» dice, non come un'accusa, ma come una constatazione carica di conseguenze."
        : "Quando restate soli tra le candele che si spengono, Maria si avvicina a te con una curiosità silenziosa, come se cercasse di capire perché sei rimasto in silenzio mentre tutti gli altri gridavano. «Sei davvero il figlio di Fredersen» dice, non come un'accusa, ma come una constatazione carica di conseguenze.";
      return [
        open,
        "Si toglie dal collo un piccolo medaglione con inciso una spiga di grano e te lo mette in mano. «Se qualcuno dovesse mai dubitare che sono io» dice «chiedigli di questo.»"
      ];
    },
    onEnter: function(s){ grantItem("medaglione_maria"); },
    choices: [
      { label: "Chiedile di fuggire via con te, stanotte stessa, lontano da tutto questo", next: "s_meeting_maria_flee" },
      { label: "Prometti di tornare, e di continuare a cercare la verità insieme a lei", effect: function(s){ s.stats.maria = clamp(s.stats.maria + 5); s.flags.stayed_loyal = true; }, next: "s_meeting_maria_promise" }
    ]
  },

  s_meeting_maria_promise: {
    text: [
      "Vi promettete di rivedervi. Mentre risali verso la superficie, non sai ancora che qualcuno vi ha seguiti nell'ombra per tutta la notte."
    ],
    choices: [ { label: "Torna a casa, con la mente piena di lei", next: "s_spy_report" } ]
  },

  s_meeting_maria_flee: {
    text: [
      "Per un istante, mentre lo dici, ci credi davvero: potreste sparire insieme, lasciare Metropolis, i suoi ingranaggi e le sue promesse a qualcun altro. Maria ti guarda con una tenerezza che non ti aspettavi, e per un attimo sembra tentata.",
      "Poi scuote la testa, piano. «Non posso abbandonarli, nemmeno per te» dice, indicando con un gesto le candele che si spengono, i bambini addormentati contro le pareti di roccia. «E se sei davvero chi dici di essere, nemmeno tu potresti.»",
      "Ha ragione, e lo sai. Vi promettete comunque di rivedervi. Mentre risali verso la superficie, non sai ancora che qualcuno vi ha seguiti nell'ombra per tutta la notte."
    ],
    onEnter: function(s){ s.flags.tried_to_flee = true; },
    choices: [ { label: "Torna a casa, con la mente piena di lei", next: "s_spy_report" } ]
  },

  s_spy_report: {
    chapterNum: 6,
    text: [
      "Quella notte, un uomo magro e silenzioso — uno dei tanti occhi di cui Joh Fredersen dispone in città — bussa alla porta dell'ufficio più alto di Metropolis.",
      "Riferisce tutto: le catacombe, la donna, la folla, la mappa scomparsa dalla tasca di un operaio. E riferisce, soprattutto, di aver riconosciuto Freder tra loro, vestito da operaio.",
      "Joh Fredersen non alza la voce. Si limita a prendere il cappello e a ordinare che l'automobile lo porti immediatamente a casa di un vecchio collaboratore: l'inventore Rotwang."
    ],
    choices: [ { label: "Continua", next: "s_rotwang_house" } ]
  },

  s_rotwang_house: {
    text: [
      "La casa di Rotwang è un'isola di legno antico incastonata tra i grattacieli, con una stella a cinque punte scolpita sopra la porta. All'interno, una statua ricorda Hel — la donna che Rotwang amò, che sposò invece Joh Fredersen, e che morì dando alla luce te.",
      "Nel suo laboratorio sotterraneo, tra scintille e ingranaggi, Rotwang svela a Fredersen la sua opera segreta: una figura umanoide d'acciaio e rame, ancora senza volto. «L'uomo del futuro» la chiama. «Non si stanca mai. Non si ammala mai. Non ama nessuno.»",
      "Fredersen, saputo delle catacombe e della donna che vi predica, ha un'idea fredda e precisa: dare a quella macchina il volto e il corpo di Maria, per screditarla agli occhi degli operai prima che la sua parola diventi rivolta. Rotwang accetta con un sorriso che il padrone di Metropolis non sa leggere: da anni aspetta solo un'occasione per vendicarsi di lui, e ora gliel'ha portata in casa da solo."
    ],
    choices: [ { label: "Continua", next: "s_night_search" } ]
  },

  s_night_search: {
    chapterNum: 7,
    text: [
      "Non riesci a dormire. Esci di nascosto, deciso a rivedere Maria prima del previsto, e i tuoi passi ti portano proprio vicino alla vecchia casa di Rotwang, da cui provengono luci e rumori che non dovrebbero esserci a quest'ora.",
      "Attraverso un varco nel muro senti un urlo che riconosci — Maria — inseguita da un fascio di torcia nei cunicoli che collegano la sua casa alle catacombe."
    ],
    choices: [
      { label: "Forza subito la porta principale", effect: function(s){ s.stats.salute = clamp(s.stats.salute - 15); grantItem("schema_robot"); s.stats.sospetto = clamp(s.stats.sospetto + 20); }, next: "s_fever" },
      { label: "Aggirati in silenzio e osserva da una fessura nel muro", effect: function(s){ grantItem("schema_robot"); s.stats.sospetto = clamp(s.stats.sospetto + 30); }, next: "s_fever" }
    ]
  },

  s_fever: {
    text: [
      "Quel che vedi — o credi di vedere — non ha senso: Maria legata a una poltrona di rame, un alone di luce che scivola dal suo corpo verso la figura d'acciaio accanto a lei, come un ritratto che cambia cornice. Un colpo alla testa, o forse solo l'orrore stesso, ti fa perdere i sensi.",
      "Ti risvegli nel tuo letto, bruciante di febbre. Le statue della Morte e dei Sette Peccati Capitali, nella cappella di famiglia, sembrano muoversi nella penombra. Vedi una donna vestita solo di seta danzare su un mostro a sette teste, mentre uomini in redingote si sbranano ai suoi piedi per un suo sguardo.",
      "Quando la febbre cala, non sai più distinguere cosa hai davvero visto da cosa ha inventato la tua mente in delirio. Ma un pensiero resta, freddo e chiaro: qualcosa, sotto quella casa, ha preso il volto di Maria."
    ],
    onEnter: function(s){ s.flags.fever_survived = true; },
    choices: [ { label: "Rialzati e torna in strada", next: "s_false_maria_intro" } ]
  },

  s_false_maria_intro: {
    chapterNum: 8,
    text: [
      "In città si parla già di una \"Maria\" vista a Yoshiwara, il locale di piacere della città alta, che balla per uomini che si sfidano a duello per un suo sorriso — cosa che la Maria che conosci non farebbe mai.",
      "La incontri per un istante, per strada: ha il suo viso, la sua voce, ma lo sguardo è sbagliato, freddo, come se ti stesse studiando invece di riconoscerti."
    ],
    choices: [
      { requires: function(s){ return s.inventory.indexOf("medaglione_maria") !== -1; },
        label: "Mostrale il medaglione e osserva la sua reazione", effect: function(s){ s.stats.sospetto = clamp(s.stats.sospetto + 30); s.flags.tested_medallion = true; }, next: "s_confront_early" },
      { requires: function(s){ return !s.flags.visited_yoshiwara; },
        label: "Entra di persona a Yoshiwara, per vedere con i tuoi occhi", next: "s_yoshiwara_visit" },
      { label: "Allontanati confuso, convincendoti che sia solo lo stress", next: "s_workers_incited" }
    ]
  },

  s_yoshiwara_visit: {
    text: [
      "Yoshiwara è tutto ciò che i Giardini Eterni non ammettono di essere: musica frenetica, fumo dolciastro, uomini in redingote che si contendono a spintoni un solo sorriso di \"Maria\", danzante su un tavolo come se il mondo sotto i suoi piedi non fosse mai esistito.",
      "Due di loro finiscono per sfidarsi a duello proprio davanti a te, per un fazzoletto che lei ha lasciato cadere apposta. Nessuno, in quella sala, sembra ricordare che esista una Città delle Mani.",
      "Vedi, per un istante, un uomo magro e silenzioso osservare la scena da un angolo buio — lo stesso che, senza saperlo, ha già riferito ogni tuo movimento a tuo padre."
    ],
    onEnter: function(s){ s.flags.visited_yoshiwara = true; s.stats.sospetto = clamp(s.stats.sospetto + 10); },
    choices: [ { label: "Esci, sconvolto da quello che hai visto", next: "s_workers_incited" } ]
  },

  s_confront_early: {
    text: [
      "Alla vista del medaglione, l'espressione della falsa Maria si incrina per una frazione di secondo — un guasto, un cortocircuito nella recitazione perfetta. Non hai più dubbi.",
      "Corri da Josaphat e da alcuni operai fidati: «Quella che parla nelle catacombe stanotte non è lei. Non fidatevi delle sue parole, qualunque cosa dica.» Non tutti ti credono, ma il seme del dubbio è piantato, e potrebbe fare la differenza quando sarà il momento."
    ],
    onEnter: function(s){ s.flags.warned_workers = true; },
    choices: [ { label: "Continua", next: "s_workers_incited" } ]
  },

  s_workers_incited: {
    text: [
      "Nelle catacombe, la falsa Maria non parla più di pazienza e Mediatori. Incita alla furia: «Basta aspettare un cuore che non arriverà mai. Distruggete le macchine, stanotte, con le vostre mani!»",
      "Grot, il caposquadra che ha sempre difeso gli operai senza mai tradire il proprio ruolo, cerca di fermarli: «Le macchine sono ciò che tiene in vita le vostre case, i vostri figli!» Nessuno lo ascolta più. La folla si muove come un'unica bestia verso il Cuore-Macchina."
    ],
    choices: [ { label: "C'è ancora un attimo prima che tutto precipiti: agisci", next: "s_last_chance_hub" } ]
  },

  s_last_chance_hub: {
    text: [
      "Il tempo si sta esaurendo, ma non è ancora scaduto del tutto. Ogni istante speso ora potrebbe salvare qualcuno, più tardi."
    ],
    choices: [
      { requires: function(s){ return !s.flags.pre_warned_grot; },
        label: "Raggiungi Grot e avvertilo di tenere i bambini lontani dalle case basse stanotte", effect: function(s){ s.flags.pre_warned_grot = true; }, next: "s_last_chance_grot" },
      { requires: function(s){ return !s.flags.pre_alerted && s.inventory.indexOf("fischietto_josaphat") !== -1; },
        label: "Usa il fischietto di Josaphat per far suonare l'allarme generale", effect: function(s){ s.flags.pre_alerted = true; }, next: "s_last_chance_whistle" },
      { label: "Non c'è più tempo: segui la folla", next: "s_riot" }
    ]
  },

  s_last_chance_grot: {
    text: [
      "Trovi Grot mentre cerca ancora, inutilmente, di farsi ascoltare dalla folla. Lo tiri per un braccio: «Se distruggono il Cuore-Macchina, l'acqua salirà nelle case basse. I bambini sono ancora lì dentro.»",
      "Il suo sguardo cambia. «Vai» dice. «Io faccio quel che posso qui, tu portali fuori appena puoi.» Non è una soluzione, ma è un inizio."
    ],
    choices: [ { label: "Torna a decidere cosa fare", next: "s_last_chance_hub" } ]
  },

  s_last_chance_whistle: {
    text: [
      "Tre colpi brevi, come promesso tanto tempo fa. Per un istante temi che nessuno li abbia sentiti nel caos — poi vedi Josaphat farsi largo tra la folla, seguito da un paio di sorveglianti fidati, già diretti verso le case basse per iniziare a svegliare chi può ancora essere svegliato.",
      "Non è tutto il quartiere, ma è più di quanto la sola urgenza del momento ti avrebbe permesso di fare da solo."
    ],
    choices: [ { label: "Torna a decidere cosa fare", next: "s_last_chance_hub" } ]
  },

  s_riot: {
    chapterNum: 9,
    text: [
      "Con mazze e sbarre, gli operai fanno a pezzi il Cuore-Macchina che regola l'intera Città delle Mani. Per un istante esultano, liberi per la prima volta in vita loro.",
      "Poi l'acqua comincia a salire dai condotti rotti. Grot urla la verità che nessuno voleva sentire: le loro case, dove sono rimasti i loro figli, stanno per allagarsi.",
      "Nel caos generale, la vera Maria — libera, forse fuggita nella confusione dell'attacco a Rotwang — ti afferra per un braccio. «I bambini» dice soltanto. Non serve altro."
    ],
    choices: [ { label: "Correte insieme verso le case degli operai", next: "s_flood_alarm" } ]
  },

  s_flood_alarm: {
    text: [
      "L'acqua sale più in fretta di quanto entrambi temevate. Dovete decidere in un istante come raggiungere i bambini, ancora addormentati o in preda al panico nelle case basse."
    ],
    choices: [
      { label: "La vecchia scala a chiocciola: più lunga, ma sicura", effect: function(s){ s.flood += 12; }, next: "s_flood_panic" },
      { label: "I cunicoli di servizio: più rapidi, ma rischiosi", effect: function(s){ if (s.stats.salute >= 70) { s.flood += 20; } else { s.flood += 6; s.stats.salute = clamp(s.stats.salute - 10); } }, next: "s_flood_panic" },
      { label: "Torna indietro un attimo: hai visto Josaphat ferito, forse puoi aiutarlo a guidarvi", effect: function(s){ s.flood -= 8; }, next: "s_flood_panic" }
    ]
  },

  s_flood_panic: {
    text: [
      "Trovate i bambini svegli, terrorizzati, ammassati sui tavoli e i letti più alti mentre l'acqua nera continua a salire lungo i corridoi. Maria conosce molti di loro per nome; tu no, ma il tempo per le presentazioni non c'è."
    ],
    choices: [
      { label: "Fermati un istante a calmarli, promettendo che ce la farete", effect: function(s){ s.flood += 15; s.stats.salute = clamp(s.stats.salute - 5); }, next: "s_flood_qte" },
      { label: "Radunali in fila e correte senza fermarvi", effect: function(s){ s.flood += 8; }, next: "s_flood_qte" }
    ]
  },

  s_flood_qte: {
    text: [
      "Ogni corridoio è un rischio diverso — un tratto crollato, un varco più stretto, un punto dove l'acqua è già troppo alta per i più piccoli. Devi decidere via via, in una frazione di secondo, cosa serve in quel preciso istante: correre, tacere, fare luce, o prendere in braccio chi non ce la fa più."
    ],
    minigame: "qte",
    qtePrompt: "Osserva il corridoio davanti a voi…",
    onRendered: function(){
      if (!qte) initQTE({
        total: 5,
        symbols: ["🏃", "🤫", "🕯️", "👶", "🌊"],
        onDone: function(hits){ concludeFloodQte(hits); }
      });
    }
  },

  s_flood_climax: {
    text: function(s){
      if (s.flags.flood_qte_hits >= 4) return ["Reagite d'istinto, quasi all'unisono: ogni corridoio sbagliato viene evitato un attimo prima che diventi una trappola. Guidate la lunga fila di bambini verso le scale più alte della città quasi senza esitazioni."];
      if (s.flags.flood_qte_hits <= 1) return ["Sbagliate corridoio più di una volta, perdendo secondi preziosi che non potete permettervi. Guidate la lunga fila di bambini verso le scale più alte della città con l'acqua che sale più in fretta di voi."];
      return ["Guidate la lunga fila di bambini verso le scale più alte della città, con l'acqua che vi lambisce le caviglie e poi i ginocchi. Ogni scelta fatta stanotte, ogni minuto risparmiato o perso, conta adesso più di ogni altra cosa."];
    },
    onEnter: function(s){
      var total = s.flood;
      if (s.flags.warned_workers) total += 15;
      if (s.inventory.indexOf("mappa_catacombe") !== -1) total += 10;

function chooseEnding(s){
  if (s.flags.freder_died) return "s_end_sacrifice"; // già gestito prima di arrivare qui
  var score = s.stats.operai + s.stats.maria;
  if (s.flags.declared_mediator) score += 15;
  if (s.flags.warned_workers) score += 15;
  if (s.flags.tutti_salvi) score += 40;
  else if (s.flags.alcuni_persi) score += 5;
  else if (s.flags.molti_persi) score -= 35;

  if (s.flags.tutti_salvi && s.flags.warned_workers && s.flags.declared_mediator && s.stats.maria >= 60) return "s_end_best";
  if (s.flags.molti_persi || s.stats.operai < 25) return "s_end_dark";
  if (s.flags.alcuni_persi) return "s_end_bittersweet";
  if (score >= 90) return "s_end_true";
  return "s_end_bittersweet";
}

/* ------------------------- Minigioco: il turno -------------------------
   Un piccolo gioco di tempismo che sostituisce la scena "s_shift": cinque
   round, ognuno dei quali chiede di colpire la leva nell'istante in cui la
   spia diventa verde. Aggiorna il DOM direttamente (senza richiamare
   render()) per non interrompere i timer in corso.
------------------------------------------------------------------------- */

var shiftGame = null;

function resetShiftGame(){
  if (shiftGame && shiftGame.timer) clearTimeout(shiftGame.timer);
  shiftGame = null;
}

function initShiftGame(){
  shiftGame = { round: 0, hits: 0, phase: "idle", feedback: "", timer: null };
  scheduleShiftRound();
}

function scheduleShiftRound(){
  shiftGame.phase = "idle";
  shiftGame.feedback = "";
  updateShiftDOM();
  var delay = 700 + Math.random() * 900;
  shiftGame.timer = setTimeout(function(){
    if (!shiftGame) return;
    shiftGame.phase = "ready";
    updateShiftDOM();
    shiftGame.timer = setTimeout(function(){
      if (shiftGame && shiftGame.phase === "ready"){
        shiftGame.feedback = "Troppo lento — la lancetta ti è sfuggita.";
        finishShiftRound(false);
      }
    }, 650);
  }, delay);
}

function finishShiftRound(hit){
  if (!shiftGame) return;
  clearTimeout(shiftGame.timer);
  qteFeedbackSound(hit);
  if (hit){
    shiftGame.hits++;
    shiftGame.feedback = "Colpito al momento giusto.";
  }
  shiftGame.round++;
  shiftGame.phase = "idle";
  updateShiftDOM();
  if (shiftGame.round >= 5){
    shiftGame.phase = "done";
    updateShiftDOM();
    setTimeout(concludeShiftMinigame, 700);
  } else {
    setTimeout(scheduleShiftRound, 550);
  }
}

function updateShiftDOM(){
  if (!shiftGame) return;
  var label = document.getElementById("shiftRoundLabel");
  var btn = document.getElementById("shiftBtn");
  var fb = document.getElementById("shiftFeedback");
  if (!btn) return;
  if (label) label.textContent = "Turno " + Math.min(shiftGame.round + 1, 5) + " di 5 — colpi riusciti: " + shiftGame.hits;
  if (shiftGame.phase === "ready"){ btn.textContent = "COLPISCI!"; btn.disabled = false; btn.className = "btn primary"; }
  else if (shiftGame.phase === "done"){ btn.textContent = "Turno completato"; btn.disabled = true; btn.className = "btn"; }
  else { btn.textContent = "ATTENDI…"; btn.disabled = true; btn.className = "btn ghost"; }
  if (fb) fb.textContent = shiftGame.feedback || "";
}

function concludeShiftMinigame(){
  if (!shiftGame) return;
  var hits = shiftGame.hits;
  shiftGame = null;
  if (hits >= 4){ state.flags.shift_precise = true; }
  else if (hits <= 1){ state.stats.salute = clamp(state.stats.salute - 15); state.flags.shift_clumsy = true; }
  state.currentScene = "s_shift_paper";
  applyOnEnter("s_shift_paper");
  render();
}

function renderShiftMinigameBody(){
  // Nota: qui NON si deve assegnare a shiftGame (nemmeno un placeholder) — il
  // successivo hook onRendered() decide se avviare initShiftGame() proprio
  // controllando se shiftGame è ancora nullo dopo il render.
  var g = shiftGame || { round: 0, hits: 0, phase: "idle", feedback: "" };
  var html = '<div class="minigame-box">';
  html += '<div id="shiftRoundLabel" class="muted small" style="margin-bottom:0.9em;">Turno ' + (g.round + 1) + ' di 5 — colpi riusciti: ' + g.hits + '</div>';
  html += '<button id="shiftBtn" class="btn ghost" style="font-size:1.2em;padding:0.9em 2.2em;" onclick="MetropolisGame.shiftClick()" disabled>ATTENDI…</button>';
  html += '<div id="shiftFeedback" class="muted small" style="margin-top:0.9em;min-height:1.2em;"></div>';
  html += '</div>';
  return html;
}

/* --------------------------- Quick Time Event ---------------------------
   Un secondo tipo di minigioco, diverso dal timing puro del turno: qui
   compare un simbolo bersaglio e tre pulsanti-simbolo tra cui scegliere
   quello giusto entro una finestra di tempo. Generico, riusabile per più
   scene passando una config a initQTE().
------------------------------------------------------------------------- */

var qte = null;

function resetQTE(){
  if (qte && qte.timer) clearTimeout(qte.timer);
  qte = null;
}

function shuffleArr(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function initQTE(config){
  qte = { round: 0, hits: 0, phase: "idle", target: null, options: [], timer: null, feedback: "", config: config };
  scheduleQteRound();
}

function scheduleQteRound(){
  qte.phase = "idle";
  qte.target = null;
  updateQteDOM();
  var delay = 500 + Math.random() * 700;
  qte.timer = setTimeout(function(){
    if (!qte) return;
    var syms = qte.config.symbols;
    var target = syms[Math.floor(Math.random() * syms.length)];
    var others = shuffleArr(syms.filter(function(s){ return s !== target; }));
    var options = shuffleArr([target, others[0], others[1]].filter(Boolean));
    qte.target = target;
    qte.options = options;
    qte.phase = "ready";
    updateQteDOM();
    qte.timer = setTimeout(function(){
      if (qte && qte.phase === "ready") finishQteRound(false);
    }, 900);
  }, delay);
}

function finishQteRound(hit){
  if (!qte) return;
  clearTimeout(qte.timer);
  qteFeedbackSound(hit);
  if (hit){ qte.hits++; qte.feedback = "Reazione giusta."; }
  else { qte.feedback = "Sbagliato — un attimo perso che potrebbe pesare."; }
  qte.round++;
  qte.phase = "idle";
  updateQteDOM();
  if (qte.round >= qte.config.total){
    var hits = qte.hits;
    var onDone = qte.config.onDone;
    qte = null;
    setTimeout(function(){ onDone(hits); }, 500);
  } else {
    setTimeout(scheduleQteRound, 450);
  }
}

function updateQteDOM(){
  if (!qte) return;
  var label = document.getElementById("qteLabel");
  var box = document.getElementById("qteOptions");
  if (!box) return;
  if (label) label.textContent = "Fase " + Math.min(qte.round + 1, qte.config.total) + " di " + qte.config.total + " — riuscite: " + qte.hits;
  if (qte.phase === "ready"){
    var html = '<div class="qte-target">' + qte.target + '</div><div class="qte-buttons">';
    qte.options.forEach(function(o){
      html += '<button class="btn qte-opt" onclick="MetropolisGame.qteClick(\'' + o + '\')">' + o + '</button>';
    });
    html += '</div>';
    box.innerHTML = html;
  } else {
    box.innerHTML = '<div class="qte-target dim">?</div>';
  }
  var fb = document.getElementById("qteFeedback");
  if (fb) fb.textContent = qte.feedback || "";
}

function concludeFloodQte(hits){
  state.flags.flood_qte_hits = hits;
  if (hits <= 1) state.stats.salute = clamp(state.stats.salute - 5);
  state.currentScene = "s_flood_climax";
  applyOnEnter("s_flood_climax");
  render();
}

function renderQteBody(promptLabel){
  var html = '<div class="minigame-box">';
  html += '<div id="qteLabel" class="muted small" style="margin-bottom:0.9em;">' + (promptLabel || "Preparati…") + '</div>';
  html += '<div id="qteOptions" class="qte-options"><div class="qte-target dim">?</div></div>';
  html += '<div id="qteFeedback" class="muted small" style="margin-top:0.9em;min-height:1.2em;"></div>';
  html += '</div>';
  return html;
}

/* ------------------------------ Rendering ------------------------------ */

var activeTab = "storia";
var activeLocation = null;

function getScene(id){ return SCENES[id]; }

function textOf(scene, s){
  var t = typeof scene.text === "function" ? scene.text(s) : scene.text;
  return t || [];
}

function applyOnEnter(id){
  var scene = getScene(id);
  if (scene && scene.onEnter && state.enteredScenes.indexOf(id) === -1){
    scene.onEnter(state);
  }
  if (state.enteredScenes.indexOf(id) === -1){
    state.enteredScenes.push(id);
    state.history.push(id);
  }
  if (scene && scene.ending){
    var alreadySeenEnding = meta.endingsSeen.indexOf(id) !== -1;
    state.ending = id;
    if (!alreadySeenEnding){
      var moods = { s_end_true: "good", s_end_best: "good", s_end_dark: "bad", s_end_sacrifice: "bad", s_end_bittersweet: "mixed" };
      endingSting(moods[id] || "mixed");
    }
  }
  checkAchievements();
  saveState();
}

function choose(choiceIdx){
  var scene = getScene(state.currentScene);
  var visible = visibleChoices(scene);
  var choice = visible[choiceIdx];
  if (!choice) return;
  clickSound();
  if (choice.effect) choice.effect(state);
  var next = typeof choice.next === "function" ? choice.next(state) : choice.next;
  if (next === "MENU"){
    try { localStorage.removeItem(SAVE_KEY); } catch(e){}
    state = null;
    render();
    return;
  }
  state.currentScene = next;
  applyOnEnter(next);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function visibleChoices(scene){
  return (scene.choices || []).filter(function(c){ return !c.requires || c.requires(state); });
}

}

  html += '<h3 style="font-size:0.95em;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);">Ambiente sonoro</h3>';
  html += '<button class="btn wide" onclick="MetropolisGame.toggleAudio()">'+(audioOn ? "🔇 Ferma il ronzio delle macchine" : "🔊 Attiva il ronzio delle macchine")+'</button>';
  html += '<p class="small muted" style="margin-top:0.6em;">Drone industriale sintetizzato via Web Audio — nessun file audio esterno, nessuna colonna sonora originale del film.</p>';
  html += '</div>';

  return html;
}

function renderStoria(){
  var scene = getScene(state.currentScene);
  if (!scene) return '<div class="panel">Errore di scena.</div>';
  var html = "";
  if (scene.intertitle){
    var ch = CHAPTERS.filter(function(c){ return c.n === scene.chapterNum; })[0];
    html += '<div class="intertitle"><div class="num">Capitolo '+(ch?ch.n:"")+'</div><h2>'+(ch?ch.title:"")+'</h2></div>';
  }
  html += '<div class="panel scene-panel">';
  if (!scene.intertitle){
    var chap = chapterFor(state.currentScene);
    html += '<div class="scene-tag">Capitolo '+chap.n+' — '+chap.title+'</div>';
  }
  html += '<div class="scene-text">';
  textOf(scene, state).forEach(function(p){ html += "<p>"+p+"</p>"; });
  html += '</div>';

  if (scene.ending){
    html += '<div class="ending-badge">Finale raggiunto</div>';
  }

  if (scene.minigame === "shift"){
    html += renderShiftMinigameBody();
  } else if (scene.minigame === "qte"){
    html += renderQteBody(scene.qtePrompt);
  } else {
    var visible = visibleChoices(scene);
    html += '<div class="choices">';
    visible.forEach(function(c, i){
      html += '<button class="btn" onclick="MetropolisGame.choose('+i+')">'+c.label+'</button>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderInventario(){
  var html = '<div class="panel"><h2>Inventario</h2>';
  if (state.inventory.length === 0){
    html += '<p class="muted">Non hai ancora raccolto nulla in questa storia.</p>';
  } else {
    html += '<p class="muted small">Alcuni oggetti si possono usare direttamente da qui.</p>';
    html += '<div class="item-list">';
    state.inventory.forEach(function(id){
      var it = ITEMS[id];
      html += '<div class="item-entry"><div class="icon">'+it.icon+'</div><div style="flex:1;">';
      html += '<div class="name">'+it.name+'</div><div class="desc">'+it.desc+'</div>';
      if (it.use){
        var alreadyUsed = it.use.once && state.flags["used_" + id];
        html += '<div style="margin-top:0.5em;">';
        if (alreadyUsed){
          html += '<div class="small muted"><em>' + state.flags["note_" + id] + '</em></div>';
        } else {
          html += '<button class="btn tiny" onclick="MetropolisGame.useItem(\''+id+'\')">'+it.use.label+(it.consumable?' (si consuma)':'')+'</button>';
        }
        html += '</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderDiario(){
  var html = '<div class="panel"><h2>Diario di viaggio</h2>';
  var seenChapters = [];
  state.history.forEach(function(id){
    var ch = chapterFor(id);
    if (seenChapters.indexOf(ch.n) === -1) seenChapters.push(ch.n);
  });
  CHAPTERS.forEach(function(ch){
    if (seenChapters.indexOf(ch.n) === -1) return;
    html += '<div class="diary-entry"><div class="ch-num">Capitolo '+ch.n+'</div><div>'+ch.title+'</div></div>';
  });
  html += '<p class="muted small" style="margin-top:1em;">Finali visti finora: '+meta.endingsSeen.length+' / 5</p>';
  html += '</div>';
  return html;
}

function renderMapSVG(){
  var svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" class="map-svg">';
  svg += '<rect x="0" y="0" width="100" height="100" fill="#0a0908"/>';
  svg += '<rect x="0" y="0" width="100" height="28" fill="#1a2230" opacity="0.5"/>';
  svg += '<rect x="0" y="28" width="100" height="32" fill="#171518" opacity="0.5"/>';
  svg += '<rect x="0" y="60" width="100" height="40" fill="#0a0908" opacity="0.7"/>';
  LOCATIONS.forEach(function(loc){
    var unlocked = isLocationUnlocked(loc);
    var fill = unlocked ? "#c9a227" : "#4a463a";
    var textFill = unlocked ? "#e9e5d8" : "#5a5648";
    var label = unlocked ? loc.name : "???";
    svg += '<g onclick="MetropolisGame.showLocation(\'' + loc.id + '\')" style="cursor:pointer;">';
    svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="3" fill="' + fill + '" stroke="#0b0b0d" stroke-width="0.6"/>';
    svg += '<text x="' + loc.x + '" y="' + (loc.y - 4.5) + '" font-size="3.2" fill="' + textFill + '" text-anchor="middle">' + label + '</text>';
    svg += '</g>';
  });
  svg += '</svg>';
  return svg;
}

function renderMappa(){
  var html = '<div class="panel"><h2>Mappa di Metropolis</h2>';
  html += '<p class="muted small">I luoghi si sbloccano man mano che la storia li attraversa. Tocca un punto per leggerne la descrizione.</p>';
  html += '<div class="map-wrap">' + renderMapSVG() + '</div>';
  html += '</div>';
  if (activeLocation){
    var loc = LOCATIONS.filter(function(l){ return l.id === activeLocation; })[0];
    if (loc && isLocationUnlocked(loc)){
      html += '<div class="panel" style="margin-top:1em;"><h3 style="color:var(--gold);">' + loc.name + '</h3><p>' + loc.desc + '</p></div>';
    }
  }
  return html;
}

function renderAchievements(){
  var html = '<div class="panel"><h2>Achievement</h2><div class="ach-list">';
  Object.keys(ACHIEVEMENTS).forEach(function(id){
    var a = ACHIEVEMENTS[id];
    var unlocked = meta.achievements.indexOf(id) !== -1;
    html += '<div class="ach '+(unlocked?"":"locked")+'"><div class="icon">'+(unlocked ? a.icon : "🔒")+'</div>' +
      '<div><div class="name">'+a.name+'</div><div class="desc">'+(unlocked ? a.desc : "Non ancora sbloccato.")+'</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function renderImpostazioni(){
  var html = '<div class="panel"><h2>Salvataggio</h2>';
  html += '<p class="muted small">La partita si salva automaticamente nel browser dopo ogni scelta. Puoi anche esportarla o importarla come file JSON.</p>';
  html += '<div class="row">';
  html += '<button class="btn" onclick="MetropolisGame.exportSave()">⬇️ Esporta partita</button>';
  html += '<button class="btn" onclick="MetropolisGame.triggerImport()">⬆️ Importa partita</button>';
  html += '<input type="file" id="importFile" accept="application/json" style="display:none" onchange="MetropolisGame.importSave(event)">';
  html += '<button class="btn" style="border-color:var(--critical);" onclick="MetropolisGame.resetGame()">♻️ Ricomincia da capo</button>';
  html += '</div>';
  html += '<textarea class="savebox" id="saveOut" readonly placeholder="Il JSON della partita esportata comparirà qui"></textarea>';
  html += '</div>';

  html += '<div class="panel"><h2>Informazioni</h2>';
  html += '<p class="small">Metropolis (1927) di Fritz Lang è oggi di pubblico dominio negli Stati Uniti; in altri paesi la durata del copyright sulle opere cinematografiche può essere diversa (nell\'Unione Europea, ad esempio, dura fino a 70 anni dopo la morte dell\'ultimo autore superstite). Questo è un gioco di finzione originale, liberamente ispirato alla trama e all\'estetica Art Déco / Espressionista del film: non riproduce alcun fotogramma, dialogo originale, la colonna sonora di Gottfried Huppertz, né il logo ufficiale di alcuno studio o restauro. Il trattamento grafico del titolo è opera originale.</p>';
  html += '</div>';
  return html;
}

function render(){
  var app = document.getElementById("app");
  if (!state){
    app.innerHTML = renderBoot();
    return;
  }
  var chap = chapterFor(state.currentScene);
  var html = '<div class="game-wrap active">';
  html += '<header class="gamehead"><div class="title">Metropolis — Il Mediatore</div>' +
    '<div class="chapter-tag">Capitolo '+chap.n+' di 12 — '+chap.title+'</div></header>';

  html += '<nav class="tabs">';
  [["storia","Storia"],["mappa","Mappa"],["inventario","Inventario"],["diario","Diario"],["achievement","Achievement"],["impostazioni","Impostazioni"]].forEach(function(t){
    html += '<button class="'+(activeTab===t[0]?"active":"")+'" onclick="MetropolisGame.setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  html += '</nav>';

  html += '<div class="layout"><div class="main">';
  if (activeTab === "storia") html += renderStoria();
  else if (activeTab === "mappa") html += renderMappa();
  else if (activeTab === "inventario") html += renderInventario();
  else if (activeTab === "diario") html += renderDiario();
  else if (activeTab === "achievement") html += renderAchievements();
  else if (activeTab === "impostazioni") html += renderImpostazioni();
  html += '</div><div class="sidebar">'+renderSidebar()+'</div></div>';

  html += '<div class="footer-note">Metropolis — Il Mediatore · fan game non ufficiale ispirato al film del 1927 · nessun dato lascia mai questo browser</div>';
  html += '</div>';

  html += renderToasts();

  app.innerHTML = html;
  flushToasts();

  var currentScene = getScene(state.currentScene);
  if (currentScene && currentScene.onRendered) currentScene.onRendered();
}

function renderToasts(){
  if (toastQueue.length === 0) return "";
  var html = '<div class="toast-wrap">';
  toastQueue.forEach(function(t){
    if (t.type === "achievement"){
      var a = ACHIEVEMENTS[t.id];
      html += '<div class="toast"><div class="t-head">Achievement sbloccato</div><div>'+a.icon+' <strong>'+a.name+'</strong></div></div>';
    } else {
      html += '<div class="toast"><div class="t-head">Diario</div><div>'+(t.icon||"📝")+' '+t.text+'</div></div>';
    }
  });
  html += '</div>';
  return html;
}
function flushToasts(){
  if (toastQueue.length === 0) return;
  setTimeout(function(){ toastQueue = []; render(); }, 3200);
}

function renderPosterSVG(){
  // Illustrazione originale (non un fotogramma o un logo ufficiale) ispirata
  // alla composizione classica del poster del 1927: fasci di luce radiali,
  // uno skyline a ziggurat, una sagoma robotica. Vettoriale: nitida su
  // qualunque schermo, da un iPhone a un laptop, senza alcun file immagine.
  var xs = [-20, 20, 60, 100, 140, 180, 220, 260, 300, 340];
  var beams = "";
  for (var i = 0; i < xs.length - 1; i++){
    var color = i % 2 === 0 ? "#c9a227" : "#050405";
    beams += '<polygon points="150,0 ' + xs[i] + ',400 ' + xs[i+1] + ',400" fill="' + color + '"/>';
  }
  var svg = '<svg viewBox="0 0 300 400" class="poster-svg" role="img" aria-label="Illustrazione originale ispirata al poster di Metropolis del 1927">';
  svg += '<defs><radialGradient id="posterGlow" cx="50%" cy="14%" r="65%"><stop offset="0%" stop-color="#3a2f10"/><stop offset="100%" stop-color="#0b0b0d"/></radialGradient></defs>';
  svg += '<rect x="0" y="0" width="300" height="400" fill="url(#posterGlow)"/>';
  svg += '<g opacity="0.3">' + beams + '</g>';
  svg += '<g fill="#141216" stroke="#c9a227" stroke-width="2">';
  svg += '<polygon points="80,400 220,400 195,315 105,315"/>';
  svg += '<polygon points="105,315 195,315 178,250 122,250"/>';
  svg += '<polygon points="122,250 178,250 165,195 135,195"/>';
  svg += '<polygon points="135,195 165,195 156,150 144,150"/>';
  svg += '</g>';
  svg += '<g fill="#c9a227"><circle cx="150" cy="112" r="15"/><rect x="132" y="129" width="36" height="48" rx="4"/><polygon points="122,177 178,177 190,218 110,218"/></g>';
  svg += '<text x="150" y="382" text-anchor="middle" font-size="22" letter-spacing="6" fill="#e9e5d8" font-family="Georgia, serif">METROPOLIS</text>';
  svg += '</svg>';
  return svg;
}

var bootSlide = 0;
function renderCarousel(){
  var loc = LOCATIONS[bootSlide % LOCATIONS.length];
  var html = '<div class="carousel">';
  html += '<div class="cs-title">' + loc.name + '</div>';
  html += '<div class="cs-text">' + loc.desc + '</div>';
  html += '<div class="cs-dots">';
  LOCATIONS.forEach(function(l, i){
    html += '<span class="cs-dot' + (i === bootSlide % LOCATIONS.length ? ' active' : '') + '"></span>';
  });
  html += '</div></div>';
  return html;
}

function renderBoot(){
  var hasSave = !!loadState();
  var html = '<div class="boot">';
  html += renderPosterSVG();
  html += '<h1>Metropolis</h1>';
  html += '<div class="sub">Il Mediatore</div>';
  html += '<p class="tagline">Un\'avventura narrativa a scelte multiple, liberamente ispirata al film del 1927 di Fritz Lang.</p>';
  html += renderCarousel();
  html += '<div class="boot-frame">';
  html += '<div class="boot-actions">';
  html += '<button class="btn primary wide" onclick="MetropolisGame.newGame()">Nuova Partita</button>';
  if (hasSave) html += '<button class="btn wide" onclick="MetropolisGame.continueGame()">Continua</button>';
  html += '<button class="btn wide ghost" onclick="MetropolisGame.showAchievementsFromMenu()">Achievement ('+meta.achievements.length+' / '+Object.keys(ACHIEVEMENTS).length+')</button>';
  html += '</div></div>';
  html += '<div class="disclaimer">Fan game non ufficiale. <em>Metropolis</em> (1927, Fritz Lang) è di pubblico dominio negli Stati Uniti; il regime di copyright può variare altrove. Nessun fotogramma, musica originale o logo ufficiale viene riprodotto: trama e ambientazione sono reinterpretate liberamente, il titolo è un trattamento grafico originale.</div>';
  html += '</div>';
  return html;
}

/* ------------------------------- API pubblica --------------------------- */

var showingAchFromMenu = false;

window.MetropolisGame = {
  newGame: function(){
    resetShiftGame(); resetQTE();
    state = freshState();
    applyOnEnter(state.currentScene);
    activeTab = "storia";
    render();
  },
  continueGame: function(){
    resetShiftGame(); resetQTE();
    state = loadState() || freshState();
    activeTab = "storia";
    render();
  },
  choose: choose,
  shiftClick: function(){
    if (shiftGame && shiftGame.phase === "ready") finishShiftRound(true);
  },
  qteClick: function(sym){
    if (qte && qte.phase === "ready") finishQteRound(sym === qte.target);
  },
  useItem: useItem,
  showLocation: function(id){
    var loc = LOCATIONS.filter(function(l){ return l.id === id; })[0];
    if (loc && isLocationUnlocked(loc)) { activeLocation = id; render(); }
  },
  setTab: function(t){ activeTab = t; render(); },
  toggleAudio: toggleAmbient,
  exportSave: function(){
    var box = document.getElementById("saveOut");
    if (box) box.value = JSON.stringify(state, null, 2);
  },
  triggerImport: function(){
    var input = document.getElementById("importFile");
    if (input) input.click();
  },
  importSave: function(evt){
    var file = evt.target.files && evt.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var loaded = JSON.parse(e.target.result);
        if (loaded && loaded.stats && loaded.currentScene){
          state = loaded;
          saveState();
          render();
        }
      } catch(err){ /* file non valido, ignorato */ }
    };
    reader.readAsText(file);
  },
  resetGame: function(){
    if (window.confirm("Ricominciare da capo? La partita in corso andrà persa (gli achievement restano salvati).")){
      resetShiftGame(); resetQTE();
      state = freshState();
      saveState();
      activeTab = "storia";
      render();
    }
  },
  showAchievementsFromMenu: function(){
    state = state || freshState();
    activeTab = "achievement";
    render();
  }
};

/* -------------------------------- Avvio --------------------------------- */

meta = loadMeta() || freshMeta();
state = null; // mostra il frontespizio; l'utente sceglie Nuova Partita o Continua
render();

// Fa avanzare la vetrina dei luoghi nel frontespizio; non tocca mai il
// render() di una partita in corso (per non interferire con i minigiochi).
setInterval(function(){
  if (!state){
    bootSlide = (bootSlide + 1) % LOCATIONS.length;
    render();
  }
}, 3400);

})();
</script>
