// - Europei a 24 squadre (2016, 2020, 2024): tornano gli ottavi di finale (i migliori terzi classificati passano), niente finale 3°/4°.
// - Mondiali a 24 squadre non-1982 (1986, 1990, 1994) e a 32 squadre (1998-2022): ottavi, quarti, semifinale, finale 3°/4° posto, finale.
// - Mondiale 2026 (48 squadre, nuovo formato): trentaduesimi, ottavi, quarti, semifinale, finale 3°/4° posto, finale.
function bracketFormatFor(ed) {
  if (ed.year === 1982 && ed.type === 'WC') return { special1982: true, rounds: ['SF','F'], hasThirdPlace: true };
  if (ed.slots === 8) return { rounds: ['SF','F'], hasThirdPlace: false };
  if (ed.slots === 16) return { rounds: ['QF','SF','F'], hasThirdPlace: false };
  if (ed.slots === 24 && ed.type === 'EURO') return { rounds: ['R16','QF','SF','F'], hasThirdPlace: false };
  if (ed.slots === 24 && ed.type === 'WC') return { rounds: ['R16','QF','SF','F'], hasThirdPlace: true };
  if (ed.slots === 48) return { rounds: ['R32','R16','QF','SF','F'], hasThirdPlace: true };
  return { rounds: ['R16','QF','SF','F'], hasThirdPlace: true }; // WC a 32 squadre (1998-2022)

function newCareer(coachName, difficulty, startIndex, singleTournament) {
  const idx = (startIndex==null || isNaN(startIndex)) ? 0 : Math.max(0, Math.min(EDITIONS.length-1, startIndex));
  STATE = {
    coachName: coachName || 'CT',
    difficulty: difficulty || 'media',
    editionIndex: idx,
    singleTournament: !!singleTournament,
    log: [],          // storico edizioni concluse: {year,type,result,realResult}

    played: 0, wins:0, draws:0, losses:0,

function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) {} }
function loadGame() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { STATE = JSON.parse(raw); return true; } } catch (e) {} return false; }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function exportSave() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'azzurri82-salvataggio.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importSaveFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try { STATE = JSON.parse(reader.result); saveGame(); VIEW.screen='hub'; render(); }
    catch (e) { alert('File di salvataggio non valido.'); }
  };
  reader.readAsText(file);
}

/* ============================================================
   GENERAZIONE ROSE
   ============================================================ */
function ratingFor(role, seedIdx, era) {
  // rating 52-88 circa, con piccola variabilità
  const base = 58 + Math.round(Math.sin(seedIdx*12.9898)*10 + 10 + (era==='modern'?2:0));
  return Math.max(50, Math.min(90, base + (seedIdx%7)));
}
function genPlayer(role, club, idx) {
  const nome = NOMI[Math.floor(Math.random()*NOMI.length)];
  const cognome = COGNOMI[Math.floor(Math.random()*COGNOMI.length)];
  const age = 19 + Math.floor(Math.random()*15);
  const ovr = 58 + Math.floor(Math.random()*22);
  return { name: nome+' '+cognome, role, club, age, ovr, gen:true, id: 'g'+idx+'-'+Math.random().toString(36).slice(2,7) };
}
function ovrForPoolIndex(idx, poolSize) {
  // assegna un overall plausibile in base alla posizione nella lista (i primi nomi, i più
  // noti/ufficiali, prendono i valori più alti), con una piccola variazione casuale
  const top = 89, bottom = 55;
  const frac = poolSize > 1 ? idx / (poolSize - 1) : 0;
  const base = top - frac * (top - bottom);
  return Math.max(50, Math.min(92, Math.round(base + (Math.random() * 4 - 2))));
}
function buildSquadForEdition(edIdx) {
  const ed = EDITIONS[edIdx];
  const pool = clubPoolForYear(ed.year);
  // combina rosa storica ufficiale + pool ampio di convocabili reali (50-60 per edizione, verificati
  // con ricerca storica) + eventuale nucleo marquee residuo, deduplicando per nome. Tutti reali:
  // niente più riempitivi generati quando il pool storico è già sufficientemente ampio.
  const seen = new Set();
  let real = [];
  (REAL_SQUADS[ed.year] || []).forEach(p => { if (!seen.has(p[0])) { seen.add(p[0]); real.push({ name:p[0], role:p[1], club:p[2], age:p[3] }); } });
  (REAL_POOL[ed.year] || []).forEach(p => { if (!seen.has(p[0])) { seen.add(p[0]); real.push({ name:p[0], role:p[1], club:p[2], age:p[3] }); } });
  (MARQUEE[ed.year] || []).forEach(p => { if (!seen.has(p[0])) { seen.add(p[0]); real.push({ name:p[0], role:p[1], club:p[2], age: 22+Math.floor(Math.random()*10) }); } });
  if (real.length > 62) real = real.slice(0, 62);
  let players = real.map((p,i) => ({ name:p.name, role:p.role, club:p.club, age:p.age, ovr: ovrForPoolIndex(i, real.length), id:'r'+ed.year+'-'+i, real:true }));
  // completa la rosa fino a un minimo di convocabili solo se il pool storico reale è troppo esiguo
  const target = Math.max(28, Math.min(players.length, 60));
  const roleQuota = { POR:4, DIF:9, CEN:9, ATT:6 };
  const have = { POR:0, DIF:0, CEN:0, ATT:0 };
  players.forEach(p => { const r = normRole(p.role); if (have[r]!=null) have[r]++; });
  let gi = 0;
  Object.keys(roleQuota).forEach(r => {
    while (have[r] < roleQuota[r] && players.length < target) {
      const club = pool[Math.floor(Math.random()*pool.length)];
      players.push(genPlayer(r, club, gi++));
      have[r]++;
    }
  });
  while (players.length < target) {
    const r = ['DIF','CEN','ATT'][Math.floor(Math.random()*3)];
    players.push(genPlayer(r, pool[Math.floor(Math.random()*pool.length)], gi++));
  }
  return players;
}
function normRole(role) {
  if (role==='POR') return 'POR';
  if (['DIF','DC','TD','TS'].includes(role)) return 'DIF';
  if (['CEN','CC','ED','ES','TQ'].includes(role)) return 'CEN';
  return 'ATT';
}

function genOpponentTeam(nation, year, difficultyMult) {
  const strength = Math.max(40, Math.min(97, Math.round(nation.base * difficultyMult + (Math.random()*10-5))));
  const players = [];
  const roles = ['POR','DIF','DIF','DIF','DIF','CEN','CEN','CEN','CEN','ATT','ATT'];
  const usedNames = new Set();
  const stars = (OPPONENT_STARS[nation.code] || []).filter(s => year>=s[2] && year<=s[3]);
  shuffle(stars);
  roles.forEach((r) => {
    const starIdx = stars.findIndex(s => s[1]===r);
    if (starIdx >= 0) {
      const s = stars.splice(starIdx,1)[0];
      players.push({ name:s[0], role:r, ovr: Math.min(96, strength + 6 + Math.round(Math.random()*4)), real:true });
      return;
    }
    let name = genOpponentPlayerName(nation), tries = 0;
    while (usedNames.has(name) && tries++ < 8) name = genOpponentPlayerName(nation);
    usedNames.add(name);
    players.push({ name, role:r, ovr: strength + Math.round(Math.random()*8-4) });
  });
  return { name: nationName(nation, year), code: nation.code, strength, players, formation: pickOpponentFormation(year) };
}
function pickOpponentFormation(year) {
  const keys = Object.keys(FORMATIONS);
  return keys[Math.floor(Math.random()*keys.length)];
}

const DIFF_MULT = { facile:0.86, media:1.0, difficile:1.14, realistica:1.0 };
const DIFF_VARIANCE = { facile:1.15, media:1.0, difficile:0.95, realistica:0.8 };

function teamOverall(squad, xiIds, formationKey, tactics) {
  const f = FORMATIONS[formationKey];
  const xi = xiIds.map(id => squad.find(p=>p.id===id)).filter(Boolean);
  const atkPlayers = xi.filter(p => normRole(p.role)==='ATT' || normRole(p.role)==='CEN');
  const defPlayers = xi.filter(p => normRole(p.role)==='DIF' || p.role==='POR');
  const avg = arr => arr.length ? arr.reduce((a,p)=>a+p.ovr,0)/arr.length : 60;
  const m = MENTALITA[tactics.mentalita] || MENTALITA.equilibrato;
  const pr = PRESSING[tactics.pressing] || PRESSING.medio;
  return {
    attack: avg(atkPlayers) + f.atk + m.atk,
    defense: avg(defPlayers) + f.def + m.def,
    overall: avg(xi),
    pressBonus: pr.turnover, cardRisk: pr.cardi, staminaDrain: pr.stamina,
  };
}

function createMatch(homeIsItaly, italySquad, italyXiIds, italyFormation, italyTactics, opponent, context) {
  const diffMult = DIFF_MULT[STATE.difficulty] || 1;
  const variance = DIFF_VARIANCE[STATE.difficulty] || 1;
  const itRatings = teamOverall(italySquad, italyXiIds, italyFormation, italyTactics);
  const oppTactics = { mentalita:'equilibrato', pressing:'medio' };
  const oppXi = opponent.players;
  const oppAvg = arr => arr.reduce((a,p)=>a+p.ovr,0)/arr.length;
  const oppRatings = { attack: oppAvg(oppXi.filter(p=>normRole(p.role)!=='DIF'&&p.role!=='POR')) , defense: oppAvg(oppXi.filter(p=>normRole(p.role)==='DIF'||p.role==='POR')), overall: opponent.strength, pressBonus:0, cardRisk:0, staminaDrain:0 };
  oppRatings.attack *= diffMult; oppRatings.defense *= diffMult;
  const homeBonus = context.venue === 'casa' ? 4 : (context.venue === 'trasferta' ? -3 : 0);
  return {
    minute: 0, added:0, half:1, halfAdded:0,
    homeIsItaly,
    italy: { squad: italySquad, xiIds: italyXiIds.slice(), subs: italySquad.filter(p=>!italyXiIds.includes(p.id)).map(p=>p.id), formation: italyFormation, tactics: Object.assign({},italyTactics), ratings: itRatings, homeBonus: homeIsItaly?homeBonus:-homeBonus, score:0, cards:{}, subsUsed:0, subsLog:[], stats:{shots:0,shotsOnTarget:0,possess:50,corners:0,fouls:0} },
    opp: { team: opponent, ratings: oppRatings, homeBonus: homeIsItaly?-homeBonus:homeBonus, score:0, cards:{}, subsUsed:0, stats:{shots:0,shotsOnTarget:0,possess:50,corners:0,fouls:0} },
    events: [],
    variance,
    context,
    finished:false,
    playerRatings: {}, // id -> array of contribution deltas
    motm: null,
  };
}

function bumpRating(match, playerId, delta) {
  if (!match.playerRatings[playerId]) match.playerRatings[playerId] = 6.0;
  match.playerRatings[playerId] = Math.max(3, Math.min(10, match.playerRatings[playerId] + delta));
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmt(tpl, vars){ return tpl.replace(/\{(\w+)\}/g, (_,k)=> vars[k]||''); }
function sideTeamName(match, side){ return side==='italy' ? 'l\'Italia' : match.opp.team.name; }

function pickAttacker(match, side) {
  const list = side==='italy' ? match.italy.xiIds.map(id=>match.italy.squad.find(p=>p.id===id)).filter(p=>normRole(p.role)!=='DIF'&&p.role!=='POR')
                              : match.opp.team.players.filter(p=>normRole(p.role)!=='DIF'&&p.role!=='POR');
  if (!list.length) return {name:'un giocatore'};
  return pick(list);
}
function pickDefenderOrAny(match, side) {
  const list = side==='italy' ? match.italy.xiIds.map(id=>match.italy.squad.find(p=>p.id===id)).filter(Boolean)
                              : match.opp.team.players;
  if (!list.length) return {name:'un giocatore'};
  return pick(list);
}

// genera gli eventi dei minuti da (match.minute+1) a targetMinute (incluso), rispettando meta' tempo
function advanceToMinute(match, targetMinute) {
  const hardCap = match.half===1 ? (45+match.halfAdded) : (90+match.halfAdded);
  const cap = Math.min(targetMinute, hardCap);
  for (let m = match.minute+1; m <= cap; m++) {
    simulateOneMinute(match, m);
  }
  match.minute = cap;
  return match.minute >= hardCap;
}

function simulateOneMinute(match, minute) {
  const it = match.italy.ratings, op = match.opp.ratings;
  const diffIt = (it.attack + match.italy.homeBonus) - op.defense;
  const diffOp = (op.attack + match.opp.homeBonus) - it.defense;
  const v = match.variance;
  const fatigueFactor = minute > 70 ? 1.25 : 1;
  const chanceItProb = clamp(0.028 + diffIt*0.0022, 0.006, 0.16) * v * fatigueFactor;
  const chanceOpProb = clamp(0.028 + diffOp*0.0022, 0.006, 0.16) * v * fatigueFactor;
  const cardProb = 0.012 + (match.italy.tactics.pressing==='alto'?0.006:0);
  const injuryProb = 0.004;
  const cornerItProb = chanceItProb * 0.85;
  const cornerOpProb = chanceOpProb * 0.85;
  const offsideProb = 0.018;
  const goodDefenseProb = 0.03;
  const foulProb = 0.045;
  const keeperProb = 0.03;
  const benchProb = 0.02;

  const roll = Math.random();
  let acc = 0;
  const bump = (p) => { acc += p; return roll < acc; };

  if (bump(chanceItProb)) { resolveChance(match, minute, 'italy', diffIt); return; }
  if (bump(chanceOpProb)) { resolveChance(match, minute, 'opp', diffOp); return; }
  if (bump(cardProb)) { resolveCard(match, minute, Math.random()<0.5?'italy':'opp'); return; }
  if (bump(injuryProb)) { resolveInjury(match, minute, Math.random()<0.5?'italy':'opp'); return; }
  if (bump(cornerItProb)) { resolveCorner(match, minute, 'italy'); return; }
  if (bump(cornerOpProb)) { resolveCorner(match, minute, 'opp'); return; }
  if (bump(offsideProb)) { resolveOffside(match, minute, Math.random()<0.5?'italy':'opp'); return; }
  if (bump(goodDefenseProb)) { resolveGoodDefense(match, minute, Math.random()<0.5?'italy':'opp'); return; }
  if (bump(foulProb)) { resolveFoul(match, minute, Math.random()<0.5?'italy':'opp'); return; }
  if (bump(keeperProb)) { match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.keeperAction), {team:sideTeamName(match, Math.random()<0.5?'italy':'opp')}) }); return; }
  if (bump(benchProb)) { match.events.push({ minute, type:'quiet', text: pick(COMMENT_BANKS.bench) }); return; }
  // fase di gioco senza eventi netti: quasi sempre narrata comunque
  if (Math.random() < 0.7) {
    const momentum = diffIt - diffOp;
    if (Math.abs(momentum) > 3 && Math.random() < 0.6) {
      const side = momentum > 0 ? 'italy' : 'opp';
      match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.quietAttacking), {team:sideTeamName(match, side)}) });
    } else {
      match.events.push({ minute, type:'quiet', text: pick(COMMENT_BANKS.quietNeutral) });
    }
  }
}
function resolveCorner(match, minute, side) {
  const p = pickAttacker(match, side);
  match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.corner), {team:sideTeamName(match,side), p:p.name}) });
  if (Math.random() < 0.55) match.events.push({ minute, type:'quiet', text: pick(COMMENT_BANKS.cornerFollow) });
  const teamObj = side==='italy' ? match.italy : match.opp;
  teamObj.stats.corners = (teamObj.stats.corners||0) + 1;
}
function resolveOffside(match, minute, side) {
  const p = pickAttacker(match, side);
  match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.offside), {team:sideTeamName(match,side), p:p.name}) });
}
function resolveGoodDefense(match, minute, side) {
  // difesa del lato opposto a chi stava attaccando
  const defSide = side==='italy' ? 'opp' : 'italy';
  const p = pickDefenderOrAny(match, defSide);
  match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.goodDefense), {p:p.name}) });
}
function resolveFoul(match, minute, side) {
  const p = pickDefenderOrAny(match, side);
  match.events.push({ minute, type:'quiet', text: fmt(pick(COMMENT_BANKS.foulNoCard), {team:sideTeamName(match,side), p:p.name}) });
}

function resolveChance(match, minute, side, diff) {
  const finishProb = clamp(0.24 + diff*0.006, 0.08, 0.55);
  const scorer = pickAttacker(match, side);
  const isGoal = Math.random() < finishProb;
  const teamObj = side==='italy' ? match.italy : match.opp;
  teamObj.stats.shots++; if (Math.random()<0.6) teamObj.stats.shotsOnTarget++;
  if (isGoal) {
    teamObj.score++;
    const bank = COMMENT_BANKS.goal;
    match.events.push({ minute, type:'goal', side, text: fmt(pick(bank), {p:scorer.name}), scorer: scorer.name, scorerId: scorer.id });
    if (side==='italy' && scorer.id) bumpRating(match, scorer.id, 1.4);
    if (side==='italy') {
      const assister = pickAttacker(match,'italy');
      if (assister.id && assister.id !== scorer.id && Math.random()<0.6) bumpRating(match, assister.id, 0.4);
    }
  } else {
    match.events.push({ minute, type:'chance', side, text: fmt(pick(COMMENT_BANKS.chanceMiss), {p:scorer.name}) });
    if (side==='italy' && scorer.id) bumpRating(match, scorer.id, 0.15);
  }
}
function resolveCard(match, minute, side) {
  const p = pickDefenderOrAny(match, side);
  const isRed = Math.random() < 0.08;
  const teamObj = side==='italy'?match.italy:match.opp;
  if (isRed) {
    teamObj.cards[p.id||p.name] = 'rosso';
    match.events.push({ minute, type:'card-r', side, text: fmt(pick(COMMENT_BANKS.red), {p:p.name}) });
    if (side==='italy' && p.id) { bumpRating(match, p.id, -1.5); const idx=match.italy.xiIds.indexOf(p.id); if(idx>=0) match.italy.xiIds.splice(idx,1); }
  } else {
    teamObj.cards[p.id||p.name] = (teamObj.cards[p.id||p.name]==='giallo') ? 'rosso' : 'giallo';
    match.events.push({ minute, type: teamObj.cards[p.id||p.name]==='rosso'?'card-r':'card-y', side, text: fmt(pick(COMMENT_BANKS.yellow), {p:p.name}) });
    if (side==='italy' && p.id) bumpRating(match, p.id, teamObj.cards[p.id||p.name]==='rosso' ? -1.5 : -0.3);
  }
}
function resolveInjury(match, minute, side) {
  const p = pickDefenderOrAny(match, side);
  match.events.push({ minute, type:'injury', side, text: fmt(pick(COMMENT_BANKS.injury), {p:p.name}) });
  if (side==='italy' && p.id) bumpRating(match, p.id, -0.2);
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function makeSubstitution(match, outId, inId, minute) {
  if (match.italy.subsUsed >= maxSubsForYear(match.context.year)) return false;
  const idx = match.italy.xiIds.indexOf(outId);
  if (idx<0) return false;
  const pOut = match.italy.squad.find(p=>p.id===outId);
  const pIn = match.italy.squad.find(p=>p.id===inId);
  match.italy.xiIds[idx] = inId;
  match.italy.subsUsed++;
  match.italy.subsLog.push({outId,inId,minute});
  match.events.push({ minute, type:'sub', side:'italy', text: fmt(pick(COMMENT_BANKS.sub), {p1:pOut?pOut.name:'?', p2:pIn?pIn.name:'?'}) });
  return true;
}

function computePagelle(match) {
  const rows = [];
  match.italy.squad.forEach(p => {
    const played = match.playerRatings[p.id] != null || match.italy.xiIds.includes(p.id) || match.italy.subsLog.some(s=>s.inId===p.id||s.outId===p.id);
    if (!played) return;
    let voto = match.playerRatings[p.id] != null ? match.playerRatings[p.id] : 6.0;
    voto = Math.round(voto*10)/10;
    let comment;
    if (voto>=7.5) comment = pick(['Prestazione superba, tra i migliori in campo.','Decisivo, ha fatto la differenza.','Partita di grande sostanza e qualità.']);
    else if (voto>=6.5) comment = pick(['Ordinato e affidabile, buona prova.','Ha retto bene l\'urto della partita.','Prova solida senza sbavature.']);
    else if (voto>=5.5) comment = pick(['Prova sufficiente, senza brillare.','Alti e bassi ma nel complesso ok.','Corretto ma poco incisivo.']);
    else comment = pick(['Serataccia, in difficoltà per tutta la gara.','Non pervenuto, prova da dimenticare.','Troppi errori, il ct lo toglie a fine partita.']);
    rows.push({ id:p.id, name:p.name, role:p.role, voto, comment });
  });
  rows.sort((a,b)=> b.voto-a.voto);
  return rows;
}

function generateHeadline(match) {
  const it = match.italy.score, op = match.opp.score;
  const oppName = match.opp.team.name;
  if (it>op) return pick([
    `Azzurri implacabili: ${it}-${op} a ${oppName}, la Nazionale vola`,
    `Notte magica: Italia-${oppName} ${it}-${op}, che prestazione!`,
    `Italia corsara: piegata ${oppName} per ${it}-${op}`
  ]);
  if (it<op) return pick([
    `Doccia fredda: ${oppName} passa ${op}-${it}, azzurri nel caos`,
    `Crolla la Nazionale: ${op}-${it} contro ${oppName}, è polemica`,
    `Notte fonda: ${oppName} batte l'Italia ${op}-${it}`
  ]);
  return pick([
    `Pareggio amaro: ${it}-${op} con ${oppName}, occasione sprecata`,
    `Equilibrio totale: finisce ${it}-${op} con ${oppName}`,
  ]);
}

/* ============================================================
   QUALIFICAZIONI E CALENDARIO
   ============================================================ */
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

// Gironi di qualificazione REALI dell'Italia, verificati per ogni edizione 1982-2026 (fonti incrociate:
// Wikipedia, RSSSF/athlet.org, UEFA.com). Note sul formato:
// - 1986 e 1990: nessun vero girone di qualificazione (l'Italia era qualificata di diritto come campione
//   del mondo uscente nel 1986, e come paese ospitante nel 1990) — solo amichevoli di preparazione.
// - 1984, 1988, 1992 (Europei a 8 squadre): in quel formato NON esisteva alcuno spareggio per la seconda
//   classificata, solo la prima del girone passava il turno.
// - 1996: l'Italia arrivò seconda nel girone ma passò comunque come una delle "migliori seconde" UEFA,
//   senza dover giocare uno spareggio.
// - 1998, 2018, 2022, 2026: l'Italia arrivò seconda nel girone e giocò davvero uno spareggio, rispettivamente
//   contro Russia (vinto), Svezia (perso), Macedonia del Nord (perso), Irlanda del Nord (semifinale spareggio, vinta;
//   nella realtà la finale del percorso spareggi fu poi persa contro la Bosnia-Erzegovina).
// Per le edizioni in cui l'Italia arriva seconda nella simulazione ma nella realtà non lo fu (la storia qui
// può essere riscritta), lo spareggio si gioca comunque contro un avversario generato, dato che nella realtà
// quello specifico spareggio non è mai esistito.
const REAL_QUAL_GROUPS = {
  1982: { opponents:['DEN','GRE','LUX','YUG'] },
  1984: { opponents:['TCH','CYP','ROU','SWE'], onlyWinnerQualifies:true },
  1986: { bye:'qualificata di diritto: campione del mondo uscente (Spagna 1982)' },
  1988: { opponents:['MLT','POR','SWE','SUI'], onlyWinnerQualifies:true },
  1990: { bye:'qualificata di diritto: paese ospitante' },
  1992: { opponents:['CYP','HUN','NOR','RUS'], onlyWinnerQualifies:true },
  1994: { opponents:['EST','MLT','POR','SCO','SUI'] },
  1996: { opponents:['CRO','EST','LTU','SVN','UKR'], secondQualifiesDirect:true },
  1998: { opponents:['ENG','GEO','MDA','POL'], playoffOpponent:'RUS' },
  2000: { opponents:['BLR','DEN','SUI','WAL'] },
  2002: { opponents:['GEO','HUN','LTU','ROU'] },
  2004: { opponents:['AZE','FIN','SCG','WAL'] },
  2006: { opponents:['BLR','MDA','NOR','SCO','SVN'] },
  2008: { opponents:['FRO','FRA','GEO','LTU','SCO','UKR'] },
  2010: { opponents:['BUL','CYP','GEO','IRL','MNE'] },
  2012: { opponents:['EST','FRO','NIR','SRB','SVN'] },
  2014: { opponents:['ARM','BUL','CZE','DEN','MLT'] },
  2016: { opponents:['AZE','BUL','CRO','MLT','NOR'] },
  2018: { opponents:['ALB','ISR','LIE','MKD','ESP'], playoffOpponent:'SWE' },
  2020: { opponents:['ARM','BIH','FIN','GRE','LIE'] },
  2022: { opponents:['BUL','LTU','NIR','SUI'], playoffOpponent:'MKD' },
  2024: { opponents:['ENG','MLT','MKD','UKR'] },
  2026: { opponents:['EST','ISR','MDA','NOR'], playoffOpponent:'NIR' },
};

function buildCalendar(ed) {
  // circa due anni di qualificazioni e amichevoli prima dell'edizione
  const startYear = ed.year - 2;
  const nations = nationsForYear(ed.year).filter(n => n.code !== 'ITA');
  const real = REAL_QUAL_GROUPS[ed.year];
  let uniq;
  if (real && real.bye) {
    uniq = [];
  } else if (real && real.opponents) {
    uniq = real.opponents.map(code => NATIONS.find(n=>n.code===code)).filter(Boolean);
  } else {
    // fallback generato: nessun dato reale verificato per quest'edizione
    shuffle(nations);
    const strong = nations.filter(n=>n.base>=78);
    const mid = nations.filter(n=>n.base>=63 && n.base<78);
    const weak = nations.filter(n=>n.base<63);
    const picks = [pick(strong)||nations[0], pick(strong)||nations[1], pick(mid)||nations[2], pick(mid)||nations[3], pick(weak)||nations[4]];
    uniq = []; picks.forEach(g=>{ if (g && !uniq.includes(g)) uniq.push(g); });
    while (uniq.length<5) { const c = pick(nations); if (!uniq.includes(c)) uniq.push(c); }
  }

  function friendlyOpponent() {
    let c = pick(nations);
    let tries = 0;
    while (uniq.includes(c) && tries++ < 20) c = pick(nations);
    return c;
  }

  const matches = [];
  let month = 2, year = startYear; // marzo
  function nextSlot(){ month += 2; if (month>11) { month -= 12; year++; } }
  matches.push({ kind:'amichevole', label:'Amichevole', opponent: friendlyOpponent(), venue: Math.random()<0.5?'casa':'trasferta', month, year });
  nextSlot();
  matches.push({ kind:'amichevole', label:'Amichevole', opponent: friendlyOpponent(), venue: Math.random()<0.5?'casa':'trasferta', month, year });
  nextSlot();
  uniq.forEach((opp,i) => {
    matches.push({ kind:'qualificazione', label:`Qualificazione — Girone`, opponent: opp, venue:'casa', month, year, roundOf: i });
    nextSlot();
    matches.push({ kind:'qualificazione', label:`Qualificazione — Girone`, opponent: opp, venue:'trasferta', month, year, roundOf: i });
    nextSlot();
    if (i===1 || i===3) { matches.push({ kind:'amichevole', label:'Amichevole', opponent: friendlyOpponent(), venue: Math.random()<0.5?'casa':'trasferta', month, year }); nextSlot(); }
  });
  matches.push({ kind:'amichevole', label:'Amichevole pre-torneo', opponent: friendlyOpponent(), venue:'casa', month, year });
  nextSlot();
  matches.push({ kind:'amichevole', label:'Amichevole pre-torneo', opponent: friendlyOpponent(), venue:'casa', month: ed.year===new Date().getFullYear()?month:5, year: ed.year });
  matches.forEach((m,i) => m.id = 'q'+i);
  return {
    matches, group: uniq, standings: buildStandingsInit(uniq),
    bye: real && real.bye, onlyWinnerQualifies: !!(real && real.onlyWinnerQualifies),
    secondQualifiesDirect: !!(real && real.secondQualifiesDirect),
    playoffOpponentCode: real && real.playoffOpponent,
    isRealGroup: !!(real && real.opponents),
  };
}
function buildStandingsInit(group) {
  const t = { ITA: {name:'Italia', code:'ITA', pt:0, g:0, v:0, n:0, p:0, gf:0, gs:0} };
  group.forEach(n => { t[n.code] = { name:null, code:n.code, pt:0, g:0, v:0, n:0, p:0, gf:0, gs:0, nationRef:n }; });
  return t;
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function simulateQuickMatch(strengthA, strengthB, variance) {
  // simulazione rapida (senza minuto per minuto) per partite non giocate dal CT
  const diff = (strengthA - strengthB) * (variance||1);
  const lam = (base) => Math.max(0.15, base + diff*0.02 + (Math.random()*1.4-0.7));
  let a = poissonish(lam(1.3)), b = poissonish(lam(1.1) - diff*0.04);
  return { a: Math.max(0,Math.round(a)), b: Math.max(0,Math.round(b)) };
}
function poissonish(lambda){ let x=0, p=1, L=Math.exp(-Math.max(0.05,lambda)); do { x++; p*=Math.random(); } while (p>L); return x-1+ (Math.random()<0.3?0:0); }

function updateStandings(table, codeA, codeB, gA, gB) {
  const a = table[codeA], b = table[codeB];
  a.g++; b.g++; a.gf+=gA; a.gs+=gB; b.gf+=gB; b.gs+=gA;
  if (gA>gB) { a.v++; a.pt+=3; b.p++; }
  else if (gA<gB) { b.v++; b.pt+=3; a.p++; }
  else { a.n++; b.n++; a.pt++; b.pt++; }
}

/* ============================================================
   FLUSSO DI UN'EDIZIONE
   ============================================================ */
function startEdition(idx) {
  const ed = EDITIONS[idx];
  const squad = buildSquadForEdition(idx);
  const cal = buildCalendar(ed);
  STATE.edition = {
    idx, phase:'intro',
    squad, provisionalIds: squad.slice(0,26).map(p=>p.id).length? squad.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,26).map(p=>p.id) : [],
    calendar: cal.matches, group: cal.group, standings: cal.standings,
    matchIdx: 0, qualified: null,
    bye: cal.bye || null, onlyWinnerQualifies: cal.onlyWinnerQualifies, secondQualifiesDirect: cal.secondQualifiesDirect,
    playoffOpponentCode: cal.playoffOpponentCode, isRealGroup: cal.isRealGroup, playoffPending: null,
    tactics: { formation:'4-4-2', mentalita:'equilibrato', pressing:'medio', ampiezza:'normale' },
    finals: null,
    resultText: null,
  };
  if (cal.bye) { STATE.edition.qualified = true; STATE.edition.qualMethod = 'bye'; }
  // selezione iniziale: i migliori per ruolo
  autoSelectXI();
}
function currentEd() { return STATE.edition; }
function edMeta() { return EDITIONS[STATE.edition.idx]; }

function formationRoleCounts(formationKey) {
  const roles = (FORMATIONS[formationKey] || FORMATIONS['4-4-2']).roles;
  const counts = { POR:0, DIF:0, CEN:0, ATT:0 };
  roles.forEach(r => counts[normRole(r)]++);
  return counts;
}
function autoSelectXI() {
  const e = currentEd();
  const pool = e.squad.filter(p => e.provisionalIds.includes(p.id));
  const byRole = r => pool.filter(p=>normRole(p.role)===r).sort((a,b)=>b.ovr-a.ovr);
  const counts = formationRoleCounts(e.tactics.formation);
  const gk = byRole('POR').slice(0,counts.POR);
  const df = byRole('DIF').slice(0,counts.DIF);
  const md = byRole('CEN').slice(0,counts.CEN);
  const fw = byRole('ATT').slice(0,counts.ATT);
  e.currentXI = [...gk,...df,...md,...fw].map(p=>p.id);
  if (e.currentXI.length < 11) {
    const rest = pool.filter(p=>!e.currentXI.includes(p.id)).sort((a,b)=>b.ovr-a.ovr);
    while (e.currentXI.length<11 && rest.length) e.currentXI.push(rest.shift().id);
  }
}

function advanceQualCalendar() {
  const e = currentEd();
  while (e.matchIdx < e.calendar.length && e.calendar[e.matchIdx].played) e.matchIdx++;
}

function playNextQualMatch() {
  const e = currentEd();
  const fixture = e.calendar[e.matchIdx];
  if (!fixture) return null;
  const ed = edMeta();
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const opp = genOpponentTeam(fixture.opponent, ed.year, diffMult);
  const italySquad = e.squad.filter(p => e.provisionalIds.includes(p.id));
  const match = createMatch(true, italySquad, e.currentXI, e.tactics.formation, e.tactics, opp, { venue: fixture.venue, year: ed.year, label: fixture.label+' vs '+nationName(fixture.opponent, ed.year) });
  return { fixture, match, opp };
}

function finalizeQualMatch(fixture, match) {
  const e = currentEd();
  fixture.played = true;
  fixture.score = { it: match.italy.score, op: match.opp.score };
  if (fixture.kind === 'qualificazione') {
    const nation = fixture.opponent;
    updateStandings(e.standings, 'ITA', nation.code, match.italy.score, match.opp.score);
  }
  e.matchIdx++;
  // simula rapidamente le altre partite del girone non giocate dall'Italia, quando serve completare il quadro
  simulateRestOfGroupIfNeeded();
  saveGame();
}
function simulateRestOfGroupIfNeeded() {
  const e = currentEd();
  // conta quante partite di qualificazione mancano per l'Italia
  const remainingIt = e.calendar.filter(m=>m.kind==='qualificazione' && !m.played).length;
  if (remainingIt === 0) {
    // completa scontri diretti fra le altre nazionali del girone per rendere plausibile la classifica
    e.group.forEach((n1,i) => e.group.forEach((n2,j) => {
      if (i<j) {
        const key = n1.code+'-'+n2.code+'-cross';
        if (!e._crossDone) e._crossDone = {};
        if (!e._crossDone[key]) {
          const r1 = simulateQuickMatch(n1.base, n2.base, 1);
          updateStandings(e.standings, n1.code, n2.code, r1.a, r1.b);
          const r2 = simulateQuickMatch(n2.base, n1.base, 1);
          updateStandings(e.standings, n2.code, n1.code, r2.a, r2.b);
          e._crossDone[key] = true;
        }
      }
    }));
    determineQualification();
  }
}
function determineQualification() {
  const e = currentEd();
  if (e.qualified !== null) return; // già determinata (es. bye storico)
  const ed = edMeta();
  const rows = Object.values(e.standings).map(r => Object.assign({}, r, { name: r.code==='ITA'?'Italia':nationName(r.nationRef, ed.year) }));
  rows.sort((a,b)=> b.pt-a.pt || (b.gf-b.gs)-(a.gf-a.gs) || b.gf-a.gf);
  e.finalStandings = rows;
  const italyPos = rows.findIndex(r=>r.code==='ITA');
  if (italyPos === 0) { e.qualified = true; e.qualMethod = 'diretta'; }
  else if (italyPos === 1 && e.secondQualifiesDirect) {
    e.qualified = true; e.qualMethod = 'ripescaggio';
  } else if (italyPos === 1 && e.onlyWinnerQualifies) {
    e.qualified = false; e.qualMethod = 'solo-vincitrice';
  } else if (italyPos === 1) {
    // spareggio vero e proprio, giocato: l'avversario reale se l'Italia lo affrontò davvero in quella posizione,
    // altrimenti un avversario generato (quello spareggio, in quella forma, non è mai esistito nella realtà)
    const oppNation = e.playoffOpponentCode ? NATIONS.find(n=>n.code===e.playoffOpponentCode) : pick(nationsForYear(ed.year).filter(n=>n.code!=='ITA' && !e.group.includes(n)));
    e.playoffPending = { opponent: oppNation, real: !!e.playoffOpponentCode };
    e.qualMethod = 'spareggio';
  } else {
    e.qualified = false;
    e.qualMethod = 'eliminata';
  }
}
function playPlayoffMatch() {
  const e = currentEd(); const ed = edMeta();
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const opp = genOpponentTeam(e.playoffPending.opponent, ed.year, diffMult*1.05);
  const italySquad = e.squad.filter(p => e.provisionalIds.includes(p.id));
  const match = createMatch(true, italySquad, e.currentXI, e.tactics.formation, e.tactics, opp, { venue:'casa', year: ed.year, label:'Spareggio qualificazione vs '+nationName(e.playoffPending.opponent, ed.year) });
  return { match, opp };
}
function finalizePlayoffMatch(match, pen) {
  const e = currentEd(); const ed = edMeta();
  const won = pen ? pen.won : match.italy.score > match.opp.score;
  e.playoffPending.result = `${match.italy.score}-${match.opp.score}` + (pen?` (rig. ${pen.score})`:'');
  e.playoffPending.won = won;
  e.qualified = won;
  saveGame();
}

function startFinals() {
  const e = currentEd();
  if (e.finals) return;
  const ed = edMeta();
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const nations = nationsForYear(ed.year).filter(n=>n.code!=='ITA' && !e.group.includes(n));
  shuffle(nations);
  const groupOpponents = nations.slice(0,3);
  const finalsSquadIds = e.squad.filter(p=>e.provisionalIds.includes(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0, ed.squadSize).map(p=>p.id);
  e.finals = {
    phase: 'group', squadIds: finalsSquadIds, opponents: groupOpponents, matches: [], matchIdx: 0,
    standings: (function(){ const t={ITA:{code:'ITA',name:'Italia',pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0}}; groupOpponents.forEach(n=>t[n.code]={code:n.code,name:nationName(n,ed.year),pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0,nationRef:n}); return t; })(),
    bracket: null, out: false, result: null,
  };
  groupOpponents.forEach(n => e.finals.matches.push({ kind:'girone-finale', opponent:n, venue:'neutro' }));
}

function playFinalsMatch() {
  const e = currentEd(); const ed = edMeta();
  const fixture = e.finals.matches[e.finals.matchIdx];
  if (!fixture) return null;
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const opp = genOpponentTeam(fixture.opponent, ed.year, diffMult);
  const italySquad = e.squad.filter(p=>e.finals.squadIds.includes(p.id));
  const match = createMatch(true, italySquad, e.currentXI.filter(id=>e.finals.squadIds.includes(id)).length===11?e.currentXI:autoXIFromIds(e.finals.squadIds), e.tactics.formation, e.tactics, opp, { venue:'neutro', year: ed.year, label:'Fase a gironi vs '+nationName(fixture.opponent,ed.year) });
  return { fixture, match, opp };
}
function autoXIFromIds(ids) {
  const e = currentEd();
  const pool = e.squad.filter(p=>ids.includes(p.id));
  const byRole = r => pool.filter(p=>normRole(p.role)===r).sort((a,b)=>b.ovr-a.ovr);
  return [...byRole('POR').slice(0,1),...byRole('DIF').slice(0,4),...byRole('CEN').slice(0,4),...byRole('ATT').slice(0,2)].map(p=>p.id);
}
function finalizeFinalsMatch(fixture, match) {
  const e = currentEd(); const ed = edMeta();
  fixture.played = true; fixture.score = { it: match.italy.score, op: match.opp.score };
  updateStandings(e.finals.standings, 'ITA', fixture.opponent.code, match.italy.score, match.opp.score);
  e.finals.matchIdx++;
  if (e.finals.matchIdx >= e.finals.matches.length) {
    // completa gli altri incroci del girone
    const opps = e.finals.opponents;
    for (let i=0;i<opps.length;i++) for (let j=i+1;j<opps.length;j++) {
      const r = simulateQuickMatch(opps[i].base, opps[j].base, 1);
      updateStandings(e.finals.standings, opps[i].code, opps[j].code, r.a, r.b);
    }
    const rows = Object.values(e.finals.standings).sort((a,b)=> b.pt-a.pt || (b.gf-b.gs)-(a.gf-a.gs) || b.gf-a.gf);
    e.finals.groupStandings = rows;
    const italyPos = rows.findIndex(r=>r.code==='ITA');
    if (italyPos <= 1) {
      const fmt = bracketFormatFor(ed);
      if (fmt.special1982) buildSecondGroup1982(); else buildKnockoutBracket();
    }
    else { e.finals.out = true; e.finals.result = 'Eliminata al girone'; }
  }
  saveGame();
}
// Formula speciale del Mondiale 1982: dopo il primo girone, un secondo girone da 3 squadre
// (mini-campionato all'italiana, sola andata) al posto degli ottavi di finale. Solo la prima
// classificata del secondo girone passa in semifinale.
function buildSecondGroup1982() {
  const e = currentEd(); const ed = edMeta();
  const usedNations = [...e.group, ...e.finals.opponents];
  const others = nationsForYear(ed.year).filter(n=>n.code!=='ITA' && !usedNations.includes(n));
  shuffle(others);
  const opponents = others.slice(0,2);
  e.finals.secondGroup = {
    opponents, matches: opponents.map(n=>({ kind:'secondo-girone-82', opponent:n, venue:'neutro' })), matchIdx:0,
    standings: (function(){ const t={ITA:{code:'ITA',name:'Italia',pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0}}; opponents.forEach(n=>t[n.code]={code:n.code,name:nationName(n,ed.year),pt:0,g:0,v:0,n:0,p:0,gf:0,gs:0,nationRef:n}); return t; })(),
  };
}
function playSecondGroupMatch1982() {
  const e = currentEd(); const ed = edMeta();
  const fixture = e.finals.secondGroup.matches[e.finals.secondGroup.matchIdx];
  if (!fixture) return null;
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const opp = genOpponentTeam(fixture.opponent, ed.year, diffMult*1.05);
  const italySquad = e.squad.filter(p=>e.finals.squadIds.includes(p.id));
  const match = createMatch(true, italySquad, e.currentXI.filter(id=>e.finals.squadIds.includes(id)).length===11?e.currentXI:autoXIFromIds(e.finals.squadIds), e.tactics.formation, e.tactics, opp, { venue:'neutro', year: ed.year, label:'Secondo girone (formula 1982) vs '+nationName(fixture.opponent,ed.year) });
  return { fixture, match, opp };
}
function finalizeSecondGroupMatch1982(fixture, match) {
  const e = currentEd();
  fixture.played = true; fixture.score = { it: match.italy.score, op: match.opp.score };
  updateStandings(e.finals.secondGroup.standings, 'ITA', fixture.opponent.code, match.italy.score, match.opp.score);
  e.finals.secondGroup.matchIdx++;
  if (e.finals.secondGroup.matchIdx >= e.finals.secondGroup.matches.length) {
    const opps = e.finals.secondGroup.opponents;
    const r = simulateQuickMatch(opps[0].base, opps[1].base, 1);
    updateStandings(e.finals.secondGroup.standings, opps[0].code, opps[1].code, r.a, r.b);
    const rows = Object.values(e.finals.secondGroup.standings).sort((a,b)=> b.pt-a.pt || (b.gf-b.gs)-(a.gf-a.gs) || b.gf-a.gf);
    e.finals.secondGroup.finalStandings = rows;
    if (rows[0].code === 'ITA') { buildKnockoutBracket(); }
    else { e.finals.out = true; e.finals.result = 'Eliminata al secondo girone (formula Mondiale 1982)'; }
  }
  saveGame();
}
function buildKnockoutBracket() {
  const e = currentEd(); const ed = edMeta();
  const fmt = bracketFormatFor(ed);
  const usedNations = [...e.group, ...e.finals.opponents, ...(e.finals.secondGroup ? e.finals.secondGroup.opponents : [])];
  const others = nationsForYear(ed.year).filter(n=>n.code!=='ITA' && !usedNations.includes(n));
  shuffle(others);
  e.finals.bracket = { rounds: fmt.rounds, hasThirdPlace: fmt.hasThirdPlace, round: fmt.rounds[0], italyAlive:true, opponent: others[0], history: [] };
}
function playKnockoutMatch() {
  const e = currentEd(); const ed = edMeta();
  const diffMult = DIFF_MULT[STATE.difficulty]||1;
  const opp = genOpponentTeam(e.finals.bracket.opponent, ed.year, diffMult*1.05);
  const italySquad = e.squad.filter(p=>e.finals.squadIds.includes(p.id));
  const match = createMatch(true, italySquad, e.currentXI.filter(id=>e.finals.squadIds.includes(id)).length===11?e.currentXI:autoXIFromIds(e.finals.squadIds), e.tactics.formation, e.tactics, opp, { venue:'neutro', year: ed.year, label: roundLabel(e.finals.bracket.round)+' vs '+nationName(e.finals.bracket.opponent,ed.year), knockout:true });
  return { match, opp };
}
function roundLabel(r){ return { R32:'Trentaduesimi di finale', R16:'Ottavi di finale', QF:'Quarti di finale', SF:'Semifinale', F:'Finale', TP:'Finale 3°/4° posto' }[r] || r; }
function resolvePenaltiesIfNeeded(match) {
  if (match.italy.score !== match.opp.score) return null;
  // rigori: probabilità pesata sull'overall
  const itOvr = match.italy.ratings.overall, opOvr = match.opp.ratings.overall;
  const pWin = clamp(0.5 + (itOvr-opOvr)*0.01, 0.25, 0.75);
  const won = Math.random() < pWin;
  const itGoals = 3+Math.floor(Math.random()*3), opGoals = won ? itGoals-1-Math.floor(Math.random()*2) : itGoals+1+Math.floor(Math.random()*2);
  return { won, score: won ? `${Math.max(itGoals,opGoals+1)}-${opGoals}` : `${itGoals}-${Math.max(opGoals,itGoals+1)}` };
}
function finalizeKnockoutMatch(match, pen) {
  const e = currentEd(); const ed = edMeta();
  const b = e.finals.bracket;
  const won = pen ? pen.won : match.italy.score > match.opp.score;
  b.history.push({ round:b.round, opponent: nationName(b.opponent, ed.year), score: `${match.italy.score}-${match.opp.score}` + (pen?` (rig. ${pen.score})`:''), won });

  if (b.round === 'TP') {
    e.finals.out = true;
    e.finals.result = won ? '🥉 Terzo posto! Vince la finale 3°/4° posto' : `Quarto posto: persa la finale 3°/4° posto contro ${nationName(b.opponent,ed.year)}`;
    saveGame();
    return;
  }
  if (!won) {
    const isSemifinal = b.round === b.rounds[b.rounds.length-2];
    if (isSemifinal && b.hasThirdPlace) {
      e.finals.result = `Eliminata: ${roundLabel(b.round)} persa contro ${nationName(b.opponent,ed.year)} — ora la finale 3°/4° posto`;
      b.round = 'TP';
      b.opponent = pickThirdPlaceOpponent();
    } else {
      e.finals.out = true;
      e.finals.result = `Eliminata: ${roundLabel(b.round)} persa contro ${nationName(b.opponent,ed.year)}`;
    }
  } else {
    const idx = b.rounds.indexOf(b.round);
    if (idx === b.rounds.length-1) { e.finals.champion = true; e.finals.result = 'CAMPIONE!'; STATE.trophies++; }
    else { b.round = b.rounds[idx+1]; b.opponent = pickNextOpponent(); }
  }
  saveGame();
}
function pickNextOpponent() {
  const e = currentEd(); const ed = edMeta();
  const facedNames = new Set([
    ...e.group.map(n=>nationName(n,ed.year)),
    ...e.finals.opponents.map(n=>nationName(n,ed.year)),
    ...(e.finals.secondGroup ? e.finals.secondGroup.opponents.map(n=>nationName(n,ed.year)) : []),
    ...e.finals.bracket.history.map(h=>h.opponent),
    nationName(e.finals.bracket.opponent, ed.year),
  ]);
  const others = nationsForYear(ed.year).filter(n=>n.code!=='ITA' && !facedNames.has(nationName(n,ed.year)));
  shuffle(others);
  return others[0] || pick(nationsForYear(ed.year));
}
function pickThirdPlaceOpponent() { return pickNextOpponent(); }

function finishEdition() {
  const e = currentEd(); const ed = edMeta();
  let resultText;
  if (e.qualified === false) resultText = `Non qualificata (${e.qualMethod === 'spareggio' ? 'eliminata allo spareggio' : 'eliminata nel girone'})`;
  else if (e.finals) {
    if (e.finals.champion) resultText = `CAMPIONE! 🏆 (${ed.type==='WC'?'Campione del Mondo':'Campione d\'Europa'})`;
    else if (e.finals.out) resultText = e.finals.result;
    else if (e.finals.bracket) resultText = `Eliminata: ${roundLabel(e.finals.bracket.round)}`;
  }
  STATE.log.push({ year: ed.year, type: ed.type, result: resultText || 'Torneo interrotto', real: REAL_HISTORY[ed.year] });
  if (e.finals && e.finals.champion) STATE.trophies++;
  STATE.edition = null;
  saveGame();
}
function goToNextEdition() {
  if (STATE.singleTournament) { VIEW.screen = 'careerEnd'; saveGame(); render(); return; }
  const nextIdx = STATE.editionIndex + 1;
  STATE.editionIndex = nextIdx;
  if (nextIdx >= EDITIONS.length) { VIEW.screen = 'careerEnd'; saveGame(); render(); return; }
  startEdition(nextIdx);
  saveGame();
  VIEW.screen = 'hub'; VIEW.tab = 'intro';
  render();
}

function h(strings, ...vals) { return strings.reduce((acc,s,i)=> acc+s+(vals[i]!=null?vals[i]:''), ''); }
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render() {
  const app = document.getElementById('app');
  if (VIEW.screen === 'menu') app.innerHTML = renderMenu();
  else if (VIEW.screen === 'pickEdition') app.innerHTML = renderPickEdition();
  else if (VIEW.screen === 'newCareer') app.innerHTML = renderNewCareer();
  else if (VIEW.screen === 'hub') app.innerHTML = renderHub();
  else if (VIEW.screen === 'liveMatch') app.innerHTML = renderLiveMatch();
  else if (VIEW.screen === 'careerEnd') app.innerHTML = renderCareerEnd();
  window.scrollTo(0,0);
}

  let body = '';
  Object.keys(groups).forEach(r => {
    const need = counts[r] || 0;
    const list = e.squad.filter(p => e.provisionalIds.includes(p.id) && normRole(p.role)===r).sort((a,b)=>b.ovr-a.ovr);
    const selected = list.filter(p=>e.currentXI.includes(p.id)).length;
    body += `<h3 class="small" style="color:var(--accent-2);margin-top:0.8em;">${groups[r]} <span class="muted">(${selected}/${need})</span></h3>`;
    if (!list.length) body += `<p class="muted small">Nessun convocato in questo ruolo.</p>`;
    list.forEach(p => {
      const checked = e.currentXI.includes(p.id);
      body += `<div class="player-row">
        <div class="pos">${esc(p.role)}</div>
        <div>${esc(p.name)} <span class="club">${esc(p.club||'')}${p.real?' <span class=\"badge good\">storico</span>':''}</span></div>

}

function renderCalendarTab(e, ed) {

  const groupNote = !e.bye && e.group.length ? `<p class="muted small">${e.isRealGroup ? 'Girone di qualificazione storicamente reale.' : 'Nessun dato storico verificato per questo girone: avversari generati.'}${e.onlyWinnerQualifies ? ' In questo formato (Europeo a 8 squadre) solo la prima classificata passa il turno: niente spareggio per la seconda.' : ''}${e.secondQualifiesDirect ? ' In questa edizione la seconda classificata passò comunque il turno come una delle migliori seconde UEFA, senza spareggio.' : ''}</p>` : '';

/* ============================================================
   LOOP DI GIOCO DAL VIVO (avanzamento minuto per minuto)
   ============================================================ */
const SPEED_MS = { lenta: 850, media: 380, veloce: 140, velocissima: 20 };

function beginLiveMatch(matchBundle, onDone) {
  LIVE = { match: matchBundle.match, fixture: matchBundle.fixture, speed:'media', paused:false, subPanel:false, onDone, timer:null };
  VIEW.screen = 'liveMatch';
  render();
  tickLoop();
}
function tickLoop() {
  if (!LIVE || LIVE.paused) return;
  const m = LIVE.match;
  if (m.finished) return;
  const atHalfEnd = advanceToMinute(m, m.minute+1);
  if (atHalfEnd) {
    if (m.half===1) {
      m.half = 2; m.halfAdded = 1+Math.floor(Math.random()*4);
      LIVE.paused = true; // pausa automatica a fine primo tempo
      render();
      return;
    } else {
      m.finished = true;
      determineMOTM(m);
      render();
      if (LIVE.onDone) LIVE.onDone(m);
      return;
    }
  }
  render();
  LIVE.timer = setTimeout(tickLoop, SPEED_MS[LIVE.speed]||300);
}
function determineMOTM(m) {
  const rows = computePagelle(m);
  m.motm = rows[0] ? rows[0].name : null;
}
function skipToResult() {
  const m = LIVE.match;
  while (!m.finished) {
    const atHalfEnd = advanceToMinute(m, m.minute+1);
    if (atHalfEnd) {
      if (m.half===1) { m.half=2; m.halfAdded = 1+Math.floor(Math.random()*4); }
      else { m.finished = true; determineMOTM(m); }
    }
  }
  clearTimeout(LIVE.timer);
  render();
  if (LIVE.onDone) LIVE.onDone(m);
}

/* ============================================================
   EVENTI UI
   ============================================================ */
function bind() {
  document.getElementById('app').addEventListener('click', onClick);
  document.getElementById('app').addEventListener('change', onChange);
}
function onChange(e) {
  const t = e.target;
  if (t.id === 'import-file' && t.files[0]) { importSaveFile(t.files[0]); return; }
  if (t.dataset.act === 'toggle-conv') {
    const e2 = currentEd();
    if (t.checked) { if (!e2.provisionalIds.includes(t.dataset.id)) e2.provisionalIds.push(t.dataset.id); }
    else { e2.provisionalIds = e2.provisionalIds.filter(id=>id!==t.dataset.id); e2.currentXI = e2.currentXI.filter(id=>id!==t.dataset.id); }
    saveGame(); render(); return;
  }
  if (t.dataset.act === 'toggle-xi') {
    const e2 = currentEd();
    const role = t.dataset.role, id = t.dataset.id;
    if (t.checked) {
      const counts = formationRoleCounts(e2.tactics.formation);
      const inRole = e2.squad.filter(p=>e2.currentXI.includes(p.id) && normRole(p.role)===role).length;
      if (inRole >= (counts[role]||0) || e2.currentXI.length >= 11) { render(); return; }
      e2.currentXI.push(id);
    } else {
      e2.currentXI = e2.currentXI.filter(x=>x!==id);
    }
    saveGame(); render(); return;
  }
  if (t.dataset.act === 'set-formation') { currentEd().tactics.formation = t.value; autoSelectXI(); saveGame(); render(); return; }
  if (t.dataset.act === 'set-mentalita') { currentEd().tactics.mentalita = t.value; saveGame(); render(); return; }
  if (t.dataset.act === 'set-pressing') { currentEd().tactics.pressing = t.value; saveGame(); render(); return; }
  if (t.dataset.act === 'set-ampiezza') { currentEd().tactics.ampiezza = t.value; saveGame(); render(); return; }
}
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'new-career-full') { VIEW.newCareerMode='full'; VIEW.pickedEditionIdx=0; VIEW.screen='newCareer'; render(); return; }
  if (act === 'pick-edition') { VIEW.screen='pickEdition'; render(); return; }
  if (act === 'select-edition') { VIEW.newCareerMode='single'; VIEW.pickedEditionIdx=parseInt(el.dataset.idx,10)||0; VIEW.screen='newCareer'; render(); return; }
  if (act === 'continue') {
    loadGame();
    if (STATE && STATE.edition) { VIEW.screen='hub'; VIEW.tab='intro'; }
    else if (STATE && (STATE.singleTournament || STATE.editionIndex >= EDITIONS.length)) { VIEW.screen='careerEnd'; }
    else { VIEW.screen='menu'; }
    render();
    return;
  }
  if (act === 'back-menu') { VIEW.screen='menu'; render(); return; }
  if (act === 'export-save') { exportSave(); return; }
  if (act === 'reset-career') {
    if (!STATE || confirm('Vuoi davvero tornare al menu? La partita in corso andrà persa se non l\'hai esportata.')) {
      clearSave(); STATE=null; VIEW.screen='menu'; render();
    }
    return;
  }
  if (act === 'confirm-new-career') {
    const name = document.getElementById('coach-name').value.trim() || 'CT';
    const diff = document.getElementById('coach-diff').value;
    const single = VIEW.newCareerMode === 'single';
    newCareer(name, diff, single ? VIEW.pickedEditionIdx : 0, single);
    VIEW.screen='hub'; VIEW.tab='intro'; render();
    return;
  }
  if (act === 'tab') { VIEW.tab = el.dataset.tab; render(); return; }
  if (act === 'auto-xi') { autoSelectXI(); saveGame(); render(); return; }

  if (act === 'play-qual') {
    const bundle = playNextQualMatch();
    if (!bundle) return;
    beginLiveMatch(bundle, (m) => { finalizeQualMatch(bundle.fixture, m); });
    return;
  }
  if (act === 'goto-finals') { startFinals(); VIEW.tab='finals'; saveGame(); render(); return; }
  if (act === 'finish-edition') { finishEdition(); goToNextEdition(); return; }
  if (act === 'play-playoff') {
    const bundle = playPlayoffMatch();
    if (!bundle) return;
    beginLiveMatch(bundle, (m) => {
      const pen = resolvePenaltiesIfNeeded(m);
      finalizePlayoffMatch(m, pen);
    });
    return;
  }

  if (act === 'play-finals-group') {
    const bundle = playFinalsMatch();
    if (!bundle) return;
    VIEW.tab = 'finals';
    beginLiveMatch(bundle, (m) => { finalizeFinalsMatch(bundle.fixture, m); });
    return;
  }
  if (act === 'play-knockout') {
    const bundle = playKnockoutMatch();
    if (!bundle) return;
    VIEW.tab = 'finals';
    beginLiveMatch(bundle, (m) => {
      const pen = resolvePenaltiesIfNeeded(m);
      finalizeKnockoutMatch(m, pen);
    });
    return;
  }
  if (act === 'play-secondgroup') {
    const bundle = playSecondGroupMatch1982();
    if (!bundle) return;
    VIEW.tab = 'finals';
    beginLiveMatch(bundle, (m) => { finalizeSecondGroupMatch1982(bundle.fixture, m); });
    return;
  }
  if (act === 'close-match') {
    LIVE = null;
    VIEW.screen = 'hub';
    render();
    return;
  }

  if (act === 'set-speed') { if (LIVE) { LIVE.speed = el.dataset.speed; render(); if (!LIVE.paused) { clearTimeout(LIVE.timer); tickLoop(); } } return; }
  if (act === 'pause-match') { if (LIVE) { LIVE.paused = true; clearTimeout(LIVE.timer); render(); } return; }
  if (act === 'resume-match') { if (LIVE) { LIVE.paused = false; render(); tickLoop(); } return; }
  if (act === 'skip-match') { if (LIVE) skipToResult(); return; }
  if (act === 'open-sub') { if (LIVE) { LIVE.subPanel = true; render(); } return; }
  if (act === 'cancel-sub') { if (LIVE) { LIVE.subPanel = false; render(); } return; }
  if (act === 'confirm-sub') {
    if (!LIVE) return;
    const outId = document.getElementById('sub-out').value;
    const inId = document.getElementById('sub-in').value;
    makeSubstitution(LIVE.match, outId, inId, LIVE.match.minute);
    LIVE.subPanel = false;
    render();
    return;
  }
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  bind();
  loadGame();
  if (STATE && STATE.edition) { VIEW.screen = 'hub'; VIEW.tab='intro'; }
  else if (STATE && (STATE.singleTournament || STATE.editionIndex >= EDITIONS.length)) { VIEW.screen = 'careerEnd'; }
  else { VIEW.screen = 'menu'; }
  render();
});

})();
</script>
</body>
</html>
