name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Richiesto da un giocatore (sito diventato lento a caricare su cellulare): index.html è un unico
      # file da oltre 2.6 MB, di cui quasi un quinto solo commenti di spiegazione per chi lavora sul
      # codice — utilissimi nel repository (restano intatti lì, questo step non li tocca e non fa mai
      # commit), inutili per chi deve solo scaricare e giocare. Minifica SOLO la copia pubblicata (non il
      # sorgente): rimuove commenti e spazi superflui da HTML/CSS/JS inline, senza toccare alcuna
      # funzionalità del gioco — una trasformazione meccanica, non una modifica al comportamento. Circa
      # -40% di peso nei test locali.
      - name: Minify index.html for faster loading
        run: |
          npx --yes html-minifier-terser@7.2.0 \
            --collapse-whitespace --remove-comments --minify-js true --minify-css true \
            -o index.min.html index.html
          mv index.min.html index.html
      # App Android (richiesta: scaricare l'app dal sito). I runner di GitHub hanno già l'Android SDK:
      # build.sh compila l'APK senza Gradle e lo mette in app/politis-it.apk, pubblicato con il sito.
      # Se la compilazione fallisse, il sito viene pubblicato lo stesso.
      - name: Setup Java for the Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android app (APK)
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x android/build.sh
          android/build.sh app/politis-it.apk
          ls -la app
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
