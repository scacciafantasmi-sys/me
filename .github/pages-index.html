<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://politisit.scacciafantasmi.workers.dev/">
<title>Politis-IT si è spostato</title>
<!-- Questa pagina sostituisce il gioco SOLO nella copia su GitHub Pages (vedi il workflow): l'indirizzo
     ufficiale è politisit.scacciafantasmi.workers.dev. Chi arriva viene portato subito lì; chi aveva
     partite salvate su questo indirizzo può trasferirle con un tocco. -->
<noscript><meta http-equiv="refresh" content="0; url=https://politisit.scacciafantasmi.workers.dev/"></noscript>
<script>
(function () {
  var TARGET = "https://politisit.scacciafantasmi.workers.dev/";
  var saves = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^politisit_/.test(k)) saves[k] = localStorage.getItem(k); } } catch (e) {}
  window.__saves = saves;
  if (!Object.keys(saves).length) location.replace(TARGET + location.search + location.hash);
})();
</script>
<style>
  body { margin: 0; background: #0a0c18; color: #f4f5fb; font: 16px/1.5 Inter, system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .card { max-width: 480px; background: #12142a; border-radius: 22px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 1.4rem; margin: 12px 0 8px; }
  p { color: #c9cce0; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin: 12px 0 0; padding: 14px; border-radius: 999px; border: 0; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; }
  .main { background: linear-gradient(135deg, #7c6cf0, #9b8bff); color: #fff; }
  .alt { background: rgba(255,255,255,0.08); color: #f4f5fb; }
  #msg { margin-top: 14px; font-weight: 700; color: #5ee6d6; min-height: 1.5em; }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="Politis-IT">
  <h1>Politis-IT ha un nuovo indirizzo</h1>
  <p>Il gioco ora è su <strong>politisit.scacciafantasmi.workers.dev</strong>. Su questo dispositivo hai partite salvate al vecchio indirizzo: trasferiscile con un tocco, poi continua a giocare sul nuovo sito.</p>
  <button type="button" class="main" id="move">Trasferisci le mie partite e apri il gioco</button>
  <button type="button" class="alt" id="dl">Scarica le partite come file</button>
  <a class="btn alt" href="https://politisit.scacciafantasmi.workers.dev/">Vai al nuovo sito senza trasferire</a>
  <div id="msg"></div>
</div>
<script>
(function () {
  var TARGET_ORIGIN = "https://politisit.scacciafantasmi.workers.dev";
  var saves = window.__saves || {};
  var msg = document.getElementById("msg");
  document.getElementById("move").addEventListener("click", function () {
    var w = window.open(TARGET_ORIGIN + "/?transfer=github", "_blank");
    if (!w) { msg.textContent = "Il browser ha bloccato la nuova finestra: consenti i popup e riprova."; return; }
    msg.textContent = "Trasferimento in corso…";
    var sent = false;
    window.addEventListener("message", function (e) {
      if (e.origin !== TARGET_ORIGIN || !e.data) return;
      if (e.data.type === "politis-ready" && !sent) { sent = true; w.postMessage({ type: "politis-transfer", saves: saves }, TARGET_ORIGIN); }
      if (e.data.type === "politis-done") msg.textContent = "Fatto: " + e.data.copied + " salvataggi trasferiti" + (e.data.skipped ? " (" + e.data.skipped + " non trasferiti perché gli slot erano pieni: usa «Scarica le partite come file»)" : "") + ". Continua a giocare nella nuova scheda.";
    });
  });
  document.getElementById("dl").addEventListener("click", function () {
    Object.keys(saves).forEach(function (k) {
      if (!/save_v2/.test(k)) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([saves[k]], { type: "application/json" }));
      a.download = "politis-it-" + k.replace(/^politisit_founder_save_v2_?/, "").replace(/^$/, "slot1") + ".json";
      document.body.appendChild(a); a.click(); a.remove();
    });
    msg.textContent = "File scaricati: sul nuovo sito usa «Importa partita».";
  });
})();
</script>
</body>
</html>
