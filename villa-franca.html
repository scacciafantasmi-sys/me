<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Villa Franca 1980 — un paese di Sicilia</title>
<!-- Pagina autonoma a file singolo, ospitata accanto a Politis-IT sullo stesso dominio. -->
<meta name="description" content="Prototipo pre-alpha di roguelike testuale ambientato in un paese immaginario di Sicilia nel 1980. Interamente client-side, nessuna AI esterna, nessuna chiave API.">
<style>
  :root {
    --bg: #14120e;
    --panel: #1d1a14;
    --panel-2: #262019;
    --border: #3a3226;
    --text: #ece3d0;
    --text-dim: #a89a80;
    --accent: #c98a3b;
    --accent-2: #7c9473;
    --accent-soft: rgba(201,138,59,0.16);
    --good: #7c9473;
    --good-soft: rgba(124,148,115,0.16);
    --warning: #c98a3b;
    --warning-soft: rgba(201,138,59,0.16);
    --critical: #a14a3a;
    --critical-soft: rgba(161,74,58,0.18);
    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    --font-body: Georgia, 'Times New Roman', serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { padding: 0; min-height: 100vh; }
  ::selection { background: var(--accent-soft); }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: 0.02em; margin: 0 0 0.4em; }
  p { line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input, select { font-family: inherit; }
  a { color: var(--accent); }

  #app { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .muted { color: var(--text-dim); font-size: 0.85em; }
  .small { font-size: 0.82em; }
  .hint { color: var(--text-dim); font-size: 0.9em; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.6em 1.1em; font-size: 0.95em; box-shadow: var(--shadow);
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #14120e; border-color: var(--accent); font-weight: bold; }
  .btn.ghost { background: transparent; }
  .btn.tiny { padding: 0.15em 0.6em; font-size: 0.9em; }
  .link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: 0.9em; }

  /* ---------------- boot / esito schermate a colonna singola ---------------- */
  .boot { max-width: 640px; margin: 3rem auto; text-align: center; }
  .boot h1 { font-size: 2.6rem; letter-spacing: 0.08em; color: var(--accent); }
  .boot .sub { color: var(--text-dim); font-style: italic; margin-top: -0.5em; }
  .boot .tagline { color: var(--text-dim); }
  .boot-actions { display: flex; flex-direction: column; gap: 0.6em; align-items: stretch; max-width: 380px; margin: 1.5em auto 0; }
  .boot.death h1, .boot.wipe h1 { color: var(--critical); }
  .boot.wipe h1 { color: var(--accent-2); }
  .anno-corrente { margin-top: 2em; color: var(--text-dim); font-size: 0.85em; }
  .fatale { color: var(--critical); font-weight: bold; }
  .salafama-list { text-align: left; max-height: 60vh; overflow-y: auto; margin-top: 1em; }

  /* ---------------- creazione personaggio ---------------- */
  .creation { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; box-shadow: var(--shadow); }
  .wizard-progress { display: flex; flex-wrap: wrap; gap: 0.5em; margin-bottom: 1.2em; font-size: 0.78em; }
  .wp-step { padding: 0.3em 0.6em; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
  .wp-step.active { border-color: var(--accent); color: var(--accent); }
  .wp-step.done { color: var(--good); border-color: var(--good); }
  .wizard-body { min-height: 320px; }
  .wizard-nav { display: flex; justify-content: space-between; margin-top: 1.5em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9em; }
  .grid2 label { display: flex; flex-direction: column; gap: 0.3em; font-size: 0.85em; color: var(--text-dim); }
  .grid2 .span2 { grid-column: 1 / -1; }
  input, select, textarea {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 0.5em 0.6em; font-size: 0.95em;
  }
  textarea { width: 100%; resize: vertical; }

  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  .skill-cat h3 { font-size: 0.95em; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
  .skill-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 0.4em; padding: 0.15em 0; font-size: 0.88em; }
  .skill-val { font-family: var(--font-mono); color: var(--accent); letter-spacing: 1px; min-width: 5.5em; text-align: center; }

  .segreti-list { display: flex; flex-direction: column; gap: 0.5em; max-height: 420px; overflow-y: auto; padding-right: 0.4em; }
  .segreto-row { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 0.6em; border: 1px solid var(--border); border-radius: 6px; padding: 0.5em 0.7em; cursor: pointer; }
  .segreto-row.selected { border-color: var(--accent); background: var(--accent-soft); }
  .segreto-row input { grid-row: 1 / span 2; margin-top: 0.3em; }
  .segreto-nome { font-weight: bold; }
  .segreto-desc { grid-column: 2; color: var(--text-dim); font-size: 0.85em; }

  .riepilogo p { margin: 0.4em 0; }
  .backstory-preview { white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.7em; font-size: 0.9em; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35em; margin-top: 0.6em; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 0.2em 0.6em; font-size: 0.78em; color: var(--text-dim); }

  /* ---------------- hub ---------------- */
  .hub-top {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.6em;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8em 1.1em; margin-bottom: 1em;
  }
  .hub-id strong { display: block; }
  .hub-money { font-family: var(--font-mono); color: var(--accent); font-size: 1.1em; }
  .hub-body { display: grid; grid-template-columns: 230px 1fr 300px; gap: 1em; align-items: start; }
  @media (max-width: 980px) { .hub-body { grid-template-columns: 1fr; } }

  .hub-side { display: flex; flex-direction: column; gap: 0.7em; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.6em 0.8em; }
  .panel summary { cursor: pointer; font-weight: bold; color: var(--accent); }
  .mini-skills { margin-top: 0.5em; display: flex; flex-direction: column; gap: 0.15em; }
  .mini-skill { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--text-dim); }
  .mini-skill.good span:last-child { color: var(--good); }
  .mini-skill.bad span:last-child { color: var(--critical); }
  .quick-actions { display: flex; flex-direction: column; gap: 0.4em; }

  .hub-main { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1em 1.2em; min-height: 420px; }
  .breadcrumb { font-size: 0.8em; color: var(--text-dim); margin-bottom: 0.6em; }
  .categorie-grid, .luoghi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.7em; margin-top: 0.8em; }
  .cat-card, .luogo-card, .azione-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 0.8em; text-align: left;
    display: flex; flex-direction: column; gap: 0.25em; color: var(--text);
  }
  .cat-card:hover, .luogo-card:hover:not(:disabled), .azione-card:hover:not(:disabled) { border-color: var(--accent); }
  .luogo-card.chiuso { opacity: 0.5; }
  .azioni-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.7em; margin-top: 0.8em; }
  .luogo-desc { color: var(--text-dim); }

  .hub-feed { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8em; max-height: 80vh; overflow-y: auto; }
  .feed-tabs { display: flex; gap: 0.3em; margin-bottom: 0.6em; }
  .tab { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4em; font-size: 0.78em; color: var(--text-dim); }
  .tab.active { color: var(--accent); border-color: var(--accent); }
  .feed-item { border-bottom: 1px solid var(--border); padding: 0.6em 0; font-size: 0.85em; }
  .feed-item:last-child { border-bottom: none; }
  .feed-item strong { display: block; margin: 0.2em 0; }
  .feed-date { color: var(--text-dim); font-size: 0.78em; }
  .feed-item.storia { border-left: 3px solid var(--accent); padding-left: 0.6em; }
  .feed-item.lore { border-left: 3px solid var(--accent-2); padding-left: 0.6em; }

  /* ---------------- modale esito ---------------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 1em; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.4em; max-width: 460px; box-shadow: var(--shadow); }
  .modal.esito-critico_successo { border-color: var(--good); }
  .modal.esito-critico_fallimento { border-color: var(--critical); }
  .modal .btn { margin-top: 0.8em; }

  @media (max-width: 640px) {
    .grid2, .skills-grid { grid-template-columns: 1fr; }
    .boot h1 { font-size: 2rem; }
  }
</style>
</head>

<div id="app"><div class="boot"><h1>VILLA FRANCA</h1><p class="tagline">Caricamento…</p></div></div>

<script>

/* ---------------------------------------------------------------------- */
/* OSCURI SEGRETI                                                         */
/* ---------------------------------------------------------------------- */
GAME_DATA.OSCURI_SEGRETI = [
  { id: 'nessuno', nome: 'Nessun segreto', desc: 'Una vita senza ombre particolari. Nessun effetto.', effetti: [] },
  { id: 'debito_mafia', nome: 'Debito con la mafia', desc: 'Devi del denaro a un uomo d\'onore locale, e prima o poi qualcuno verrà a riscuoterlo.', effetti: ['denaro_iniziale:-300', 'relazione:mafia:-10', 'flag:debito_mafia'] },

  { id: 'informatore_carabinieri', nome: 'Informatore dei Carabinieri', desc: 'Passi voci alla caserma in cambio di favori. Se si scoprisse, sarebbe un problema serio.', effetti: ['relazione:forze_ordine:+10', 'flag:informatore'] },

GAME_DATA.STORIA_1980 = [
  { data: '1980-01-06', titolo: 'Omicidio a Palermo', testo: 'Il Presidente della Regione Siciliana Piersanti Mattarella viene ucciso a Palermo davanti alla famiglia. La notizia sconvolge l\'intera Sicilia.' },

  { data: '1980-05-04', titolo: 'Morto il Maresciallo Tito', testo: 'A Lubiana muore Josip Broz Tito, storico presidente della Jugoslavia. Si apre un\'incertezza sul futuro del paese balcanico.' },
  { data: '1980-06-27', titolo: 'Disastro aereo sul Tirreno', testo: 'Un aereo di linea partito da Bologna e diretto a Palermo scompare dai radar nei pressi di Ustica. Non ci sono superstiti: la notizia arriva anche a Villa Franca con enorme sgomento, essendo la rotta quella per la Sicilia.' },

  { data: '1980-09-22', titolo: 'Scoppia la guerra Iran-Iraq', testo: 'L\'Iraq attacca l\'Iran: inizia un conflitto che si preannuncia lungo e sanguinoso in Medio Oriente.' },
  { data: '1980-11-04', titolo: 'Elezioni presidenziali americane', testo: 'Ronald Reagan viene eletto Presidente degli Stati Uniti.' },
  { data: '1980-11-23', titolo: 'Terremoto nel Sud Italia', testo: 'Un violentissimo terremoto colpisce l\'Irpinia e la Basilicata, causando migliaia di vittime. La solidarietà si organizza in tutto il paese, anche a Villa Franca.' },
  { data: '1980-12-08', titolo: 'Ucciso un ex Beatle a New York', testo: 'John Lennon viene ucciso a colpi di arma da fuoco a New York. Anche i più giovani di Villa Franca, che ascoltano i suoi dischi di nascosto, ne restano segnati.' },
];

if (typeof module !== 'undefined') module.exports = GAME_DATA;

<script>
/* ==========================================================================
   VILLA FRANCA 1980 — motore di gioco
   Stato, tempo, generatore narrativo locale (nessuna AI esterna, nessuna
   chiave API: solo tabelle pesate e template combinati a runtime), salvataggio.
   ========================================================================== */

const ENGINE = (() => {
  const SAVE_KEY = 'villafranca_save_v1';
  const START_YEAR = 1980;
  const END_YEAR = 1990;

  /* ------------------------------ stato ------------------------------ */
  let STATE = null;

  function nuovoMondo() {
    return {
      anno: START_YEAR,
      serverConcluso: false,
      npcStato: {}, // npcId -> { vivo:true, relazione:0, note:[] }
      loreStage: 0,
      loreFlags: {},
      giornale: [], // { anno, mese, giorno, titolo, testo, autore }
      salaFama: [], // personaggi conclusi (morti/ritirati/wipe)
      rumorLog: [], // voci di paese recenti (persistenti tra wipe)
      cicli: 0,
    };
  }

  function defaultState() {
    const s = {
      world: nuovoMondo(),
      character: null,
      clock: { anno: START_YEAR, mese: 1, giorno: 1, ora: 8, meteoGiorno: null, meteoData: null },
      version: 1,
    };
    GAME_DATA.NPCS.forEach(n => { s.world.npcStato[n.id] = { vivo: true, relazione: 0, note: [] }; });
    return s;
  }

  function getState() { return STATE; }

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) { /* storage pieno o non disponibile */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      STATE = JSON.parse(raw);
      return true;
    } catch (e) { return false; }
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function resetAll() {
    STATE = defaultState();
    save();
  }

  function init() {
    if (!load()) STATE = defaultState();
  }

  /* ------------------------------ utility ------------------------------ */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  const _lastPick = {};
  function pickNoRepeat(key, arr) {
    if (arr.length <= 1) return arr[0];
    let idx = randInt(0, arr.length - 1);
    if (_lastPick[key] !== undefined && arr.length > 2) {
      let tries = 0;
      while (idx === _lastPick[key] && tries < 5) { idx = randInt(0, arr.length - 1); tries++; }
    }
    _lastPick[key] = idx;
    return arr[idx];
  }

  /* ------------------------------ tempo ------------------------------ */
  function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(m, y) {
    const d = [31, isLeapYear(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return d[m - 1];
  }
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const GIORNI_SETT = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

  function dataChiave(c) {
    return `${c.anno}-${String(c.mese).padStart(2,'0')}-${String(c.giorno).padStart(2,'0')}`;
  }

  function giornoSettimana(c) {
    // Zeller-ish via Date object (attenzione: Date gestisce solo anni >=1)
    const d = new Date(Date.UTC(c.anno, c.mese - 1, c.giorno));
    return GIORNI_SETT[d.getUTCDay()];
  }

  const METEO_ESTATE = ['sole a picco e cicale', 'caldo afoso, aria ferma', 'scirocco che porta sabbia dal mare', 'cielo terso, mare calmo', 'temporale improvviso di calore'];
  const METEO_INVERNO = ['pioggia fine e insistente', 'vento freddo da tramontana', 'cielo grigio e coperto', 'freddo pungente ma sereno', 'nebbia bassa sui campi'];
  const METEO_MEZZA = ['tiepido e ventilato', 'nuvole sparse', 'sole gentile', 'pioggia leggera al mattino', 'aria limpida'];

  function calcolaMeteo(mese) {
    if ([6,7,8].includes(mese)) return pick(METEO_ESTATE);
    if ([12,1,2].includes(mese)) return pick(METEO_INVERNO);
    return pick(METEO_MEZZA);
  }

  function meteoOggi() {
    const key = dataChiave(STATE.clock);
    if (STATE.clock.meteoData !== key) {
      STATE.clock.meteoData = key;
      STATE.clock.meteoGiorno = calcolaMeteo(STATE.clock.mese);
    }
    return STATE.clock.meteoGiorno;
  }

  function periodoDelGiorno(ora) {
    if (ora >= 5 && ora < 8) return 'alba';
    if (ora >= 8 && ora < 13) return 'mattina';
    if (ora >= 13 && ora < 17) return 'pomeriggio';
    if (ora >= 17 && ora < 20) return 'sera';
    if (ora >= 20 && ora < 24) return 'notte';
    return 'notte fonda';
  }

  function eLuogoAperto(luogo) {
    if (!luogo.orario) return true;
    const [a, b] = luogo.orario;
    const ora = STATE.clock.ora;
    if (a < b) return ora >= a && ora < b;
    return ora >= a || ora < b; // apertura che attraversa la mezzanotte
  }

  /* callback opzionale impostata da main.js per notificare la UI di un wipe/morte */
  let onWorldEvent = null;
  function setWorldEventHandler(fn) { onWorldEvent = fn; }

  function advanceTime(ore, opts) {
    opts = opts || {};
    let restante = ore;
    while (restante > 0) {
      const step = Math.min(restante, 1);
      restante -= step;
      STATE.clock.ora += step;
      tickOrario();
      if (STATE.clock.ora >= 24) {
        STATE.clock.ora -= 24;
        avanzaGiorno();
      }
    }
  }

  function tickOrario() {
    if (!STATE.character || STATE.character.stato !== 'vivo') return;
    // piccola possibilità che il paese "viva" anche senza il giocatore (rumor / lore)
    if (Math.random() < 0.03) generaRumor();
    if (Math.random() < 0.01) avanzaLore();
  }

  function avanzaGiorno() {
    STATE.clock.giorno++;
    if (STATE.clock.giorno > daysInMonth(STATE.clock.mese, STATE.clock.anno)) {
      STATE.clock.giorno = 1;
      STATE.clock.mese++;
      if (STATE.clock.mese > 12) {
        STATE.clock.mese = 1;
        finisceAnno();
      }
    }
    checkStoriaOggi();
  }

  function checkStoriaOggi() {
    if (STATE.clock.anno !== 1980) return;
    const key = dataChiave(STATE.clock);
    const evt = GAME_DATA.STORIA_1980.find(e => e.data === key);
    if (evt && STATE.character) {
      STATE.character.log.unshift({ tipo: 'storia', titolo: evt.titolo, testo: evt.testo, data: key });
      if (onWorldEvent) onWorldEvent('storia', evt);
    }
  }

  function finisceAnno() {
    const annoConcluso = STATE.clock.anno;
    STATE.clock.anno++;
    STATE.world.cicli++;
    if (STATE.character && STATE.character.stato === 'vivo') {
      archiviaPersonaggio(STATE.character, `Ha attraversato il wipe di fine ${annoConcluso}. La sua storia continua nel ${STATE.clock.anno}, ma la sua scheda personale viene ripristinata.`);
    }
    STATE.world.anno = STATE.clock.anno;
    if (STATE.clock.anno > END_YEAR) {
      STATE.world.serverConcluso = true;
    }
    const wasCharacter = STATE.character;
    STATE.character = null;
    if (onWorldEvent) onWorldEvent('wipe', { annoConcluso, nuovoAnno: STATE.clock.anno, personaggio: wasCharacter, serverConcluso: STATE.world.serverConcluso });
  }

  /* ------------------------------ personaggio ------------------------------ */
  function skillBase() {
    const s = {};
    GAME_DATA.SKILLS.forEach(sk => { s[sk.id] = GAME_DATA.SKILL_MIN; });
    return s;
  }

  function parseEffetto(effetto, character) {
    const parts = effetto.split(':');
    const tipo = parts[0];
    if (tipo === 'skill') {
      const id = parts[1], delta = parseInt(parts[2], 10);
      character.skills[id] = clamp((character.skills[id] || 1) + delta, GAME_DATA.SKILL_MIN, GAME_DATA.SKILL_MAX);
    } else if (tipo === 'denaro_iniziale') {
      character.denaro += parseInt(parts[1], 10);
    } else if (tipo === 'relazione') {
      const fazione = parts[1], delta = parseInt(parts[2], 10);
      character.relazioni[fazione] = clamp((character.relazioni[fazione] || 0) + delta, -100, 100);
    } else if (tipo === 'flag') {
      character.flags.push(parts[1]);
    }
  }

  function creaPersonaggio(dati) {
    const skills = skillBase();
    Object.keys(dati.allocazioneSkill || {}).forEach(id => {
      skills[id] = clamp(dati.allocazioneSkill[id], GAME_DATA.SKILL_MIN, GAME_DATA.SKILL_MAX);
    });

    const relazioni = {};
    GAME_DATA.FAZIONI.forEach(f => { relazioni[f.id] = 0; });

    const character = {
      nome: dati.nome, cognome: dati.cognome, sesso: dati.sesso, eta: dati.eta,
      altezza: dati.altezza, corporatura: dati.corporatura, capelli: dati.capelli,
      occhi: dati.occhi, trattoDistintivo: dati.trattoDistintivo,
      cittaNatale: dati.cittaNatale, backstory: dati.backstory,
      lavoroPrecedente: dati.lavoroPrecedente,
      skills, segreto: dati.segreto || 'nessuno', flags: [],
      denaro: 150,
      relazioni, relazioniNpc: {},
      lavoroAttuale: null,
      stato: 'vivo', causaMorte: null,
      nato: STATE.clock.anno,
      log: [],
    };

    const lavoroDef = GAME_DATA.LAVORI_PRECEDENTI.find(l => l.id === dati.lavoroPrecedente);
    if (lavoroDef) lavoroDef.bonus.forEach(sk => { character.skills[sk] = clamp(character.skills[sk] + 1, GAME_DATA.SKILL_MIN, GAME_DATA.SKILL_MAX); });

    const segretoDef = GAME_DATA.OSCURI_SEGRETI.find(s => s.id === character.segreto);
    if (segretoDef) segretoDef.effetti.forEach(e => parseEffetto(e, character));

    character.log.unshift({ tipo: 'nascita_narrativa', titolo: 'Un nuovo inizio', testo: `${character.nome} ${character.cognome} mette piede a Villa Franca il ${character.eta > 0 ? '' : ''}${STATE.clock.giorno} ${MESI[STATE.clock.mese-1]} ${STATE.clock.anno}.`, data: dataChiave(STATE.clock) });

    STATE.character = character;
    save();
    return character;
  }

  function puntiSkillSpesi(allocazione) {
    let tot = 0;
    Object.keys(allocazione || {}).forEach(id => { tot += Math.max(0, (allocazione[id] || 1) - GAME_DATA.SKILL_MIN); });
    return tot;
  }

  /* ------------------------------ azioni e skill check ------------------------------ */
  const AZIONI_RISCHIOSE = new Set(['traffico_porto','segnala_contrabbando','avvicina_boss','affari_discoteca','partecipa_assemblea_sx','partecipa_riunione_dx','contatta_balordo','ronda_porto','informatore_cc']);

  function trovaLuogo(id) { return GAME_DATA.LUOGHI.find(l => l.id === id); }
  function trovaNpc(id) { return GAME_DATA.NPCS.find(n => n.id === id); }

  function eseguiAzione(luogoId, azioneId) {
    const luogo = trovaLuogo(luogoId);
    const azione = luogo.azioni.find(a => a.id === azioneId);
    const character = STATE.character;
    const npc = azione.npc ? trovaNpc(azione.npc) : null;

    let esito = 'neutro';
    let dettaglioCheck = null;
    if (azione.skill) {
      const skillVal = character.skills[azione.skill] || 1;
      const difficolta = 45 + randInt(-10, 25);
      const roll = randInt(1, 100) + skillVal * 8;
      const scarto = roll - difficolta;
      if (scarto >= 30) esito = 'critico_successo';
      else if (scarto >= 0) esito = 'successo';
      else if (scarto >= -30) esito = 'fallimento';
      else esito = 'critico_fallimento';
      dettaglioCheck = { skill: azione.skill, skillVal, difficolta, roll, scarto };
    }

    const testo = narraEsito(luogo, azione, esito, npc, character);
    applicaEffettiAzione(luogo, azione, esito, npc, character);

    let morte = null;
    if (esito === 'critico_fallimento' && AZIONI_RISCHIOSE.has(azione.id)) {
      if (Math.random() < 0.10) {
        morte = uccidiPersonaggio(`Le cose sono precipitate durante "${azione.nome.toLowerCase()}" a ${luogo.nome}.`);
      }
    }

    character.log.unshift({ tipo: 'azione', titolo: azione.nome, testo, luogo: luogo.nome, data: dataChiave(STATE.clock), esito });
    advanceTime(azione.ore);
    save();
    return { testo, esito, dettaglioCheck, morte };
  }

  const NARRAZIONE = {
    apertura: [
      'Sono le {ora} di {periodo}, {meteo}.',
      'È {periodo} a Villa Franca: {meteo}.',
      'Il {giorno_settimana} scorre lento, {meteo}.',
    ],
    critico_successo: [
      'Ti va meglio di quanto sperassi: {dettaglio}',
      'Le cose girano dalla tua parte: {dettaglio}',
      'Un colpo di fortuna netto: {dettaglio}',
    ],
    successo: [
      'Le cose vanno come speravi: {dettaglio}',
      'Riesci nel tuo intento: {dettaglio}',
      'Con un po\' di attenzione, ottieni quello che cercavi: {dettaglio}',
    ],
    fallimento: [
      'Non va come speravi: {dettaglio}',
      'Qualcosa si mette di traverso: {dettaglio}',
      'Ci provi, ma non basta: {dettaglio}',
    ],
    critico_fallimento: [
      'Va decisamente male: {dettaglio}',
      'È un disastro: {dettaglio}',
      'Le cose precipitano: {dettaglio}',
    ],
    neutro: [
      '{dettaglio}',
    ],
  };

  const DETTAGLIO_NPC = {
    critico_successo: ['{npc} resta colpito da te e si sbilancia più del previsto.', '{npc} ti tratta quasi come un vecchio amico.'],
    successo: ['{npc} ti ascolta e ti concede quello che chiedevi.', '{npc} sembra prendere sul serio le tue parole.'],
    fallimento: ['{npc} resta sulle sue, diffidente.', '{npc} liquida la questione con poche parole.'],
    critico_fallimento: ['{npc} si offende apertamente e te lo fa capire.', 'Con {npc} la situazione degenera in fretta.'],
    neutro: ['Parli un po\' con {npc}.'],
  };

  function narraEsito(luogo, azione, esito, npc, character) {
    const apertura = pickNoRepeat('apertura', NARRAZIONE.apertura)
      .replace('{ora}', String(STATE.clock.ora).padStart(2,'0') + ':00')
      .replace('{periodo}', periodoDelGiorno(STATE.clock.ora))
      .replace('{meteo}', meteoOggi())
      .replace('{giorno_settimana}', giornoSettimana(STATE.clock));

    let dettaglio;
    if (npc) {
      dettaglio = pick(DETTAGLIO_NPC[esito]).replace(/{npc}/g, npc.nome);
    } else {
      dettaglio = `${azione.nome} a ${luogo.nome} — ${luogo.desc}`;
    }
    const corpo = pick(NARRAZIONE[esito]).replace('{dettaglio}', dettaglio);
    return `${apertura} ${corpo}`;
  }

  function applicaEffettiAzione(luogo, azione, esito, npc, character) {
    const positivo = esito === 'successo' || esito === 'critico_successo';
    const negativo = esito === 'fallimento' || esito === 'critico_fallimento';
    const forte = esito === 'critico_successo' || esito === 'critico_fallimento';

    if (npc) {
      const delta = positivo ? (forte ? 12 : 6) : negativo ? (forte ? -12 : -6) : 0;
      character.relazioniNpc[npc.id] = clamp((character.relazioniNpc[npc.id] || 0) + delta, -100, 100);
      if (npc.fazione) character.relazioni[npc.fazione] = clamp((character.relazioni[npc.fazione] || 0) + Math.round(delta / 2), -100, 100);
    }

    if (azione.lavoro && (esito === 'successo' || esito === 'critico_successo')) {
      character.lavoroAttuale = { nome: azione.lavoro, luogoId: luogo.id };
    }

    if (azione.id === 'lavora_campagna' || (character.lavoroAttuale && character.lavoroAttuale.luogoId === luogo.id && azione.id.startsWith('lavora'))) {
      if (positivo) character.denaro += forte ? 60 : 30;
    }

    if (azione.id === 'scrivi_articolo' && positivo) {
      pubblicaArticolo(character);
    }

    if (azione.id === 'vendi_al_mercato' && positivo) character.denaro += forte ? 50 : 25;
    if (azione.id === 'gioca_carte') character.denaro += positivo ? (forte ? 40 : 15) : -(forte ? 40 : 15);
    if (azione.id === 'gioca_totocalcio') { if (Math.random() < 0.05) character.denaro += 200; else character.denaro -= 5; }
    if (['compra_pane','curati','spedisci_lettera','cena_trattoria','guarda_film'].includes(azione.id)) character.denaro = Math.max(0, character.denaro - randInt(5,20));
  }

  /* ------------------------------ giornalismo ------------------------------ */
  const TITOLI_GIORNALE = [
    'Villa Franca tra cronaca e quotidianità', 'Voci dal paese', 'Cosa succede a Villa Franca',
    'La settimana del nostro paese', 'Dal porto alla piazza', 'Taccuino di paese',
  ];
  function pubblicaArticolo(character) {
    const titolo = pick(TITOLI_GIORNALE);
    STATE.world.giornale.unshift({
      anno: STATE.clock.anno, mese: STATE.clock.mese, giorno: STATE.clock.giorno,
      titolo, autore: `${character.nome} ${character.cognome}`,
      testo: `Un resoconto firmato da ${character.nome} ${character.cognome} sulla vita di Villa Franca in questi giorni di ${MESI[STATE.clock.mese-1]}.`,
    });
    if (STATE.world.giornale.length > 100) STATE.world.giornale.length = 100;
  }

  /* ------------------------------ rumor / lore in sottofondo ------------------------------ */
  const RUMOR_TEMPLATES = [
    'Si dice che {npc} sia stato visto parlare a lungo con una persona mai vista prima al {luogo}.',
    'In paese girano voci su strani movimenti notturni vicino al {luogo}.',
    '{npc} sembra particolarmente nervoso negli ultimi giorni.',
    'Qualcuno giura di aver visto luci accese di notte dove non dovrebbero essercene.',
    'Al bar si commenta una lettera arrivata da Palermo, indirizzata a {npc}.',
  ];
  function generaRumor() {
    const npc = pick(GAME_DATA.NPCS);
    const luogo = pick(GAME_DATA.LUOGHI);
    const testo = pick(RUMOR_TEMPLATES).replace('{npc}', npc.nome).replace('{luogo}', luogo.nome);
    STATE.world.rumorLog.unshift({ data: dataChiave(STATE.clock), testo });
    if (STATE.world.rumorLog.length > 40) STATE.world.rumorLog.length = 40;
  }

  const LORE_TAPPE = [
    'In paese non si parla ancora di nulla di strano.',
    'Qualche vecchio del paese accenna a "cose viste nella notte" vicino alla campagna, ma nessuno li prende sul serio.',
    'Un articolo mai pubblicato scompare dalla redazione de La Voce di Villa Franca. Nessuno sa spiegare come.',
    'Un forestiero è stato notato più volte in paese, fa domande e non si presenta mai.',
    'Un vecchio fascicolo dei Carabinieri, dato per perso da anni, viene ritrovato per caso.',
  ];
  function avanzaLore() {
    if (STATE.world.loreStage < LORE_TAPPE.length - 1) {
      STATE.world.loreStage++;
      STATE.world.rumorLog.unshift({ data: dataChiave(STATE.clock), testo: LORE_TAPPE[STATE.world.loreStage], lore: true });
    }
  }

  /* ------------------------------ turno di lavoro e riposo ------------------------------ */
  function eseguiTurnoLavoro() {
    const character = STATE.character;
    const job = character.lavoroAttuale;
    const luogo = trovaLuogo(job.luogoId);
    const guadagno = randInt(40, 90);
    character.denaro += guadagno;
    const testo = `${pick(['Un turno lungo ma senza sorprese.', 'Il lavoro di oggi è filato liscio.', 'Giornata di lavoro come tante altre, ma le lire contano.', 'Fatica, ma alla fine ne vale la pena.'])} Guadagni ${guadagno} lire come ${job.nome.toLowerCase()} a ${luogo.nome}.`;
    character.log.unshift({ tipo: 'lavoro', titolo: 'Turno di lavoro', testo, luogo: luogo.nome, data: dataChiave(STATE.clock), esito: 'successo' });
    advanceTime(6);
    save();
    return { testo, esito: 'successo' };
  }

  function riposa(ore) {
    const character = STATE.character;
    character.log.unshift({ tipo: 'riposo', titolo: 'Riposo', testo: `Ti concedi qualche ora di riposo.`, data: dataChiave(STATE.clock), esito: 'neutro' });
    advanceTime(ore);
    save();
  }

  function dormiFinoAlMattino() {
    let ore = 8 - STATE.clock.ora;
    if (ore <= 0) ore += 24;
    const character = STATE.character;
    character.log.unshift({ tipo: 'riposo', titolo: 'Una notte di sonno', testo: 'Dormi fino al mattino successivo.', data: dataChiave(STATE.clock), esito: 'neutro' });
    advanceTime(ore);
    save();
  }

  /* ------------------------------ morte e archiviazione ------------------------------ */
  function uccidiPersonaggio(causa) {
    const c = STATE.character;
    c.stato = 'morto';
    c.causaMorte = causa;
    archiviaPersonaggio(c, causa);
    save();
    return causa;
  }

  function ritiraPersonaggio(motivo) {
    const c = STATE.character;
    c.stato = 'ritirato';
    archiviaPersonaggio(c, motivo || 'Ha deciso di lasciare Villa Franca per sempre.');
    STATE.character = null;
    save();
  }

  function archiviaPersonaggio(c, nota) {
    STATE.world.salaFama.unshift({
      nome: `${c.nome} ${c.cognome}`, stato: c.stato, causa: c.causaMorte, nota,
      annoConclusione: STATE.clock.anno, lavoro: c.lavoroAttuale ? c.lavoroAttuale.nome : null,
    });
    if (STATE.world.salaFama.length > 200) STATE.world.salaFama.length = 200;
  }

  return {
    init, save, resetAll, hasSave, getState, setWorldEventHandler,
    MESI, GIORNI_SETT, START_YEAR, END_YEAR,
    dataChiave, giornoSettimana, periodoDelGiorno, meteoOggi, eLuogoAperto,
    advanceTime,
    skillBase, creaPersonaggio, puntiSkillSpesi,
    trovaLuogo, trovaNpc, eseguiAzione,
    eseguiTurnoLavoro, riposa, dormiFinoAlMattino,
    uccidiPersonaggio, ritiraPersonaggio,
    randInt, clamp,
  };
})();

</script>
<script>
/* ==========================================================================
   VILLA FRANCA 1980 — interfaccia
   Rendering a stringhe + delega degli eventi, nessun framework.
   ========================================================================== */

const UI = (() => {
  const root = () => document.getElementById('app');

  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  let view = { screen: 'boot', categoria: null, luogo: null, tab: 'diario' };
  let creationState = null;
  let lastResult = null;
  let suppressNextRender = false;

  /* ------------------------------ boot ------------------------------ */
  function renderBoot() {
    const st = ENGINE.getState();
    const haveChar = st.character && st.character.stato === 'vivo';
    root().innerHTML = `
      <div class="boot">
        <h1>VILLA FRANCA</h1>
        <p class="sub">un paese di Sicilia, ${ENGINE.START_YEAR}&ndash;${ENGINE.END_YEAR}</p>
        <p class="tagline">Simulazione roguelike di un server di ruolo. Wipe annuale. Nessuna intelligenza artificiale esterna, nessuna chiave API: tutto gira nel tuo browser.</p>
        <div class="boot-actions">
          ${haveChar ? `<button data-act="continua" class="btn primary">Continua partita — ${esc(st.character.nome)} ${esc(st.character.cognome)}</button>` : ''}
          <button data-act="nuova-partita" class="btn ${haveChar ? '' : 'primary'}">${haveChar ? 'Nuovo personaggio (wipe)' : 'Avvia il wipe — nuova partita'}</button>
          <button data-act="salafama-open" class="btn ghost">Sala della memoria</button>
        </div>
        <p class="anno-corrente">Anno corrente del server: <strong>${st.clock.anno}</strong>${st.world.serverConcluso ? ' — il server ha concluso il suo ciclo ufficiale' : ''}</p>
      </div>`;
  }

  /* ------------------------------ creazione personaggio ------------------------------ */
  const STEPS = ['Identità', 'Aspetto', 'Passato', 'Abilità', 'Segreto', 'Riepilogo'];

  function startCreation() {
    creationState = {
      nome: '', cognome: '', sesso: 'uomo', eta: 28, cittaNatale: '', lavoroPrecedente: 'disoccupato',
      altezza: 'media', corporatura: 'normale', capelli: '', occhi: '', trattoDistintivo: '',
      backstory: '', allocazioneSkill: {}, segreto: 'nessuno', step: 0,
    };
    GAME_DATA.SKILLS.forEach(s => { creationState.allocazioneSkill[s.id] = GAME_DATA.SKILL_MIN; });
    view.screen = 'creation';
    render();
  }

  function readStepInputs() {
    const g = id => document.getElementById(id);
    if (creationState.step === 0) {
      creationState.nome = g('f-nome') ? g('f-nome').value.trim() : creationState.nome;
      creationState.cognome = g('f-cognome') ? g('f-cognome').value.trim() : creationState.cognome;
      creationState.sesso = g('f-sesso') ? g('f-sesso').value : creationState.sesso;
      creationState.eta = g('f-eta') ? parseInt(g('f-eta').value, 10) || 18 : creationState.eta;
      creationState.cittaNatale = g('f-citta') ? g('f-citta').value.trim() : creationState.cittaNatale;
      creationState.lavoroPrecedente = g('f-lavoro') ? g('f-lavoro').value : creationState.lavoroPrecedente;
    } else if (creationState.step === 1) {
      creationState.altezza = g('f-altezza') ? g('f-altezza').value : creationState.altezza;
      creationState.corporatura = g('f-corporatura') ? g('f-corporatura').value : creationState.corporatura;
      creationState.capelli = g('f-capelli') ? g('f-capelli').value.trim() : creationState.capelli;
      creationState.occhi = g('f-occhi') ? g('f-occhi').value.trim() : creationState.occhi;
      creationState.trattoDistintivo = g('f-tratto') ? g('f-tratto').value.trim() : creationState.trattoDistintivo;
    } else if (creationState.step === 2) {
      creationState.backstory = g('f-backstory') ? g('f-backstory').value.trim() : creationState.backstory;
    }
  }

  function creationErrors() {
    if (creationState.step === 0) {
      const errs = [];
      if (!creationState.nome) errs.push('Inserisci un nome.');
      if (!creationState.cognome) errs.push('Inserisci un cognome.');
      if (!creationState.cittaNatale) errs.push('Indica una città natale.');
      if (!creationState.eta || creationState.eta < 16 || creationState.eta > 80) errs.push('Età non valida (16-80).');
      return errs;
    }
    return [];
  }

  function renderCreation() {
    const s = creationState.step;
    root().innerHTML = `
      <div class="creation">
        <div class="wizard-progress">
          ${STEPS.map((t,i) => `<span class="wp-step ${i===s?'active':''} ${i<s?'done':''}">${i+1}. ${t}</span>`).join('')}
        </div>
        <div class="wizard-body">
          ${s===0 ? stepIdentita() : ''}
          ${s===1 ? stepAspetto() : ''}
          ${s===2 ? stepPassato() : ''}
          ${s===3 ? stepAbilita() : ''}
          ${s===4 ? stepSegreto() : ''}
          ${s===5 ? stepRiepilogo() : ''}
        </div>
        <div class="wizard-nav">
          ${s>0 ? `<button data-act="step-prev" class="btn ghost">&larr; Indietro</button>` : `<button data-act="torna-boot" class="btn ghost">&larr; Annulla</button>`}
          ${s<STEPS.length-1 ? `<button data-act="step-next" class="btn primary">Avanti &rarr;</button>` : `<button data-act="conferma-creazione" class="btn primary">Inizia la partita nel ${ENGINE.getState().clock.anno}</button>`}
        </div>
      </div>`;
  }

  function stepIdentita() {
    const c = creationState;
    const comuniOpts = GAME_DATA.COMUNI.map(x => `<option value="${esc(x)}">`).join('');
    const lavoriOpts = GAME_DATA.LAVORI_PRECEDENTI.map(l => `<option value="${l.id}" ${c.lavoroPrecedente===l.id?'selected':''}>${esc(l.nome)}</option>`).join('');
    return `
      <h2>Chi sei</h2>
      <div class="grid2">
        <label>Nome <input id="f-nome" type="text" value="${esc(c.nome)}" maxlength="30"></label>
        <label>Cognome <input id="f-cognome" type="text" value="${esc(c.cognome)}" maxlength="30"></label>
        <label>Sesso <select id="f-sesso">
          <option value="uomo" ${c.sesso==='uomo'?'selected':''}>Uomo</option>
          <option value="donna" ${c.sesso==='donna'?'selected':''}>Donna</option>
        </select></label>
        <label>Età <input id="f-eta" type="number" min="16" max="80" value="${c.eta}"></label>
        <label class="span2">Città natale <input id="f-citta" list="comuni-list" type="text" value="${esc(c.cittaNatale)}" placeholder="Scrivi o scegli un comune italiano"></label>
        <datalist id="comuni-list">${comuniOpts}</datalist>
        <label class="span2">Lavoro precedente <select id="f-lavoro">${lavoriOpts}</select></label>
      </div>`;
  }

  function stepAspetto() {
    const c = creationState;
    return `
      <h2>Aspetto fisico</h2>
      <div class="grid2">
        <label>Altezza <select id="f-altezza">
          ${['bassa','media','alta'].map(v=>`<option value="${v}" ${c.altezza===v?'selected':''}>${v}</option>`).join('')}
        </select></label>
        <label>Corporatura <select id="f-corporatura">
          ${['magra','normale','robusta','atletica'].map(v=>`<option value="${v}" ${c.corporatura===v?'selected':''}>${v}</option>`).join('')}
        </select></label>
        <label>Capelli <input id="f-capelli" type="text" value="${esc(c.capelli)}" placeholder="es. neri, mossi"></label>
        <label>Occhi <input id="f-occhi" type="text" value="${esc(c.occhi)}" placeholder="es. scuri"></label>
        <label class="span2">Tratto distintivo <input id="f-tratto" type="text" value="${esc(c.trattoDistintivo)}" placeholder="es. una cicatrice sul sopracciglio, un modo di fumare tutto suo..."></label>
      </div>`;
  }

  function stepPassato() {
    const c = creationState;
    return `
      <h2>Backstory</h2>
      <p class="hint">Racconta chi era il tuo personaggio prima di arrivare o tornare a Villa Franca. Più dettagli dai, più il gioco potrà agganciarsi alla tua storia in futuro (funzionalità in sviluppo nel prototipo).</p>
      <textarea id="f-backstory" rows="8" maxlength="2000" placeholder="Scrivi liberamente la backstory del tuo personaggio...">${esc(c.backstory)}</textarea>`;
  }

  function stepAbilita() {
    const c = creationState;
    const spesi = ENGINE.puntiSkillSpesi(c.allocazioneSkill);
    const rimanenti = GAME_DATA.SKILL_POINTS_POOL - spesi;
    const cats = GAME_DATA.SKILL_CATEGORIES.map(cat => {
      const skills = GAME_DATA.SKILLS.filter(s => s.cat === cat.id);
      return `<div class="skill-cat"><h3>${cat.nome}</h3>
        ${skills.map(s => {
          const v = c.allocazioneSkill[s.id];
          return `<div class="skill-row" title="${esc(s.desc)}">
            <span class="skill-name">${s.nome}</span>
            <button data-act="skill-dec" data-skill="${s.id}" class="btn tiny" ${v<=GAME_DATA.SKILL_MIN?'disabled':''}>−</button>
            <span class="skill-val">${'●'.repeat(v)}${'○'.repeat(GAME_DATA.SKILL_MAX-v)}</span>
            <button data-act="skill-inc" data-skill="${s.id}" class="btn tiny" ${v>=GAME_DATA.SKILL_MAX || rimanenti<=0?'disabled':''}>+</button>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
    return `
      <h2>Abilità</h2>
      <p class="hint">Punti da distribuire: <strong>${rimanenti}</strong> rimanenti su ${GAME_DATA.SKILL_POINTS_POOL}. Ogni abilità va da 1 a 5. Potrai svilupparle ulteriormente giocando.</p>
      <div class="skills-grid">${cats}</div>`;
  }

  function stepSegreto() {
    const c = creationState;
    const items = GAME_DATA.OSCURI_SEGRETI.map(s => `
      <label class="segreto-row ${c.segreto===s.id?'selected':''}">
        <input type="radio" name="f-segreto" value="${s.id}" data-act="select-segreto" ${c.segreto===s.id?'checked':''}>
        <span class="segreto-nome">${esc(s.nome)}</span>
        <span class="segreto-desc">${esc(s.desc)}</span>
      </label>`).join('');
    return `
      <h2>Un oscuro segreto</h2>
      <p class="hint">Facoltativo: puoi scegliere "Nessun segreto". Ogni segreto porta con sé un vantaggio e uno svantaggio narrativo e meccanico.</p>
      <div class="segreti-list">${items}</div>`;
  }

  function stepRiepilogo() {
    const c = creationState;
    const lavoroNome = (GAME_DATA.LAVORI_PRECEDENTI.find(l => l.id === c.lavoroPrecedente) || {}).nome || '—';
    const segretoDef = GAME_DATA.OSCURI_SEGRETI.find(s => s.id === c.segreto);
    const skillList = GAME_DATA.SKILLS.filter(s => c.allocazioneSkill[s.id] > GAME_DATA.SKILL_MIN || true)
      .map(s => `<span class="chip">${s.nome}: ${c.allocazioneSkill[s.id]}</span>`).join('');
    return `
      <h2>Riepilogo</h2>
      <div class="riepilogo">
        <p><strong>${esc(c.nome)} ${esc(c.cognome)}</strong>, ${c.eta} anni, ${c.sesso === 'uomo' ? 'nato' : 'nata'} a ${esc(c.cittaNatale)}.</p>
        <p>Corporatura ${esc(c.corporatura)}, altezza ${esc(c.altezza)}${c.trattoDistintivo ? ', ' + esc(c.trattoDistintivo) : ''}.</p>
        <p>Prima di arrivare a Villa Franca: ${esc(lavoroNome)}.</p>
        <p class="backstory-preview">${esc(c.backstory) || '<em>Nessuna backstory scritta.</em>'}</p>
        <p><strong>Segreto:</strong> ${esc(segretoDef ? segretoDef.nome : 'Nessuno')}</p>
        <div class="chips">${skillList}</div>
      </div>`;
  }

  /* ------------------------------ hub ------------------------------ */
  function renderHub() {
    const st = ENGINE.getState();
    const c = st.character;
    if (!c || (c.stato !== 'vivo' && !(lastResult && lastResult.morte))) { view.screen = 'boot'; return renderBoot(); }
    const clk = st.clock;
    const dataStr = `${clk.giorno} ${ENGINE.MESI[clk.mese-1]} ${clk.anno}, ${ENGINE.giornoSettimana(clk)}`;
    const oraStr = `${String(clk.ora).padStart(2,'0')}:00`;

    root().innerHTML = `
      <div class="hub">
        <header class="hub-top">
          <div class="hub-id">
            <strong>${esc(c.nome)} ${esc(c.cognome)}</strong>
            <span class="muted">${c.lavoroAttuale ? esc(c.lavoroAttuale.nome) : 'senza lavoro fisso'}</span>
          </div>
          <div class="hub-clock">
            <span>${dataStr}</span> — <span>${oraStr}</span>
            <span class="muted">${esc(ENGINE.meteoOggi())}</span>
          </div>
          <div class="hub-money">£ ${c.denaro}</div>
        </header>
        <div class="hub-body">
          <aside class="hub-side">
            ${renderSkillsPanel(c)}
            ${renderFazioniPanel(c)}
            <div class="quick-actions">
              ${c.lavoroAttuale ? `<button class="btn" data-act="turno-lavoro">Fai un turno di lavoro</button>` : ''}
              <button class="btn" data-act="riposa">Riposa (3 ore)</button>
              <button class="btn" data-act="dormi">Dormi fino al mattino</button>
              <button class="btn ghost" data-act="ritira-personaggio">Lascia Villa Franca</button>
            </div>
          </aside>
          <section class="hub-main">
            ${view.luogo ? renderLuogo(view.luogo) : renderCategorie()}
          </section>
          <aside class="hub-feed">
            <div class="feed-tabs">
              <button class="tab ${view.tab==='diario'?'active':''}" data-act="tab" data-tab="diario">Diario</button>
              <button class="tab ${view.tab==='giornale'?'active':''}" data-act="tab" data-tab="giornale">Giornale</button>
              <button class="tab ${view.tab==='voci'?'active':''}" data-act="tab" data-tab="voci">Voci di paese</button>
            </div>
            <div class="feed-body">
              ${view.tab==='diario' ? renderDiario(c) : ''}
              ${view.tab==='giornale' ? renderGiornale(st) : ''}
              ${view.tab==='voci' ? renderVoci(st) : ''}
            </div>
          </aside>
        </div>
      </div>
      ${lastResult ? renderEsitoModal(lastResult) : ''}`;
  }

  function renderSkillsPanel(c) {
    const rows = GAME_DATA.SKILLS.map(s => `<div class="mini-skill"><span>${s.nome}</span><span>${'●'.repeat(c.skills[s.id])}${'○'.repeat(GAME_DATA.SKILL_MAX-c.skills[s.id])}</span></div>`).join('');
    return `<details class="panel"><summary>Abilità</summary><div class="mini-skills">${rows}</div></details>`;
  }

  function renderFazioniPanel(c) {
    const rows = GAME_DATA.FAZIONI.map(f => {
      const v = c.relazioni[f.id] || 0;
      const cls = v > 15 ? 'good' : v < -15 ? 'bad' : '';
      return `<div class="mini-skill ${cls}"><span>${f.nome}</span><span>${v > 0 ? '+' : ''}${v}</span></div>`;
    }).join('');
    return `<details class="panel"><summary>Relazioni</summary><div class="mini-skills">${rows}</div></details>`;
  }

  function renderCategorie() {
    const cat = view.categoria;
    if (!cat) {
      return `<h2>Villa Franca</h2><div class="categorie-grid">
        ${GAME_DATA.CATEGORIE_LUOGHI.map(c => `<button class="cat-card" data-act="apri-categoria" data-cat="${c.id}">${c.nome}</button>`).join('')}
      </div>`;
    }
    const catDef = GAME_DATA.CATEGORIE_LUOGHI.find(c => c.id === cat);
    const luoghi = GAME_DATA.LUOGHI.filter(l => l.cat === cat);
    return `
      <div class="breadcrumb"><button data-act="apri-categoria" data-cat="" class="link">Villa Franca</button> / ${catDef.nome}</div>
      <h2>${catDef.nome}</h2>
      <div class="luoghi-grid">
        ${luoghi.map(l => {
          const aperto = ENGINE.eLuogoAperto(l);
          return `<button class="luogo-card ${aperto?'':'chiuso'}" data-act="apri-luogo" data-luogo="${l.id}" ${aperto?'':'disabled'}>
            <strong>${l.nome}</strong>
            <span class="muted">${aperto ? (l.orario ? `aperto ${l.orario[0]}–${l.orario[1]}` : 'sempre aperto') : 'chiuso ora'}</span>
          </button>`;
        }).join('')}
      </div>`;
  }

  function renderLuogo(luogoId) {
    const l = ENGINE.trovaLuogo(luogoId);
    if (!l) { view.luogo = null; return renderCategorie(); }
    const c = ENGINE.getState().character;
    const aperto = ENGINE.eLuogoAperto(l);
    return `
      <div class="breadcrumb"><button data-act="chiudi-luogo" class="link">Villa Franca</button> / ${l.nome}</div>
      <h2>${l.nome}</h2>
      <p class="luogo-desc">${esc(l.desc)}</p>
      ${!aperto ? '<p class="muted">Il luogo è chiuso a quest\'ora. Puoi comunque tornare più tardi.</p>' : ''}
      <div class="azioni-list">
        ${l.azioni.map(a => {
          const npc = a.npc ? ENGINE.trovaNpc(a.npc) : null;
          return `<button class="azione-card" data-act="esegui-azione" data-luogo="${l.id}" data-azione="${a.id}" ${aperto?'':'disabled'}>
            <strong>${a.nome}</strong>
            <span class="muted">${a.ore}h${npc ? ' · con ' + npc.nome : ''}${a.skill ? ' · ' + (GAME_DATA.SKILLS.find(s=>s.id===a.skill)||{}).nome : ''}</span>
          </button>`;
        }).join('')}
      </div>`;
  }

  function renderDiario(c) {
    if (!c.log.length) return '<p class="muted">Ancora nessuna pagina scritta.</p>';
    return c.log.slice(0, 30).map(e => `<div class="feed-item ${e.tipo}"><span class="feed-date">${e.data}${e.luogo ? ' · ' + esc(e.luogo) : ''}</span><strong>${esc(e.titolo)}</strong><p>${esc(e.testo)}</p></div>`).join('');
  }
  function renderGiornale(st) {
    if (!st.world.giornale.length) return '<p class="muted">"La Voce di Villa Franca" non ha ancora pubblicato nulla in questa partita.</p>';
    return st.world.giornale.slice(0, 30).map(a => `<div class="feed-item"><span class="feed-date">${a.giorno}/${a.mese}/${a.anno} · ${esc(a.autore)}</span><strong>${esc(a.titolo)}</strong><p>${esc(a.testo)}</p></div>`).join('');
  }
  function renderVoci(st) {
    if (!st.world.rumorLog.length) return '<p class="muted">In paese, per ora, non si dice nulla di particolare.</p>';
    return st.world.rumorLog.slice(0, 30).map(r => `<div class="feed-item ${r.lore?'lore':''}"><span class="feed-date">${r.data}</span><p>${esc(r.testo)}</p></div>`).join('');
  }

  function renderEsitoModal(result) {
    return `<div class="modal-backdrop">
      <div class="modal esito-${result.esito}">
        <h3>${esitoTitolo(result.esito)}</h3>
        <p>${esc(result.testo)}</p>
        ${result.dettaglioCheck ? `<p class="muted small">Prova di ${(GAME_DATA.SKILLS.find(s=>s.id===result.dettaglioCheck.skill)||{}).nome}: tiro ${result.dettaglioCheck.roll} vs difficoltà ${result.dettaglioCheck.difficolta}</p>` : ''}
        ${result.morte ? `<p class="fatale">Il tuo personaggio non ce l'ha fatta.</p>` : ''}
        <button class="btn primary" data-act="chiudi-esito">Continua</button>
      </div>
    </div>`;
  }
  function esitoTitolo(e) {
    return { critico_successo: 'Va benissimo', successo: 'Ci sei riuscito', fallimento: 'Non è andata bene', critico_fallimento: 'Disastro', neutro: 'Fatto' }[e] || 'Fatto';
  }

  /* ------------------------------ morte / wipe / fine ------------------------------ */
  function renderDeath(causa) {
    root().innerHTML = `
      <div class="boot death">
        <h1>Fine della storia</h1>
        <p class="tagline">${esc(causa)}</p>
        <p>Il tuo personaggio entra nella Sala della memoria di Villa Franca.</p>
        <div class="boot-actions">
          <button class="btn primary" data-act="nuova-partita">Crea un nuovo personaggio</button>
          <button class="btn ghost" data-act="torna-boot">Menu principale</button>
        </div>
      </div>`;
  }

  function renderWipeScreen(payload) {
    root().innerHTML = `
      <div class="boot wipe">
        <h1>Wipe di fine anno</h1>
        <p class="tagline">Si chiude il ${payload.annoConcluso} e si apre il ${payload.nuovoAnno} a Villa Franca.</p>
        <p>${payload.personaggio ? `${esc(payload.personaggio.nome)} ${esc(payload.personaggio.cognome)} viene ricordato nella storia del paese, ma la sua scheda è stata azzerata.` : ''}</p>
        ${payload.serverConcluso ? '<p class="tagline">Il server ha raggiunto il 1990: è la fine ufficiale del ciclo di Villa Franca.</p>' : ''}
        <div class="boot-actions">
          <button class="btn primary" data-act="nuova-partita">Crea un personaggio per il ${payload.nuovoAnno}</button>
          <button class="btn ghost" data-act="salafama-open">Sala della memoria</button>
        </div>
      </div>`;
  }

  function renderSalaFama() {
    const st = ENGINE.getState();
    root().innerHTML = `
      <div class="boot">
        <h1>Sala della memoria</h1>
        ${st.world.salaFama.length ? `<div class="salafama-list">${st.world.salaFama.map(p => `
          <div class="feed-item"><strong>${esc(p.nome)}</strong> <span class="muted">(${p.stato}, ${p.annoConclusione})</span>
          <p>${esc(p.nota || '')}</p></div>`).join('')}</div>` : '<p class="muted">Ancora nessuna storia conclusa.</p>'}
        <div class="boot-actions"><button class="btn ghost" data-act="torna-boot">Indietro</button></div>
      </div>`;
  }

  /* ------------------------------ render dispatch ------------------------------ */
  function render() {
    if (view.screen === 'boot') renderBoot();
    else if (view.screen === 'creation') renderCreation();
    else if (view.screen === 'hub') renderHub();
    else if (view.screen === 'salafama') renderSalaFama();
  }

  /* ------------------------------ eventi ------------------------------ */
  function bind() {
    document.getElementById('app').addEventListener('click', onClick);
  }

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'nuova-partita') { startCreation(); return; }
    if (act === 'continua') { view.screen = 'hub'; view.luogo = null; view.categoria = null; render(); return; }
    if (act === 'salafama-open') { view.screen = 'salafama'; render(); return; }
    if (act === 'torna-boot') { view.screen = 'boot'; render(); return; }

    if (act === 'step-next') {
      readStepInputs();
      const errs = creationErrors();
      if (errs.length) { alert(errs.join('\n')); return; }
      creationState.step++; render(); return;
    }
    if (act === 'step-prev') { readStepInputs(); creationState.step--; render(); return; }
    if (act === 'skill-inc') {
      const id = el.dataset.skill;
      const spesi = ENGINE.puntiSkillSpesi(creationState.allocazioneSkill);
      if (spesi < GAME_DATA.SKILL_POINTS_POOL && creationState.allocazioneSkill[id] < GAME_DATA.SKILL_MAX) creationState.allocazioneSkill[id]++;
      render(); return;
    }
    if (act === 'skill-dec') {
      const id = el.dataset.skill;
      if (creationState.allocazioneSkill[id] > GAME_DATA.SKILL_MIN) creationState.allocazioneSkill[id]--;
      render(); return;
    }
    if (act === 'select-segreto') { creationState.segreto = el.value; render(); return; }
    if (act === 'conferma-creazione') {
      readStepInputs();
      ENGINE.creaPersonaggio(creationState);
      view.screen = 'hub'; view.luogo = null; view.categoria = null; view.tab = 'diario';
      render(); return;
    }

    if (act === 'apri-categoria') { view.categoria = el.dataset.cat || null; view.luogo = null; render(); return; }
    if (act === 'apri-luogo') { view.luogo = el.dataset.luogo; render(); return; }
    if (act === 'chiudi-luogo') { view.luogo = null; render(); return; }
    if (act === 'tab') { view.tab = el.dataset.tab; render(); return; }

    if (act === 'esegui-azione') {
      const result = ENGINE.eseguiAzione(el.dataset.luogo, el.dataset.azione);
      if (suppressNextRender) { suppressNextRender = false; return; }
      lastResult = result;
      render();
      return;
    }
    if (act === 'chiudi-esito') {
      const wasMorte = lastResult && lastResult.morte;
      lastResult = null;
      if (wasMorte) { view.screen = 'boot'; renderDeath(wasMorte); }
      else render();
      return;
    }
    if (act === 'turno-lavoro') {
      const result = ENGINE.eseguiTurnoLavoro();
      if (suppressNextRender) { suppressNextRender = false; return; }
      lastResult = result; render(); return;
    }
    if (act === 'riposa') { ENGINE.riposa(3); if (suppressNextRender) { suppressNextRender = false; return; } render(); return; }
    if (act === 'dormi') { ENGINE.dormiFinoAlMattino(); if (suppressNextRender) { suppressNextRender = false; return; } render(); return; }
    if (act === 'ritira-personaggio') {
      if (confirm('Sei sicuro di voler lasciare Villa Franca? Il personaggio verrà archiviato e la partita terminerà.')) {
        ENGINE.ritiraPersonaggio();
        view.screen = 'boot'; view.luogo = null; view.categoria = null;
        render();
      }
      return;
    }
  }

  ENGINE.setWorldEventHandler((tipo, payload) => {
    if (tipo === 'wipe') {
      view.luogo = null; view.categoria = null; lastResult = null;
      renderWipeScreen(payload);
      suppressNextRender = true;
    }
  });

  return { init: () => { bind(); render(); }, render };
})();

</script>
<script>
/* ==========================================================================
   VILLA FRANCA 1980 — bootstrap
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  ENGINE.init();
  UI.init();
});

</script>
